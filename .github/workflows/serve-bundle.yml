name: serve-bundle

# The dashboard is buildless (RFC 0032, A-76): one dependency-free HTML
# file, "built" by copying into the wheel's package data. This job asserts
# the vendored copy matches the source byte-for-byte and that the backend
# suite stays green — the npm-builder toolchain the first cut used is gone
# with the framework.

on:
  workflow_dispatch:
  push:
    tags:
      - "r*"

permissions:
  contents: read

jobs:
  serve-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: vendored bundle matches source
        run: cmp web/index.html src/torve/_web/index.html
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --frozen --extra serve
      - run: uv run pytest tests/test_serve.py
