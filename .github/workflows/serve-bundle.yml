name: serve-bundle

# The dashboard build (RFC 0032 D-32.4, A-77): Vite output is
# deterministic per lockfile, so the vendored bundle in torve/_web is
# byte-compared against a fresh build, and the backend suite must stay
# green beside it.

on:
  workflow_dispatch:
  push:
    tags:
      - "r*"

permissions:
  contents: read

jobs:
  serve-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor: ignore[cache-poisoning] — this job publishes nothing: it
      # builds and diffs, read-only permissions, no artifact leaves it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 26
      - name: fresh build
        run: cd web && npm ci && npm run build
      - name: vendored bundle matches the fresh build
        run: git diff --exit-code -- src/torve/_web
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --frozen --extra serve
      - run: uv run pytest tests/test_serve.py
