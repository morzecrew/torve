name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gates diff against git merge-base
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run pytest
      # The sabotage suite: a gate that cannot be shown to fail is not a check.
      - run: uv run torve gates check
      # Dogfood: the repository's own manifest, on human and agent PRs alike.
      # Task branches (torve/T-nnnn) auto-discover their contract.
      - run: uv run torve gates run --base origin/main
      - run: uv run python skills/rfc-writer/scripts/rfc_index.py check
