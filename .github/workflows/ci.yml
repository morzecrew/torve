name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this before it builds a tag.
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    name: gates (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Every interpreter `requires-python` admits: development and the sandbox
    # image run 3.13, while an unpinned runner resolves the newest.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gates diff against git merge-base
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      # The sabotage suite: a gate that cannot be shown to fail is not a check.
      - run: uv run torve gates check
      # The repository's own manifest, on human and agent PRs alike. Task
      # branches (torve/T-nnnn) auto-discover their contract; without one the
      # acceptance gate runs the manifest's fallback battery — ruff, mypy,
      # pytest, rfc check. CI does not run those a second time itself (A-52):
      # one step, one battery, and the gate is the thing under test.
      - run: uv run torve gates run --base origin/main
