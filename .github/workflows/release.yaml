name: Release a new package version

# Copied from bloomery's release workflow and cut to what torve has: no perf
# lane and no cloud lanes. `publish.yml` stays the sandbox images' workflow on
# `r*` tags; this one is the Python package on `v*` tags.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # First, and everything else waits on it: a tag that is not on `main`, or
  # that is not a release version (the tag is the version: hatch-vcs), runs nothing here —
  # not the CI it would re-run and not the build. `build` repeats the main
  # check before packaging.
  tag-on-main:
    name: Ensure the tag is on main and names a release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure release tag is on main
        run: bash .github/scripts/ensure-tag-on-main.sh
      - name: Ensure the tag names a release version
        run: bash .github/scripts/ensure-tag-matches-version.sh

  ci:
    name: Run CI before release
    needs: tag-on-main
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    name: Build the package
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure release tag is on main
        run: bash .github/scripts/ensure-tag-on-main.sh

      # Uncached: this job builds what is published, and a restored cache is a
      # supply-chain surface a one-off `uv build` does not need.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Ensure the build carries the tag's version
        run: bash .github/scripts/ensure-tag-matches-version.sh dist

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torve
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Checkout first: it cleans the workspace, and a `dist/` downloaded
      # before it is gone by the time the release attaches `dist/*` (v0.1.0
      # was published with no files).
      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package
          path: dist/

      - name: Compute version from tag
        id: ver
        run: bash .github/scripts/compute-version-from-tag.sh

      - name: Get Changelog Entry
        id: changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          version: ${{ steps.ver.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create GitHub Release # zizmor: ignore[superfluous-actions] prefer the pinned action over an inline `gh release` script
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.changes }}

  # S-0112/D-1, S-0112/D-4: once PyPI has the package, build every image from
  # the tag, prove each one runs this release, and push only then. A failure
  # in the build or the checks leaves the package published and no image
  # tagged — a half-released state the job can be rerun from, rather than a
  # tag that names another torve. A failure partway through the push leaves
  # some tags published, and a rerun stops at the first of them, because a
  # published tag is never pushed twice: those tags are removed by hand first.
  images:
    name: Build and publish the sandbox images
    needs: publish
    runs-on: ubuntu-latest
    # One images job per tag at a time: `push` asks the registry before each
    # push, and two runs over one tag could both find a tag missing and push it
    # twice. A queued run waits rather than cancelling one mid-push.
    concurrency:
      group: release-images-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version from tag
        id: ver
        run: bash .github/scripts/compute-version-from-tag.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No push in the build: the images are loaded so the checks run against
      # the bytes this runner would publish, on the runner that pushes them.
      - name: Build every image from the tag and load it
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REVISION: ${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: bash .github/scripts/release-images.sh build

      # The checks precede every push: each image must run this release, a seat
      # must print the harness version its label carries, and no tag may
      # already be published (S-0112/D-1).
      - name: Check every image before anything is pushed
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-images.sh check

      - name: Log in to the package registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push every image's tags
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          # Each push first asks what is published, so a rerun pushes only the missing.
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-images.sh push
