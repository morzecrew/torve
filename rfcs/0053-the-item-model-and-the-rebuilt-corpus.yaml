    grade: OPEN
    text: >-
      Whether the baseline is one document or several by area (D-31.6, Q-53.2); settled
      by the grading pass in §5.8
alternatives:
  - option: >-
      YAML per document as the authoring root, markdown rendered from it
    rejected_because: >-
      The probe fit everything by construction and turned 84 % of a large document
      into indentation-sensitive literal blocks nobody can navigate; the model is
      what torve reads either way, and D-A.3's reason for keeping rows beside rationale
      stands.
  - option: One YAML file per item (Doorstop)
    rejected_because: >-
      43 files per document, link kinds collapse into one list, torve identifiers
      cannot be uids, path globs cannot be references; nothing torve lacks is supplied.
  - option: sphinx-needs directives and needs.json
    rejected_because: >-
      Closest to today's authoring, but every custom option is a string, a link must
      target a need id so governs(path) and pins(test) cannot be links, and needs.json
      drops prose, so the loader re-parsed the markdown — the parser being replaced.
      needs.json stays worth emitting as an interchange export later, from the model.
  - option: Record-first authoring, the file as an export
    rejected_because: >-
      Loses git diff as the refusal surface (A-4) and needs the store to author. RFC
      0047 chose the file as importer; the record is the intermediate representation,
      not the editor.
  - option: >-
      Migrate the 597 rows onto the model instead of rebuilding
    rejected_because: >-
      Half were never cited and a third never inherited; carrying them forward carries
      the decoration and the rot with them, and skips the one run of the adopter's
      lane that would find its defects cheaply.
  - option: >-
      Retire documents in place with status superseded, no archive directory
    rejected_because: >-
      Honours D-A.18 and D-A.19 without amendment, but every reader — the programme
      block, intake's execution facts, rfc health — keeps walking 52 documents to
      find the two that stand, and the corpus directory keeps looking like the specification
      it no longer is.
  - option: Typed §Design as a list of atomic claims
    rejected_because: >-
      Argument fragments; the probe's 2,932 words of 0044 design prose have no list
      shape. Headings as keys give logs an anchor; that is all the typing §Design
      needs.
questions:
  - id: Q-53.1
    text: >-
      Which fields the fingerprint covers — text, grade and paths only, or consequence
      and check as well. Text, grade and paths is what a contract copies at mint;
      the rest is what a human reads.
    status: settled
    settled_by: >-
      0053 §5.4 — text, grade and paths; a text-only mismatch is editorial
  - id: Q-53.2
    text: >-
      Whether the baseline is one document or several by area (D-31.6 left it to the
      first adoption). This repository is the first adoption.
  - id: Q-53.3
    text: >-
      When domain/spec.py is extracted into its own distribution, and under what name.
      Settled by the first other repository that runs the bootstrap against it.
phasing:
  - phase: 1
    title: the model and its loader
    intent: >-
      `domain/spec.py` holds the pydantic model of §5.1 and `config/spec.py` loads
      it from the markdown corpus as it stands: frontmatter, the decision table, the
      phasing fence, the contract example, amendment headings, and the five fenced
      kinds of §5.2, which the existing corpus does not yet carry and which load as
      empty. The loader owns number derivation over corpus and archive (D-53.10) and
      the fingerprint (D-53.5). A parity test asserts, document by document over the
      whole corpus, that the loader yields what `rfc_parse` yields today; nothing
      else switches to the model in this phase, so the parser stays the owner of every
      reader until phase 2.
    scope:
      - src/torve/domain/spec.py
      - src/torve/config/spec.py
      - tests/test_spec.py
      - tests/test_spec_load.py
    acceptance:
      - >-
        uv run pytest tests/test_spec.py tests/test_spec_load.py
      - uv run lint-imports --config pyproject.toml
      - uv run torve rfc check
    character: structural
  - phase: 2
    title: >-
      the readers, the amend forms, coverage and the archive verb
    intent: >-
      Every reader switches to the model beside its old path with a parity assertion
      (D-53.13): `rfc check`, `show`, `index`, `health`, the importer, `decisions
      paths`. `torve rfc amend` gains the mutating forms of §5.4 and writes the `changes`
      fence with the prior value; `retire` becomes one of them; `torve rfc fix` re-stamps
      a text-only edit as editorial; a hand-edited grade or paths fails the check.
      Coverage (D-53.6) and rot (D-53.7) land in the importer's module and surface
      through `decisions paths` and `rfc health`. `torve rfc archive NUMBER` moves
      a document to `archive/rfcs/` with the frontmatter of D-53.8, and the importer
      records archived documents and rows as retired (D-53.9). `rfc_parse.py` is untouched
      in this phase so the parity assertions have something to assert against.
    scope:
      - src/torve/config/rfc_emit.py
      - src/torve/application/decisions.py
      - src/torve/application/specquality.py
      - src/torve/cli/rfc.py
      - src/torve/cli/decisions.py
      - tests/test_rfc_emit.py
      - tests/test_decisions.py
      - tests/test_specquality.py
      - tests/test_rfc_check.py
      - tests/test_cli_decisions.py
    acceptance:
      - >-
        uv run pytest tests/test_rfc_emit.py tests/test_decisions.py tests/test_specquality.py
        tests/test_rfc_check.py tests/test_cli_decisions.py
      - uv run lint-imports --config pyproject.toml
      - uv run torve rfc check
    depends_on:
      - 1
    character: structural
  - phase: 2
    title: the check learns the archive
    intent: >-
      The parser's corpus check resolves what the archive defines (A-140): a `D-x.y`
      citation into an archived document resolves, a `depends_on`, `informed_by` or
      `supersedes` reference to an archived number is a warning naming the archive
      rather than "no such RFC", the parser's own `next_number` derives over corpus
      and archive exactly as the loader's does, and `lookup` answers an archived identifier
      marked archived so the MCP `show` face keeps resolving what the CLI already
      does. Nothing about the format changes and no reader moves; this is the one
      piece of archive awareness the parser must have before phase 3 can move a document
      that others cite.
    scope: [src/torve/config/rfc_parse.py, tests/test_rfc_archive.py]
    acceptance:
      - >-
        uv run pytest tests/test_rfc_archive.py tests/test_rfc_check.py
      - uv run lint-imports --config pyproject.toml
      - uv run torve rfc check
    depends_on:
      - 1
    character: structural
  - phase: 3
    title: the archive lands
    intent: >-
      The three amendments to RFC 0016 and the one to RFC 0007 named in §5.7 are written
      into their documents' own Amendments sections through `torve rfc amend`, and
      every accepted document except this one is moved by `torve rfc archive` — fifty-one
      documents, filenames and identifiers kept, `status: superseded`. Path-rotted
      rows are retired through `rfc check --fix-rot` before the move so the archive
      records what was already dead as retired for that reason and not for the move.
      `torve decisions import` brings the record level. The pages named in §7 describe
      the archive. `rfc check` is green on a corpus of one document, and `show D-44.12`
      answers from the archive.
    scope:
      - rfcs/**
      - archive/**
      - pages/docs/operating.md
      - pages/docs/architecture/record.md
    acceptance:
      - uv run torve rfc check
      - >-
        uv run pytest tests/test_rfc_check.py tests/test_decisions.py
    depends_on:
      - 2
    character: routine
  - phase: 5
    title: one owner of the format
    intent: >-
      `rfc_parse.py` is deleted along with its parity harness, the import-linter contract
      that named it is re-pointed at `config/spec.py` so the format still terminates
      at the planner, and the rfc-writer skill is rewritten for the five fenced kinds
      and the `amend` forms, its references updated, its symlinks under `.claude/skills`
      and `.agents/skills` intact. After this phase there is one owner of the format
      and it is the loader.
    scope: [src/torve/**, pyproject.toml, skills/rfc-writer/**, tests/**]
    acceptance:
      - uv run pytest
      - uv run lint-imports --config pyproject.toml
      - uv run torve rfc check
    depends_on:
      - 3
    character: routine
contract_example:
  schema_version: 1
  id: T-0290
  rfc: rfcs/0053-the-item-model-and-the-rebuilt-corpus.md
  phase: 0
  role: implement
  title: ''
  intent: >-
    `domain/spec.py` holds the pydantic model and `config/spec.py` loads it from the
    markdown corpus as it stands; a parity test asserts the loader yields what `rfc_parse`
    yields today, document by document.
  depends_on: []
  targets: []
  scope:
    allow:
      - src/torve/domain/spec.py
      - src/torve/config/spec.py
      - tests/test_spec.py
      - tests/test_spec_load.py
    deny: []
  acceptance:
    - >-
      uv run pytest tests/test_spec.py tests/test_spec_load.py
  decisions:
    - id: D-53.1
      grade: LOCKED
      text: >-
        The specification the engine reads is one pydantic model in domain/spec.py;
        every reader consumes the model and never a parser's rows
      paths: [src/torve/domain/spec.py, src/torve/config/spec.py]
      consequence: ''
      check_state: shadow
  budget: {}
  tier: executor
amendments:
  - id: A-140
    at: '2026-09-09'
    title: the archive needs the check to know it
    changes:
      - subject: phase 2
        field: units
        before: 1
        after: 2
    md: |-
      **Found while planning phase 3.** `check_corpus` resolves a dotted
      citation only against the corpus path's own tables and `retired:` lists,
      and refuses a `depends_on`, `informed_by` or `supersedes` reference to a
      number it cannot find. This document cites D-A.3, D-7.12 and D-31.2 and
      depends on 0016, 0031 and 0047 — all of which phase 3 moves to the
      archive. Under the phasing as written, the first `torve rfc archive`
      would leave a corpus the parser refuses, and the transaction that
      protects the move would refuse the move. The loader of phase 1 already
      resolves over the archive (D-53.10); the parser, which phase 5 deletes,
      never learned to, and until phase 5 it is still the check the gate runs.

      **Changed:** phase 2 gains a second unit, disjoint in scope from the
      first, giving the parser the one piece of archive awareness the move
      needs — citations, references, numbering, `lookup`. Phase 3 waits on
      phase 2 as before, which now means both units. D-53.13 is unchanged:
      readers still switch beside the parser, and phase 5 still deletes it.

      ```yaml changes
      - subject: phase 2
        field: units
        before: 1
        after: 2
      ```
  - id: A-152
    at: '2026-09-09'
    title: phase 5 reaches every importer
    changes:
      - subject: phase 5
        field: scope
        before: >-
          src/torve/config/rfc_parse.py pyproject.toml skills/rfc-writer/** tests/test_spec_load.py
          tests/test_layering.py
        after: >-
          src/torve/** pyproject.toml skills/rfc-writer/** tests/**
    md: |-
      **Found while planning phase 5.** Deleting `rfc_parse.py` is not a
      deletion: fourteen modules under `src/torve/` and eight test modules
      import it, and the format's functions — the frontmatter reader, the table
      reader, `check_corpus`, `build_index`, `lookup` — are what the loader,
      the emitter, the planner, the lint and every CLI verb call. "One owner of
      the format" means those functions live in `config/spec.py` and every
      importer says so, which is a rename in every one of them. The phase as
      written allowed the parser's own file and two tests; it could not touch
      the importers, so it could not be executed as scoped.

      **Changed:** phase 5's scope is `src/torve/**` and `tests/**` beside the
      manifest and the skill, and its acceptance is the whole suite. D-53.13 is
      unchanged: the parser is deleted after the archive landed, which it has.
      The functions move whole; nothing about what they check changes, and the
      parity test that licensed the switch now pins one module against itself.

      ```yaml changes
      - subject: phase 5
        field: scope
        before: "src/torve/config/rfc_parse.py pyproject.toml skills/rfc-writer/** tests/test_spec_load.py tests/test_layering.py"
        after: "src/torve/** pyproject.toml skills/rfc-writer/** tests/**"
      ```
