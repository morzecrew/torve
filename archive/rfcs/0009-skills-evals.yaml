    paths: [src/torve/application/runner.py]
    consequence: >-
      Attribution from configuration archaeology reconstructs intent, not fact
  - id: D-9.15
    grade: ASSUMED
    text: >-
      The eval loop is `torve eval`: with-skill versus without-skill shadow replays
      of the same completed tasks (nothing merges, RFC 0004 D-4.4), arms marked on
      every record, one skill-eval record in the evals ledger with a baseline-matched
      verdict as direction, never magnitude; deletion stays a human act on the evidence
      (D-9.4). A skill in no role set refuses before any spend. Added by execution
      2026-08-24 — see .torve/tasks/T-0071
    paths: [src/torve/application/evals.py, src/torve/cli/evals.py]
    consequence: >-
      The §5 measurement, riding the only risk-free replay machinery the corpus has
amendments:
  - id: A-3
    at: '2026-08-21'
    title: >-
      skills whose format Torve parses ship with Torve (adds D-9.7)
    md: |-
      **Found in implementation.** A skill and its gate encode one rule in two forms. Versioned separately, they drift: the gate tightens in the package, the skill in another repository does not know, and agents write to the old rule and redden on every task.

      **Changed:** a skill and its gate are **one unit of versioning**. Skills whose output Torve parses ship with the package: `flag-dont-flip` (parsed by `decisions_reported`), `rfc-writer` (parsed by `RfcDirectory` and `rfc_index`), `ratchet-what-you-build` (parsed by `sabotage`). Everything else stays in `agent-skills`. `escape-hatch-policy` was on the list and removed on review — same word, different concept; three skills move, not four.

      **The boundary is narrow and should stay narrow.** The test: *does Torve parse what this skill produces?* Without that line, most of the verification cluster gets pulled in and Torve ends up owning fifteen skills instead of three.

      **Distribution: none required on the engine path.** The runner writes the role-scoped skill set into the sandbox from package data at dispatch time; nothing is checked into the consuming repository, so nothing can drift, and the skill version is the Torve version by construction. No bespoke installer.

      **Consequence for D-9.3:** `config_hash` includes the Torve package version, not only the `agent-skills` lockfile — otherwise upgrading Torve silently changes the regime and telemetry does not notice.
  - id: A-25
    at: '2026-08-22'
    title: >-
      vendored skills reach the sandbox as reviewed content (adds §4a, D-9.11–D-9.13)
    md: |-
      **Found asking how the rest of the library gets in.** A-3 drew the boundary — Torve ships only what it parses — but left everything on the far side of it (review checklists, stack conventions, the `agent-skills` library) with no road into the sandbox.

      **Changed:** §4a — the sandbox-definition doctrine applied to skills. Vendored skills are committed under `.torve/skills-vendor/<name>/` and resolve by name beside shipped skills at materialization; a collision with a shipped skill is refused, structurally protecting the A-3 unit-of-versioning; the vendored tree's digest joins `config_hash`. The channel is task context (RFC 0017 §3) — repository content instructing the agent about the work, which is allowed, as distinct from the repository configuring the harness, which is not (D-17.4).
  - id: A-54
    at: '2026-08-27'
    title: >-
      the specialisation rules come in from `ops/` (amends A-3, adds D-9.14)
    md: |-
      **Found deleting the executed procedure.** `ops/skill-specialisation.md` was executed on 2026-08-21 and kept past its deletion (D-A.1b), because four of its rules were still normative and had nowhere else to live. That is exactly the case §2 of RFC 0016 names: when a procedure accumulates decisions rather than steps, the decisions are promoted into an RFC and the procedure goes.

      **Adds D-9.14,** carrying the four rules intact:

      - **The ownership test.** Does Torve parse what this skill produces? If not, it stays upstream. This is A-3's boundary restated as a test rather than as a list, so it answers the next candidate without an amendment.
      - **No install step.** The runner writes the role-scoped set into the sandbox from package data at dispatch; nothing is checked into the consuming repository, so nothing can drift.
      - **The mandatory header.** A specialised skill states in its own first lines that it is a specialisation and what it diverges from — these are not forks kept in sync, they are supposed to diverge, and the divergence is deliberate from the first commit or it is discovered later as drift.
      - **The homonym lesson.** Before moving a skill, check that the Torve concept it maps to is the same concept and not the same word. `escape-hatch-policy` was on A-3's list and removed on review: Torve parses bypass records, and that skill does not produce them.

      **Note on A-3's wording.** A-3 cites `RfcDirectory` as the parser of `rfc-writer`'s output. That adapter was retired by RFC 0007 A-47; the parser is `torve.config.rfc_parse`, reached by `torve plan`, `torve rfc check` and adoption. A-3's text stands as written — amendments record what was decided when — and this note is the correction.
  - id: A-122
    at: '2026-09-05'
    title: One skill evaluated of four, and none retired
    md: |-
      **Judged in the pass A-113's new flag started.** The machinery is built and
      the header is accurate about it: `torve eval` runs with/without-skill
      shadow arms, the ledger records them, per-skill telemetry attribution
      works, vendored skills resolve and join `config_hash`. What §8 asks for is
      use, and use has not happened.

      - **"Evals run for the whole library, with at least one skill retired on
        evidence"** is unmet, and not marginally. The library is four skills —
        `corpus-bootstrap`, `flag-dont-flip`, `ratchet-what-you-build`,
        `rfc-writer` — and one has been evaluated, once, in August, with the
        baseline matched and the deletion left to the operator. Nothing has been
        retired. The seven rows in the evals ledger since are `config-eval`
        entries from RFC 0027's harness work, not skill arms; a reader counting
        ledger lines would conclude otherwise, which is why this says so.
      - **"Every cluster-C skill paired with a gate, or an explicit written
        decision"** has no evidence either way in this tree.
      - Role-scoped sets are configured, which is the one criterion the code
        answers on its own.

      The honest shape of what is owed: three evals and a decision. The engine
      side is done, and a skill that cannot show it earns its tokens is exactly
      what this document exists to retire — including, potentially, itself
      reporting that all four earn them.

      **Changed:** `implementation: partial` stands, with the outstanding work
      named as campaign rather than build.
  - id: A-125
    at: '2026-09-06'
    title: >-
      The eval ran, measured nothing, and said the skill had not earned its tokens
    md: |-
      **Found running A-122's owed evals.** The library was read against the
      record first, and the reading changed what "the whole library" can mean.

      **Two of the four shipped skills have never once been materialized.** Over
      226 attempts that name what they loaded (D-9.14), the record shows
      `flag-dont-flip` 226 times, `ratchet-what-you-build` 225, and a vendored
      `reading-isnt-proof` twice. `rfc-writer` and `corpus-bootstrap`: never.
      The cause is a role that does not exist — the default sets keyed
      `rfc-writer` under `author`, and no run has that role, so `sets.get(role)`
      never asks for it and `torve eval` refuses the skill as "in no role set".

      They are not dead code, which is why they are not deleted.
      `skills/rfc-writer/references/rfc-template.md` is what `torve rfc new`
      reads to create every document in this corpus, and
      `skills/corpus-bootstrap/fixtures/` carries the survey report and expected
      output RFC 0031's tests read. They are **packaged assets shaped like
      skills**: unreachable as instructions, load-bearing as files. The dead
      `author` key is removed; the directories stay, and this records what they
      are so the next reader does not delete them for the reason I nearly did.

      **The eval then ran, and its verdict was worthless in a way worth keeping.**
      `ratchet-what-you-build` over T-0254, T-0255 and T-0259 — three tasks about
      gates, chosen because this skill is about finishing a guard. Six replays,
      all escalated at the poison ceiling, both arms `0/3` green. The verdict
      printed: *baseline matched — this skill did not earn its tokens here;
      deletion is your call.*

      Both arms scored zero because this repository's committed configuration
      runs every tier on the `fake` adapter with every provider denied — a safe
      default so a stray `torve run` here calls nobody. Each replay took 0.4
      seconds and cost nothing. Nothing about the skill was measured, and D-9.4
      would have deleted it on that.

      **Changed, twice, both the same defect in different clothes:**

      - `baseline_matched` was `without.green >= with.green and
        without.attempts <= with.attempts`. At 0 green and 9 attempts each that
        is `0 >= 0 and 9 <= 9` — true. It is now `None` when neither arm
        completed a task: a comparison needs something to compare.
      - The record carries `simulated`, true when the executor seat is a fake
        adapter, and a simulated eval never produces a verdict. D-4.6 already
        says a fake adapter is neither spend nor conviction and the cost and
        quality projections already exclude its rows; the eval loop was the one
        reader that did not.

      Recorded rather than refused, because a test asserting the record's shape
      runs a fake agent on purpose. What must not happen is a *verdict*.

      **What this leaves owed.** §8's second criterion cannot be met in this
      repository as configured: skill evidence needs a real seat, and this
      repository denies every provider by design. It can be met where the engine
      runs against real tiers — the lab — and the two skills that can be
      measured there are `flag-dont-flip` (measured once, August, baseline
      matched) and `ratchet-what-you-build` (never measured). The other two are
      not skills a run loads and should not be counted as owed.

      **Its third criterion is met, and provable.** Every skill in the library
      declares a `gate:` — `rfc-valid`, `decisions-reported`, `gates-sabotage`,
      `rfc-index` — which is D-9.7's skill-and-gate-as-one-unit holding across
      all four.

      *Archived 2026-09-09: superseded by 0055 (RFC 0053 D-53.8).*
