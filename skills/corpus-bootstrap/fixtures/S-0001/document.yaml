design:
  - key: the-survey-findings
    md: |-
      - **`secrets` fired** on landing `f901a7b` ("chore: wire stripe
        credentials"): a new file `src/leak.py` carried an access key. Landing `d55fecb`
        ("fix: rotate credentials out of the tree") deleted the file and added a
        `.env.example` placeholder, and measured clean — the boundary was
        defended in the window.
      - **`scope` fired** on landing `8ef5b12` ("chore: deployment script at
        repository root"): `scripts/deploy.sh` landed outside the manifest's
        `src/**` and `.env.example` allow. No later landing corrected it in the
        window, and the tree's `src/` home for product code holds across the
        other four landings.
      - **`no-test-tampering`, `decisions-reported`, `self-audit` skipped every
        landing** with the no-task skip: no contract has ever existed in this
        repository, so nothing gave them a spec to check against. The survey's
        `corpus_adds` names exactly these three — the corpus's absence made
        visible.
  - key: decisions
    md: |-
      | # | Grade | Decision | Paths | Consequence |
      | --- | --- | --- | --- | --- |
      | S-0001/D-1 | `LOCKED` | Credentials never enter the source tree; secrets are injected from the deployment environment | `src/**` `.env.example` | The repository's history defended this boundary: the survey's secrets gate fired when a key landed in `src/leak.py` and the next landing removed it; crossing it again is expensive to undo |
      | S-0001/D-2 | `ASSUMED` | Product code lives under `src/**`; operational scripts live under `scripts/**` | `src/**` `scripts/**` | The survey's scope gate fired once on a root-level deploy script and stayed clean on the other four landings; whether the layout is deliberate is the acceptance edit's call |
      | S-0001/D-3 | `ASSUMED` | Test files are edited only under a task's licence; adding a test is an addition, editing one needs scope | `tests/**` | The no-test-tampering gate never measured a single landing — no task existed — so this row gives the gate a spec once work is minted |
      | S-0001/D-4 | `ASSUMED` | Work touching governed areas records its decisions in the task log | `.torve/tasks/**` `logs/**` | The decisions-reported gate never measured a landing; this row is the corpus layer that turns its no-task skip into something that can fire |
      | S-0001/D-5 | `ASSUMED` | Execution logs carry the declared drift count | `.torve/tasks/**` `logs/**` | The self-audit gate never measured a landing; this row names the log discipline the gate reads |
