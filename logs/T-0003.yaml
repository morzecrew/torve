  attempt: 1
  claim: gates that shell out must not run in the agent's used sandbox — an agent can tamper the environment
    (a PATH shim faking the test runner) so the gate would compute inside the agent's trust boundary;
    the spec places gates "in the task sandbox" without saying which one
  evidence: src/torve/run.py:1-14
  action: decided
  proposal: ASSUMED — `torve run` executes shell gates in a fresh sandbox from the same image over the
    same worktree, via an executor seam in the gate runner; diff/task/log-input gates are pure computation
    and run in the engine
