  claim: RFC 0003 §5 stages notifications through the outbox in the same transaction as the state change,
    but the outbox is only reachable through the forze context facade with transaction plumbing — the
    heaviest piece of the integration; settled with the charter owner 2026-08-21 to defer
  evidence: '`rg -n "outbox" src/torve/ --type py` — no matches'
  action: decided
