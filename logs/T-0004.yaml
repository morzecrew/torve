  attempt: 1
  claim: '`torve reap --force` must be able to drain runs whose leases are healthy but whose operator
    wants them gone, which no fenced write can do by design'
  evidence: src/torve/taskstore.py:93-100
  action: decided
  proposal: ASSUMED — forced reap is the one deliberate use of an unfenced terminal write, an operator
    override that exists so a stuck system is always drainable
- decision: unlisted
  grade: UNLISTED
  kind: resolved
  class: discovery
  at: '2026-08-21T19:22:00Z'
  attempt: 1
  claim: a body doing blocking sandbox work in a thread observes cancellation only at the next port-call
    boundary, so the ask lands after at most one heartbeat plus one in-flight sandbox operation, bounded
    by the agent hard timeout
  evidence: src/torve/run.py:273-277
  action: decided
  proposal: ASSUMED — cancel observation latency is one heartbeat plus the current port call, bounded
    by the agent hard timeout; RFC 0003 §5's "a body that never awaits is bounded only by maximum run
    duration" already anticipates exactly this
