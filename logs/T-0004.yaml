  at: '2026-08-21T19:05:00Z'
  attempt: 1
  claim: RFC 0003 §7 says substrate tables "have their own provisioning path; do not reinvent it" — in
    reality forze documents the DDL only in adapter docstrings and ships no migrations, so someone must
    own the DDL
  evidence: src/torve/adapters/durable_store.py:6-11
  action: decided
  proposal: ASSUMED — torve owns the DDL for its durable tables (transcribed from the substrate's documented
    schemas, additive-only) and applies it via `torve store provision`; RFC 0003 §7's sentence is amended
    to "the substrate documents the schema; the adapter owns applying it"
- decision: unlisted
  grade: UNLISTED
  kind: resolved
  class: spec-gap
  at: '2026-08-21T19:10:00Z'
  attempt: 1
  claim: the durable store's status vocabulary and the task state machine are different things and nothing
    says how they map
  evidence: src/torve/run.py:293-296
  action: decided
  proposal: 'ASSUMED — COMPLETED wraps every engine verdict (ready and escalated alike: the run finished
    deciding); FAILED is an unhandled engine exception; CANCELLED maps to escalation `killed`; TIMED_OUT
    (the store watchdog) maps to `budget_exhausted`'
- decision: unlisted
  grade: UNLISTED
  kind: resolved
  class: spec-gap
  at: '2026-08-21T19:14:00Z'
  attempt: 1
  claim: the mock store is in-process, so a reaper in another process cannot see its leases; D-3.6 already
    says Postgres for real runs but nothing says what reap does under the mock
  evidence: src/torve/runconfig.py:41-47
  action: decided
  proposal: 'ASSUMED — under `store.adapter: mock` the reaper keeps the v1 heartbeat heuristic; under
    postgres the lease is the liveness authority via claim_abandoned; cross-process durability requires
    postgres, stated in configuration'
- decision: unlisted
  grade: UNLISTED
  kind: resolved
