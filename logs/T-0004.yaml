  at: '2026-08-21T19:30:00Z'
  attempt: 1
  claim: the simulation surfaced that store-level idempotent claim convergence (an idempotency key per
    task-generation) is a stronger mutual-exclusion mechanism than the engine's state-file guard; torve
    currently keys per engine run and relies on the file guard
  evidence: tests/dst_world.py:143
  action: decided
  proposal: 'ASSUMED — candidate row for the RFC 0006 dispatch design: dispatch keys durable runs by task
    and generation so concurrent dispatches of one task converge on a single claim instead of racing the
    state-file guard'
