# qwen3.8-flash, repointed 2026-09-01 from OpenRouter to the ModelStudio
# token plan through the run's egress broker (D-21.1: no credential in the
# overlay; per-run route and token arrive as TORVE_BROKER_URL/TOKEN). A
# different route is a different digest — a visible regime change (D-17.4).
- id: llm-pi-ai
  config:
    providers:
      torve-broker:
        api: openai-completions
        baseURL: !!js process.env.TORVE_BROKER_URL
        apiKeyEnv: TORVE_BROKER_TOKEN
        # 2026-09-02: a wedged-but-trickling stream idled two attempts to the
        # full agent cap — the hard per-request timeout is the fix, the idle
        # cap the backstop; agent-level retries reissue within the attempt.
        timeoutMs: 600000
        streamIdleTimeoutMs: 120000
        # These are reasoning models (plan console); false stripped the
        # capability and every trace showed reasoningTokens: 0.
        reasoning: medium
        # The endpoint takes classic roles only (400 on `developer`, which
        # pi-ai switches to for reasoning models) and returns thinking as
        # deepseek-style reasoning_content.
        compat:
          supportsDeveloperRole: false
          thinkingFormat: deepseek
        models:
          - id: qwen3.8-flash
            name: Qwen3.8 Flash
            contextWindow: 1000000
            maxTokens: 65536
            input: [text]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
- id: agent-default-model
  config:
    provider: torve-broker
    model: qwen3.8-flash
