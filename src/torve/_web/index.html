<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>torve</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2318181b'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%2334d399'/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#101014; --panel:#17171c; --panel2:#1d1d24; --line:#26262e;
  --text:#e4e4e9; --dim:#8b8b96; --faint:#5b5b66;
  --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa;
  --violet:#a78bfa; --cyan:#22d3ee;
  --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,'Segoe UI',Inter,Roboto,sans-serif}
a{color:var(--blue)}
.mono{font-family:var(--mono);font-size:12.5px}

header{position:sticky;top:0;z-index:10;background:rgba(16,16,20,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:0 20px}
.hrow{display:flex;align-items:center;gap:14px;height:52px}
.logo{font-weight:650;letter-spacing:.4px;font-size:15px}
.logo b{color:var(--green);font-weight:650}
#stamp{margin-left:auto;color:var(--dim);font-size:12px;display:flex;align-items:center;gap:8px}
#dot{width:7px;height:7px;border-radius:50%;background:var(--green);transition:background .3s}
#dot.stale{background:var(--red)}

nav{display:flex;gap:2px;overflow-x:auto}
nav button{appearance:none;border:0;background:none;color:var(--dim);padding:9px 13px;font:inherit;
  font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
nav button:hover{color:var(--text)}
nav button.on{color:var(--text);border-bottom-color:var(--green)}
nav .n{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 7px;
  font-size:11px;color:var(--dim);line-height:17px}
nav button.on .n{color:var(--text)}

main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
section{display:none}section.on{display:block}

.controls{display:flex;gap:10px;align-items:center;margin:2px 0 14px;flex-wrap:wrap}
.controls input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);padding:7px 12px;font:inherit;font-size:13px;width:260px;outline:none}
.controls input[type=search]:focus{border-color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 11px;
  font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.chip.on{color:var(--text);border-color:var(--faint);background:var(--panel2)}
.chip .c{opacity:.7;margin-left:5px}
.spacer{flex:1}
.note{color:var(--faint);font-size:12px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.card .v{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.card .s{font-size:12px;color:var(--dim);margin-top:1px}

.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);color:var(--dim);font-weight:500;text-align:left;
  padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
td.id{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td.wrap{max-width:560px}
td.dim{color:var(--dim)}
.empty{padding:28px;text-align:center;color:var(--faint)}

.b{display:inline-block;border-radius:5px;padding:1px 8px;font-size:11.5px;font-weight:550;white-space:nowrap}
.b.green{background:rgba(52,211,153,.13);color:var(--green)}
.b.amber{background:rgba(251,191,36,.13);color:var(--amber)}
.b.red{background:rgba(248,113,113,.13);color:var(--red)}
.b.blue{background:rgba(96,165,250,.13);color:var(--blue)}
.b.violet{background:rgba(167,139,250,.13);color:var(--violet)}
.b.grey{background:rgba(139,139,150,.13);color:var(--dim)}
.b.cyan{background:rgba(34,211,238,.13);color:var(--cyan)}

.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel2);min-width:90px}
.bar i{display:block}
.pgrow{display:flex;gap:6px;flex-wrap:wrap}
.ph{border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:11.5px;font-family:var(--mono)}
.ph.shipped{color:var(--green);border-color:rgba(52,211,153,.35)}
.ph.in_flight{color:var(--blue);border-color:rgba(96,165,250,.35)}
.ph.blocked{color:var(--red);border-color:rgba(248,113,113,.35)}
.ph.planned{color:var(--dim)}
details.frow{border-bottom:1px solid var(--line);background:var(--panel)}
details.frow:last-child{border-bottom:0}
details.frow summary{display:flex;gap:10px;align-items:baseline;padding:9px 14px;cursor:pointer;list-style:none}
details.frow summary::-webkit-details-marker{display:none}
details.frow .claim{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
details.frow[open] .claim{white-space:normal}
details.frow .body{padding:2px 14px 12px 14px;color:var(--dim);font-size:12.5px}
details.frow .body .ev{font-family:var(--mono);font-size:12px;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.caveat{color:var(--faint);font-size:12px;margin-top:14px;max-width:900px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <span class="logo">torve<b>·</b>operator</span>
    <span id="stamp"><span id="dot"></span><span id="stamptext">connecting…</span></span>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,html)=>{const e=document.createElement(t);if(c)e.className=c;if(html!==undefined)e.innerHTML=html;return e;};
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt$=v=>v==null?"—":"$"+(+v).toFixed(v>=10?2:4);
const fmtK=v=>v==null?"—":v>=1e6?(v/1e6).toFixed(2)+"M":v>=1e3?(v/1e3).toFixed(1)+"k":String(v);
const ago=iso=>{if(!iso)return"—";const s=(Date.now()-Date.parse(iso))/1e3;
  if(s<90)return Math.round(s)+"s ago";if(s<5400)return Math.round(s/60)+"m ago";
  if(s<172800)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago";};
const when=iso=>iso?iso.replace("T"," ").replace(/:\d\dZ$/,""):"—";

const STATE_COLOR={shipped:"green",ready:"green",consumed:"grey",unstarted:"grey",
  running:"blue",claimed:"blue",gated:"amber",reviewed:"violet",queued:"grey",escalated:"red"};
const SEV_COLOR={blocker:"red",major:"amber",minor:"blue",nit:"grey"};
const badge=(txt,color)=>`<span class="b ${color||"grey"}">${esc(txt)}</span>`;

const TABS=[["board","Board"],["runs","Runs"],["findings","Findings"],["costs","Costs"],
  ["gates","Gates"],["programme","Programme"],["proposals","Proposals"],["attention","Attention"]];
let ctx=null, live=null, tab=location.hash.slice(1)||"board";
const filters={board:{q:"",states:new Set()},findings:{q:"",sev:new Set(),hideAddressed:true},
  costs:{q:""},proposals:{q:"",hideLanded:true}};

function nav(){
  const n=$("#tabs");n.innerHTML="";
  for(const[id,label]of TABS){
    const b=el("button",tab===id?"on":"");
    b.innerHTML=`${label}<span class="n" id="count-${id}"></span>`;
    b.onclick=()=>{tab=id;location.hash=id;nav();render();};
    n.appendChild(b);
  }
}
function counts(){
  if(!ctx)return;
  const set=(id,v)=>{const e=$("#count-"+id);if(e)e.textContent=v;};
  set("board",ctx.tasks.length);
  set("runs",(live?.runs||[]).length);
  set("findings",ctx.findings.filter(f=>!f.possibly_addressed).length);
  set("costs",ctx.costs.length);
  set("gates",Object.keys(ctx.gates).length);
  set("programme",ctx.programme.length);
  set("proposals",ctx.proposals.filter(p=>!p.possibly_landed).length);
  const oa=ctx.spec_quality?.operator_attention;set("attention",oa?oa.landed:0);
}

function table(cols,rows,empty){
  if(!rows.length)return `<div class="tablewrap"><div class="empty">${esc(empty||"nothing here")}</div></div>`;
  return `<div class="tablewrap"><table><thead><tr>${
    cols.map(c=>`<th${c.num?' class="num"':""}>${esc(c.h)}</th>`).join("")
  }</tr></thead><tbody>${rows.map(r=>`<tr>${
    cols.map(c=>`<td class="${c.cls||""}${c.num?" num":""}">${c.f(r)}</td>`).join("")
  }</tr>`).join("")}</tbody></table></div>`;
}

/* ---------- tabs ---------- */

function boardTab(m){
  const f=filters.board;
  const byState={};for(const t of ctx.tasks)(byState[t.state]??=[]).push(t);
  const order=["running","claimed","gated","reviewed","ready","escalated","unstarted","shipped","consumed"];
  const states=order.filter(s=>byState[s]).concat(Object.keys(byState).filter(s=>!order.includes(s)));

  const esc_=Object.entries(ctx.escalations||{});
  const cards=el("div","cards");
  cards.append(
    card("shipped",(byState.shipped||[]).length,"landed in history"),
    card("active",states.filter(s=>["running","claimed","gated","reviewed"].includes(s))
      .reduce((a,s)=>a+byState[s].length,0),"in the loop now"),
    card("escalated",(byState.escalated||[]).length + esc_.reduce((a,[,v])=>a+(v.length||0),0),"awaiting the operator"),
    card("ready",(byState.ready||[]).length,"awaiting merge"));
  m.appendChild(cards);

  const ctl=el("div","controls");
  const inp=el("input");inp.type="search";inp.placeholder="filter id / rfc / role…";inp.value=f.q;
  inp.oninput=()=>{f.q=inp.value.toLowerCase();draw();};
  const chips=el("div","chips");
  for(const s of states){
    const c=el("span","chip"+(f.states.has(s)?" on":""),`${esc(s)}<span class="c">${byState[s].length}</span>`);
    c.onclick=()=>{f.states.has(s)?f.states.delete(s):f.states.add(s);boardTab.refresh();};
    chips.appendChild(c);
  }
  ctl.append(inp,chips);m.appendChild(ctl);

  const holder=el("div");m.appendChild(holder);
  const draw=()=>{
    let rows=ctx.tasks.slice().reverse();
    if(f.states.size)rows=rows.filter(t=>f.states.has(t.state));
    if(f.q)rows=rows.filter(t=>(t.id+" "+(t.rfc||"")+" "+t.role+" "+(t.escalation||"")).toLowerCase().includes(f.q));
    holder.innerHTML=table([
      {h:"task",cls:"id",f:t=>esc(t.id)},
      {h:"state",f:t=>badge(t.state,STATE_COLOR[t.state])},
      {h:"role",cls:"dim",f:t=>esc(t.role)},
      {h:"rfc",cls:"id dim",f:t=>esc((t.rfc||"—").replace("rfcs/","").replace(".md",""))},
      {h:"phase",num:true,cls:"dim",f:t=>t.phase??"—"},
      {h:"attempts",num:true,f:t=>t.attempts||""},
      {h:"escalation",cls:"wrap",f:t=>t.escalation?badge(t.escalation,"red"):""},
      {h:"parent",cls:"id dim",f:t=>esc(t.parent||"")},
    ],rows,"no tasks match");
  };
  boardTab.refresh=()=>{boardTab(clear(m));};
  draw();
}
function card(k,v,s){const c=el("div","card");c.innerHTML=`<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div>`;return c;}

function runsTab(m){
  const runs=live?.runs||[];
  m.appendChild(el("div","note",`live run states, polled every 3s`)).style.marginBottom="12px";
  m.appendChild(el("div","",table([
    {h:"task",cls:"id",f:r=>esc(r.task_id||r.task)},
    {h:"state",f:r=>badge(r.state,STATE_COLOR[r.state])},
    {h:"attempts",num:true,f:r=>r.attempts??"—"},
    {h:"heartbeat",f:r=>{const hb=r.heartbeat_at||r.heartbeat;return hb?esc(ago(hb)):"—";}},
    {h:"escalation",cls:"wrap",f:r=>r.escalation?`${badge(r.escalation.reason||r.escalation,"red")} <span class="dim">${esc((r.escalation.detail||"").slice(0,180))}</span>`:""},
  ],runs,"no live runs — the board is quiet")));
}

function findingsTab(m){
  const f=filters.findings;
  const ctl=el("div","controls");
  const inp=el("input");inp.type="search";inp.placeholder="filter claim / task…";inp.value=f.q;
  inp.oninput=()=>{f.q=inp.value.toLowerCase();draw();};
  const chips=el("div","chips");
  for(const s of["blocker","major","minor","nit"]){
    const n=ctx.findings.filter(x=>x.severity===s).length;if(!n)continue;
    const c=el("span","chip"+(f.sev.has(s)?" on":""),`${s}<span class="c">${n}</span>`);
    c.onclick=()=>{f.sev.has(s)?f.sev.delete(s):f.sev.add(s);draw();chipSync();};
    chips.appendChild(c);
  }
  const hide=el("span","chip"+(f.hideAddressed?" on":""),"hide possibly addressed");
  hide.onclick=()=>{f.hideAddressed=!f.hideAddressed;draw();chipSync();};
  const chipSync=()=>{[...chips.children].forEach((c,i)=>{});};
  ctl.append(inp,chips,hide);m.appendChild(ctl);
  const holder=el("div");m.appendChild(holder);
  const draw=()=>{
    let rows=ctx.findings.slice().reverse();
    if(f.hideAddressed)rows=rows.filter(x=>!x.possibly_addressed);
    if(f.sev.size)rows=rows.filter(x=>f.sev.has(x.severity));
    if(f.q)rows=rows.filter(x=>(x.claim+" "+x.review+" "+x.target).toLowerCase().includes(f.q));
    if(!rows.length){holder.innerHTML=`<div class="tablewrap"><div class="empty">ledger clear</div></div>`;return;}
    const wrap=el("div","tablewrap");
    for(const x of rows){
      const d=el("details","frow");
      d.innerHTML=`<summary>${badge(x.severity,SEV_COLOR[x.severity])}
        <span class="id mono dim">${esc(x.review)}→${esc(x.target)}</span>
        <span class="claim">${esc(x.claim)}</span>
        ${x.possibly_addressed?badge("possibly addressed","green"):""}</summary>
        <div class="body">${x.evidence?`<div class="ev">${esc(x.evidence)}</div>`:""}</div>`;
      wrap.appendChild(d);
    }
    holder.innerHTML="";holder.appendChild(wrap);
  };
  draw();
}

function costsTab(m){
  const rows=ctx.costs.slice();
  const total=rows.reduce((a,r)=>a+(+r.cost_usd||0),0);
  const byModel={};
  for(const r of rows){const k=r.model||r.adapter||"?";byModel[k]=(byModel[k]||0)+(+r.cost_usd||0);}
  const cards=el("div","cards");
  cards.appendChild(card("total recorded",fmt$(total),rows.length+" records"));
  for(const[mo,v]of Object.entries(byModel).sort((a,b)=>b[1]-a[1]).slice(0,3))
    cards.appendChild(card(mo,fmt$(v),"by model"));
  m.appendChild(cards);

  const f=filters.costs, ctl=el("div","controls");
  const inp=el("input");inp.type="search";inp.placeholder="filter task / model / regime…";inp.value=f.q;
  inp.oninput=()=>{f.q=inp.value.toLowerCase();draw();};
  ctl.append(inp,el("span","note","tokens appear on records made after the token-shape landing"));
  m.appendChild(ctl);
  const holder=el("div");m.appendChild(holder);
  const draw=()=>{
    let rws=rows;
    if(f.q)rws=rws.filter(r=>((r.task||"")+" "+(r.model||"")+" "+(r.config_hash||"")+" "+(r.harness||"")).toLowerCase().includes(f.q));
    holder.innerHTML=table([
      {h:"at",cls:"id dim",f:r=>esc(when(r.at))},
      {h:"task",cls:"id",f:r=>esc(r.task||"—")},
      {h:"kind",cls:"dim",f:r=>esc(r.kind)},
      {h:"regime",cls:"id dim",f:r=>esc((r.config_hash||"").slice(0,8))},
      {h:"model",f:r=>esc(r.model||r.adapter||"—")},
      {h:"cost",num:true,f:r=>fmt$(r.cost_usd)},
      {h:"in",num:true,cls:"dim",f:r=>fmtK(r.input_tokens)},
      {h:"cache",num:true,cls:"dim",f:r=>fmtK(r.cache_read_tokens)},
      {h:"out",num:true,cls:"dim",f:r=>fmtK(r.output_tokens)},
      {h:"harness",cls:"id dim",f:r=>esc(r.harness||"—")},
    ],rws,"no cost records match");
  };
  draw();
}

function gatesTab(m){
  const rows=Object.entries(ctx.gates).map(([name,g])=>({name,...g}))
    .sort((a,b)=>b.runs-a.runs);
  m.appendChild(el("div","",table([
    {h:"gate",cls:"id",f:g=>esc(g.name)},
    {h:"runs",num:true,f:g=>g.runs},
    {h:"failures",num:true,f:g=>g.failures?badge(g.failures,"amber"):"0"},
    {h:"fail rate",num:true,cls:"dim",f:g=>g.runs?((100*g.failures/g.runs).toFixed(1)+"%"):"—"},
    {h:"flaky",num:true,f:g=>g.flaky?badge(g.flaky,"red"):"0"},
    {h:"bypassed",num:true,cls:"dim",f:g=>g.bypassed||0},
    {h:"mean",num:true,cls:"dim",f:g=>g.mean_duration_s.toFixed(2)+"s"},
    {h:"max",num:true,cls:"dim",f:g=>g.max_duration_s.toFixed(1)+"s"},
    {h:"minutes total",num:true,cls:"dim",f:g=>(g.total_duration_s/60).toFixed(1)},
  ],rows)));
}

function programmeTab(m){
  const rows=ctx.programme.slice();
  const done=rows.filter(r=>r.implementation==="complete").length;
  const cards=el("div","cards");
  cards.append(card("documents",rows.length,"in the corpus"),
    card("complete",done,"implementation judged"),
    card("in flight",rows.filter(r=>r.implementation==="partial").length,"partial"),
    card("disagreements",rows.filter(r=>r.disagreement).length,"assertion vs derived"));
  m.appendChild(cards);
  m.appendChild(el("div","",table([
    {h:"rfc",cls:"id",f:r=>esc(r.rfc)},
    {h:"title",cls:"wrap",f:r=>esc(r.title)},
    {h:"status",f:r=>badge(r.status,r.status==="accepted"?"green":"grey")},
    {h:"impl",f:r=>badge(r.implementation||"none",{complete:"green",partial:"blue",none:"grey"}[r.implementation]||"grey")},
    {h:"phases",f:r=>{
      const pr=r.progress||{};const keys=Object.keys(pr).sort((a,b)=>+a-+b);
      if(!keys.length)return`<span class="dim">—</span>`;
      return`<span class="pgrow">${keys.map(k=>`<span class="ph ${esc(pr[k])}">P${esc(k)}</span>`).join("")}</span>`;}},
    {h:"flags",cls:"wrap",f:r=>[
      r.disagreement?badge("⚠ "+r.disagreement,"amber"):"",
      r.plannable?badge("plannable","cyan"):"",
      (r.unsatisfied_depends_on||[]).length?badge("waits on "+r.unsatisfied_depends_on.join(", "),"grey"):"",
    ].filter(Boolean).join(" ")},
  ],rows)));
}

function proposalsTab(m){
  const f=filters.proposals, ctl=el("div","controls");
  const inp=el("input");inp.type="search";inp.placeholder="filter decision / task…";inp.value=f.q;
  inp.oninput=()=>{f.q=inp.value.toLowerCase();draw();};
  const hide=el("span","chip"+(f.hideLanded?" on":""),"hide possibly landed");
  hide.onclick=()=>{f.hideLanded=!f.hideLanded;hide.classList.toggle("on");draw();};
  ctl.append(inp,hide);m.appendChild(ctl);
  const holder=el("div");m.appendChild(holder);
  const draw=()=>{
    let rows=ctx.proposals.slice().reverse();
    if(f.hideLanded)rows=rows.filter(p=>!p.possibly_landed);
    if(f.q)rows=rows.filter(p=>(p.decision+" "+p.task+" "+p.claim).toLowerCase().includes(f.q));
    if(!rows.length){holder.innerHTML=`<div class="tablewrap"><div class="empty">nothing awaiting the author</div></div>`;return;}
    const wrap=el("div","tablewrap");
    for(const p of rows){
      const d=el("details","frow");
      d.innerHTML=`<summary>${badge(p.decision,"violet")}${badge(p.grade,p.grade==="LOCKED"?"red":"grey")}
        <span class="id mono dim">${esc(p.task)}</span>
        <span class="claim">${esc(p.proposal||p.claim)}</span>
        ${p.possibly_landed?badge("possibly landed","green"):""}</summary>
        <div class="body">claim: ${esc(p.claim)}${p.evidence?`<div class="ev">${esc(p.evidence)}</div>`:""}</div>`;
      wrap.appendChild(d);
    }
    holder.innerHTML="";holder.appendChild(wrap);
  };
  draw();
}

function attentionTab(m){
  const oa=ctx.spec_quality?.operator_attention;
  if(!oa){m.appendChild(el("div","empty","no attention data"));return;}
  const cards=el("div","cards");
  cards.append(
    card("landed changes",oa.landed,"in the window"),
    card("feedback joined",`${oa.feedback.joined} / ${oa.feedback.total}`,"per landed / recorded"),
    card("command events",`${oa.command_events.joined} / ${oa.command_events.total}`,"joined / total"),
    card("escalations triaged",`${oa.escalations_triaged.joined} / ${oa.escalations_triaged.total}`,"joined / total"),
    card("human minutes (median)",oa.human_minutes_median??"—",`n=${oa.human_minutes_n} · floor ${oa.floor}`));
  m.appendChild(cards);
  m.appendChild(el("p","caveat",esc(oa.caveat||ctx.spec_quality.caveat||"")));
  const docs=ctx.spec_quality.documents;
  if(Array.isArray(docs)&&docs.length){
    m.appendChild(el("h3","", "document signals")).style.cssText="margin:18px 0 10px;font-size:14px;color:var(--dim)";
    m.appendChild(el("div","",table([
      {h:"document",cls:"id",f:d=>esc((d.document||d.rfc||"").replace("rfcs/","").replace(".md",""))},
      {h:"decisions",num:true,cls:"dim",f:d=>d.decisions??d.rows??"—"},
      {h:"signals",cls:"wrap dim",f:d=>esc(JSON.stringify(d).slice(0,160))},
    ],docs)));
  }
}

/* ---------- shell ---------- */

const clear=m=>{m.innerHTML="";return m;};
function render(){
  const m=clear($("#main"));
  if(!ctx){m.appendChild(el("div","empty","waiting for the projection…"));return;}
  const s=el("section","on");m.appendChild(s);
  ({board:boardTab,runs:runsTab,findings:findingsTab,costs:costsTab,
    gates:gatesTab,programme:programmeTab,proposals:proposalsTab,attention:attentionTab}[tab]||boardTab)(s);
  counts();
}

async function pollCtx(){
  try{
    const r=await fetch("/api/context");ctx=await r.json();
    $("#dot").classList.remove("stale");
    $("#stamptext").textContent="projected "+ago(ctx.at);
    counts();if(["board","findings","costs","gates","programme","proposals","attention"].includes(tab))render();
  }catch{ $("#dot").classList.add("stale");$("#stamptext").textContent="engine unreachable"; }
}
async function pollLive(){
  try{
    const r=await fetch("/api/status");live=await r.json();
    counts();if(tab==="runs")render();
  }catch{ /* dot handled by ctx poll */ }
}
nav();render();
pollCtx();pollLive();
setInterval(pollCtx,10000);setInterval(pollLive,3000);
setInterval(()=>{if(ctx)$("#stamptext").textContent="projected "+ago(ctx.at);},5000);
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==tab){tab=h;nav();render();}});
</script>
</body>
</html>
