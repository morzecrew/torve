[project]
name = "torve"
version = "0.1.0"
description = "A specification-and-gate engine for a standing agent team: graded decisions, scope as a contract, deterministic gates, sandboxed runs"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "morzecrew" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # Linux only, and stated: the sandboxes and the sealed broker run on Docker
    # networking, and nothing in CI runs another platform.
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    # One operator and one adopter so far; the formats carry schema versions
    # but no stability page binds them yet.
    "Development Status :: 3 - Alpha",
]
keywords = ["agents", "ai", "code-review", "gates", "sandbox", "specification"]
dependencies = [
    "attrs>=25",
    # Exact, as `migrations/substrate/FORZE_VERSION` is: the substrate
    # migrations were written against this forze, and `torve doctor` refuses
    # any other (S-0012/D-7). A range here resolves a forze the migrations
    # never met. The pin and this line move together.
    "forze==0.10.0",
    "pathspec>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13",
    "typer>=0.16",
]

[project.optional-dependencies]
# 0.x: a minor may break the SDK the adapter imports.
opensandbox = ["opensandbox>=0.1.15,<0.2"]
postgres = ["forze[postgres]==0.10.0"]
# Applied in production, absent from a gates-only CI install.
migrate = ["yoyo-migrations>=9"]
# The planning session's read surface — never installed into an executor image.
mcp = ["mcp>=1.2"]
# The loopback dashboard's HTTP stack (S-0032) — lazy-imported behind
# the extra, so a gates-only install never pays for it.
serve = ["starlette>=1.0", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/morzecrew/torve"
Documentation = "https://morzecrew.github.io/torve/"
Repository = "https://github.com/morzecrew/torve"
Changelog = "https://github.com/morzecrew/torve/blob/main/CHANGELOG.md"
Issues = "https://github.com/morzecrew/torve/issues"

[project.scripts]
torve = "torve.cli:main"

[dependency-groups]
dev = [
    # Backs the layering gate (S-0015, S-0015/D-8). Dev-only on purpose
    # (S-0015/D-10): a check on Torve's internals never ships to consumers.
    "import-linter>=2",
    "forze[dst,postgres]==0.10.0",
    "basedpyright>=1.31",
    "mypy[faster-cache]>=1.19",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    # Backs the worker count in `addopts` below (S-0071/D-1). Dev-only like
    # pytest-timeout: how this repository runs its own tests is no concern of
    # a consumer.
    "pytest-xdist>=3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12",
    "yoyo-migrations>=9",
    "mcp>=1.2",
    # Backs the serve endpoint tests (starlette's TestClient).
    "starlette>=1.0",
    "vulture>=2.16",
    "deptry>=0.25.1",
    "bandit>=1.9.4",
    "zizmor>=1.29.0",
    "pre-commit>=4.6.2",
    # Back the coverage-delta gate (S-0036/the-coverage-delta-gate). Dev-only like
    # import-linter: a check on this repository's own test evidence never
    # ships to consumers.
    "pytest-cov>=7.1.0",
    "diff-cover>=10.5.1",
]
docs = [
    # The documentation site under `pages/` (Zensical) and its versioning
    # (mike, Zensical's fork). Its own group, as bloomery keeps it: building the
    # site is no concern of a consumer, and CI installs it only to deploy.
    "mike",
    "pygments>=2.19",
    "pymdown-extensions>=10.14",
    "zensical>=0.0.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# What the sdist carries is named, not whatever the tree holds: without a list
# hatch packs everything the root `.gitignore` misses — `.torve/` state and
# telemetry, `.claude/` and `.mcp.json` with a developer's paths, `web/` with
# its node_modules. The list is what the wheel builds from (the package and
# its forced includes below) plus the lockfile and the changelog. Anchored:
# the patterns match as `.gitignore` lines do, so a bare `skills` also takes
# `.agents/skills` and `.claude/skills`, and a bare `README.md` `web/README.md`.
[tool.hatch.build.targets.sdist]
include = [
    "/src/torve",
    "/skills",
    "/migrations",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
# Pruned before the walk, not filtered after it. `.agents/skills` and
# `.claude/skills` hold symlinks into `skills/`, and hatch walks each real
# directory once, in sorted order: the dot directories came first, so
# `skills/spec-writer`, `skills/flag-dont-flip` and `skills/working-rules`
# were seen there, never under `skills/`, and the wheel built from the sdist
# shipped without them.
exclude = ["/.agents", "/.claude"]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/torve"]

[tool.hatch.build.targets.wheel.force-include]
# The specialised skills ship inside the wheel (S-0009/A-1, S-0009/D-7): skill and gate
# are one unit of versioning by construction.
"skills" = "torve/_skills"
# Migrations ship as package data (rfcs/0012-migrations.md §2): a wheel that knows how
# to migrate but has nothing to migrate with is discovered at first deployment.
"migrations" = "torve/_migrations"

# S-0015/enforcement-the-layering-gate (S-0015/D-8): the layer rules as import-linter contracts, wrapped by
# the `layering` gate. `gates` and `config` sit beside the main stack — they
# do not fit a total order, so they get their own forbidden contracts.
[tool.importlinter]
root_package = "torve"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "torve.cli",
    "torve.adapters",
    "torve.application",
    "torve.domain",
    "torve.base",
]

[[tool.importlinter.contracts]]
name = "Gates stand alone"
type = "forbidden"
source_modules = ["torve.gates"]
forbidden_modules = ["torve.application", "torve.adapters"]

[[tool.importlinter.contracts]]
name = "Config stands alone"
type = "forbidden"
source_modules = ["torve.config"]
forbidden_modules = ["torve.application", "torve.adapters", "torve.cli"]

# 0015 S-0015/A-1, enforcing 0007's S-0007/D-18: the RFC format terminates at the
# planner (its owner is `config/spec.py` since S-0053 phase 5; the corpus is `.torve/specs/` since S-0057). A gate or runtime that parses specification documents directly is
# how format containment breaks, and it breaks quietly.
[[tool.importlinter.contracts]]
name = "The RFC format stays at the planner"
type = "forbidden"
source_modules = [
    "torve.gates",
    "torve.adapters.runtime",
    "torve.adapters.agent",
]
forbidden_modules = ["torve.config.spec"]

[[tool.importlinter.contracts]]
name = "Adapters are independent"
type = "independence"
modules = [
    "torve.adapters.agent",
    "torve.adapters.runtime",
    "torve.adapters.workspace",
    "torve.adapters.vcs",
    "torve.adapters.store",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Skills are content this repository vendors, not code it owns: `.agents` and
# `.claude` hold the ones beside the tree, `.torve/skills-vendor` the ones a
# run materialises. The formatter reads Python fences inside their markdown and
# would edit a teaching template's deliberate ellipsis.
extend-exclude = [".agents", ".claude", ".torve/skills-vendor"]

[tool.ruff.lint]
# forze's selection (S-0014 S-0014/D-9): two codebases read by the same people
# should not differ in mechanics. T20 enforces S-0011's boundary — print is
# the CLI's output contract and belongs nowhere else.
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "ASYNC",
    "C4",
    "ISC",
    "PIE",
    "T20",
    "SIM",
]
ignore = [
    "E501", # line length is owned by `ruff format` (code is wrapped at 100); the remaining long
    # lines are unwrappable prose
    "ISC001", # single-line implicit concat: conflicts with `ruff format`
    "RUF001", # ambiguous unicode: docstrings deliberately use typographic punctuation (—, §, ·)
    "RUF002", # see RUF001
    "RUF003", # see RUF001
]

[tool.ruff.lint.per-file-ignores]
# A standalone analysis script is invoked as `python3 scripts/<name>.py`, so
# stdout *is* its output contract — the same reason T20 does not reach the CLI,
# which prints through rich. S-0055/D-59 already exempts `scripts/` from the
# type floor for the same reason: it is not code the engine imports.
"scripts/*" = ["T201"]

# ....................... #
# Dead code

[tool.vulture]
paths = ["src/torve"]
sort_by_size = true
# bloomery's floor: 60 drowns in pydantic model_config/field false positives
min_confidence = 80
# `indentless` is PyYAML's keyword on the override; `--check` is the only
# mode of `spec fmt` and the flag is kept for its callers.
ignore_names = ["indentless", "check_only"]

# ....................... #
# Security

[tool.bandit]
# Torve's job is driving git/gh/docker as subprocesses with list arguments and
# PATH-resolved executables; flagging every such call is flagging the design.
# Anything sharper (shell=True, hardcoded tmp) stays on and is exempted per
# line with a justified `# nosec`.
# B101: the handful of asserts in src are type-narrowing invariants mypy
# already relies on, not input validation.
skips = ["B101", "B404", "B603", "B607"]

# ....................... #
# Dependency analysis

[tool.deptry]
known_first_party = ["torve"]
# The engine's own hooks under `.torve/agents/hooks/` import each other as
# siblings; they are not a package and never ship.
extend_exclude = [".torve"]
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
DEP002 = [
    # Imported lazily behind their extras (`torve[opensandbox]`,
    # `torve[migrate]`, `torve[mcp]`, `torve[serve]`), so no static import
    # ties them to the codebase.
    "opensandbox",
    "yoyo-migrations",
    "mcp",
    "starlette",
    "uvicorn",
]

# ....................... #

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src", "tests"]
# The worker count lives here and not in a gate's command (S-0071/D-1): both
# gates that run the suite spell it `uv run pytest` and neither names one, so
# this reaches both without a contract changing. `-n 0` on the command line
# still buys a serial run.
addopts = ["-q", "--tb=short", "--strict-markers", "--strict-config", "-n", "auto"]
# Safety net: no test may hang the run indefinitely. On timeout, dump all
# thread stacks and kill the process (the `thread` method guarantees the run
# can't stick). Generous enough for container startup on a cold runner.
timeout = 300
timeout_method = "thread"

[tool.pyright]
# Kept for the editor only (pylance/cursorpyright read it), so what a
# developer sees inline agrees with what the gate checks. Nothing in CI or
# the acceptance battery runs it: `mypy` is the one type checker of record
# (S-0014/A-2) — two strict checkers over one tree bought disagreement, not depth.
include = ["src"]
ignore = ["tests", "scripts", "skills", ".venv", ".wt"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.mypy]
strict = true
# The gate runs `mypy src`; excluding tests keeps a bare `mypy .` from
# disagreeing with it. mypy's `exclude` is a regex over paths and does not
# apply to files named explicitly on the command line.
exclude = ["^tests/", "^scripts/", "^skills/"]

[[tool.mypy.overrides]]
# The OpenSandbox SDK ships no type information; the adapter imports it lazily
# behind the `torve[opensandbox]` extra.
module = ["opensandbox.*", "yoyo.*"]
ignore_missing_imports = true

[tool.uv.sources]
# Zensical's mike fork has no PyPI release. Pinned to the commit bloomery uses:
# an unpinned git source tracks the default branch, so a later `uv lock` would
# re-resolve it silently. A dependency group is not package metadata, so this
# git source never reaches a built wheel.
mike = { git = "https://github.com/squidfunk/mike", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac" }
