[project]
name = "torve"
version = "0.1.0"
description = "Deterministic gates for agent (and human) pull requests — RFC 0002 of the Torve corpus"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "morzecrew" }]
dependencies = [
    "click>=8.1",
    "forze>=0.6.0",
    "pathspec>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
opensandbox = ["opensandbox"]
postgres = ["forze[postgres]>=0.6.0"]
# Applied in production, absent from a gates-only CI install (MIGRATIONS.md §2).
migrate = ["yoyo-migrations>=9"]

[project.scripts]
torve = "torve.cli:main"

[dependency-groups]
dev = [
    "forze[dst,postgres]>=0.6.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "yoyo-migrations>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torve"]

[tool.hatch.build.targets.wheel.force-include]
# The specialised skills ship inside the wheel (A-3, D-9.7): skill and gate
# are one unit of versioning by construction.
"skills" = "torve/_skills"
# Migrations ship as package data (MIGRATIONS.md §2): a wheel that knows how
# to migrate but has nothing to migrate with is discovered at first deployment.
"migrations" = "torve/_migrations"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
