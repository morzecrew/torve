[project]
name = "torve"
version = "0.1.0"
description = "Deterministic gates for agent (and human) pull requests — RFC 0002 of the Torve corpus"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "morzecrew" }]
dependencies = [
    "forze>=0.6.0",
    "pathspec>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13",
    "typer>=0.16",
]

[project.optional-dependencies]
opensandbox = ["opensandbox"]
postgres = ["forze[postgres]>=0.6.0"]
# Applied in production, absent from a gates-only CI install (rfcs/0012-migrations.md §2).
migrate = ["yoyo-migrations>=9"]

[project.scripts]
torve = "torve.cli:main"

[dependency-groups]
dev = [
    # Backs the layering gate (RFC 0015, D-15.8). Dev-only on purpose
    # (D-15.10): a check on Torve's internals never ships to consumers.
    "import-linter>=2",
    "forze[dst,postgres]>=0.6.0",
    "mypy[faster-cache]>=1.19",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12",
    "yoyo-migrations>=9",
    "vulture>=2.16",
    "deptry>=0.25.1",
    "bandit>=1.9.4",
    "zizmor>=1.29.0",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torve"]

[tool.hatch.build.targets.wheel.force-include]
# The specialised skills ship inside the wheel (A-3, D-9.7): skill and gate
# are one unit of versioning by construction.
"skills" = "torve/_skills"
# Migrations ship as package data (rfcs/0012-migrations.md §2): a wheel that knows how
# to migrate but has nothing to migrate with is discovered at first deployment.
"migrations" = "torve/_migrations"

# RFC 0015 §6 (D-15.8): the layer rules as import-linter contracts, wrapped by
# the `layering` gate. `gates` and `config` sit beside the main stack — they
# do not fit a total order, so they get their own forbidden contracts.
[tool.importlinter]
root_package = "torve"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "torve.cli",
    "torve.adapters",
    "torve.application",
    "torve.domain",
    "torve.base",
]

[[tool.importlinter.contracts]]
name = "Gates stand alone"
type = "forbidden"
source_modules = ["torve.gates"]
forbidden_modules = ["torve.application", "torve.adapters"]

[[tool.importlinter.contracts]]
name = "Config stands alone"
type = "forbidden"
source_modules = ["torve.config"]
forbidden_modules = ["torve.application", "torve.adapters", "torve.cli"]

# 0015 A-19, enforcing 0007's D-7.18: the RFC format terminates at the
# planner. A gate or runtime that parses specification documents directly is
# how format containment breaks, and it breaks quietly.
[[tool.importlinter.contracts]]
name = "The RFC format stays at the planner"
type = "forbidden"
source_modules = ["torve.gates", "torve.adapters.runtime", "torve.adapters.agent"]
forbidden_modules = ["torve.config.rfc_parse"]

[[tool.importlinter.contracts]]
name = "Adapters are independent"
type = "independence"
modules = [
    "torve.adapters.agent",
    "torve.adapters.runtime",
    "torve.adapters.workspace",
    "torve.adapters.vcs",
    "torve.adapters.store",
    "torve.adapters.tracker",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
# forze's selection (RFC 0014 D-14.9): two codebases read by the same people
# should not differ in mechanics. T20 enforces RFC 0011's boundary — print is
# the CLI's output contract and belongs nowhere else.
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "ASYNC",
    "C4",
    "ISC",
    "PIE",
    "T20",
    "SIM",
]
ignore = [
    "E501", # line length is owned by `ruff format` (code is wrapped at 100); the remaining long
    # lines are unwrappable prose
    "ISC001", # single-line implicit concat: conflicts with `ruff format`
    "RUF001", # ambiguous unicode: docstrings deliberately use typographic punctuation (—, §, ·)
    "RUF002", # see RUF001
    "RUF003", # see RUF001
]

# ....................... #
# Dead code

[tool.vulture]
paths = ["src/torve", "scripts/vulture_whitelist.py"]
sort_by_size = true
# bloomery's floor: 60 drowns in pydantic model_config/field false positives
min_confidence = 80

# ....................... #
# Security

[tool.bandit]
# Torve's job is driving git/gh/docker as subprocesses with list arguments and
# PATH-resolved executables; flagging every such call is flagging the design.
# Anything sharper (shell=True, hardcoded tmp) stays on and is exempted per
# line with a justified `# nosec`.
# B101: the handful of asserts in src are type-narrowing invariants mypy
# already relies on, not input validation.
skips = ["B101", "B404", "B603", "B607"]

# ....................... #
# Dependency analysis

[tool.deptry]
known_first_party = ["torve"]
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
DEP002 = [
    # Imported lazily behind their extras (`torve[opensandbox]`,
    # `torve[migrate]`), so no static import ties them to the codebase.
    "opensandbox",
    "yoyo-migrations",
]

# ....................... #

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src", "tests"]
addopts = ["-q", "--tb=short", "--strict-markers", "--strict-config"]
# Safety net: no test may hang the run indefinitely. On timeout, dump all
# thread stacks and kill the process (the `thread` method guarantees the run
# can't stick). Generous enough for container startup on a cold runner.
timeout = 300
timeout_method = "thread"

[tool.pyright]
# Kept for the editor only (pylance/cursorpyright read it), so what a
# developer sees inline agrees with what the gate checks. Nothing in CI or
# the acceptance battery runs it: `mypy` is the one type checker of record
# (A-51) — two strict checkers over one tree bought disagreement, not depth.
include = ["src"]
ignore = ["tests", "scripts", "skills", ".venv"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.mypy]
strict = true
# The gate runs `mypy src`; excluding tests keeps a bare `mypy .` from
# disagreeing with it. mypy's `exclude` is a regex over paths and does not
# apply to files named explicitly on the command line.
exclude = ["^tests/", "^scripts/", "^skills/"]

[[tool.mypy.overrides]]
# The OpenSandbox SDK ships no type information; the adapter imports it lazily
# behind the `torve[opensandbox]` extra.
module = ["opensandbox.*", "yoyo.*"]
ignore_missing_imports = true
