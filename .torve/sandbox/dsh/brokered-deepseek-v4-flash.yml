# The brokered executor seat (RFC 0021 D-21.1): deepseek-v4-flash reached
# only through the run's egress broker. Same shape as brokered-deepseek.yml
# — the overlay is static, the per-run route and token arrive as environment
# set by the tier command's {broker_url} / {broker_token} substitution, so
# no credential and no per-run value is ever baked. A different model is a
# different overlay and a different image digest — a visible regime change
# (RFC 0017 §3, D-17.4).
- id: llm-pi-ai
  config:
    providers:
      torve-broker:
        api: openai-completions
        baseURL: !!js process.env.TORVE_BROKER_URL
        apiKeyEnv: TORVE_BROKER_TOKEN
        # 2026-09-02: same hardening as the ModelStudio family — hard
        # request cap, idle backstop, and reasoning restored (false had
        # stripped thinking from a reasoning model; the API honors
        # reasoning_effort, 13 reasoning tokens on the probe). Reasoning
        # bills at the output rate here — the incumbent's costs tick up.
        timeoutMs: 600000
        streamIdleTimeoutMs: 120000
        reasoning: medium
        compat:
          supportsDeveloperRole: false
          thinkingFormat: deepseek
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 128000
            maxTokens: 8192
            input: [text]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
- id: agent-default-model
  config:
    provider: torve-broker
    model: deepseek-v4-flash
