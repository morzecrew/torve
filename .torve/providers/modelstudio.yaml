# yaml-language-server: $schema=../schemas/provider.json
# The ModelStudio token plan (S-0064/D-1). Everything below was measured against
# it on 2026-09-11 and had been riding inside `DSH_MODEL`, a JSON document in a
# string that torve set and never read — which is how half of it went stale
# without any gate being able to miss it.
#
# The clocks sit on the provider rather than on a route because a wedged stream
# is a property of the network path to a vendor: a trickling stream once idled
# two attempts to the full agent cap, and it did not care which URL it was
# trickling from. The hard cap is the fix, the idle one the backstop.
#
# Two routes, one credential. Measured 2026-09-11: Claude Code drives
# qwen3.8-flash over /apps/anthropic end to end, with tool use, and no
# translation anywhere in the stack. The two differ in what they return —
# `reasoning_content` on one, native `thinking` blocks on the other — which is
# the whole reason a route owns its compat facts rather than the provider
# (S-0064/D-2).
name: modelstudio
key_env: MODELSTUDIO_CODING_API_KEY
via_proxy: false
request_timeout_s: 600
stream_idle_timeout_s: 120

routes:
  openai:
    base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    compat:
      # This route returns thinking as `reasoning_content`; the Anthropic one
      # returns native `thinking` blocks and carries no such flag.
      thinking_format: deepseek
  anthropic:
    base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic
    # No compat: this route returns Anthropic's own thinking blocks, so there is
    # nothing for torve to name.

models:
  # The levels came out of a 400 that enumerated them. The endpoint returns
  # reasoning tokens (33 for a two-word reply) — the value that was lost when
  # the overlays were deleted, leaving a reasoning model running with reasoning
  # off and every trace reading zero.
  qwen3.8-flash:
    context_window: 1000000
    max_tokens: 65536
    reasoning: [none, minimal, low, medium, high, xhigh, max]
  # Probed 2026-09-13 over both routes: it answers on `/apps/anthropic` end to
  # end and echoes its own id, and the same deliberate 400 on the openai route
  # enumerates the same seven levels. No `context_window` and no `max_tokens`:
  # the endpoint accepts `max_tokens: 10_000_000` with a 200, so neither was
  # measurable, and a number nobody observed is a knob that moves the regime
  # digest while changing nothing (S-0063, probe-then-declare).
  deepseek-v4-flash-0731:
    reasoning: [none, minimal, low, medium, high, xhigh, max]
    # No `price`. This plan is a prepaid weekly token quota, not per-token
    # billing, so dollars-per-token is not the number anyone is charged — and
    # the figures that stood here were never measured against anything. An
    # absent price leaves the attempt's cost unreported, which is true, rather
    # than priced off a rate card nobody pays (S-0064/D-12, S-0064/Q-2).
