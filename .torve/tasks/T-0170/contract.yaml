# Hand-minted — T-0169's two review findings on T-0162 (0022 P4 follow-up).
schema_version: 1
id: T-0170
rfc: rfcs/0022-specification-quality.md
phase: 4
role: implement
title: operator attention joined and path honest
intent: >-
  Two review findings on the operator-attention line, one edit site.
  First, operator_attention counts landed changes and counts operator
  interventions but never joins them, though D-22.12's framing is "the
  operator interventions behind them": feedback rows and tracker events
  carry task ids and landings resolve to task ids through the shipped
  derivation, so join per task id where the records allow and report the
  joined counts beside the raw totals with both denominators printed; an
  intervention whose task never landed in the window stays in the raw
  total only. Second, _tracker_command_events hardcodes
  .torve/telemetry.jsonl, silently reading zero events when a repository
  configures a custom telemetry path — resolve the path through the same
  layout/configuration the writer uses.
