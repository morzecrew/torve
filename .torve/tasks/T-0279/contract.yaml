# Minted by `torve plan 0043` — phase 1: the blocker revision loop
schema_version: 1
id: T-0279
rfc: rfcs/0043-blocker-revision.md
phase: 1
role: implement
title: the blocker revision loop
intent: 'A surviving review blocker no longer escalates while the run has revision budget:
  the runner renders the blockers and the convicted candidate diff into the RFC 0005 §4a feedback
  record at the task''s root-side feedback path, appends a revision history fact, and continues
  the attempt loop in the same worktree; the record is planted and framed by the existing
  D-5.13 mechanics, the poison ceiling and task budgets count revisions unchanged, and a blocker
  surviving the spent budget — or an unparseable verdict or broker budget refusal at any point
  — escalates exactly as today. ReviewConfig gains `blocker_revisions` (default 1; 0 restores
  the pre-0043 sequence byte-for-byte).'
