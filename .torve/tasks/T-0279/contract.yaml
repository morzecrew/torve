    ceiling and task budgets count every revision, unchanged
  paths:
  - src/torve/application/runner.py
- id: D-43.2
  grade: LOCKED
  text: The revision's critique travels only in the RFC 0005 §4a feedback record — blockers
    rendered as threads (review id as author, claim + evidence as body), the convicted diff
    as the superseded diff, cap and truncation honesty unchanged
  paths:
  - src/torve/application/feedback.py
  - src/torve/application/review.py
- id: D-43.3
  grade: ASSUMED
  text: '`blocker_revisions: 0` restores the pre-0043 transition sequence exactly — configuration
    decides the consequence (D-2), and the conservative setting is always reachable'
  paths:
  - src/torve/config/runconfig.py
- id: D-43.4
  grade: ASSUMED
  text: Unparseable verdicts and broker budget refusals keep immediate escalation — infrastructure
    and cost are not revisable defects
  paths:
  - src/torve/application/runner.py
- id: D-43.5
  grade: ASSUMED
  text: The record is written root-side (`.torve/tasks/<id>/feedback.md`) so a post-escalation
