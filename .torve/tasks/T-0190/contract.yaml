# Minted by `torve plan 0033` — phase 3: doctor-remote-digest
schema_version: 1
id: T-0190
rfc: rfcs/0033-published-harness-images.md
phase: 3
role: implement
title: doctor remote digest
intent: 'Doctor''s image line covers remote references: a tier naming a registry reference
  prints the resolved digest beside it, the same line local images already get, so "what exactly
  will run" has one answer for both kinds of reference. No new check — resolution failure
  already fails dispatch loudly.'
depends_on:
- T-0188
parent: null
targets: []
scope:
  allow:
  - src/torve/cli/doctor.py
  - tests/test_cli.py
  deny: []
acceptance:
- uv run pytest tests/test_cli.py
- uv run mypy src
- uv run basedpyright src
- uv run ruff check .
decisions:
- id: D-33.1
  grade: LOCKED
  text: 'Published images are a convenience, never a requirement: no engine behavior conditions
    on an in-house image, every published image builds locally from its in-repo definition
    with one command, and a stock upstream image plus a longer command template always works'
  paths:
  - .torve/sandbox/**
- id: D-33.2
  grade: LOCKED
  text: Tags are immutable `<harness-version>-r<image-rev>` and CI refuses to re-push an existing
    tag; `latest` floats as convenience; the digest remains the only identity the engine trusts
    (D-17.1 unchanged)
  paths:
  - .github/workflows/**
- id: D-33.3
  grade: ASSUMED
  text: Every harness install in a published definition goes through an `ARG` with a pinned
    default; a version bump is a one-line reviewed diff, never a rebuild side effect
  paths:
  - .torve/sandbox/**
- id: D-33.4
  grade: ASSUMED
  text: 'The `/opt/torve/` toolkit is thin by rule: single-file utilities, variability from
    environment only, no reading of contracts or `.torve/`; a utility wanting task context
    has outgrown the image'
  paths:
  - .torve/sandbox/**
- id: D-33.5
  grade: ASSUMED
  text: Publishing happens from this repository's CI, gated by the same conformance battery
    that tests the definitions; platform-images supplies bases and prior art, never these
    definitions
  paths:
  - .github/workflows/**
- id: D-33.6
  grade: OPEN
  text: Whether images carry their definition's git sha as an OCI label for provenance-by-inspection;
    the first debugging session against a pulled image settles it
  paths:
  - .torve/sandbox/**
