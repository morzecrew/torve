  - decision: D-25.8
    grade: OPEN
    kind: resolved
    class: spec-gap
    at: 2026-08-30T00:00:00Z
    attempt: 1
    claim: fmt does not renumber or validate `## N.` section numbers in this
      phase. There is no parsed model for section numbering anywhere in
      rfc_parse.py (HEADING/HEADING_NUMBER exist only for check_headings's
      duplicate-heading detection, not a numbering scheme), and D-25.1 scopes
      the emitter to structures the parser models. Building a numbering model
      is section-renumbering's real cost and is not requested by this task's
      contract, whose only phase is emitter-and-fmt; the question stays open
      for whichever later phase actually proposes with evidence, as the row
      already anticipates.
    evidence: "src/torve/config/rfc_parse.py:58-59 — HEADING_NUMBER is used
      only by check_headings, not by a section-numbering model; grep
      `HEADING_NUMBER` shows that one call site, and
      src/torve/config/rfc_emit.py has no section-numbering code."
    action: decided
  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: 2026-08-30T00:00:00Z
    attempt: 1
    claim: "neither D-25.1 nor RFC 0025 §5.1 says how the emitter should wrap
      the frontmatter `description` or a phase's `intent` — both are YAML
      folded/literal scalars whose source line-wrapping is cosmetic (folding
      already collapses `description` to one logical string; `intent`'s
      literal block was hand-wrapped prose). Decided: both render as a single
      unwrapped line under `>-`. It is the simplest deterministic choice
      (trivially idempotent — no wrap-width parameter to keep stable across
      runs) and already matches most of the live corpus's `description`
      fields as written."
    evidence: "rfcs/0001-torve-charter.md:12 — a single-line `description: >-`,
      and rfcs/0009-skills-evals.md:12 the same, against
      rfcs/0022-specification-quality.md:14-18 which wraps one across four
      lines — no single convention exists to preserve; src/torve/config/rfc_emit.py:106-109
      is the render, tests/test_rfc_emit.py:77-86 pins the corpus-wide
      idempotence this choice produces."
    proposal: ASSUMED — canonical `description`/phasing `intent` render as one
      unwrapped `>-` line; a future document can carry an arbitrarily long
      one rather than the corpus enforcing a wrap width nothing currently
      requires.
    action: decided
