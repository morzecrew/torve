# Minted by `torve plan 0025` — phase 1: emitter-and-fmt
schema_version: 1
id: T-0123
rfc: rfcs/0025-corpus-authoring-surface.md
phase: 1
role: implement
intent: 'The canonical emitter beside the parser and torve rfc fmt as its

  surface: frontmatter in fixed key order with trap scalars quoted,

  decision tables at the validated header, phasing fences re-serialised,

  amendment headings in dated form — prose byte-for-byte. Idempotence

  pinned over the live corpus; fmt refuses documents whose parse already

  reports problems; --check reports without writing.'
depends_on: []
parent: null
targets: []
scope:
  allow:
  - src/torve/config/**
  - src/torve/cli/**
  - tests/**
  deny: []
acceptance:
- uv run ruff check src tests
- uv run mypy src
- uv run basedpyright src
- uv run pytest
- uv run lint-imports
- uv run torve rfc check
decisions:
- id: D-25.1
  grade: LOCKED
  text: The emitter and `fmt` normalise only the structures the parser models — frontmatter,
    decision tables, phasing fences, amendment headings; body prose passes through byte-for-byte
  paths:
  - src/torve/config/rfc_emit.py
  - src/torve/cli/rfc.py
- id: D-25.2
  grade: LOCKED
  text: Every authoring verb is one transaction — parse, mutate, emit, regenerate the index,
    check — and a red check aborts the whole write, leaving the tree untouched
  paths:
  - src/torve/cli/rfc.py
  - src/torve/config/rfc_emit.py
- id: D-25.3
  grade: LOCKED
  text: 'Verbs write structure and identifiers, never judgement: no verb chooses a grade,
    drafts decision or amendment prose, or flips `status`/`implementation`'
  paths:
  - src/torve/cli/rfc.py
- id: D-25.4
  grade: LOCKED
  text: Amendment numbers are derived at write time as maximum plus one corpus-wide, through
    the parser's `next_amendment`; the verb never accepts a chosen number
  paths:
  - src/torve/config/rfc_parse.py
  - src/torve/cli/rfc.py
- id: D-25.5
  grade: ASSUMED
  text: Storage stays one `NNNN-slug.md` per document; the authoring surface is the answer
    to structural fragility, and D-A.18 stands unamended
  paths:
  - rfcs/**
- id: D-25.6
  grade: ASSUMED
  text: '`rfc retire` executes D-16.1 whole — row removal, `retired:` frontmatter, tombstone
    stub — and refuses while any citation would stop resolving'
  paths:
  - src/torve/cli/rfc.py
  - src/torve/config/rfc_emit.py
- id: D-25.7
  grade: ASSUMED
  text: '`rfc relocate-paths` sweeps Paths cells mechanically and never touches decision text;
    in-row markers stay hand-written per D-16.4'
  paths:
  - src/torve/cli/rfc.py
- id: D-25.8
  grade: OPEN
