    evidence from the first documents touched
  paths:
  - src/torve/config/rfc_emit.py
- id: D-25.9
  grade: OPEN
  text: 'Whether a `schema_version: 2` section manifest per kind becomes checkable once the
    emitter exists; deferred until `fmt` has run over the corpus'
  paths:
  - src/torve/config/rfc_parse.py
- id: D-25.10
  grade: ASSUMED
  text: Typed example fences extend the phasing pattern one validator at a time, starting
