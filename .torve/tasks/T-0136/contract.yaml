title: profile resolution
intent: 'TierConfig gains the profile field and load_runner_config resolves it: raw-mapping
  merge from the operator''s agents directory before validation, local keys winning, every
  failure a refusal naming the file (D-28.1–D-28.5). The hash property arrives for free because
  config_hash already digests resolved tiers; the test family pins the merge semantics, the
  refusals, the D-21.1 interaction and the hash property.'
