# Minted by hand on the document-less lane (RFC 0030): the archive verb's guard could not see the archive; found mid-phase-3 of RFC 0053.
schema_version: 1
id: T-0294
rfc: null
role: implement
title: the archive transaction checks with the archive in view
intent: '`torve rfc archive` guarded the move with a scratch check that saw neither the real archive nor
  the document being moved, so a document any other document cites or depends on could never leave the
  corpus path — the check refused every citation into it as undefined. Found when RFC 0053 phase 3 tried
  to archive the charter. The transaction now mirrors the archive beside the scratch corpus and places
  the archived copy there before checking, and writes the copy to the real archive only when the check
  is green; the CLI test archives a cited, depended-on document and then a second one beside it.'
depends_on: []
parent: null
targets: []
scope:
  allow:
  - src/torve/config/rfc_emit.py
  - src/torve/cli/rfc.py
  - tests/test_rfc_emit.py
  - tests/test_rfc_check.py
  deny: []
acceptance:
- uv run pytest tests/test_rfc_emit.py tests/test_rfc_check.py tests/test_rfc_verbs.py
- uv run lint-imports --config pyproject.toml
- uv run torve rfc check
decisions:
- id: D-53.4
  grade: LOCKED
  text: 'A row''s grade or paths change only through `torve rfc amend`, which records the typed diff with
    the prior value in a `changes` fence under the amendment heading; a grade or paths mismatch against
    the last recorded change fails `rfc check`. A text-only mismatch is editorial drift: a warning, re-stamped
    by `torve rfc fix` with the before and after recorded, never an `A-n`'
  paths:
  - src/torve/config/rfc_emit.py
  - src/torve/config/spec.py
- id: D-53.7
  grade: ASSUMED
  text: 'A row whose every glob matches nothing on an accepted, implemented document is path rot: reported
    by `rfc check`, retired by `amend --retire --reason path-rot` (or `check --fix-rot`), recorded as
    `decision.retired` on import; never automatic on load, never a red on the document'
  paths:
  - src/torve/application/decisions.py
  - src/torve/config/rfc_emit.py
- id: D-53.9
  grade: LOCKED
  text: The importer records every archived document as a source and every archived row as retired; `torve
    why` and `show` resolve archived identifiers and say they are archived
  paths:
  - src/torve/application/decisions.py
  - src/torve/cli/rfc.py
- id: D-53.13
  grade: ASSUMED
  text: Each reader switches from `rfc_parse` to the model beside its old path with a parity assertion,
    one at a time, in phase 2; `rfc_parse.py` is deleted in phase 5 only after the archive lands
  paths:
  - src/torve/application/decisions.py
  - src/torve/cli/rfc.py
