  paths:
  - src/torve/domain/task.py
  - src/torve/application/planner.py
- id: D-54.2
  grade: LOCKED
  text: 'A contract''s row with a `check` runs as a gate appended to the battery by the runner,
    named `decision:<id>`, axis compliance, `origin: rfc/NNNN#<id>`, never written into `gates.yaml`'
  paths:
  - src/torve/gates/runner.py
- id: D-54.3
  grade: LOCKED
  text: A row whose check ran in the same pass, green or red, is not owed a divergence entry;
    a row with no check keeps the silence check
  paths:
  - src/torve/gates/decisions_reported.py
- id: D-54.4
  grade: LOCKED
  text: A decision gate enters at `shadow`; promotion to blocking is `check_state` on the
    row, written by `torve rfc amend` citing soak evidence, and a blocking row must name a
    `check_twin` that `torve gates check` runs
  paths:
  - src/torve/gates/runner.py
  - src/torve/gates/sabotage.py
- id: D-54.5
  grade: ASSUMED
  text: A `LOCKED` row with no check is reported *soft* by `rfc health`, counted beside the
    hard ones, never regraded by the engine
  paths:
  - src/torve/application/specquality.py
- id: D-54.6
  grade: LOCKED
  text: '`torve spec project` renders a managed section into the `AGENTS.md` of every directory
    a standing row''s paths or an accepted phase''s scope names — rows with grade, text, consequence,
    check and state; invariants; contended paths — and a root index of governed directories;
    text outside the markers is never touched'
  paths:
  - src/torve/application/colocation.py
  - src/torve/cli/spec.py
- id: D-54.7
  grade: LOCKED
  text: The rendered sections are committed and drift-checked by a manifest gate running `torve
    spec project --check`; a hand edit inside the markers is drift naming the file
  paths:
  - .torve/gates.yaml
  - src/torve/cli/spec.py
- id: D-54.8
  grade: ASSUMED
  text: '`AGENTS.md` sections carry rows, invariants, checks, tests and warnings only; no
    generated overview, no prose beyond the row''s own text and consequence'
  paths:
  - src/torve/application/colocation.py
- id: D-54.9
  grade: LOCKED
  text: '`torve spec show`, `paths`, `tests` and `why-not` form a read-only verb over the
    worktree''s corpus and the archive beside it; a form that would need the record, another
    task or an escalation is refused by design'
  paths:
  - src/torve/cli/spec.py
- id: D-54.10
  grade: LOCKED
  text: The context pack under `.torve/context/` is computed host-side from the record and
    the tree, with no model, before the prompt is written; deterministic for a base sha and
    record state; gitignored; never in an image; byte-identical for a shadow run; own task
    only
  paths:
  - src/torve/application/contextpack.py
  - src/torve/application/session.py
- id: D-54.11
  grade: ASSUMED
  text: The pack's files are `index.md`, `decisions.json`, `gates.json`, `tests.json` (from
    `coverage.xml`), `attempts.json`, `contended.json`, `schema/`; each lands one at a time
    behind a config-eval on the compliance-red population and is deleted if attempts to green
    and dollars per landing do not fall by more than its tokens cost
  paths:
  - src/torve/application/contextpack.py
- id: D-54.12
  grade: ASSUMED
  text: A red pass writes its gate report into the next attempt's `attempts.json` — output
    tails with byte-loss markers, governing decision ids for `decisions-reported` and `scope`,
    failed test ids from JUnit — and the retry ladder still selects the tier from outcome
