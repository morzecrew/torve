# Minted by `torve plan 0054` — phase 2: the projections beside the code and the spec verb
schema_version: 1
id: T-0297
rfc: rfcs/0054-decisions-as-gates-and-the-projections-beside-the-code.md
phase: 2
role: implement
title: the projections beside the code and the spec verb
intent: '`torve spec project` renders managed sections into nested `AGENTS.md` files and the
  root index from the model, byte-identical outside the markers, and `--check` reports drift
  naming the file; the manifest gains the `spec-projection` shell gate with its sabotage twin.
  `torve spec show | paths | tests | why-not` read the worktree''s corpus and archive and
  refuse anything that would need the record. The working rules gain the one line naming the
  verb and the pack index; nothing else in the prompt changes. The rendered sections for this
  repository land with the phase.'
depends_on:
- T-0296
parent: null
targets: []
scope:
  allow:
  - src/torve/application/colocation.py
  - src/torve/cli/spec.py
  - src/torve/cli/main.py
  - .torve/gates.yaml
  - AGENTS.md
  - src/torve/**/AGENTS.md
  - tests/test_colocation.py
  - tests/test_cli_spec.py
  - tests/test_manifest.py
  deny: []
acceptance:
- uv run pytest tests/test_colocation.py tests/test_cli_spec.py tests/test_manifest.py
- uv run lint-imports --config pyproject.toml
- uv run torve rfc check
