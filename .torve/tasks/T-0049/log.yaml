    claim: >-
      the outbox is generic over string keys — the (task_id, state,
      attempt) rule is the tracker projection's to compose in phase 2 —
      and holds the three properties the projection cannot live without:
      staging dedupes by key, the relay marks the ledger only after a
      delivery returned (the crash window between the two is what makes it
      at-least-once instead of at-most-once), and a deliberate replay of
      the whole relay delivers nothing. A failed destination leaves its
      row pending and the queue flows past it
    evidence: src/torve/application/outbox.py:75-118 — stage and relay;
      tests/test_outbox.py:28-77 — replay no-op, crash redelivery, and the
      undammed queue pinned
    action: decided
  - decision: unlisted
