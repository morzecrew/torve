    at: 2026-08-23T19:21:00Z
    attempt: 1
    claim: >-
      the local regime's "same transaction" is the run state file itself —
      every transition is written atomically with its history, so effects
      DERIVE from durable state and are re-staged idempotently rather than
      being staged alongside a database write; a lost outbox file is
      rebuilt from the states, never invented, which is what closes the
      escalated-but-nobody-told window here. The store-side transactional
      staging arrives when the projection runs inside the durable runner,
      against the same store transaction — the outbox API does not change
      for it
    evidence: src/torve/application/outbox.py:1-17 — the module docstring
      stating the derivation doctrine
    action: decided
    proposal: 0008 §2 note — in the local regime effects derive from run
      state and re-stage idempotently; store-transactional staging joins
      with the durable-runner integration, same API
