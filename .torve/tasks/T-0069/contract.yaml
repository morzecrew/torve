# Minted by hand — A-30's execution: the first organic retry left a
# ready candidate wearing its old escalation label, because the state
# revisit deduped against the delivered key.
schema_version: 1
id: T-0069
rfc: rfcs/0008-tracker-projection.md
phase: 2
role: implement
intent: |
  The state effect's key gains the run's transition ordinal — the
  length of the history every transition appends to — so a state
  revisited at the same attempt is a new effect the board reflects,
  while replays between transitions still deliver nothing. Escalation,
  notify and attempt effects keep their keys: attempts move between
  their revisits by construction.
