  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: discovery
    at: 2026-08-23T18:13:00Z
    attempt: 1
    claim: >-
      only the latest run of each workflow counts — the live demo forced
      this: a rerun after a fix left the superseded failure on the same
      head sha, and a union over all runs would have vetoed the green
      rerun forever. GhCi dedupes newest-first by workflow id; a red run
      of a DIFFERENT workflow still vetoes. Second field note: the pull
      request merge snapshot lags a base push — a run triggered seconds
      after pushing the base tested the merge against the OLD base, which
      reads as CI lying until the checkout log names the stale merge
      parent
    evidence: src/torve/adapters/vcs/git.py:224-243 — newest-per-workflow;
      tests/test_forge.py:155-168 — superseded failure ignored, foreign
      red still vetoes
    action: decided
    proposal: 0006 §3 note — green_on_current_head reads the LATEST run
      per workflow for the head sha; and a base push invalidates in-flight
      merge-ref runs, so a lane consulting PR-event CI should expect one
      retrigger after the base moves
  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: discovery
    at: 2026-08-23T18:20:00Z
    attempt: 1
    claim: >-
      the lane releases a READY candidate's engine worktree before the
      rebase — the first engine-run landing surfaced this: the run's own
      worktree still pins the task branch and git refuses a second
      checkout, so the rebase path failed until the lane removed it. A
      READY run's worktree is disposable (the work lives on the branch,
      the reap would collect it anyway); the fast-forward path never
      needs the branch free and stays untouched. The full live sequence
      then completed on the lab: refusal on real red CI, landing after
      the green rerun — rebased, battery green, lane_demo.md on main
    evidence: src/torve/application/lane.py:130-136 — the release before
      the rebase; tests/test_lane.py:171-188 — an engine-held branch
      rebases and lands, worktree gone
    action: decided
    proposal: 0006 §1 note — the rebase path releases the candidate's
      engine worktree; merge-before-reap (A-26's ordering) applies to
      state files, and the lane owns the worktree half itself
