    claim: >-
      the lane's shape is untouched — the CI verdict is one more refusal
      gate in the serial loop, consulted per candidate before the
      ff-or-rebase decision; a refusal names the verdict and the tip,
      rides the engine-event stream, and moves nothing, exactly like the
      conflict and gates-red refusals beside it. Demonstrated live twice
      on the lab repository: the lane refused T-0004 while its pull
      request's Actions run was genuinely red ("remote ci failure on
      9edac66d2b"), and landed it once the rerun went green
    evidence: src/torve/application/lane.py:105-116 — the refusal path;
      tests/test_lane.py:147-169 — refusal touches nothing, then the same
      candidate lands green
    action: decided
