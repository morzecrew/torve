- decision: D-53.13
  grade: ASSUMED
  kind: resolved
  at: '2026-09-09T09:47:19Z'
  attempt: 1
  claim: 'check, show, health, the importer and decisions paths read the model beside the
    parser: check runs both and merges findings, show enriches the parser''s answer and falls
    back to the model, health and the importer read the model only, decisions paths adds coverage
    from it; index stays on the parser because its output is a byte-exact lockfile and the
    parity test in phase 1 already proves the frontmatter equal'
  evidence: src/torve/application/decisions.py:281 - load_corpus wraps the loader's refusals
    as PlanError; src/torve/cli/rfc.py:214 - the check merges model findings with the parser's
    report
  action: decided
  notes: 'index is a departure from the phase intent, not from a row: switching a lockfile
    renderer buys nothing until the parser is deleted in phase 5, when the renderer moves
    whole'
- decision: unlisted
  grade: UNLISTED
  kind: contradicted
  class: spec-gap
  at: '2026-09-09T09:47:19Z'
  attempt: 1
  claim: the loader raises pydantic's ValidationError rather than SpecError when a row's grade
    is outside the vocabulary, because the row is built from the parser's table without a
    guard; every reader in this phase catches both, and the importer wraps it as the same
    'not mintable' PlanError the parser path raised, but the loader's own promise of one collected
    refusal is not kept for this case
  evidence: src/torve/application/decisions.py:281 - the ValidationError branch; tests/test_decisions.py
    pins the not-mintable wording
  action: decided
  proposal: phase 5 (or a maintenance task on src/torve/config/spec.py) converts row validation
    errors into SpecError problems naming the row, which phase 1's scope did not reach after
    the fact and this phase's scope excludes
