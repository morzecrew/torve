  claim: 'the settle form of amend (settling a question by a task or amendment) named in RFC
    0053 §5.4 is not built: questions live in a prose-side yaml fence the emitter does not
    model, and no reader consumes a settlement yet; the fence can be hand-edited and the loader
    validates it'
  evidence: src/torve/config/rfc_emit.py:426 - the forms built are grade, paths, text and
    retire
  action: decided
