- decision: D-53.4
  grade: LOCKED
  kind: resolved
  at: '2026-09-09T09:47:18Z'
  attempt: 1
  claim: a row's grade, paths or text change through torve rfc amend --row, which replaces
    the row, re-stamps it in a fingerprints frontmatter map (full fingerprint beside a grade-and-paths
    fingerprint) and writes the typed diff with the prior value as a changes fence under the
    new heading; torve rfc fix re-stamps a text-only edit and records the pair under the table
    with no amendment number; rfc check reads a grade-or-paths mismatch as a problem and a
    text mismatch as a warning naming fix. The stamp lives in frontmatter rather than a model
    field because the model's file is outside this phase's scope and D-A.2 already puts structured
    facts there; the standalone retire verb stays beside amend --retire until phase 5 deletes
    it
  evidence: src/torve/config/rfc_emit.py:426 - amend_row replaces the field, stamps and returns
    the diff; src/torve/config/rfc_emit.py:490 - fix_row_text re-stamps and records under
    the table; src/torve/application/decisions.py:571 - fingerprint_drift tells the two mismatches
    apart; tests/test_rfc_check.py pins problem versus warning versus fix
  action: decided
  notes: 'the settle form for questions named in §5.4 is not built: questions live in a prose
    fence and nothing reads a settlement yet; recorded as its own entry'
