# Minted by `torve plan 0053` — phase 2: the readers, the amend forms, coverage and the archive verb
schema_version: 1
id: T-0289
rfc: rfcs/0053-the-item-model-and-the-rebuilt-corpus.md
phase: 2
role: implement
title: the readers, the amend forms, coverage and the archive verb
intent: 'Every reader switches to the model beside its old path with a parity assertion (D-53.13):
  `rfc check`, `show`, `index`, `health`, the importer, `decisions paths`. `torve rfc amend`
  gains the mutating forms of §5.4 and writes the `changes` fence with the prior value; `retire`
  becomes one of them; `torve rfc fix` re-stamps a text-only edit as editorial; a hand-edited
  grade or paths fails the check. Coverage (D-53.6) and rot (D-53.7) land in the importer''s
  module and surface through `decisions paths` and `rfc health`. `torve rfc archive NUMBER`
  moves a document to `archive/rfcs/` with the frontmatter of D-53.8, and the importer records
  archived documents and rows as retired (D-53.9). `rfc_parse.py` is untouched in this phase
  so the parity assertions have something to assert against.'
depends_on:
- T-0288
