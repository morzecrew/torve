# Hand-minted — T-0146's review finding (T-0136 follow-up).
schema_version: 1
id: T-0149
rfc: rfcs/0028-agent-profiles.md
phase: 0
role: implement
title: profile validation errors name the file
intent: >-
  When a tier that resolved through a profile fails TierConfig validation
  on the merged result, the pydantic error names neither the profile nor
  its file — an operator cannot tell whether the defect came from the
  profile body or the repository's own overrides. Wrap the validation
  failure for profile-resolved tiers so the refusal names the tier, the
  profile name and the profile path alongside the underlying error,
  matching the other three refusal classes that already name the file.
  Refusal semantics unchanged: the load still fails, nothing falls back.
