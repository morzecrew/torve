title: regime preimage follows the telemetry root
intent: >-
  Two defects in T-0138's preimage write, same edit site. First, it lands
  in the root config_hash was called with — a gate run in a worktree wrote
  .wt/T-0137/.torve/regimes/7bb55f3d33a2.json, destroyed at reap, while
  the telemetry row citing that hash lives in the host root's
  telemetry.jsonl; the preimage must be written beside the telemetry
  stream that carries the rows citing it, or it evaporates with the
  worktree. Second, the write is unguarded: an unwritable .torve crashes
  a run at telemetry time, a new failure mode for a previously pure
  function — the write must be best-effort, never raising, a missing
  preimage being strictly better than a dead run.
