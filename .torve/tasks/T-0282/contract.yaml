# Minted by `torve plan 0052` — phase 2: the conflict disposes of itself
schema_version: 1
id: T-0282
rfc: rfcs/0052-the-lane-as-a-manager-leg.md
phase: 2
role: implement
title: the conflict disposes of itself
intent: 'The leg passes an `on_conflict` that captures the superseded candidate''s diff into
  the task''s feedback record before the branch is replaced, so the next attempt sees what
  it collided with, and re-queues only when the base tip has moved since the last attempt.
  The forge-thread half is deliberately absent and stays owed by RFC 0005. What must not change
  is the manual lane: `torve merge` passes no disposal and escalates as it always has.'
