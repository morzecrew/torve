  at: '2026-09-07T05:56:38Z'
  attempt: 1
  claim: 'the disposal must capture the superseded candidate''s diff, but the lane''s Vcs
    port has no diff method and the port and the git adapter that would implement one are
    outside this task''s scope. The contract names neither: it says what to capture, not through
    what. Decided here: the disposal reads the repository through the same gates helper the
    lane already reaches for its re-gate, keeping the whole builder inside lane.py so the
    owed wiring remains the single keyword argument it can be.'
  evidence: src/torve/application/ports.py:455-475 — the LaneVcs surface as declared, no diff
    among it; src/torve/application/lane.py:93 is the lane's existing reach into the gates
    helpers
  action: decided
  proposal: give LaneVcs a diff(root, base, head) with three-dot semantics beside its rebase_conflicts
    probe, implement it on the git adapter, and let the disposal ask the vcs it was handed;
    the wiring follow-up can carry both
