  at: '2026-09-07T05:56:29Z'
  attempt: 1
  claim: the phase intent has the landing leg pass the conflict disposal, and this decision's
    own row names the manager CLI as a path, but the task's scope allows only the lane, the
    feedback record, and the lane's tests; the lane cannot distinguish the leg's call from
    the merge verb's — they are argument-for-argument identical — so any distinction drawn
    inside the shared function would change the manual lane this same intent declares must
    not change. The disposal and its tests are buildable wholly in scope; the single line
    that wires it to the leg is not.
  evidence: src/torve/cli/manager.py:132-141 — the leg's process_lane call carries no disposal
    argument; src/torve/cli/merge.py:238-247 is the manual verb's call and it is identical
    argument-for-argument, so no in-scope change can arm one caller without arming the other
  action: departed
  proposal: 'amend phase 2''s scope in RFC 0052 §12 to name src/torve/cli/manager.py, or mint
    the wiring as its own one-line change: the leg''s call gains on_conflict=conflict_disposal(root),
    the builder this attempt lands in scope'
  notes: in scope, the disposal is built whole — a follow-up that only adds the keyword argument
    completes the intent
- decision: unlisted
