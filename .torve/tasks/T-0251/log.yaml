    at: '2026-09-03T20:39:04Z'
    attempt: 1
    claim: >-
      the contract settles that seed and sync-out bytes/seconds ride the
      attempt row "beside wall_time_s", but the only code that assembles
      that row — the run loop — is outside this phase's scope, and the
      phase-1 file list leaves no third way to carry per-attempt numbers
      from the runtime adapter into the row builders; the invented join is
      an in-process pending ledger in the telemetry module that the
      adapter writes (keyed by the `torve.task` label the sandbox spec
      already carries) and that `build_record`/`build_attempt_row` drain
      when they build a row for that task
    evidence: >-
      rfcs/0041-remote-sandboxes.md:316-320 — the phase-1 scope lists only
      opensandbox.py, telemetry.py and the two test files;
      src/torve/application/runner.py:1258-1290 — create/sync_out are the
      adapter's only callsites and agent_meta (the block beside which the
      numbers must land) is assembled exclusively in the run loop
    action: decided
    proposal: >-
      amend RFC 0041 §5.3 with a row naming the channel — transferring
      runtimes report per-leg cost through `application.telemetry.
      record_transfer(task_id, ...)`, keyed by the task label of the spec
      they were created from; the attempt-row builders drain it and emit a
      `transfer` block, absent-stays-absent (D-4.6) when the runtime
      transfers nothing; the ledger is process-local and dies with the
      orchestrator (consistent with D-41.1's single host-local process)
    notes: |
      Two consequences are recorded with the decision rather than hidden
      in it. The drain pops both the plain task id and its shadow-id
      spelling (naming.shadow_id), because sandbox labels key on the
      infrastructure id while attempt rows key on the task id; and every
      leg of one attempt's task accumulates into one block, so the agent
      sandbox and the -gates sandbox of D-3.8 sum their bytes and seconds
      rather than competing for the key. Concurrent attempts of the same
      task within one process would blur per-attribution between them —
      the totals stay correct for the row that drains.
  - decision: unlisted
