    at: '2026-09-03T20:39:05Z'
    attempt: 1
    claim: >-
      §10 leaves the transfer-telemetry field names and the agent-block
      question to the implementation ("aligns them with RFC 0038's layout
      when both land, and logs") — the block is emitted as a sibling of
      `agent` named `transfer`, with flat keys `seed_bytes`,
      `seed_seconds`, `sync_out_bytes`, `sync_out_seconds`, so a
      reader can distinguish an attempt that synced nothing from one that
      synced out into nothing
    evidence: >-
      rfcs/0041-remote-sandboxes.md:282-285 — the open question this entry
      answers; src/torve/application/telemetry.py:250-281 — build_record,
      the row the block joins beside its `agent` key
    action: decided
    proposal: >-
      close §10's second bullet once RFC 0038's layout exists to align
      against; until then the sibling placement is the conservative choice
      — the agent block is defined as what the agent adapter reported, and
      a runtime's numbers are not the agent's self-report
    notes: |
      Bytes are the wire bytes each leg actually moved — the base64
      payload written into the sandbox at create, and the base64 the
      sync-out pipe returned — because the transfer tax this measures is
      the API round trip, not the workspace size.
