# Minted by hand — A-39's execution: the first batch ran strictly
# serially even where its work was provably disjoint.
schema_version: 1
id: T-0082
rfc: rfcs/0019-standing-loop.md
phase: 2
role: implement
intent: |
  The loop dispatches what cannot collide. The dispatch leg admits up
  to loop.dispatch_workers queued tasks per tick whose contract scopes
  are pairwise disjoint — the planner's conservative intersection, an
  empty allow-set disjoint from nothing — and disjoint from every
  in-flight run's scope. Admitted tasks run concurrently, each under
  its own worker slot; worktree surgery and telemetry appends
  serialize behind in-process locks. The default of 1 keeps the
  serial regime; the lane stays strictly serial.
