# Minted by `torve plan 0005` — phase 2: The review run
# Scope widened by hand before execution: the reviewer agent is wired into
# RunDeps by the CLI (agent construction imports adapters, which application
# cannot), so src/torve/cli/run.py joins the allow list — the phase-scope
# seam lesson of T-0028, legal cross-phase overlap under D-7.23.
schema_version: 1
id: T-0039
rfc: rfcs/0005-review-as-a-run.md
phase: 2
role: implement
intent: 'Review runs through the pipeline: input assembled from the diff, the

  target''s contract, inherited decisions and gate results — never the

  author''s trace; the workspace mounts read-only and the reviewer holds

  no credential beyond its tier''s; findings parse from the agent''s

  output, unlocatable evidence is discarded before anyone sees it, a

  surviving blocker escalates the target as blocker_finding and

  everything else is recorded on the attempt; the runner mints and

  drives the review task when its target''s gates go green, replacing

  the review-not-configured bridge — off by default in configuration.'
depends_on:
- T-0038
scope:
  allow:
  - src/torve/cli/run.py
  - src/torve/application/**
  - src/torve/adapters/**
  - src/torve/config/**
  - tests/**
  deny: []
acceptance:
- uv run ruff check src tests
- uv run mypy src
- uv run basedpyright src
- uv run pytest
- uv run lint-imports
- uv run torve rfc check
decisions:
- id: D-5.1
  grade: LOCKED
  text: 'Review is a run with `role: review`, not a distinct subsystem'
  paths:
  - src/torve/application/review.py
  - src/torve/application/runner.py
- id: D-5.2
  grade: LOCKED
  text: The reviewer gets a read-only workspace and no forge credential; the runner posts
    comments
  paths:
  - src/torve/application/review.py
  - src/torve/adapters/runtime/**
- id: D-5.3
  grade: LOCKED
  text: The reviewer never receives the author's session trace
  paths:
  - src/torve/application/review.py
- id: D-5.4
  grade: ASSUMED
  text: Findings with unlocatable evidence are discarded automatically
  paths:
  - src/torve/application/review.py
  - src/torve/gates/decisions_reported.py
- id: D-5.6
  grade: LOCKED
  text: A seeded-defect corpus gates every prompt or model change
  paths:
  - .torve/review-corpus/**
  - src/torve/cli/review.py
- id: D-5.7
  grade: ASSUMED
  text: Third-party reviewer removal requires shadow-mode numbers, not preference
  paths: []
- id: D-5.8
  grade: ASSUMED
  text: Reviews on pull requests without a task run in degraded mode and are told so
  paths:
  - src/torve/application/review.py
- id: D-5.9
  grade: LOCKED
  text: 'Review is minted as a task with `role: review` and `targets`, sharing the contract
    shape'
  paths:
  - src/torve/domain/task.py
- id: D-5.10
  grade: LOCKED
  text: A review task has no `acceptance`; the gate is skipped for the role
  paths:
  - src/torve/gates/acceptance.py
  - src/torve/domain/task.py
- id: D-5.11
  grade: LOCKED
  text: Review tasks are minted by the runner at `gated`, never by the planner
  paths:
  - src/torve/application/runner.py
budget:
  iterations: null
  wallclock_minutes: null
  tokens: null
tier: executor
