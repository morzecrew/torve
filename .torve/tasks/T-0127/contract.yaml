schema_version: 1
id: T-0127
role: implement
intent: "Add a contract-example fence to src/torve/config/rfc_parse.py following the\
  \ existing phasing-fence pattern (PHASING_HEADING/YAML_FENCE/parse_phasing/check_phasing\
  \ at rfc_parse.py:389-470): a new heading regex locates an optional 'Contract example'\
  \ section, a YAML fence inside it is parsed and validated against torve.domain.task.Task\
  \ (imported, not modified), and a new check_contract_example is wired into check_corpus\
  \ alongside check_phasing (rfc_parse.py:1153) so torve rfc check fails any corpus\
  \ document whose example fence no longer validates against the live task contract\
  \ schema \u2014 the mechanism that makes the fence redden when the schema moves."
