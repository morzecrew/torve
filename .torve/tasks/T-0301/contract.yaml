# Minted by `torve plan 0056` — phase 2: the schema is the authoring contract
schema_version: 1
id: T-0301
rfc: rfcs/0056-structure-for-everything.yaml
phase: 2
role: implement
title: the schema is the authoring contract
intent: '`torve rfc schema` writes `rfcs/schema/document.json` from the model and `rfc check`
  reddens when it lags; `rfc new` emits a document in 0055''s shape with the header line;
  `rfc list` replaces the index and `rfc render NNNN` writes the human page; the rfc-writer
  skill is rewritten as a YAML authoring guide with the schema as its reference; the operating
  page describes the document, the schema line and the verbs.'
