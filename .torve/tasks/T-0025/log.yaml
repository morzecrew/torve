    action: decided
    proposal: 0007 row — the Phasing format is the fenced YAML unit list,
      owned by rfc_parse; prose-only sections are legal but unmintable
  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: 2026-08-22T19:19:00Z
    attempt: 1
    claim: four minting mechanics the RFC leaves open, decided — a contract
      inherits the planned document's FULL decision table (over-inheritance
      is safe because the silence check fires only for touched paths, and
      "relevant" filtering would be a judgement the planner must not make);
      task ids derive max+1 over .torve/tasks and are never reused; a phase
      already minted from the same document refuses (duplicate work is a
      human decision); scope intersection is checked conservatively —
      identical globs or literal-prefix overlap refuse, cleverly disjoint
      passes
    evidence: src/torve/application/planner.py:205-289 — plan_document;
      tests/test_plan.py covers inheritance, ids, replanning refusal and
      the intersection check
    action: decided
    proposal: 0007 rows — full-table inheritance at mint; ids max+1 never
      reused; already-minted phases refuse; conservative scope-overlap
      refusal
