    by `torve rfc fix` with the before and after recorded, never an `A-n`'
  paths:
  - src/torve/config/rfc_emit.py
  - src/torve/config/spec.py
- id: D-53.5
  grade: ASSUMED
  text: Every row carries a content fingerprint; a mismatch between a contract's copied row and the row
