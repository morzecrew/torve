    grade: ASSUMED
    text: "The reap keeps to its root: every sandbox is labelled with a stable digest of its engine root's resolved path, and the reaper judges only sandboxes wearing its own root — an unlabelled sandbox is a pre-amendment stray, reapable by anyone"
    paths:
      - src/torve/base/naming.py
