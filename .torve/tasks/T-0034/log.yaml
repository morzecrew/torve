    attempt: 1
    claim: >-
      the hide rules differ deliberately by surface: the graph omits on
      accepted-and-complete alone (it has no note column), while the
      programme table keeps a settled document visible whenever it carries
      any note — a disagreement flag, an unsatisfied dependency, or
      plannability — so nothing warned-about can hide. Verified
      self-referentially at measurement time: 0018 re-entered the table
      with a truthful "asserted complete, but a phase is not shipped" flag
      the moment this task was minted against its phase 2, and the flag
      dissolves when this commit ships. A done interior node passes its
      dependents through to where it stood, so completing a mid-tree
      document never orphans its descendants
    evidence: src/torve/cli/context.py:87-91 — the notes-guarded hide;
      src/torve/cli/rfc.py:262-268 — the pass-through
    action: decided
    proposal: 0007 D-7.27 addendum or 0018 note — record the two hide
      rules (graph omits done docs with pass-through; programme hides only
      note-free settled rows) beside the tree-rendering row
