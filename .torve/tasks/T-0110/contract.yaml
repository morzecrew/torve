# Minted by `torve plan 0026` — phase 1: decomposition-run-and-adoption
schema_version: 1
id: T-0110
rfc: rfcs/0026-decomposition-and-continuation.md
phase: 1
role: implement
intent: 'The too_large route and the decomposition drafting run: an oversized

  contract awaits decomposition and dispatch skips it; a draft-role run

  over a read-only worktree proposes sub-contracts; lint adds the four

  decomposition rules to the existing battery; human adoption mints

  children carrying parent, grows the parent''s depends_on, and the

  parent becomes the integration task. Projections group children under

  their parent. Explicit recorded operator override for dispatching

  oversized contracts directly. Depth bounded at two.'
depends_on: []
targets: []
scope:
  allow:
  - src/torve/application/**
  - src/torve/domain/**
  - src/torve/cli/**
  - tests/**
  deny: []
acceptance:
- uv run ruff check src tests
- uv run mypy src
- uv run basedpyright src
- uv run pytest
- uv run lint-imports
- uv run torve rfc check
decisions:
- id: D-26.1
  grade: LOCKED
  text: 'Decomposition never mints: the drafter proposes, deterministic lint refuses by name,
    and children exist only at human adoption under the tick lock'
  paths:
  - src/torve/application/intake.py
  - src/torve/application/planner.py
- id: D-26.2
  grade: LOCKED
  text: The union of children scopes fits inside the parent's `scope.allow`; a child escaping
    the parent scope is refused at lint
  paths:
  - src/torve/application/intake.py
- id: D-26.3
  grade: ASSUMED
  text: Children are pairwise scope-disjoint or explicitly dependency-ordered, checked with
    the planner's glob machinery
  paths:
  - src/torve/application/intake.py
  - src/torve/application/planner.py
- id: D-26.4
  grade: ASSUMED
  text: Every parent acceptance command lands on at least one child or on the integration
    task; a decomposition may distribute the battery, never drop it
  paths:
  - src/torve/application/intake.py
- id: D-26.5
  grade: ASSUMED
  text: '`parent` is optional contract data read by projections only; dispatch, lane and store
    never consult it — ordering is `depends_on` alone'
  paths:
  - src/torve/domain/task.py
  - src/torve/application/projections.py
- id: D-26.6
  grade: ASSUMED
  text: 'At adoption the parent becomes the integration task: `depends_on` gains every child,
    scope and full battery stay, and its landing is the decomposition''s completion'
  paths:
  - src/torve/application/intake.py
- id: D-26.7
  grade: ASSUMED
  text: 'A `too_large` verdict routes: the contract awaits decomposition and dispatch skips
    it; the operator override is explicit and recorded on the run'
  paths:
  - src/torve/application/loop.py
  - src/torve/application/sizing.py
- id: D-26.8
  grade: LOCKED
  text: Continuation fires only on budget exhaustion — wallclock or tokens — never on a gate
    conviction, review blocker or any judged escalation; convicted work restarts from base
    through the revision loop
  paths:
  - src/torve/application/runner.py
- id: D-26.9
  grade: ASSUMED
  text: A continued attempt cuts its worktree from the previous candidate tip; diffs, gates
    and the attempt ceiling are measured exactly as for any attempt, against the original
    base
  paths:
  - src/torve/application/runner.py
  - src/torve/adapters/workspace/git.py
- id: D-26.10
  grade: OPEN
  text: What the decomposition prompt carries beyond the parent contract and the tree under
    scope; execution decides and logs it
  paths:
  - src/torve/application/intake.py
- id: D-26.11
  grade: OPEN
  text: Whether continuation feeds the previous trace tail into the prompt or only the record
    and commits; execution starts commits-only and logs the evidence
  paths:
  - src/torve/application/runner.py
- id: D-26.12
  grade: ASSUMED
  text: Decomposition depth is bounded at two levels; a third is refused with the bound named
  paths:
  - src/torve/application/intake.py
- id: D-26.13
  grade: ASSUMED
  text: Sizing thresholds are regraded from `torve rfc health` populations, and the `HistoricalPercentile`
    arm enters only on that evidence
  paths:
  - src/torve/application/sizing.py
budget:
  iterations: null
  wallclock_minutes: null
  tokens: null
tier: executor
