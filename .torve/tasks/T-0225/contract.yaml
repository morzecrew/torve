# Minted by `torve plan 0035` — phase 1: the baked dependency layer
schema_version: 1
id: T-0225
rfc: rfcs/0035-warm-starts.md
phase: 1
role: implement
title: the baked dependency layer
intent: 'The battery image bakes the lockfile-keyed dependency layer (D-35.2): pyproject and
  uv.lock copied, uv sync --all-extras --no-install-project at build, UV_PROJECT_ENVIRONMENT
  fixed so an attempt''s uv run reconciles the delta instead of rebuilding. The layer is a
  convenience, never a requirement — a stock image still works. A conformance case proves
  an unchanged lockfile performs no package downloads inside an attempt.'
