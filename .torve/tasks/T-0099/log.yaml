    contract no matter what D-22.6 asks for. Read the row as licensing only its
    first clause under T-0099: `torve rfc health` ships as a full subcommand,
    text and JSON; the ''plus one section of the torve context projection'' clause
    is out of this task''s reach and left for a task whose scope actually includes
    projections.py.'
  evidence: .torve/tasks/T-0099/contract.yaml:22-27 — scope.allow names no projections.py,
    vs .torve/tasks/T-0099/contract.yaml:68-74 where D-22.6's paths include src/torve/application/projections.py
  action: departed
  proposal: 'D-22.6 — split at mint time into two rows: one scoped to cli/rfc.py
    for the `torve rfc health` subcommand, one scoped to projections.py for the
    `torve context` section, minted as separate phases/tasks so scope.allow never
    contradicts a decision''s own paths again.'
- decision: D-22.4
  grade: ASSUMED
  kind: departed
  class: spec-gap
  at: '2026-08-28T00:00:00Z'
  attempt: 1
  claim: '''touched'' cannot be a literal git diff without shelling to git and
    resolving each task''s historical merge_base/head shas from telemetry — fragile
    against pruned or unreachable history, and telemetry.jsonl carries no file
    list to check against. Read instead as the contract''s own declared scope.allow
    intersecting the decision''s declared paths (globs_intersect, already used
    for the same overlap question between sibling phase scopes): the scope gate
    already refuses a passing or bypassed diff that leaves scope.allow, so the
    declared area is a safe over-approximation of the true diff, and it keeps
    the reader exactly what D-22.5 asks for — YAML in, no git subprocess, no new
    dependency.'
  evidence: src/torve/application/specquality.py:213-227 — _touched; src/torve/gates/scope.py:39-47
    is the invariant the approximation relies on; src/torve/application/planner.py:184-209
    globs_intersect, reused rather than reimplemented
  action: departed
  proposal: D-22.4/D-22.5 — define 'touched' as scope.allow intersecting a decision's
    declared paths (both already denormalised at mint time), rather than a literal
    post-hoc diff; the decoration-or-paths-defect reading stays sound because
    the scope gate already bounds the true diff by scope.allow for any task whose
    gate passed or was bypassed.
