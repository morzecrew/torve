- decision: D-22.10
  grade: OPEN
  class: spec-gap
  at: '2026-08-28T00:00:00Z'
  attempt: 1
  claim: deciding the abandoned-vs-landed weighting the row leaves open. 'landed'
    is read as RunState.state == ready (the engine's own mergeable terminal-success
    state); 'abandoned' as RunState.state == abandoned; everything else (in-flight,
    unresolved escalation, or no run state at all) counts toward the all-tasks
    population only. Both denominators are reported on every population (inherited
    vs inherited_landed, touched vs touched_landed) rather than picking one weighting
    — no telemetry.jsonl exists in this worktree (gitignored, generated data,
    none accumulated here) to empirically compare which weighting the data supports,
    so execution reports both, unweighted, exactly as the row licenses, and logs
    that no live corpus was available to settle it further.
  evidence: src/torve/application/specquality.py:69-77 — TaskFacts.landed/abandoned;
    src/torve/domain/states.py:20-29 and :109 TaskState, TERMINAL; the worktree
    carries no .torve/telemetry.jsonl (gitignored, generated data)
  action: decided
- decision: D-22.1
  grade: LOCKED
  kind: resolved
  class: discovery
  at: '2026-08-28T00:00:00Z'
  attempt: 1
  claim: 'compliance close-out for the touched LOCKED area (specquality.py, cli/rfc.py):
    the health report only reads .torve/tasks/*, the corpus and run state; it
    writes nothing back to a decision table, emits no proposed table text, and
    imports no model/agent adapter anywhere. The OPEN reading (''review-decided-claims'')
    deliberately stops at surfacing the distinct claims verbatim rather than asserting
    they were ''decided identically'', because auto-judging textual agreement
    is the kind of judgement this row forbids the engine from making — the human
    reads the claims, the engine does not rank them.'
  evidence: src/torve/application/specquality.py:1-30 — module docstring, no write/model
    import; src/torve/application/specquality.py:349-356 review-decided-claims,
    claims listed with no identity assertion
  action: decided
