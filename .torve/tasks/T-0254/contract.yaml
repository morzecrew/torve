- uv run pytest tests/test_sabotage.py
decisions:
- id: D-36.1
  grade: LOCKED
  text: The coverage-delta gate judges the attempt's changed lines only — never the inherited tree,
    never a whole-repo threshold — and enters shadow like every gate (D-2.18); promotion to blocking
    is a separate act on soak evidence
  paths:
  - .torve/gates.yaml
  - src/torve/gates/sabotage.py
- id: D-36.2
  grade: OPEN
  text: 'The changed-lines threshold and the exact pytest-cov/diff-cover invocation: the executor
    measures candidate values against recent landings and logs the settled command'
  paths:
  - .torve/gates.yaml
- id: D-36.3
  grade: ASSUMED
  text: A manifest gate entry names its sabotage twin (`sabotage:` — a CASES family or a test path);
    manifest load refuses a twinless gate, with existing entries backfilled in the landing so the
    lint ships with zero exceptions
  paths:
  - src/torve/config/manifest.py
  - .torve/gates.yaml
- id: D-36.4
  grade: LOCKED
  text: 'A fix for an escaped defect owes a review-corpus entry beside the fix: the defective diff
    from history, the finding a reviewer should have produced (written by a person, never generated),
    and the fixed tree — the corpus grows at the rate defects escape (0002''s accumulate-from-leaks
    doctrine applied to the reviewer)'
  paths:
  - .torve/review-corpus/**
  - src/torve/cli/review.py
- id: D-36.5
  grade: ASSUMED
  text: '`torve review corpus add <fixing-commit>` scaffolds the entry from the commit pair (defective
    landing by trailer, fix parent as tree); a commit with no shipped defective ancestor is refused
    with an instructive message'
  paths:
  - src/torve/cli/review.py
