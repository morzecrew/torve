  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: 2026-09-04T05:52:00Z
    attempt: 1
    claim: >-
      "the runtime composing the sandbox proxy env from the advertised
      address" needs the broker's block inside OpenSandboxRuntime, but the
      composition root that builds it hands it only the opensandbox
      sub-config and is outside this task's scope; no decision names the
      channel the two adapters share for the address
    evidence: >-
      src/torve/cli/options.py:82 — the only production construction
      passes config.runtime.opensandbox alone; .torve/tasks/T-0253/contract.yaml:18-24 —
      the scope allow list names neither options.py nor any docs path;
      src/torve/config/runconfig.py:1248-1259 — the invented join: a
      RunnerConfig validator resolves broker.bind/broker.advertise once at
      load and publishes it on the opensandbox config instance
    action: decided
    proposal: >-
      amend RFC 0041 §5.4 (or the phase's scope) with a row naming the
      resolution channel — configuration load decides the advertised
      address once and both adapters read that one resolution, the sealed
      name-derived-port doctrine with a configured address in place of the
      gateway facts — and grant the composition root (cli/options.py) to
      any future unit that needs broker knowledge inside a runtime
    notes: |
      The publish point is a private attribute behind
      OpenSandboxConfig.publish_remote_broker_proxy (runconfig.py:423) with a
      read-only property (runconfig.py:413); extra="forbid" refuses the name
      as an operator key, so the broker block stays the single configuration
      location (the advertised address joins the hashed broker regime), and
      the runtime keeps no other view of the broker.

  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: 2026-09-04T05:52:00Z
    attempt: 1
    claim: >-
      D-41.6 names two knobs but settles neither their grammar nor their
      defaults, and three load-bearing details have no row: whether bind
      may omit the port, what advertise defaults to, and what a wildcard
      bind means to a sandbox — every answer is a refusal a run would
      otherwise hit as a silent unreachability
    evidence: >-
      rfcs/0041-remote-sandboxes.md:296 — the D-41.6 row: two names, a
      refusal and a documentation clause, no address grammar;
      src/torve/config/runconfig.py:734-790 — the decided shape: sealed
      mode refuses both knobs, bind must carry an explicit port (no
      ephemeral: the sandbox side composes with no channel to the broker),
      advertise's port falls back to bind's, advertise is legal only
      beside bind, a 0.0.0.0 bind without an advertise is refused, and
      adapter 'none' refuses bind
    action: decided
    proposal: >-
      amend RFC 0041 with a row: broker.bind is a host:port literal (port
      mandatory, the address is a shared derivation, never an ephemeral
      discovery), broker.advertise is host[:port] defaulting to bind and
      refused without a bind, and sealed mode refuses both — the sealed
      address is a topology, not a knob

