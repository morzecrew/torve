    claim: >-
      the naming docstrings ("removing the worktree must not destroy the
      record", "triage outlives the workspace") justify the beside-the-
      worktree placement — protection against implicit destruction — but
      were being read as immortality: no code path ever deleted a terminal
      run's state file or traces, so torve status showed a phantom run
      forever and a second reap could not even see it, because the sweep
      was driven by the worktree listing alone. The resolution keeps the
      placement rationale intact and makes the reap the deliberate
      collector: terminal footprints go whole, escalated ones stay whole
    evidence: src/torve/application/reaper.py:15-21 — the module docstring
      stating the lifecycle; tests/test_reaper.py:101-108 pins the
      worktree-already-gone case
    action: decided
