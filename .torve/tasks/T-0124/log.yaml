      touching rfc_dir, so the real tree is left exactly as it was
    evidence: src/torve/config/rfc_emit.py:431-458
    action: decided
    notes: |
      Close-out for touching a D-25.2-governed path. "Run the check in
      memory" (RFC 0025 §5.3) is read as the observable contract (abort
      whole, tree untouched) rather than a literal no-disk-IO requirement;
      a scratch-directory copy achieves the same guarantee and is what
      src/torve/cli/rfc.py:319-496 calls for all four verbs.
  - decision: D-25.3
    grade: LOCKED
    kind: resolved
    class: spec-gap
    at: '2026-08-30T16:02:00Z'
    attempt: 1
    claim: D-25.3 says no verb chooses a grade, but RFC 0025 §5.3 says
      add-decision appends a row "with a placeholder grade" — the table
      schema has no fourth, non-judgement token, so some member of
      GRADES (LOCKED/ASSUMED/OPEN) has to be written for the row to parse
      at all; OPEN is used because it is the vocabulary's own "not yet
      decided" value, so the row commits to nothing LOCKED or ASSUMED would
    evidence: src/torve/config/rfc_emit.py:342-360
    action: decided
    proposal: 'LOCKED stands unamended — add-decision writes grade: OPEN as
      the schema-required non-judgement placeholder; this is not "choosing a
      grade" in the sense D-25.3 forbids, since OPEN asserts no authority
      over the decision the way LOCKED or ASSUMED would'
    notes: |
      Flagged rather than silently picked, since D-25.3 is LOCKED and the
      two source sentences (the decision row and the §5.3 narrative) are in
      tension for this one implementation detail.
