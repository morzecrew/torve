# Minted by `torve plan 0040` — phase 1: the why projection
schema_version: 1
id: T-0250
rfc: rfcs/0040-the-why-projection.md
phase: 1
role: implement
title: the why projection
intent: 'why_report in projections.py assembles the per-task envelope from the telemetry stream,
  feedback stream and contract head (D-40.1, D-40.2): attempts grouped by the 0038 stamp with
  the pre_verdict fallback (D-40.3), chronological events and reviews, totals, and the same-regime
  cost comparator carrying the quasi-experiment caveat in-envelope (D-40.4, D-40.5). Three
  renderers re-expose it verbatim: torve why <task-id> per the presentation contract with
  json format and the D-40.6 exit codes, the why(task_id) MCP tool beside context and show,
  and a serve endpoint. Tests pin grouping, fallback marking, totals, comparator scoping,
  trace_present, the found:false envelope, and byte-identical parity across the three surfaces.'
