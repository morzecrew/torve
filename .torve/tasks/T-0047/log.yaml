    claim: >-
      a collision refuses in both directions with the reason in the
      message — a vendored variant of a parsed skill would drift against
      the gate that reads its output, the exact A-3 failure; notably the
      upstream team library really does carry same-named copies of two
      shipped skills, so the refusal is guarding a live hazard, not a
      hypothetical
    evidence: tests/test_skills.py:74-79 — the refusal pinned against a
