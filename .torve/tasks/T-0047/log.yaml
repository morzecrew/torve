    at: 2026-08-23T17:30:00Z
    attempt: 1
    claim: >-
      materialize resolves each role-set name against package data and the
      vendor directory together — the runner hands it the WORKTREE's vendor
      path, so a task sees the vendored skills of the commit it runs
      against, reviewed content like everything else in the tree; the
      unknown-name error now names both places it looked. The repository
      vendors reading-isnt-proof from the team library as the first living
      entry, and a hygiene test keeps the committed directory well-formed
    evidence: src/torve/application/skills.py:35-71 — the joint
      resolution; src/torve/application/runner.py:405-409 — the worktree
      vendor path at dispatch; tests/test_skills.py:64-90 — resolution and
      the committed-directory shape
    action: decided
  - decision: D-9.12
    grade: LOCKED
    kind: resolved
    at: 2026-08-23T17:31:00Z
