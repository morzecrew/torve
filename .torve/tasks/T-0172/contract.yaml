# Hand-minted — two lane-evidence holes found in the new-regime smoke run
# (the T-0170 no-op cascade), one fence.
schema_version: 1
id: T-0172
rfc: rfcs/0005-review-as-a-run.md
phase: 0
role: implement
title: empty diff refused and traces kept apart
intent: >-
  Two holes from the same incident. First, an implement attempt whose
  candidate diff against base is empty passed its gates and reached ready
  — gates ran green over an unchanged tree, so a harness that silently
  did nothing promoted a no-op; an empty diff on an implement-role task
  must be treated as a red attempt (retried toward the poison ceiling,
  with a fact naming it), while an integration task's empty diff remains
  legal completion per D-26.6 and revert/review roles are untouched.
  Second, the review attempt writes its trace to the same path as the
  executor attempt it reviews — telemetry showed both records citing
  .wt/T-0170.a1.trace.log and the executor's trace was overwritten,
  destroying the evidence needed to triage the very failure the review
  caught; the review's trace must land at its own path, named by the
  review task id.
depends_on: []
