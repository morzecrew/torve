# Hand-minted by the operator against 0005 A-78 (D-5.2 reworded, D-5.16).
schema_version: 1
id: T-0227
rfc: rfcs/0005-review-as-a-run.md
phase: 0
role: implement
title: the reviewer executes in a disposable copy
intent: >-
  A-78 executed: the review sandbox stages a disposable writable copy of
  the target worktree instead of mounting it read-only — the diff under
  judgment, the gate results and the executor's trace protections are all
  composed BEFORE the copy exists, nothing written in the copy survives
  the review, and the copy is destroyed with the sandbox (D-5.2 as
  reworded). Inside the copy the reviewer may run the target's acceptance
  commands and gates; its prompt names that capability and the evidence
  rule extends to backticked commands with their output (D-5.16), which
  the evidence filter already accepts. Execution spends the review
  attempt's own budget and timeout — no new knobs. A test pins that a
  review which edits files in its copy leaves the target worktree
  byte-identical, and one pins that the composed diff predates the copy.
depends_on: []
