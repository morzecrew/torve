    notes: |
      `torve review corpus` is today a leaf command whose optional positional
      is a case name; `corpus add` cannot join it as a subcommand without the
      leaf becoming a group. A custom group class resolves any unknown
      non-option token as the case for a replay subcommand, so the existing
      spellings — `corpus`, `corpus <case>`, with every existing flag in either
      position — keep their names, flags, exit codes and output; `add` joins
      beside them, and `pr` is untouched.
