# Minted by `torve plan 0038` — phase 1: the attempt verdict
schema_version: 1
id: T-0247
rfc: rfcs/0038-the-attempt-verdict.md
phase: 1
role: implement
title: the attempt verdict
intent: 'The agent block stamps its attempt number (D-38.4); every path out of the attempt
  hook appends exactly one row (D-38.1) carrying an engine-derived verdict from the closed
  vocabulary (D-38.2, D-38.3), subsuming the inline red-agent append; RunState.escalate appends
  the durable escalation engine event best-effort from its single call site (D-38.5). All
  keys additive (D-38.6). Tests: one per verdict value, the one-attempt-one-row invariant,
  the broker-refused row that today does not exist, the escalate append and its best-effort
  failure mode, and the replay test deriving each verdict from the row''s other fields.'
depends_on: []
parent: null
targets: []
