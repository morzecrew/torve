- uv run ruff check .
decisions:
- id: D-38.1
  grade: LOCKED
  text: 'Every attempt ends in exactly one telemetry row, whatever the ending: the endings
    that today append nothing (broker refusal, halt, gates-hook failure) append the red-agent
    shape'
  paths:
  - src/torve/application/runner.py
- id: D-38.2
  grade: LOCKED
  text: The verdict is engine-derived from facts the runner already recorded or observed —
    exec results, gate report, escalation state — never from model output, and no router reads
    it (D-34.5 untouched)
  paths:
  - src/torve/application/runner.py
  - src/torve/application/telemetry.py
- id: D-38.3
  grade: ASSUMED
  text: The vocabulary is `green`, `gates_red`, `agent_timeout`, `agent_error`, `broker_refused`,
    `halted`, `gate_infrastructure`, carried top-level beside `exit_code`; it grows by amendment
  paths:
  - src/torve/application/telemetry.py
- id: D-38.4
  grade: ASSUMED
  text: The agent block stamps `attempt`, restamped where tier/adapter/model already are,
    on every record the attempt appends
  paths:
  - src/torve/application/runner.py
- id: D-38.5
  grade: ASSUMED
  text: '`RunState.escalate` appends one `kind: engine, event: escalation` record (task, reason
    verbatim from `EscalationReason`, detail, run_id when known), best-effort, root derived
    structurally from the state-file location — one call site, not twenty-two'
  paths:
  - src/torve/application/runstate.py
- id: D-38.6
  grade: ASSUMED
  text: All keys are additive; no schema_version bump; readers treat absence as pre-0038
  paths:
  - src/torve/application/telemetry.py
