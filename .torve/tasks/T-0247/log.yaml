  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    at: 2026-09-03T16:03:05Z
    attempt: 1
    claim: >-
      §10's open question (whether the reaper's lease_expired sweep of an
      orphaned run also stamps a verdict row) is settled by the reaper's
      actual knowledge at sweep time — it has none, no exec result, no
      gate report, no escalation from the attempt itself; the only fact in
      hand is the lease expiry, and it lands through RunState.escalate,
      i.e. as the D-38.5 engine event. Inventing a verdict row from a
      state-file field would also collide with the one-row-per-attempt
      invariant, since the crashed attempt may already have appended rows
      earlier in the run
    evidence: >-
      src/torve/application/reaper.py:195-204 — the heartbeat sweep
      escalates `lease_expired` on the state and nothing else;
      tests/test_reaper.py:62-79 pins event-lands-row-does-not
    action: decided
    proposal: >-
      RFC 0038 §10 closes as decided — the sweep lands the escalation
      event only; if 0040's timeline later needs the orphaned attempt's
      verdict, it needs a new vocabulary value (e.g. `died`), which the
      D-38.3 amendment route exists for
