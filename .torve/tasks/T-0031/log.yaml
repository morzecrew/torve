  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: discovery
    at: 2026-08-22T16:45:00Z
    attempt: 1
    claim: >-
      the inventory-first order earned its keep by surfacing three edge
      classes no hand-hunt would have settled: (1) "RFC 3339" — public
      standards are cited unpadded while corpus numbers are zero-padded,
      so the pattern keys on the padding; (2) the sabotage module is
      scenario data by nature (its log entries and fixtures MUST contain
      decision identifiers for the gates under test to judge) and is
      exempted as a data module, with its one genuinely user-facing string
      (a case name citing an identifier) rewritten anyway; (3) the gate
      scans string values, its own included, so the pattern is assembled
      from fragments that individually match nothing — pinned by a
      dedicated self-scan test
    evidence: src/torve/gates/user_facing_text.py:26-44 — the data-module
      exemption and the fragment-assembled pattern with both comments;
      tests/test_user_facing_text.py:38-43 — the self-scan regression test
    action: decided
    proposal: 0011 §5a — a sentence recording the three discriminations
      (zero-padded corpus numbers, data modules, self-scan safety) so the
      next repository adopting the gate inherits them
  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: discovery
    at: 2026-08-22T16:46:00Z
    attempt: 1
    claim: >-
      command registration is cross-module (status and reap are plain
      functions registered elsewhere), so the gate cannot syntactically
      tell a Typer command from a component function; the rule adopted is
      uniform — every public module-level function docstring in the cli
      package is treated as potential help text and stays identifier-free,
      with references in the module docstring or comments. The cost landed
      on the component library, whose function docstrings lost inline ids
      but kept them one screen up
    evidence: src/torve/gates/user_facing_text.py:65-68 — the
      rendered-as-help condition; src/torve/cli/console.py:1-15 — the
      module docstring that absorbed the displaced references
    action: decided
    proposal: none needed — the uniform rule is simpler to teach than a
      registration-aware one and errs toward the safe side
