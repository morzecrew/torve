# Minted by `torve plan 0006` — phase 2: The serialized lane
# Scope widened by hand before execution: the lane's git surface is a new
# port (LaneVcs) and ports live in application/ports.py — the wiring-seam
# lesson recurring; legal cross-phase overlap under D-7.23.
schema_version: 1
id: T-0042
rfc: rfcs/0006-merge-escalation.md
phase: 2
role: implement
intent: 'Ready is a lane, not a set: torve merge processes candidates one at a

  time — a task branch whose base has not moved lands as it was measured;

  one whose base moved is rebased and its gate battery re-run over the

  rebased tree before landing; a conflict escalates as merge_conflict

  and the lane moves on. The engine never resolves a conflict, and the

  operator''s invocation is the recorded approval. Auto-merge stays off

  by default in configuration.'
depends_on:
- T-0041
targets: []
scope:
  allow:
  - src/torve/application/lane.py
  - src/torve/application/ports.py
  - src/torve/adapters/**
  - src/torve/cli/**
  - src/torve/config/**
  - tests/**
  deny: []
acceptance:
- uv run ruff check src tests
- uv run mypy src
- uv run basedpyright src
- uv run pytest
- uv run lint-imports
- uv run torve rfc check
