  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: discovery
    at: 2026-08-23T10:44:00Z
    attempt: 1
    claim: >-
      a conflicted candidate is reported as merge_conflict, counted, and
      the lane exits 2 — but the task's run state is NOT transitioned: READY
      is terminal in the state machine (no READY to ESCALATED edge), and the
      work is still green on its branch; what failed is the landing, not
      the run. The record lives in the engine event and the lane report,
      triage is human, and the branch is left exactly as it was (rebase
      aborted, pinned by test). Opening a READY-to-ESCALATED edge for
      landing failures would let a terminal state un-terminate, which is a
      state-machine decision no landing convenience should smuggle in
    evidence: src/torve/application/lane.py:119-124 — the conflict path;
      tests/test_lane.py:95-103 — base and branch tips unmoved
    action: decided
    proposal: 0006 §1 note — a conflict escalates the LANDING (engine
      event, exit 2), never the run state; add a lane row if a re-queue
      mechanism is ever wanted
