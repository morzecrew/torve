  - decision: D-6.1
    grade: LOCKED
    kind: resolved
    at: 2026-08-23T10:40:00Z
    attempt: 1
    claim: >-
      ready is a lane — torve merge processes candidates one at a time in
      task order; a landing moves the base under the next candidate, which
      is exactly what the serialization exists for, and the test drives two
      candidates through one invocation to observe fast-forward-then-rebase.
      The unmoved-base case lands byte-identically to what the gates
      measured and skips the re-gate; the moved-base case rebases in a
      disposable worktree and re-runs the full battery over the rebased
      tree before landing
    evidence: src/torve/application/lane.py:74-137 — the serial loop;
      tests/test_lane.py pins the ff-then-rebased sequence
    action: decided
  - decision: D-6.2
    grade: LOCKED
