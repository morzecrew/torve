- decision: D-52.6
  grade: OPEN
  kind: resolved
  class: discovery
  at: '2026-09-06T15:19:25Z'
  attempt: 1
  claim: 'Decided without waiting for an unattended session, because the leg is unshippable
    until its builder picks one: a pass drains the queue, landing every ready candidate the
    lane accepts in one pass, serially, exactly as the manual verb does with no task argument.
    Landing one and waiting an idle interval for the next buys nothing while the lane serializes
    anyway, and each landing that moves the base is the rebase-and-regate path the lane already
    handles inside one call. An operator naming one task with --task narrows the leg to that
    candidate, the same promise the scan and dispatch make under a named task.'
  evidence: 'tests/test_residency.py:1122 — pins the drain: two ready candidates, one armed
    pass, both landed, first fast-forward then rebased; src/torve/cli/manager.py:128 is the
    builder, taking only from serve''s --task'
  action: decided
  notes: Settled by the implementer, not the first unattended session as the row proposed;
    the row's OPEN grade licenses the decision, and an unattended session remains the right
    place to revisit it under real load.
