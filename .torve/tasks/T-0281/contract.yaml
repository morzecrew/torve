# Minted by `torve plan 0052` — phase 1: the lane leg and its switch
schema_version: 1
id: T-0281
rfc: rfcs/0052-the-lane-as-a-manager-leg.md
phase: 1
role: implement
title: the lane leg and its switch
intent: '`promotion.auto_merge` returns with its original default of false, and `residency.once`
  gains a `lane` leg injected the way `standing` and `relay` are — after the relay, before
  the mint, stopped by a pause. The composition root wires it from configuration to the same
  `process_lane` the manual verb calls, with the same CI, approvals, review and quiet-window
  arguments, so no refusal changes. A pass with the switch off behaves exactly as it does
  today, which is what makes this safe to land before anybody turns it on.'
