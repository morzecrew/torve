    at: 2026-08-22T17:25:00Z
    attempt: 1
    claim: >-
      the per-edge table structurally hid two things the tree now shows:
      documents with no edges at all (0014 never appeared in any graph
      output before this), and the shape of the corpus (two root lineages
      plus one standalone). Multi-parent documents expand under their
      first parent in traversal order and back-reference elsewhere; the
      expand-once set also terminates traversal under a dependency cycle,
      and a final sweep renders anything unreachable from a root rather
      than letting it vanish
    evidence: src/torve/cli/rfc.py:256-262 — the root pass and the
      unreachable sweep with its comment
    action: decided
    proposal: 0007 §3a row — the graph verb renders a dependency tree
      (roots, expand-once, back-references, standalone documents shown),
      so the rendering is corpus-specified rather than repository habit
