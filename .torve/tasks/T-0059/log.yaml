    at: 2026-08-24T06:11:00Z
    attempt: 1
    claim: >-
      branch deletion is a ref deletion, never a history rewrite — the
      no-force doctrine stands untouched, and delete_remote_branch's
      contract is a postcondition ("the branch is gone": deleted now or
      already absent both answer True, transports report each
      differently) with False only for a repository without an origin;
      the forge closes the stale pull request itself when its head goes
    evidence: src/torve/adapters/vcs/git.py:109-137 — the deletion
      primitive and its postcondition; tests/test_pr_review.py:312-335 —
      gone, already-gone, and no-origin over a real local origin
    action: decided
