    claim: >-
      the retry intent now carries its mechanical consequence — the
      stale remote branch is deleted at apply time, before the state
      transitions, under the commander's explicit authority; ordering is
      load-bearing: a failed cleanup refuses the command with the
      escalation left standing and the command retryable, so the store
      never says QUEUED while the forge still holds the branch that
      would refuse the re-run's push
    evidence: src/torve/application/tracker.py:185-201 — cleanup before
      transition, refusal on failure; tests/test_tracker.py:387-425 —
      both orders pinned, state asserted mid-cleanup
    action: decided
  - decision: D-8.3
    grade: LOCKED
