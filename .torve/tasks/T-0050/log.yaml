  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: discovery
    at: 2026-08-23T20:48:00Z
    attempt: 1
    claim: >-
      command authority is deferred honestly — RFC 0008 §4 says authority
      is checked against the forge's permissions; the lab is a
      single-owner private repository where every commenter is the owner,
      so v1 records the actor and applies the store's validation only. The
      collaborator-permission check belongs with the first multi-writer
      board, before any shared deployment
    evidence: src/torve/application/tracker.py:191-208 — actor recorded,
      no permission gate yet
    action: decided
    proposal: 0008 §4 note — v1 defers the forge-permission check to the
      first multi-writer board; the actor is recorded on every command
      event so the audit trail is already complete
