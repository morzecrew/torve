schema_version: 1
id: T-0248
rfc: rfcs/0039-durable-traces-and-the-burn-profile.md
phase: 1
role: implement
title: the durable store
intent: 'Traces move home to .torve/traces/ with a root-relative trace_ref (D-39.1): naming.trace_file
  returns the new path, the harness adapter records the relative reference, the reaper''s terminal
  sweep stops unlinking traces, and the retention pass enforces traces.keep_days / traces.max_mb oldest-first
  (D-39.3) from the new configuration block. Tests pin the path, the relative ref, the sweep''s new
  restraint, and both retention bounds.'
depends_on: []
parent: null
targets: []
scope:
  allow:
  - src/torve/base/naming.py
  - src/torve/adapters/agent/harness.py
  - src/torve/application/reaper.py
  - src/torve/config/runconfig.py
  - tests/test_reaper.py
  - tests/test_tiering.py
  - tests/test_layout.py
  - tests/test_runconfig.py
  deny: []
acceptance:
- uv run pytest tests/test_reaper.py tests/test_tiering.py tests/test_layout.py
- uv run mypy src
- uv run basedpyright src
- uv run ruff check .
- uv run pytest tests/test_runconfig.py
decisions:
- id: D-39.1
  grade: LOCKED
  text: Traces live under `<root>/.torve/traces/` from the first byte, referenced root-relative; the
    reaper's terminal sweep never deletes them — only the retention pass does
  paths:
  - src/torve/base/naming.py
  - src/torve/application/reaper.py
  - src/torve/adapters/agent/harness.py
- id: D-39.2
  grade: LOCKED
  text: 'The trace store is local: torve never commits, uploads or transmits a trace; trace content
    never enters a prompt (D-5.3) and never drives control flow'
  paths:
  - src/torve/application/reaper.py
  - src/torve/adapters/agent/harness.py
- id: D-39.3
  grade: ASSUMED
  text: Retention is `traces.keep_days` and `traces.max_mb` in runner configuration, enforced oldest-first
    at the reaper's existing pass; defaults 30 and 512 pending the owner's read of dogfood volume
  paths:
  - src/torve/config/runconfig.py
  - src/torve/application/reaper.py
- id: D-39.4
  grade: ASSUMED
  text: The burn profile is derived by the harness adapter from all JSON lines of the output it already
    holds — turns, tool calls, top turns by output tokens — riding the agent block under D-4.6's absent-stays-absent
    regime; no stream, no block
  paths:
  - src/torve/adapters/agent/harness.py
  - src/torve/application/telemetry.py
- id: D-39.5
  grade: ASSUMED
  text: 'Torve imposes no trace format: the store keeps profile output verbatim, and the burn scanner
    extracts only facts with cross-harness meaning'
  paths:
  - src/torve/adapters/agent/harness.py
