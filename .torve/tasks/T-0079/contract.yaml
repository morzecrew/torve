# needs:approval; a label that never retires reads as a frozen board.
schema_version: 1
id: T-0079
rfc: rfcs/0008-tracker-projection.md
phase: 2
role: implement
intent: |
  The label follows the gap. The needs:approval label is a claim about
  the present: an applied approval stages its removal at once, a run
  observed in any non-ready state clears it — keyed on the transition
  ordinal and staged only for tasks the ledger shows were ever
  prompted — and the landings pass clears it as the backstop, stale
  labels from before the amendment included. Removal is an idempotent
  effect through the same outbox; the tracker port gains unlabel, and
  an absent-label removal is absorbed at the destination.
