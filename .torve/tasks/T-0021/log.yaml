    claim: harnesses run inside the sandbox and no harness SDK enters the engine;
      the adapter only stages a prompt file and asks the Runtime to exec the
      tier's configured command line
    evidence: src/torve/adapters/agent/harness.py:101-129 — HarnessAgent.run
      builds the command from TierConfig and calls ctx.runtime.exec; no SDK
      import exists anywhere under src/torve (`uv run lint-imports` — 5 kept)
    action: decided
  - decision: D-4.2
    grade: ASSUMED
    kind: resolved
    at: 2026-08-22T12:21:00Z
    attempt: 1
    claim: subscription auth is one named volume per worker slot, mounted
      read-write, never the host config directory; sandboxes are ephemeral,
      the volume is not
    evidence: src/torve/application/runner.py:191-200 — `_sandbox_auth` names
      `{auth_volume}-{worker_slot}`; tests/test_runtime_conformance.py
      test_docker_auth_volume_outlives_the_sandbox proves persistence across
      two sandboxes against real Docker
    action: decided
    notes: |
      A fresh named volume mounts root-owned while sandboxes run as the
      invoking user; seeding ownership is part of the operator's one-time
      slot provisioning (the interactive login §2 already requires).
