  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: 2026-08-22T12:25:00Z
    attempt: 1
    claim: api, harness and subscription are one HarnessAgent mechanism —
      the RFC's own words, "the adapters differ only in how authentication
      and the harness reach the process", and that difference lives in the
      sandbox spec, not the adapter; the Agent port gained `kind` so telemetry
      records the adapter that actually ran, not the tier's configured one
      (an --agent fake override must not masquerade as a model)
    evidence: src/torve/application/runner.py:272-285 — kind read from the
      agent that runs, meta keyed on it; the port attribute is
      src/torve/application/ports.py:128-134 and the shared adapter is
      src/torve/adapters/agent/harness.py:101-107
    action: decided
    proposal: 0004 row — one harness mechanism, three auth routes; adapter
      identity in telemetry is what ran, never what was configured
  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: 2026-08-22T12:26:00Z
    attempt: 1
    claim: never_send is enforced by withholding matching files from the
      worktree for the attempt and restoring them from memory afterwards —
      a worktree's .git is a host-side pointer the sandbox cannot follow, so
      removal from the worktree is removal from the sandbox's world; an agent
      edit to a withheld path is discarded on restore
    evidence: src/torve/application/runner.py:164-188 — withhold reads bytes
      and unlinks, restore rewrites; pinned by tests/test_tiering.py
      test_never_send_files_are_withheld_and_restored and
      test_an_agent_edit_to_a_withheld_path_is_discarded
    action: decided
    proposal: 0004 row — never_send as dispatch-time withholding; note that
      workspaces which carry their own history (shadow clones, D-4.7) need
      the truncation guarantee instead, since deletion cannot unsend history
