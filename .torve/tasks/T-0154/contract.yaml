title: equipment on the tier
intent: TierConfig gains skills (None inherits the role set, a list overrides it wholesale)
  and prompt_extras (appended after the charter's base working rules, which stay unaddressable);
  the runner threads the override into materialize and build_prompt appends the extras (D-29.1–D-29.3).
  Tests pin inheritance, override, the fail-closed unknown-name refusal, the profile-merge
  replace property, extras-after- base ordering, and the config_hash separation of equipped
  regimes.
