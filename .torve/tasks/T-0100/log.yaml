- decision: unlisted
  grade: UNLISTED
  class: spec-gap
  at: '2026-08-28T00:00:00Z'
  attempt: 1
  claim: 'RFC 0022 §5.3''s phrase "findings of kind: spec-drift" names a field
    that does not exist on the implemented `Finding` model — `domain/attempt.py`''s
    `Finding` carries only severity/claim/evidence (RFC 0005''s shape), not the
    charter''s aspirational severity/kind/location/claim/evidence (RFC 0001 §3,
    predates RFC 0005 and was superseded by it without a `kind` field ever landing).
    Read instead as the log''s own `class: drift` entries — the field
    `torve.gates.decisions_reported._check_drift` already checks a task''s declared
    `drift_count` against, and the same vocabulary flag-dont-flip already defines
    as "spec covered it and it was built otherwise (a defect — should be zero)",
    which is exactly what "spec-drift" names. This reuses an existing, already-enforced
    field rather than inventing a new one, and keeps D-22.3''s "no new recorded
    fields" intact one level up from where it''s graded.'
  evidence: src/torve/domain/attempt.py:73-84 — Finding has no kind field; rfcs/0001-torve-charter.md:110-116
    — the superseded aspirational shape; src/torve/gates/decisions_reported.py:189-203
    — _check_drift, the field this reading reuses; src/torve/application/projections.py:438-443
    — drift_findings filters log entries on class == "drift"
  action: decided
  proposal: 'RFC 0022 §5.3 — replace "findings of kind: spec-drift" with "log
    entries classed drift" so the text names the field the corpus actually carries,
    and drop the dangling reference to RFC 0001''s superseded Finding.kind.'
