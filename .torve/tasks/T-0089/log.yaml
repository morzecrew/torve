  - decision: D-20.4
    grade: LOCKED
    kind: resolved
    at: 2026-08-27T00:04:00Z
    attempt: 1
    claim: >-
      the engine lock adoption holds is the loop's own tick lock,
      reused via its module-private _acquire_lock/_release_lock — a
      second lock file would let adoption and a tick race the id
      counter, which is the exact hole D-20.4 closes
    evidence: src/torve/application/intake.py:449 — the import;
      tests/test_intake.py:312 — adoption rewrites refs, commits, and
      releases the lock
    action: decided
proposals:
  - >-
    RFC 0019: promote the tick lock's acquire/release to a public pair
    on torve.application.loop — adoption (RFC 0020) is now a second
    legitimate holder, and cross-module use of private names is the
    kind of seam a later refactor breaks silently.
