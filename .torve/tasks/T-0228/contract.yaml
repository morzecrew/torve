schema_version: 1
id: T-0228
rfc: rfcs/0032-the-serve-surface.md
phase: 0
role: implement
title: pagination for the served tables
intent: 'Every DataTable in the served dashboard paginates client-side: a page size the reader can
  change (25 default; 50/100 offered), first/prev/ next/last controls with a "rows X–Y of N" line,
  styled in the existing glass vocabulary and left-aligned like the rest of the table chrome. Sorting
  and the global filter operate over the FULL row set before pagination (TanStack''s pagination row
  model composes after the sorted and filtered models); expandable detail rows keep working on every
  page. The Board/Programme dropdown filters and live counts are untouched. The bundle is rebuilt
  into src/torve/_web (D-32.4); the vendored-diff check is CI''s (D-32.5, serve-bundle.yml) — git
  cannot run inside the sandbox, whose worktree .git is a host-side pointer.'
depends_on: []
parent: null
targets: []
scope:
  allow:
  - web/src/**
  - src/torve/_web/**
  deny: []
acceptance:
- cd web && npm run build
- uv run torve rfc check
decisions:
- id: D-32.1
  grade: LOCKED
  text: The serve surface re-exposes the existing projections verbatim; no endpoint derives, filters
    or reshapes what a projection already answers
  paths:
