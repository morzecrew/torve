  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: "2026-08-30T15:40:00Z"
    attempt: 1
    claim: RFC 0024 §5.3's table requires the reviewed class have an explicit
      provider allowlist, not the default, but names no mechanical check.
      Decided the check as providers.default being non-empty — the config
      schema's own field is literally named default, which is the most
      direct referent of the RFC's own wording, and its blanket fallback
      (used for any repository name not otherwise listed) is what the
      default names in RunnerConfig's own routing rule.
    evidence: rfcs/0024-fleet.md:174 — the reviewed row's Requires column
      reads an explicit provider allowlist, not the default; src/torve/config/runconfig.py:97-107
      — ProvidersConfig.default is the named fallback route_provider falls
      back to when no per-repository entry exists (runconfig.py:121-140,
      route_provider).
    action: decided
    proposal: the reviewed trust class refuses when providers.default is
      non-empty (src/torve/config/fleet.py::enforce_trust); untrusted does
      not carry the same check since its own required broker.mode sealed
      already forces every provider route through an explicit per-provider
      table (BrokerConfig.providers has no default-style fallback at all —
      runconfig.py:340-378) rather than route_provider's default. If a
      future repository needs a different granularity (e.g. requiring a
      non-empty providers.repositories entry keyed to the root's own name),
      that is an RFC amendment to §5.3, not a re-interpretation here.
    notes: |
      Fewer than three load-bearing gaps were found while planning this
      task (this is the only one), so per flag-dont-flip's underspecification
      rule the task proceeds with this decision logged rather than halting.
