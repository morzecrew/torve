    claim: trust enforcement is orthogonal to the fleet-wide pause — a
      refusal is decided from the root's own configuration alone, never
      consumes or alters the shared escalation budget, and the pause is
      still computed once over the fleet total before any root is refused
      or ticked — compliant, no contradiction.
    evidence: "src/torve/application/fleet.py:96-97 — decide_pause runs once
      before the per-root loop; fleet.py:104 — enforce_trust takes only
      (repo, config), no paused argument, and cannot see or change the
      pause decision."
    action: decided
    proposal: no change

