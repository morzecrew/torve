    class: discovery
    at: 2026-08-22T23:33:00Z
    attempt: 1
    claim: >-
      the first live corpus run failed on parsing, not reviewing: the
      reviewer produced a correct blocker but opencode wraps output in ANSI
      escapes and pretty-prints the document across lines, and the
      line-based parser read it as unparseable. parse_findings now strips
      escapes and decodes balanced JSON documents anywhere in the output,
      taking the last one with a findings key — pinned by a test carrying
      the real failure shape. The corpus caught a defect in the harness
      before it ever gated a prompt change, which is the mechanism working
      one level earlier than designed. Scope note: run_review's degraded
      passthrough required application/review.py in the minted phase-3
      scope, widened by hand like T-0039's
    evidence: src/torve/application/review.py:130-158 — the
      balanced-document parser; tests/test_review_run.py:167-176 — the
      ANSI regression test
    action: decided
    proposal: 0005 §2 note — reviewer output parsing is balanced-document
      extraction over ANSI-stripped text, because harness output is session
      chatter around a document, not a clean stream
