    claim: >-
      the credential passes value-free through every layer the operator
      can observe — config carries the environment-variable NAME
      (scm.token_env), the runner resolves it once in-process, git
      receives it through a credential helper reading the subprocess
      environment and gh as GH_TOKEN in the subprocess environment; it
      never appears on argv, in the worktree, in config files or in
      telemetry. The tests pin never-on-argv for both surfaces
    evidence: tests/test_forge.py:51-94 — argv asserted clean, environment
      asserted carrying, absent-token asserted loud
