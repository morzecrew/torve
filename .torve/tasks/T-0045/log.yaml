    claim: >-
      enforced structurally, which is stronger than a state check: the
      push path exposes no force flag at all — every push is additive to
      the task's own branch, and git itself refuses a non-fast-forward.
      The state-conditional force the RFC describes becomes meaningful
      only when a pre-review rewrite path exists (the forge polling leg);
      building the guard now would protect a capability nothing exposes
    evidence: src/torve/adapters/vcs/git.py:79-103 — push has no force
      parameter and targets only refs/heads/<task-branch>
    action: decided
