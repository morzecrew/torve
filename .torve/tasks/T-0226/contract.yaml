# Minted by `torve plan 0035` — phase 2: the derived-cache volume
schema_version: 1
id: T-0226
rfc: rfcs/0035-warm-starts.md
phase: 2
role: implement
title: the derived cache volume
intent: 'cache_volume on TierConfig (D-35.4): slot-suffixed naming like the auth volume, fixed
  mount outside the workspace, toolchain cache homes (uv, mypy, and the roster implementation
  settles per §10) pointed at it by the runtime adapter. Shadow replays and evals never mount
  it (D-35.3) — a shadow test pins the exclusion even when the tier names a volume. The opensandbox
  adapter refuses the field loudly (D-35.5). Deleting the volume changes nothing but wall
  clock (D-35.1) — asserted by a conformance case running the same battery cold and warm.'
depends_on:
- T-0224
- T-0225
parent: null
targets: []
scope:
  allow:
  - src/torve/config/runconfig.py
  - src/torve/application/runner.py
  - src/torve/application/shadow.py
  - src/torve/adapters/runtime/docker.py
  - src/torve/adapters/runtime/opensandbox.py
  - tests/test_runconfig.py
  - tests/test_runner.py
  - tests/test_shadow.py
  - tests/test_sandbox_images.py
  deny: []
acceptance:
- uv run pytest tests/test_runconfig.py tests/test_runner.py tests/test_shadow.py tests/test_sandbox_images.py
- uv run mypy src
- uv run basedpyright src
- uv run ruff check .
decisions:
- id: D-35.1
  grade: LOCKED
  text: 'Warm state is derived state: only artifacts rebuilt deterministically from committed
    inputs (the dependency layer from the lockfile, toolchain caches from the tree) may cross
    attempts, and deleting all of it may change nothing but wall clock'
  paths:
  - .torve/sandbox/battery/Dockerfile
  - src/torve/application/runner.py
- id: D-35.2
  grade: ASSUMED
  text: The battery image bakes a lockfile-keyed dependency layer (`uv sync` at build, `UV_PROJECT_ENVIRONMENT`
    fixed); a lockfile change rebuilds the layer and the digest change is the visible regime
    change (D-17.1)
  paths:
  - .torve/sandbox/battery/Dockerfile
- id: D-35.3
  grade: LOCKED
  text: 'Shadow replays and evals never mount warm state: a tier''s `cache_volume` is ignored
    under `shadow=True`, so replays measure the cold truth and an eval never compares caches'
  paths:
  - src/torve/application/shadow.py
  - src/torve/application/runner.py
- id: D-35.4
  grade: ASSUMED
  text: '`cache_volume` on a tier opts into a slot-suffixed derived-cache volume at a fixed
    mount outside the workspace, with toolchain cache homes pointed at it; empty (the default)
    is cold exactly as today'
  paths:
  - src/torve/config/runconfig.py
  - src/torve/adapters/runtime/docker.py
- id: D-35.5
  grade: ASSUMED
  text: The opensandbox runtime refuses a tier naming `cache_volume` loudly until a server-side
    analog exists — never a quiet cold fallback
  paths:
  - src/torve/adapters/runtime/opensandbox.py
- id: D-35.6
  grade: ASSUMED
  text: TierConfig gains optional `agent_timeout` and `sandbox_timeout`; absent falls through
    to the RuntimeConfig globals; the runner and the review lane read the resolved tier's
    values
  paths:
  - src/torve/config/runconfig.py
  - src/torve/application/runner.py
  - src/torve/application/review.py
budget:
  iterations: null
