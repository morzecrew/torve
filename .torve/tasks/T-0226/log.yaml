    at: 2026-09-02T19:19:01Z
    attempt: 1
    claim: >-
      the cache-home roster RFC 0035 §10 delegates to implementation is uv
      (UV_CACHE_DIR), mypy (MYPY_CACHE_DIR) and ruff (RUFF_CACHE_DIR);
      basedpyright and pytest earn no place at the mount — measured, not assumed
    evidence: >-
      `BPR=$(uv run python -c "import basedpyright, os; print(os.path.dirname(basedpyright.__file__))"); grep -rhoE "process\.env\.[A-Z_]*" $BPR/dist/*.js | sort -u` — the basedpyright 1.39.10 CLI exposes no cache-directory variable at all (its env surface ends at PYRIGHT_TMPDIR, a temp dir); `RUFF_CACHE_DIR=/tmp/rc uv run ruff check src/torve/base/__init__.py` — ruff 0.16.4 creates and uses /tmp/rc (CACHEDIR.TAG present); mypy's MYPY_CACHE_DIR is documented and honored by the installed mypy[faster-cache]
    action: decided
    proposal: >-
      0035 §10's first bullet settles as the three-variable roster —
      UV_CACHE_DIR, MYPY_CACHE_DIR, RUFF_CACHE_DIR, each at a subdirectory
      of the fixed cache mount
    notes: |
      Why basedpyright is out: its CLI exposes no persistent-cache home to
      point at a mount, so the only way to warm it would be relocating its
      tempdir (PYRIGHT_TMPDIR) — a temp dir, not derived state the mount is
      for, and warming it is outside D-35.1's category. Why pytest is out:
      its cache (.pytest_cache) holds --lf/stepwise session state inside the
      workspace, saves no measurable wall clock on a fresh worktree, and
      pulling it onto a cross-attempt mount would move non-derived state
      across attempts — the doctrine D-35.1 exists to police. The mount
      itself is /opt/torve/cache: fixed, outside the /work workspace, beside
      the image's own /opt/torve toolkit paths, so nothing project-visible
      ever reads from it.
