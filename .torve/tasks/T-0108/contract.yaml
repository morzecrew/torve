# Minted by `torve plan 0024` — phase 1: fleet-tick-and-the-shared-pause
schema_version: 1
id: T-0108
rfc: rfcs/0024-fleet.md
phase: 1
role: implement
intent: 'The operator-side manifest and torve fleet tick: survey every root''s

  escalation queue, decide the pause once for the fleet, tick each root

  in deterministic order under its own lock with the decision passed

  down, and record one fleet event. A locked-out or failing root is

  recorded and the pass continues. torve fleet status reads every root

  into one table ordered by escalation age. No writes across roots and no

  fleet store of any kind.'
depends_on: []
targets: []
scope:
  allow:
  - src/torve/application/fleet.py
  - src/torve/config/fleet.py
  - src/torve/cli/fleet.py
  - src/torve/cli/main.py
  - src/torve/application/loop.py
  - tests/**
  deny: []
acceptance:
- uv run ruff check src tests
- uv run mypy src
- uv run basedpyright src
- uv run pytest
- uv run lint-imports
- uv run torve rfc check
decisions:
- id: D-24.1
  grade: LOCKED
  text: The fleet manifest is operator-side and never lives in a repository under work
  paths:
  - src/torve/config/fleet.py
- id: D-24.2
  grade: LOCKED
  text: The escalation pause is decided once for the fleet and passed down; every other leg
    runs in every root
  paths:
  - src/torve/application/fleet.py
  - src/torve/application/loop.py
- id: D-24.3
  grade: LOCKED
  text: 'No fleet store: aggregation is read-only over roots, and no root''s truth ever lives
    outside it'
  paths:
  - src/torve/application/fleet.py
- id: D-24.4
  grade: ASSUMED
  text: Roots tick serially in a deterministic manifest order; `order` is never a priority
    field
  paths:
  - src/torve/application/fleet.py
  - src/torve/config/fleet.py
- id: D-24.5
  grade: ASSUMED
  text: A root that fails or is locked out is recorded and the pass continues
  paths:
  - src/torve/application/fleet.py
- id: D-24.6
  grade: ASSUMED
  text: Trust classes (`own`, `reviewed`, `untrusted`) bind per-repository capability, checked
    before a root is ticked; a root asking for more than its class allows is refused with
    the class and the setting named
  paths:
  - src/torve/config/fleet.py
  - src/torve/application/fleet.py
- id: D-24.7
  grade: ASSUMED
  text: Per-root locks stay; there is no fleet lock
  paths:
  - src/torve/application/fleet.py
- id: D-24.8
  grade: ASSUMED
  text: '`torve fleet status` orders by escalation age across roots — RFC 0006''s primary
    alert given its fleet form'
  paths:
  - src/torve/cli/fleet.py
- id: D-24.9
  grade: LOCKED
  text: A task belongs to exactly one root; no cross-repository task and no cross-root dependency
    exists
  paths:
  - src/torve/application/fleet.py
- id: D-24.10
  grade: OPEN
