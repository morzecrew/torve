  attempt: 1
  claim: the spec mandates a secret scanner but not its implementation; a noisy scanner gets muted, and
    D-2.8 forbids bypass so false positives need a sanctioned suppression path
  evidence: src/torve/gates/secrets.py:19-29
  action: decided
  proposal: ASSUMED — the scanner is a built-in high-confidence pattern set (no new dependency); false
    positives are suppressed only through `secrets.allow_patterns` in the reviewed manifest, which is
    configuration in a pull request, not a run-time bypass
