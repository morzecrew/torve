    never defines a licence
  evidence: src/torve/gates/tampering.py:1-11
  action: decided
  proposal: ASSUMED — a test edit is licensed when the file falls inside the task's scope.allow; adding
    a new test file is never tampering; modifying or deleting an existing one outside allow is
