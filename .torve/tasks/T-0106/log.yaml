  - decision: D-21.2
    grade: LOCKED
    kind: resolved
    at: 2026-08-28T19:08:02Z
    attempt: 1
    claim: |-
      Close-out: the broker remains a port with adapters. Sealed mode
      extends the `local` adapter (the internal-network lifecycle, the
      gateway bind, the pass-through relay); `none` is unchanged and still
