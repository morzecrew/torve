# Minted by `torve plan 0021` — phase 2: sealed-mode-containment
schema_version: 1
id: T-0106
rfc: rfcs/0021-egress-broker.md
phase: 2
role: implement
intent: 'Containment on top of custody: the sandbox joins an internal Docker

  network shared with the broker, so no destination is reachable except

  through it, and every non-provider host the run legitimately needs is

  declared and CONNECTed without inspection. An undeclared destination

  fails loudly and the run escalates as a configuration error rather than

  succeeding through a path nobody meant to leave open. This is what makes

  D-17.10''s trust sentence checkable for a repository the operator does

  not trust as their own shell.'
depends_on:
- T-0105
targets: []
scope:
  allow:
  - src/torve/adapters/runtime/**
  - src/torve/adapters/broker/**
  - src/torve/config/**
  - tests/**
  - CHANGELOG.md
  deny: []
acceptance:
- uv run ruff check src tests
- uv run mypy src
- uv run basedpyright src
- uv run pytest
- uv run lint-imports
decisions:
- id: D-21.1
  grade: LOCKED
  text: 'A brokered tier names no credential: `api_key_env` must be empty and a non-empty
    one is a refused configuration, not a warning'
  paths:
  - src/torve/config/runconfig.py
  - src/torve/application/runner.py
- id: D-21.2
  grade: LOCKED
  text: The broker is a port with adapters (`local`, `opensandbox`, `none`); the OpenSandbox
    vault is an adapter of it, never a prerequisite for it
  paths:
  - src/torve/application/ports.py
  - src/torve/adapters/broker/**
- id: D-21.3
  grade: ASSUMED
  text: 'Two modes: `endpoint` (reverse proxy per provider, default bridge) closes custody
    and metering; `sealed` (internal Docker network shared with the broker) adds containment
    and requires every other destination declared'
  paths:
  - src/torve/adapters/runtime/docker.py
  - src/torve/config/runconfig.py
- id: D-21.4
  grade: LOCKED
  text: 'Provider routing is enforced twice: `route_provider` at dispatch for the message,
    the broker at the wire for the fact; a wire refusal for a dispatch-allowed provider is
    a defect report about the configuration reader'
  paths:
  - src/torve/config/runconfig.py
  - src/torve/adapters/broker/**
- id: D-21.5
  grade: ASSUMED
  text: Broker-measured usage is authoritative where it exists; an adapter's self-reported
    `cost_usd` is recorded beside it and a divergence past tolerance is an engine event
  paths:
  - src/torve/application/telemetry.py
  - src/torve/adapters/broker/**
- id: D-21.6
  grade: ASSUMED
  text: 'The task''s token budget is held by the broker and enforced mid-run: requests past
    it are refused and the run escalates `cost_anomaly`'
  paths:
  - src/torve/adapters/broker/**
  - src/torve/application/runner.py
- id: D-21.7
  grade: LOCKED
  text: The broker keeps counts and metadata, never request or response bodies
  paths:
  - src/torve/adapters/broker/**
- id: D-21.8
  grade: ASSUMED
  text: The broker adapter name and the run's routing join `config_hash`; two runs under different
    egress regimes are two regimes
  paths:
  - src/torve/application/telemetry.py
- id: D-21.9
  grade: ASSUMED
  text: '`none` stays legal and is the first phase''s default, but `torve doctor` names it
    and states plainly that it leaves D-4b unmet'
  paths:
  - src/torve/cli/doctor.py
  - src/torve/config/runconfig.py
- id: D-21.10
  grade: OPEN
  text: Whether the `local` adapter is a subprocess or an in-process thread of the runner;
    execution decides and logs it
  paths:
  - src/torve/adapters/broker/**
- id: D-21.11
  grade: OPEN
  text: Where `sealed` mode's declared pass-through hosts live — the broker block or `runtime`
  paths:
  - src/torve/config/runconfig.py
budget:
  iterations: null
  wallclock_minutes: null
  tokens: null
tier: executor
