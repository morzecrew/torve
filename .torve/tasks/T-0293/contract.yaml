# Minted by hand on the document-less lane (RFC 0030): a maintenance fix found mid-phase-3 of RFC 0053, inheriting the standing rows whose paths cross the emitter.
schema_version: 1
id: T-0293
rfc: null
role: implement
title: a changes fence renders long values as one-line scalars
intent: The `yaml changes` fence `torve rfc amend` and `torve rfc fix` write renders a long `before` or
  `after` through PyYAML's own scalar rendering, which folds a long plain scalar across lines; inside
  a list item that is not the YAML it came from, the loader refuses the fence as not YAML, the document
  fails to load, and every citation into it reads as undefined. Found when the four amendments of RFC
  0053 phase 3 were written against 0016 and 0007. A string in that fence renders as a JSON string — a
  valid YAML double-quoted scalar that never wraps — and the emitter's own tests pin a long row text round-tripping
  through the fence.
depends_on: []
parent: null
targets: []
scope:
  allow:
  - src/torve/config/rfc_emit.py
  - tests/test_rfc_emit.py
  - tests/test_rfc_check.py
  deny: []
acceptance:
- uv run pytest tests/test_rfc_emit.py tests/test_rfc_check.py
- uv run lint-imports --config pyproject.toml
- uv run torve rfc check
decisions:
- id: D-53.4
  grade: LOCKED
  text: 'A row''s grade or paths change only through `torve rfc amend`, which records the typed diff with
    the prior value in a `changes` fence under the amendment heading; a grade or paths mismatch against
    the last recorded change fails `rfc check`. A text-only mismatch is editorial drift: a warning, re-stamped
    by `torve rfc fix` with the before and after recorded, never an `A-n`'
  paths:
  - src/torve/config/rfc_emit.py
  - src/torve/config/spec.py
- id: D-53.7
  grade: ASSUMED
  text: 'A row whose every glob matches nothing on an accepted, implemented document is path rot: reported
    by `rfc check`, retired by `amend --retire --reason path-rot` (or `check --fix-rot`), recorded as
    `decision.retired` on import; never automatic on load, never a red on the document'
  paths:
  - src/torve/application/decisions.py
  - src/torve/config/rfc_emit.py
