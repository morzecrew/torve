    at: 2026-08-22T14:06:00Z
    attempt: 1
    claim: runtime.network ("" default, "host" opt-in) shares the host stack
      and forwards the standard proxy convention (http_proxy family, upper
      and lower case) by name — only under the opt-in, because a
      host-loopback proxy address is reachable under host networking and
      poison under the bridge; the operator knowingly trades network
      isolation for the host's egress path. Docker-only; OpenSandbox owns
      its own egress model per RFC 0003 §4.1
    evidence: src/torve/adapters/runtime/docker.py:27-58 — `docker inspect`
      NetworkMode and env assertions in tests/test_runtime_conformance.py;
      measured on this host, `curl https://api.anthropic.com/` returns 404
      (real edge) through the host proxy and 403 (region block) from the
      default bridge — the proxy path is required, not convenience
    action: decided
    proposal: 0004 row — sandbox egress follows the host under an explicit
      network opt-in; note the isolation trade so the OpenSandbox vault
      remains the answer where egress control matters
