    attempt: 1
    claim: 'Ledger location: a `standing.json` sidecar written into the
      minted instance''s own `.torve/tasks/<id>/` directory, not the
      telemetry stream and not a separate top-level ledger file. It lives
      under `.torve/tasks/`, which lane.py''s `_engine_record` already
      exempts wholesale from the clean-tree check, so it needs no new
      exemption and survives a fresh clone (unlike telemetry, which is
      gitignored and host-local) — this also directly satisfies D-23.10
      (each instance records its originating job) with one artefact instead
      of two. Second question: max_open counts escalated instances (an
      escalated instance is unresolved work, the RFC''s own "argues yes"
      reading) — only landed or abandoned instances free a slot.'
    evidence: src/torve/application/lane.py:139-140 — `_engine_record`
