    at: 2026-09-01T11:53:34Z
    attempt: 1
    claim: >-
      The survey is agentless and read-only as built: run_survey orchestrates
      host-side git calls and the gate battery only, the only write into the
      target is the report at the operator-named --output path, and a
      completed survey always exits 0 — a red history is a successful
      measurement of a red history
    evidence: >-
      src/torve/application/survey.py:108-121 — run_survey's docstring and
      signature: it walks landings and runs gates through the injected
      SurveySource (landings, parent_of, create_workspace, remove_workspace);
      no agent, sandbox, broker or runtime import exists anywhere in the
      module
    action: decided
    notes: |
      Close-out attestation. D-31.1's two declared paths are this phase's
      spine: the application layer (src/torve/application/survey.py) and the
      CLI (src/torve/cli/survey.py). The CLI's only write into the target is
      the report the operator names (src/torve/cli/survey.py:168-173), and a
      completed measurement always raises exit 0
      (src/torve/cli/survey.py:237), with 3 reserved for configuration errors
      and 4 for infrastructure failure (src/torve/cli/survey.py:162-166).
      tests/test_survey.py pins the read-only contract
      (test_survey_is_read_only: the target tree byte-identical after a run,
      no .wt residue) and the always-zero exit on red history
      (test_survey_exits_zero_on_fired_history, tests/test_survey.py:230-239).
      The clone-at-landing mechanics add no write either: the truncated clone
      lives under .wt/ and remove_at deletes it and the empty shell it
      created (src/torve/adapters/workspace/git.py:217-228).
