  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: '2026-09-03T18:06:35Z'
    attempt: 1
    claim: 'the burn scanner''s detector vocabulary is unsettled by the contract,
      which names the block''s fields but never says which JSON lines are turns, how
      turns are numbered, what counts as a tool event, how many top turns ride, or
      what makes the block present at all; any implementation must settle these five'
    evidence: 'rfcs/0039-durable-traces-and-the-burn-profile.md:160-180 — §5.3 gives
      the block example and the absent-regime but no detector rules; §6 line 219-220
      declares the block best-effort by grade, "Not tested: any assertion about real
      harness stream schemas beyond the fixtures"'
    action: decided
    proposal: 'a row spelling the closed vocabulary, or one explicitly delegating
      it to the scanner''s docstring; decided here: a turn is a JSON line whose
      "type" is in {assistant, message, turn, step_finish, step-finish} and which
      carries a numeric output-token count at a known usage position (record/part
      usage in either harness spelling, opencode part.tokens.output); turn numbers
      are 1-based ordinals over those lines in stream order; tool calls count
      tool_use/tool-call content blocks and tool-event lines; the block exists only
      when at least one turn was seen — a stream with tool events but no per-turn
      usage answers no burn question, so absent beats partial (D-4.6, D-39.4''s
      never-zeroed rule); top_turns holds the three heaviest, ties by lower turn
      number first — the example shows two but fixes no bound; a truncated-by-timeout
      stream is scanned as it stands: its counts describe the events the stream
      recorded, and the verdict field already names the timeout'
  - decision: unlisted
    grade: UNLISTED
    kind: resolved
    class: spec-gap
    at: '2026-09-03T18:06:35Z'
    attempt: 1
    claim: 'how the durable store comes to hold the full bytes is unsettled: the
      RFCs never mention the runtime clip at all, and within this task''s allowed
      scope the only lever is the harness adapter — the mechanism (wrap the tier
      command so the sandbox itself writes the stream to the mounted worktree, then
      move those bytes into the store) is an invention the contract does not name'
    evidence: 'src/torve/base/shell.py:36 — the OUTPUT_LIMIT clip there is applied
      by the runtime adapters (docker.py:272, opensandbox.py:128), neither of which
      is in this task''s scope, so the harness adapter''s durable trace file is the
      only unclipped source parse_burn can read'
    action: decided
    proposal: 'an RFC 0039 amendment row on capture-side completeness (or a runtime
      row keeping the full stream beside the clipped exec output) — decided here:
      the adapter runs the substituted tier command wrapped as a POSIX group whose
      stdout+stderr land in `.torve/tmp/harness-output.a<attempt>.raw` inside the
      mounted workspace, preserving the command''s exit code and still emitting the
      same bytes to exec''s stdout; the adapter then moves the file''s bytes into
      the store verbatim and removes it, falling back to today''s write (and hence
      to an absent or clipped-stream profile) for any runtime that does not execute
      the wrapper as a real shell line; the runtime adapters and the ExecResult port
      are deliberately untouched'
    notes: |
      The reviewer lane reaches HarnessAgent too, so the executor's own trace in
      the store now holds full bytes under a review run as well; the review lane's
      own relocation still rewrites the reviewer's file from result.output
      (src/torve/application/review.py:529) — review.py sits outside this task's
      scope and the row's reference is not a lie about the executor's trace, so
      the reviewer's clipped-trace asymmetry is left as an open finding rather
      than silently fixed here.
