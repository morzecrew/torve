  - decision: D-39.4
    grade: ASSUMED
    kind: departed
    class: spec-gap
    at: '2026-09-03T18:06:35Z'
    attempt: 1
    claim: 'the row derives the profile "from all JSON lines of the output it already
      holds", but what the adapter holds in memory is not the output: every runtime
      clips `result.output` to 8000 characters at the exec boundary, so scanning the
      in-memory string yields silently wrong turn counts and top turns — the row''s
      premise that the adapter holds the whole stream is false; the burn is instead
      derived from the durable store''s file, and the adapter arranges for that file
      to actually hold the full bytes (the write today, `trace.write_text(result.output)`,
      persists the already-clipped string)'
    evidence: 'src/torve/base/shell.py:18 — `OUTPUT_LIMIT = 8000`;
      src/torve/adapters/runtime/docker.py:272 and
      src/torve/adapters/runtime/opensandbox.py:128 — both runtimes return
      `truncate(...)`ed output; src/torve/adapters/agent/harness.py:633-646 — where
      the base store write consumed that clipped string, now consuming the
      capture file instead; .torve/tasks/T-0249/contract.yaml:11-13 —
      the task intent names the same fact as T-0271''s blocker'
    action: departed
    proposal: 'amend the row''s words to "from all JSON lines of the full output it
      captured to the durable store" — the derivation stays in the harness adapter
      and rides the agent block exactly as decided; only the byte source moves from
      the clipped in-memory string to the store file the row''s own reference points at'
    notes: |
      absent-stays-absent (D-4.6) beats wrong, but a scanner that can only see
      clipped streams would answer "absent" on every real attempt — the RFC's §1
      goal ("the attempt row answers the first burn question") requires the full
      bytes, so this task makes the store's file honest as well as the scanner's
      source. The store write path is inside the row's declared paths
      (src/torve/adapters/agent/harness.py), so no scope is crossed.
