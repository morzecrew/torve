# Minted by `torve plan 0056` — phase 4: the telemetry file is a carrier
schema_version: 1
id: T-0303
rfc: rfcs/0056-structure-for-everything.yaml
phase: 4
role: implement
title: the telemetry file is a carrier
intent: '`torve migrate telemetry` reads the file once into the record; one function answers
  every reader that opened `.torve/telemetry.jsonl` — the pack''s attempts, touched and contended
  files, the drafter''s execution facts, `rfc health`''s conviction counts — from the record
  when a store is configured and from the file when not, and the two agree byte for byte after
  the import. `.torve/review-corpus/` moves to `tests/fixtures/review-corpus/`. The retention
  question for traces and regimes is decided and logged.'
