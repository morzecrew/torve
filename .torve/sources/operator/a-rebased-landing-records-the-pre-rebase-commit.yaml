title: A rebased landing records the attempt's pre-rebase commit
at: '2026-10-05T16:00:00Z'
summary: |
  When the lane lands a candidate by rebase, the landing file it commits
  names `commit:` as the attempt's own commit from before the rebase. That
  commit is on no branch the remote holds once the task branch is pruned,
  so the record's join from task to work commit points at nothing: a
  reader following `commit:` finds an unreachable object, and a reviewer
  reading the pull request flags the record as wrong. The landing that
  went in by fast-forward records the right commit, so the defect is the
  rebase path only.

  The landing file is written before the rebase and committed after it. It
  should name the rebased work commit, which the lane knows once
  `rebase_in_worktree` returns, or be written after the rebase.

  Fixed at cecce075. The runner writes the landing file at the attempt,
  before any rebase, and the rebase replays it unchanged. After a rebase
  onto a moved base, the lane now points each replayed landing file at its
  work commit's new sha, the parent of the commit that added the file, and
  amends the rebased tip; a document branch rebased onto `main` is
  restated the same way.
