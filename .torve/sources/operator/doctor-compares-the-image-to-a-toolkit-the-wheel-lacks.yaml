id: operator/doctor-compares-the-image-to-a-toolkit-the-wheel-lacks
kind: operator
ref: 'bloomery on torve 0.2.0, 2026-10-07: `torve doctor` reports claude-sandbox:2.1.283 as
  running "a different claude/toolkit than this tree holds", while the image''s /opt/torve
  run, capacity.py, equip and equip_flags.py match sandboxes/claude/toolkit byte for byte'
title: '`torve doctor` flags a current sandbox image as stale in an adopting repository'
at: '2026-10-07T15:00:00Z'
summary: |
  The image check compares the sandbox image's toolkit with the toolkit
  "this tree holds". In an adopting repository the tree holds no
  `sandboxes/`, and the installed wheel ships none either, so the check
  reports a mismatch for an image that is current. An adopter is told to
  rebuild an image with a recipe (`just image claude`) that lives only in
  torve's own repository.

  The check should compare against the toolkit the installed package
  carries, which means shipping it in the wheel, or report that it has
  nothing to compare against rather than a mismatch.
