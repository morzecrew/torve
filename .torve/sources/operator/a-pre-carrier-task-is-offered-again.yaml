id: operator/a-pre-carrier-task-is-offered-again
kind: operator
ref: torve night of 2026-10-12 (T-0293, T-0294)
title: A task that landed before landing files existed is offered to a worker again
at: '2026-10-12T10:48:03Z'
summary: >-
  On 2026-10-12 the S-0103 night dispatched T-0293 and T-0294, document-less contracts
  hand-minted on 2026-09-09 whose work landed on main by cherry-pick long ago. T-0293
  spent two deepseek attempts (an empty diff, then a halt) before the night was stopped.
  Ten such tasks (T-0293..T-0295, T-0317..T-0321, T-0350, T-0361) sat on the board
  as queued since the record's import of 2026-09-29; their only landing evidence is
  a `Torve-Task` trailer. S-0099/D-1 made the landing file the only answer to "is it
  landed", and S-0102/D-5 made "ran here" a run-state file or a local task branch,
  so neither reader holds them back any more. The operator resolved all ten abandoned
  with a note. T-0360 and T-0362 are held off the board only by their run-state files,
  which a reap removes. A fix could write a landing file for every trailer-landed
  task once (an importer), or record such tasks landed at the record's import.
