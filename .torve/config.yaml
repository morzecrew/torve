# Runner configuration (D-3.7; located per RFC 0013 — runner knobs live here,
# the gate manifest stays in gates.yaml beside this file). This file is read
# from where the runner was launched, never from the repository under work
# (D-13.3): a worked-on repository must not configure the engine working on it.
schema_version: 1

runtime:
  adapter: docker            # docker | opensandbox
  image: python:3.13-slim
  sandbox_timeout: 1800      # platform-enforced lifecycle bound, seconds
  agent_timeout: 1200        # hard cap per agent attempt
  network: host              # this host's egress runs through a local proxy
                             # (Outline VPN): "host" shares the host stack AND
                             # forwards the standard proxy env (http_proxy et
                             # al., names only). "" = docker's default bridge,
                             # which is region-blocked from here.
  opensandbox:
    domain: localhost:5266
    api_key_env: OPENSANDBOX_API_KEY   # the name of the variable, never the key

store:
  adapter: mock              # mock | postgres — postgres for real cross-process runs (D-3.6)
  dsn_env: TORVE_PG_DSN      # the name of the variable, never the DSN itself
  lease_for: 60              # seconds; a cancel ask rides back on lease renewal
  max_run_duration: 7200     # the store watchdog's hard cap on one run

poison_ceiling: 3            # checked before dispatch; reached -> escalated

reap:
  stale_after: 600           # non-terminal run with an older heartbeat is orphaned

scm:
  open_pr: false             # no remote yet; the PR leg is recorded as deferred

# RFC 0004 §1: `tier` on the task maps to an adapter here, and the concern
# leaks no further into the design. All fake until shadow runs (§5) produce
# the first honest numbers — a real tier names adapter, command, provider,
# and how auth reaches the process (api_key_env names or an auth volume):
#
#   executor:
#     adapter: api                       # fake | api | harness | subscription
#     command: 'claude -p "$(cat {prompt})" --output-format json'
#     model: claude-haiku-4-5
#     provider: anthropic
#     api_key_env: [ANTHROPIC_API_KEY]   # names, never values (D-4b)
tiers:
  planner: {adapter: fake}
  executor: {adapter: fake}
  reviewer: {adapter: fake}

# RFC 0004 §6b, D-4.8: which providers this repository's contents may reach,
# enforced at dispatch, before a sandbox exists. Empty defaults deny every
# real provider — silence is not a policy, it is a closed door.
providers:
  default: []
  repositories: {}
  never_send: []             # gitwildmatch globs lifted out of the sandbox's world
