# yaml-language-server: $schema=schemas/config.json
# Runner configuration (D-3.7; located per RFC 0013 — runner knobs live here,
# the gate manifest stays in gates.yaml beside this file). This file is read
# from where the runner was launched, never from the repository under work
# (D-13.3): a worked-on repository must not configure the engine working on it.
schema_version: 1

runtime:
  adapter: docker            # docker | opensandbox
  image: python:3.13-slim
  sandbox_timeout: 1800      # platform-enforced lifecycle bound, seconds
  agent_timeout: 1200        # hard cap per agent attempt
  network: host              # this host's egress runs through a local proxy
                             # (Outline VPN): "host" shares the host stack AND
                             # forwards the standard proxy env (http_proxy et
                             # al., names only). "" = docker's default bridge,
                             # which is region-blocked from here.
  opensandbox:
    domain: localhost:5266
    api_key_env: OPENSANDBOX_API_KEY   # the name of the variable, never the key

store:
  adapter: postgres          # mock | postgres — postgres for real cross-process runs (D-3.6)
  dsn_env: TORVE_PG_DSN      # the name of the variable, never the DSN itself
  lease_for: 60              # seconds; a cancel ask rides back on lease renewal
  max_run_duration: 7200     # the store watchdog's hard cap on one run

poison_ceiling: 3            # checked before dispatch; reached -> escalated

reap:
  stale_after: 600           # non-terminal run with an older heartbeat is orphaned

scm:
  open_pr: false             # no remote yet; the PR leg is recorded as deferred

# S-0004 §1: `tier` on the task maps to a seat here, and the concern leaks no
# further into the design. A seat names the harness that reaches its model and,
# optionally, the agent profile it runs; everything about *how* a model is
# reached lives in `.torve/harnesses/<name>.yaml` and everything about *what*
# the agent is lives in `.torve/agents/<name>.yaml` (S-0061). A seat naming no
# profile runs the profile named for the task's role.
#
# All on the fake harness until shadow runs (§5) produce the first honest
# numbers. A real seat looks like:
#
#   executor:
#     harness: claude-code
#     profile: careful
#     model: claude-opus-5
#     provider: anthropic
tiers:
  planner: {harness: fake}
  # The first live seat (S-0063). Everything it needs is measured: the image
  # starts claude through its own `/opt/torve/run`, the credential arrives by
  # name (S-0063/D-18), and the equipment it declares is fetched host-side into
  # a cache the sandbox mounts read-only (S-0062/D-4).
  executor:
    harness: claude-subscription
    profile: claude-equipped
    model: claude-opus-5
    provider: anthropic
  reviewer: {harness: fake}

# RFC 0004 §6b, D-4.8: which providers this repository's contents may reach,
# enforced at dispatch, before a sandbox exists. Empty defaults deny every
# real provider — silence is not a policy, it is a closed door.
providers:
  # Silence is not a policy, so this is the one line that lets the executor
  # seat reach anything at all (S-0004/D-8). Anthropic only: the seat above is
  # the only real one, and a provider nobody dispatches to has no business
  # being allowed.
  default: [anthropic]
  repositories: {}
  never_send: []             # gitwildmatch globs lifted out of the sandbox's world
