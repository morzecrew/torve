# yaml-language-server: $schema=schemas/config.json
# Runner configuration (D-3.7; located per RFC 0013 — runner knobs live here,
# the gate manifest stays in gates.yaml beside this file). This file is read
# from where the runner was launched, never from the repository under work
# (D-13.3): a worked-on repository must not configure the engine working on it.
schema_version: 1

runtime:
  adapter: docker            # docker | opensandbox
  image: python:3.13-slim
  # Strictly outside `agent_timeout`, and refused otherwise: T-0361 died at
  # 1800.2s as an infrastructure failure while the agent clock said 2200,
  # which read as a broken sandbox where the truth was a slow model.
  sandbox_timeout: 2700      # platform-enforced lifecycle bound, seconds
  # Raised from 1200 after T-0350: attempt 1 hit the cap at 1200.3s mid-write on a
  # structural task and attempt 2 finished the same work in 987s, so the phase needed
  # ~2200s and got it as two attempts and a continuation. A seat may name its own
  # `agent_timeout`; this is the fallback for one that does not.
  agent_timeout: 2200        # hard cap per agent attempt
  network: host              # this host's egress runs through a local proxy
                             # (Outline VPN): "host" shares the host stack AND
                             # forwards the standard proxy env (http_proxy et
                             # al., names only). "" = docker's default bridge,
                             # which is region-blocked from here.
  opensandbox:
    domain: localhost:5266
    api_key_env: OPENSANDBOX_API_KEY   # the name of the variable, never the key

store:
  adapter: postgres          # mock | postgres — postgres for real cross-process runs (D-3.6)
  dsn_env: TORVE_PG_DSN      # the name of the variable, never the DSN itself
  lease_for: 60              # seconds; a cancel ask rides back on lease renewal
  max_run_duration: 7200     # the store watchdog's hard cap on one run

# S-0027/D-7: a tier may not dispatch under an image no paired verdict has
# measured, because a definition edit must not quietly change what a seat runs
# under. `allow` is the hatch this repository is entitled to while it rebuilds
# its own images faster than verdicts can be recorded — the dispatch still
# records the unmeasured digest as an engine event, so the measurement stays
# owed rather than forgotten.
unmeasured_images: allow

poison_ceiling: 3            # checked before dispatch; reached -> escalated

# S-0076/D-2's size — under it the context pack carries the in-scope files and
# their tests whole, over it an outline of the same files — is NOT a key here.
# Every section of this file loads under a model that forbids an unknown key,
# so the knob is `SCOPE_BUDGET` in `src/torve/application/contextpack.py` until
# a task whose scope reaches `src/torve/config/runconfig.py` moves it here.

reap:
  stale_after: 600           # non-terminal run with an older heartbeat is orphaned

# Where a worktree is cut from. Absent, `resolve_base` prefers `origin/main`
# over `main` — right for a repository whose work is pushed, and wrong here:
# the remote exists but is 187 commits behind, so every dispatch was cutting
# its worktree from a tree five days old and reading that tree's gate manifest.
# Naming `main` says what this repository's base actually is. Remove this line
# once the work is pushed and the preference is true again.
base: main

scm:
  open_pr: false             # a remote exists but nothing is pushed to it yet

# S-0004 §1: `tier` on the task maps to a seat here, and the concern leaks no
# further into the design. A seat names the harness that reaches its model and,
# optionally, the agent profile it runs; everything about *how* a model is
# reached lives in `.torve/harnesses/<name>.yaml` and everything about *what*
# the agent is lives in `.torve/agents/<name>.yaml` (S-0061). A seat naming no
# profile runs the profile named for the task's role.
#
# All on the fake harness until shadow runs (§5) produce the first honest
# numbers. A real seat looks like:
#
#   executor:
#     harness: claude-code
#     profile: careful
#     model: claude-opus-5
#     provider: anthropic
tiers:
  planner: {harness: fake}
  # The first live seat (S-0063). Everything it needs is measured: the image
  # starts claude through its own `/opt/torve/run`, the credential arrives by
  # name (S-0063/D-18), and the equipment it declares is fetched host-side into
  # a cache the sandbox mounts read-only (S-0062/D-4).
  executor:
    harness: claude-subscription
    profile: claude-equipped
    model: claude-opus-5
    provider: anthropic
    # S-0034/D-3: a phase declared `routine` — docs, a changelog, a rename that
    # carries no design — is one competence, so it runs on the cheap seat rather
    # than the one that costs opus.
    #
    # Structural work is back on opus. The flash trial ran S-0075 end to end and
    # the seat lands work — T-0402 in one attempt — but it reports no cache
    # fields at all, and its per-request context cannot be reconstructed from
    # `input_tokens`: on T-0403 the sum ran 19% under the receipt, and 59% under
    # once the events were deduplicated. Q-1 is settled and the answer is no
    # (S-0075/D-5). Opus reports the fields, and its reconstruction closes to
    # the token — so the seat we measure is the seat we can measure.
    #
    # The cost of the trial is on the record too: T-0401 burned a whole attempt
    # to `agent_timeout` with zero edits, and T-0403 needed three attempts.
    # Add `structural: deepseek` back to return to the cheap seat.
    #
    # `routine: dsh` is back (S-0072/D-4). It was withdrawn — never retired —
    # when `implement.yaml` declared one `hook` and a hook was claude-shaped: a
    # directory of settings plus the scripts they name, while dsh's one
    # configuration channel takes a file of patch entries in its own
    # vocabulary. Both harnesses declared the kind, neither could read the
    # other's, and T-0391 died at `wall 0s` three times on `IsADirectoryError`.
    # The kind carries its shape now (S-0072/D-1): the item keeps its payload
    # at the root with one directory per harness beside it, and dsh's
    # declaration is a gate plugin its own image ships, shelling out to the
    # same script claude's settings name (S-0072/D-2).
    character_routing:
      routine: dsh
  # A second live seat, on the ModelStudio token plan through the broker.
  # `model` is the overlay's model id; `DSH_MODEL` on the manifest carries the
  # catalog entry, because a dsh model is a provider and a catalog and a
  # default all at once (S-0063/D-15).
  executor.dsh:
    harness: dsh
    model: qwen3.8-flash
    provider: modelstudio
    # dsh speaks both dialects and ModelStudio serves both, so the seat says
    # which it reaches (S-0064/D-4). pi-ai's overlay is openai-completions
    # today; the anthropic route is the same credential and a different seat.
    dialect: openai
  # The same credential and the same model, reached over the other dialect
  # (S-0064 phase 4). claude speaks only Anthropic Messages; ModelStudio serves
  # it at /apps/anthropic, so this seat is a configuration rather than a port.
  executor.qwen-claude:
    harness: claude-subscription
    # The same profile the opus seat carries, so the two differ by model and
    # nothing else. Both plugins earned it on opus over this repository's own
    # work, and the prompt extra — prefer the smallest change that makes the
    # acceptance commands pass — is the one instruction a weaker model most
    # needs and least reliably supplies itself.
    profile: claude-equipped
    model: qwen3.8-flash
    provider: modelstudio
    dialect: anthropic
  # A third live seat, the same credential and route as `qwen-claude` with a
  # different model. Probed 2026-09-13: it answers on `/apps/anthropic` and
  # returns a turn in 3.2s against qwen's 3.7s on one identical prompt, which
  # is a latency hint on n=1 and not a verdict — the ledger's attempts per
  # landing is what decides between them.
  # The prefix-diet arm (the artifact's M5), as a seat rather than an edit to
  # the one above: `context.first` is task-independent, so one attempt here says
  # what the two plugins cost, and the landing record says what they were worth.
  executor.lean:
    harness: claude-subscription
    profile: claude-lean
    model: claude-opus-5
    provider: anthropic
  executor.deepseek:
    harness: claude-subscription
    profile: claude-equipped
    model: deepseek-v4-flash-0731
    provider: modelstudio
    dialect: anthropic
  reviewer: {harness: fake}

# RFC 0004 §6b, D-4.8: which providers this repository's contents may reach,
# enforced at dispatch, before a sandbox exists. Empty defaults deny every
# real provider — silence is not a policy, it is a closed door.
# The egress broker (S-0021/D-1). `local` puts a process between the sandbox
# and every provider: the run-scoped token is what reaches the agent, the real
# key never leaves this host, and spend is metered per attempt. `none` passes
# provider keys straight through, which is what `torve doctor` has been calling
# an unmet credential-custody requirement.
#
# Which providers exist, where they are reached and on whose credential is no
# longer written here: a provider is a record, `.torve/providers/<name>.yaml`,
# holding the key's variable name, the clocks, the routes and the model roster
# (S-0064/D-1). `broker:` keeps the three things that are about the broker, and
# the wire facts it needs are projected from those records at load.
broker:
  adapter: local
  mode: endpoint
  cost_tolerance: 0.25

providers:
  # Silence is not a policy (S-0004/D-8): this is what the seats below may
  # reach, and nothing else. A provider nobody dispatches to has no business
  # being allowed.
  default: [anthropic, deepseek, modelstudio]
  repositories: {}
  never_send: []             # gitwildmatch globs lifted out of the sandbox's world
