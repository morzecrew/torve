# yaml-language-server: $schema=../schemas/harness.json
# dsh headless (S-0004). A dsh model is a provider, an API dialect, a catalog
# entry and a default — all of which are a patch, so the image bakes none of
# them (S-0063/D-15). `DSH_MODEL` carries the catalog entry as one knob, because
# those values only make sense together: split into four, three can be right
# while the fourth goes stale. `equip` renders the overlay, and it adds the
# broker's provider block only when the run has a broker.
#
# `kinds` is every kind, because dsh has one configuration channel and they all
# travel it: `--patch <file>`, a list of plugin entries. `equip` installs a
# plugin through dsh's own verb *before* patching it, since `--patch` configures
# an entry the profile already carries and cannot add one (S-0063/D-17); it
# copies a skill into `.agents/skills`, which is where
# `@deepseek-ai/dsh-skill-filesystem` watches (S-0063/D-16); and it appends
# every other kind verbatim, because those the operator writes in dsh's own
# vocabulary and a document torve invented would be a schema it does not know.
adapter: harness
image: dsh-sandbox:0.1.1-rc.2
# dsh's skill plugin watches `.agents/skills` and `.dsh/skills`. The first is
# where a repository keeps its own reviewed skills — this one tracks six — so
# equipment takes the second, which is torve's (S-0063/D-19).
equip_root: .dsh/skills
kinds: [skill, plugin, mcp, hook, agent]
env:
  # Brokered: the provider block points at the run's loopback route, which the
  # generator adds when `TORVE_BROKER_URL` is set. The catalog entry is the
  # operator's, because torve does not know what a model's window is.
  #
  # Everything after `max_tokens` is a fact about the *endpoint* rather than
  # about the model — measured against the ModelStudio token plan on
  # 2026-09-11, and true of every model it serves. Five of the seven overlays
  # this knob replaced carried identical copies of them, and the knob dropped
  # them with the files: the seat ran a reasoning model with reasoning off, no
  # request cap, and no compat block. They ride here until a provider record
  # exists to own them once.
  #
  #   reasoning     the endpoint returns `reasoning_tokens` (33 for a two-word
  #                 reply); `reasoningEfforts: false` had stripped it and every
  #                 trace read `reasoningTokens: 0`
  #   timeouts      a wedged-but-trickling stream once idled two attempts to the
  #                 full agent cap — the hard cap is the fix, the idle one the
  #                 backstop
  #   compat        the endpoint 400s on the `developer` role pi-ai switches to
  #                 for reasoning models, and returns thinking as
  #                 `reasoning_content`
  DSH_MODEL: '{"provider": "torve-broker", "api": "openai-completions", "context_window": 1000000, "max_tokens": 65536, "reasoning": "medium", "timeout_ms": 600000, "stream_idle_timeout_ms": 120000, "compat": {"supportsDeveloperRole": false, "thinkingFormat": "deepseek"}}'
# Brokered: the run-scoped token is the only credential that reaches the
# sandbox, so this names none (S-0021/D-1).
api_key_env: []
