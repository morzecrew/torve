# yaml-language-server: $schema=../schemas/harness.json
# The tool-narrowing arm. Everything here is `claude-subscription.yaml` — the
# same adapter, image, equip root and knobs — but for one variable, so what a
# paired run measures is the tool set and nothing else.
#
# Claude declares twenty-three built-in tools and every declaration rides the
# system prompt into every request. Measured over 118 traces and 2,135 tool
# calls, an attempt of this engine's uses nine names: Bash, Read, Edit, Write
# and the todo trio, with WebFetch and WebSearch once or twice between them.
# `Skill` and `Task` are declared on every request and have never been called.
#
# `--tools` names the set the image passes when `CLAUDE_TOOLS` is present. What
# it costs is the measurement: `context.first` is task-independent, so one
# attempt on this manifest against the fourteen on the other says what nineteen
# declarations weigh.
#
# Glob and Grep are named although the corpus shows the models reaching for
# shell `grep` instead: withdrawing a tool the engine never asked them to stop
# using would measure two changes at once.
adapter: subscription
image: claude-sandbox:2.1.252
equip_root: ~/.claude/skills
kinds: [skill, plugin, mcp, hook, agent]
env:
  CLAUDE_PERMISSION_MODE: bypassPermissions
  BASH_MAX_OUTPUT_LENGTH: "20000"
  MAX_MCP_OUTPUT_TOKENS: "5000"
  CLAUDE_TOOLS: Bash,Read,Edit,Write,Glob,Grep
api: [anthropic]
