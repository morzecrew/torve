# yaml-language-server: $schema=../schemas/harness.json
# Claude Code on a subscription (S-0004/D-2): the seat's credentials live in a
# per-worker-slot volume, not in an environment variable, so `api_key_env` is
# empty and nothing here is a secret.
#
# The command is one shell line run inside the sandbox — the engine never links
# a harness SDK (S-0004/D-1). Two jobs before it reaches the agent:
#
#   1. The credentials. HOME is /tmp (the container has no passwd entry), and
#      the auth volume is mounted read-write at /auth because token refresh
#      writes; linking it into HOME is what keeps a refreshed token for the
#      next attempt on this slot.
#   2. The plugins. `--plugin-dir` loads a plugin directory for the session, so
#      the image's clones are named directly and no HOME seed is copied.
#
# `--permission-mode bypassPermissions`, not `acceptEdits`: acceptEdits
# auto-approves file writes and a handful of filesystem commands, and *denies*
# every other Bash call. In print mode a denial is not a prompt and not a hang —
# it is a silent refusal, so an attempt would look like a model that would not
# work rather than a seat that was not permitted to. The sandbox is disposable
# and runs as the invoking uid, which is what the bypass asks for.
adapter: subscription
image: torve-agent:claude
command: >-
  mkdir -p "$HOME/.claude" &&
  ln -sf /auth/.credentials.json "$HOME/.claude/.credentials.json" &&
  claude -p "$(cat {prompt})" --model {model} --output-format json
  --permission-mode bypassPermissions
  --plugin-dir /opt/torve/seed/.claude/plugins/marketplaces/caveman
  --plugin-dir /opt/torve/seed/.claude/plugins/marketplaces/ponytail
auth_volume: torve-auth
auth_mount: /auth
api_key_env: []
