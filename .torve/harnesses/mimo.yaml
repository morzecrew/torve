# yaml-language-server: $schema=../schemas/harness.json
# MiMo Code (S-0004, opencode lineage).
#
# `kinds` is [skill, plugin], and both halves are measurements. `mimo debug
# skill` lists what it loads, and a user skill is read from
# `<project>/.mimocode/skill/<name>/SKILL.md` — project-scoped, since a global
# one is not read (S-0063/D-16). `mimo plugin <module>` installs and rewrites
# the config. What is absent is absent for a reason: `mimo mcp add` is
# interactive and takes no arguments at all, so an MCP server waits for a
# non-interactive verb, and a kind declared here that this harness has no
# channel for is refused at load naming both files (S-0063/D-4).
#
# mimo's equipment is installed state, not session flags, so `equip` runs
# commands before the agent — the third answer to one manifest, and the one a
# flag template could never have expressed.
#
# No broker route yet: `/opt/torve/run` refuses a brokered seat rather than
# letting it reach the provider directly, which is the leak S-0055/D-4 exists
# to prevent.
adapter: harness
image: mimo-sandbox:0.1.13
# mimo reads skills project-scoped, and this root is torve's alone
# (S-0063/D-19): the engine excludes it so an attempt commits its own work.
equip_root: .mimocode/skill
kinds: [skill, plugin]

# No `env`, so no cap on what one tool result may return (S-0076/D-4): mimo's
# equipment is installed state rather than session flags and its result boundary
# takes no environment knob, so the cap arrives here through the image's own
# configuration or not at all.

# mimo reaches a provider through its own configuration, which is
# OpenAI-dialect (S-0064/D-4).
api: [openai]
