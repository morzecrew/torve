entries:
  - decision: D-2
    grade: ASSUMED
    at: '2026-11-04T12:46:53Z'
    claim: >-
      The review claim holds: the sweep read its range with git's rename detection
      on, so a commit that moved an engine file outside the globs reported only the
      destination and the engine move went undetected. The diff now reads with --no-renames,
      so the deleted engine path is listed and matched, and a test pins a move out
      of the globs.
    evidence: >-
      src/torve/cli/manager.py:741-751 — the sweep's diff is read with --no-renames
      before the globs are matched; with the flag removed the new test fails as moved
      == [] against ['src/torve/engine.py'], and with it the sweep returns the deleted
      path and writes the chain_engine_moved event.
    action: decided
    proposal: >-
      No specification change: S-0120/D-2 says the change to a file the globs match
      is what the move is, and a moved file's deletion is that change; the row already
      reads correctly, and the code now reads the range the way the ledger and the
      lane do.
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    at: '2026-11-04T12:46:53Z'
    claim: >-
      The review claim that the row's check never exercises the ten-path clause does
      not hold: the check also selects test_engine_moved_carries_at_most_ten_sorted_paths_and_the_full_count,
      which pushes twelve matched engine paths in one commit and asserts the event's
      paths are exactly the sorted ten and its count is twelve, so an uncapped list
      or a count derived from the truncated list fails it.
    evidence: >-
      tests/test_manager.py:2227-2254 — twelve sorted engine paths are pushed, event['paths']
      must equal sorted(engine)[:10] and event['count'] must equal 12; the row's own
      -k engine_moved collects that test, and after this task's addition it collects
      nineteen tests including it.
    action: decided
    proposal: >-
      No change: S-0120/D-2's cap and full count stand as written, and the check that
      names the row already fails both an uncapped list and a count taken from the
      truncated one.
  - decision: D-3
    grade: LOCKED
    at: '2026-11-04T12:46:53Z'
    claim: >-
      The engine still installs, upgrades and re-executes nothing: the change only
      widens what the sweep matches in the range's diff, and the chain's part still
      ends at the exit code while the launcher installs.
    evidence: >-
      src/torve/cli/manager.py:1379-1383 — the chain returns the engine-moved reason
      and its exit code when the sweep reports the move, and no code in the changed
      function or this caller installs, upgrades or re-executes the engine.
    action: decided
    proposal: >-
      No specification change: the row's rule is undisturbed and the changed code
      complies.
