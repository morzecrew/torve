# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      The survey is agentless and read-only: no model call, no sandbox, no credentials,
      nothing written into the target beyond the report the operator names; exit 0
      on any completed measurement
    paths: [src/torve/application/survey.py, src/torve/cli/survey.py]
    consequence: >-
      First contact must cost zero trust; an agent or a write in it converts the wedge
      into the commitment it exists to precede
  - id: D-2
    grade: LOCKED
    text: >-
      Baseline extraction runs outside the engine as a skill; the engine only ever
      reads the committed, human-accepted document, through S-0030's standing inheritance
      and nothing else
    paths: [skills/corpus-bootstrap/**]
    consequence: >-
      S-0001/D-10 and S-0007/D-6 unchanged at the exact point they would be most convenient
      to bend; no new engine surface for the baseline exists to drift
  - id: D-3
    grade: LOCKED
    text: >-
      The baseline governs contracts minted after its acceptance only; no gate convicts
      the existing tree or its history retroactively
    paths: [src/torve/application/survey.py, skills/corpus-bootstrap/**]
    consequence: >-
      The ratchet is the entry's survivable property; day-one absolute enforcement
      converts findings into a reason to uninstall
  - id: D-4
    grade: ASSUMED
    text: >-
      Replays are truncated clones at the landing sha with the first parent as gate
      base, via the shadow workspace mechanics; task- and log-input gates record their
      no-task skip and the report prints that silence as the corpus's absence made
      visible
    paths: [src/torve/adapters/workspace/git.py, src/torve/application/survey.py]
    consequence: >-
      The skip line is the pitch: deleting it hides the one thing the survey exists
      to show
  - id: D-5
    grade: ASSUMED
    text: >-
      A target with no gates manifest is surveyed with the shipped product battery
      under manifest defaults; a target with one is surveyed with its own
    paths: [src/torve/config/manifest.py, src/torve/application/survey.py]
    consequence: >-
      House-convention gates firing on a stranger's history would read as noise and
      indict the survey, not the history
  - id: D-6
    grade: OPEN
    text: >-
      Whether the baseline is one document or several by area, and its naming convention;
      the first real adoption settles it and the bootstrap skill records the shape
      it chose
    paths: [skills/corpus-bootstrap/**]
    consequence: >-
      Guessing the shape before an adopter exists is the speculation §6b refused for
      formats
