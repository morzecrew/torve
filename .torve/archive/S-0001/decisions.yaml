# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      Two modules over one domain; executor is the sole writer of task state, planner
      is read-only plus task minting
    paths: [src/torve/**]
  - id: D-2
    grade: LOCKED
    text: >-
      Models never decide **what work exists** or **whether it is finished**. The
      planner invokes no model at all. Execution and review invoke models, but their
      output is data and the consequence is set by config. Stated precisely: a reviewer
      model does choose a `severity`, and configuration chooses what a severity does
      — so severity calibration is a **measured quantity** (RFC 0005 §6), not a trusted
      one
    paths: [src/torve/**]
  - id: D-3
    grade: LOCKED
    text: >-
      Gates execute outside the agent session; an agent cannot report a gate outcome
    paths: [src/torve/gates/runner.py, src/torve/application/runner.py]
  - id: D-4
    grade: LOCKED
    text: >-
      The sandbox is the unit of lifecycle; nothing runs on a host
    paths: [src/torve/adapters/**]
  - id: D-4b
    grade: LOCKED
    text: >-
      Agents never hold real credentials; outbound secrets are injected by the runtime's
      vault
    paths: [src/torve/adapters/**]
  - id: D-5
    grade: LOCKED
    text: >-
      `TaskStore` is a thin facade over the substrate's durable run store, not hand-written
    paths: [src/torve/application/taskstore.py]
  - id: D-5a
    grade: LOCKED
    text: >-
      The lifecycle is not modelled as a durable workflow; the run store is a leased
      queue with recovery
    paths: [src/torve/application/taskstore.py]
  - id: D-6
    grade: LOCKED
    text: >-
      The engine never resolves conflicts and never merges without the configured
      approval
    paths: [src/torve/application/runner.py]
  - id: D-21a
    grade: LOCKED
    text: >-
      The execution-log format is defined here; one file per task, append-only, grade
      copied at write time. *(Amended by A-1 2026-08-21: serialization is YAML, `logs/<task-id>.yaml`;
      substance unchanged.)*
    paths: [.torve/tasks/**, src/torve/gates/decisions_reported.py]
  - id: D-22
    grade: LOCKED
    text: >-
      Three aggregates, each with domain, create and read models and **no update command**
    paths: [src/torve/domain/**]
  - id: D-25
    grade: LOCKED
    text: >-
      The differentiator is the specification layer, not the execution runtime
    paths: [src/torve/**]
  - id: D-7
    grade: ASSUMED
    text: Python on the forze substrate; Go rejected
    paths: [pyproject.toml]
  - id: D-8
    grade: ASSUMED
    text: Pydantic is the single contract source
    paths: [src/torve/domain/**]
  - id: D-16
    grade: ASSUMED
    text: '`schema_version` on every persisted aggregate'
    paths: [src/torve/domain/**]
  - id: D-26
    grade: ASSUMED
    text: >-
      Build our own runtime rather than adopt the adjacent one; time-box a teardown
      of three of its mechanisms first
  - id: D-27
    grade: LOCKED
    text: >-
      Git and the store are a boundary, not a prohibition: git holds what should be
      (contracts, manifests, RFCs, decision tables, logs — diffable, sha-pinned, reviewed),
      the store holds what happened (runs, leases, attempts, results, telemetry).
      The engine may project git-held artefacts into the store for querying, one-way
      and read-only; the store is never authoritative for them. *(Reworded by A-4
      2026-08-21 from "nothing ever moves from git into a database".)*
    paths: [.torve/tasks/**, .torve/tasks/**, rfcs/**]
  - id: D-28
    grade: ASSUMED
    text: >-
      The engine gets a weekly time budget with a named owner; three consecutive overruns
      mean maintenance mode
  - id: D-21b
    grade: LOCKED
    text: >-
      A log entry carries `kind` (contradicted / departed / resolved / blocked), or
      the skill's `class`, or both; a `kind: resolved` close-out with `action: decided`
      is the legal attestation of compliance in a touched `LOCKED` area. Added by
      execution 2026-08-21
    paths: [.torve/tasks/**, src/torve/gates/decisions_reported.py]
  - id: D-29
    grade: ASSUMED
    text: >-
      The escalation vocabulary is §4's list plus `cost_anomaly` (§5.2), `killed`
      (RFC 0006 §5a), `underspecified` (added by amendment A-21 2026-08-22) and `stale_inheritance`
      (added by amendment A-22 2026-08-22), fixed in one closed enum in the domain
      module; any further addition is an RFC amendment, never a code change. Added
      by execution 2026-08-21
    paths: [src/torve/domain/states.py]
  - id: D-30
    grade: ASSUMED
    text: >-
      `claimed` may transition to `escalated`: a runner that dies between claim and
      first dispatch needs a legal exit, and the durable store's `claim_abandoned`
      recovery lands on the same edge. Added by execution 2026-08-21
    paths: [src/torve/domain/states.py]
  - id: D-31
    grade: LOCKED
    text: >-
      Agents do not communicate; the runner coordinates. What an agent may touch and
      what was already decided are copied into its contract; what others are doing
      is the runner's knowledge for overlap-free dispatch, never the agent's. Falsifiable:
      revisit only if telemetry shows tasks escalating with "insufficient context
      about adjacent work". Added by amendment A-5 2026-08-21
    paths: [src/torve/application/ports.py, src/torve/application/runner.py]
  - id: D-21c
    grade: ASSUMED
    text: >-
      The YAML log carries a top-level `drift_count` scalar checked against entries
      classed `drift`; revising the claim edits the scalar (git history preserves
      prior claims) while `entries` stays append-only. Added by execution 2026-08-21
    paths: [.torve/tasks/**, src/torve/gates/decisions_reported.py]
  - id: D-21d
    grade: ASSUMED
    text: >-
      Bypass records live in a separate top-level `bypasses:` list in the same log
      file, appended structurally (parse, append, dump); append-only means items are
      never removed or edited, not that bytes are only appended. Added by execution
      2026-08-21
    paths: [.torve/tasks/**, src/torve/gates/runner.py]
  - id: D-32
    grade: ASSUMED
    text: >-
      Every corpus decision table carries a Paths column naming the module areas a
      decision governs; `LOCKED` rows must carry paths, enforced by the shipped `rfc_index.py`.
      For RFCs not yet built the globs name the intended module and are refined when
      it exists. Added by execution 2026-08-21
    paths: [rfcs/**, src/torve/config/rfc_parse.py]
  - id: D-33
    grade: ASSUMED
    text: >-
      Two strict typecheckers gate `src` as blocking commands — `mypy src` and `basedpyright
      src` — with `[tool.pyright]` in pyproject as the repo-canonical strict config
      every editor reads; tests, scripts and skills carry no type floor. Added by
      execution 2026-08-21
    paths: [pyproject.toml, .github/**, .torve/gates.yaml]
  - id: D-34
    grade: ASSUMED
    text: >-
      The TaskStore facade and store adapters are typed against forze's exported contracts
      (`DurableRunStorePort`, `DurableFunctionHandler`, `JsonDict`), so a forze upgrade
      that changes the durable surface fails typecheck at the pin bump rather than
      surfacing as adapter behaviour. Added by execution 2026-08-21
    paths: [src/torve/application/taskstore.py, src/torve/adapters/store/durable.py]
  - id: D-35
    grade: ASSUMED
    text: >-
      Typing pattern at data boundaries: parsed-YAML documents are cast to `dict[str,
      Any]` at exactly one boundary per reader and stay typed inward; optional dependencies
      load via `import_module` (explicit Any), never from-imports of partially-unknown
      names; container initialisers are always annotated. Added by execution 2026-08-21
    paths: [src/torve/**]
  - id: D-A.7
    grade: LOCKED
    text: Task logs carry `repo` and `base_sha`
    paths: [.torve/tasks/**]
    consequence: >-
      Makes evidence resolvable against the commit the agent actually saw
  - id: D-1.7
    grade: LOCKED
    text: >-
      A task contract carries an `intent` paragraph stating what changes and why;
      it never carries steps. Added by amendment A-11 2026-08-22
    paths: [src/torve/domain/task.py, .torve/tasks/**]
    consequence: >-
      Without it an executor infers intent from acceptance commands, which is guessing;
      with steps in it, the plan gate becomes theatre
  - id: D-A.13
    grade: LOCKED
    text: >-
      One directory per task holding contract and log; path resolution lives in one
      module. Added by amendment A-12 2026-08-22
    paths: [src/torve/config/layout.py, .torve/tasks/**]
    consequence: >-
      Retention, sharding and pairing all follow from it; scattering path construction
      makes any later move a hunt
  - id: D-A.14
    grade: LOCKED
    text: >-
      Task deletion is supported; no code assumes a contract is present on disk. Added
      by amendment A-12 2026-08-22
    paths: [src/torve/**]
    consequence: >-
      Retention later collides with code that assumes the file is always there, which
      is a refactor rather than a feature
  - id: D-A.15
    grade: LOCKED
    text: >-
      Deletion requires prior promotion of `resolved` and `departed` entries into
      decision tables. Added by amendment A-12 2026-08-22
    paths: [.torve/tasks/**, rfcs/**]
    consequence: >-
      That promotion is the only unique information a log carries
  - id: D-1.8
    grade: ASSUMED
    text: >-
      A terminal task's contract and log are historical records: a corpus reorganisation
      never edits them, and identifier preservation is what keeps their citations
      resolving. Added by execution 2026-08-22 — see .torve/tasks/T-0017
    paths: [.torve/tasks/**]
