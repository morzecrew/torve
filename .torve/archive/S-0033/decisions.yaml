# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      Published images are a convenience, never a requirement: no engine behavior
      conditions on an in-house image, every published image builds locally from its
      in-repo definition with one command, and a stock upstream image plus a longer
      command template always works
    paths: [.torve/sandbox/**]
    consequence: >-
      The moment an engine feature needs an in-house image, the images stop being
      infrastructure and become a moat — including for ourselves
  - id: D-2
    grade: LOCKED
    text: >-
      Tags are immutable `<harness-version>-r<image-rev>` and CI refuses to re-push
      an existing tag; `latest` floats as convenience; the digest remains the only
      identity the engine trusts (S-0017/D-1 unchanged)
    paths: [.github/workflows/**]
    consequence: >-
      Humans read tags even though the engine reads digests; a re-pushed tag lies
      to the reader the hash cannot protect
  - id: D-3
    grade: ASSUMED
    text: >-
      Every harness install in a published definition goes through an `ARG` with a
      pinned default; a version bump is a one-line reviewed diff, never a rebuild
      side effect
    paths: [.torve/sandbox/**]
    consequence: >-
      The f68f4e7 incident as a convention: a rebuild that upgrades a harness silently
      is a regime change nobody chose
  - id: D-4
    grade: ASSUMED
    text: >-
      The `/opt/torve/` toolkit is thin by rule: single-file utilities, variability
      from environment only, no reading of contracts or `.torve/`; a utility wanting
      task context has outgrown the image
    paths: [.torve/sandbox/**]
    consequence: >-
      Toolkit-as-API is the calcification risk; the rule keeps the interface small
      enough to version by image revision
  - id: D-5
    grade: ASSUMED
    text: >-
      Publishing happens from this repository's CI, gated by the same conformance
      battery that tests the definitions; platform-images supplies bases and prior
      art, never these definitions
    paths: [.github/workflows/**]
    consequence: >-
      Splitting build-source from test-source is permanent drift; the battery gating
      the publish is what makes a pulled image mean something
  - id: D-6
    grade: OPEN
    text: >-
      Whether images carry their definition's git sha as an OCI label for provenance-by-inspection;
      the first debugging session against a pulled image settles it
    paths: [.torve/sandbox/**]
    consequence: >-
      Cheap to add, worthless until someone actually inspects one
