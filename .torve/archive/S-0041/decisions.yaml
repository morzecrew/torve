# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      The orchestrator stays one host-local process with per-root file authority;
      this document scales compute by moving sandboxes, never by moving the engine
    paths: [src/torve/adapters/runtime/opensandbox.py]
    consequence: >-
      Multi-host orchestration is a separate future document with a data-plane story;
      nothing here may leak engine state off-host
  - id: D-2
    grade: LOCKED
    text: >-
      Provider keys never enter a sandbox, local or remote: remote runs reach providers
      only through the broker's token-authenticated routes
    paths: [src/torve/adapters/broker/local.py]
    consequence: >-
      The D-21 doctrine survives the network hop; any shortcut that ships keys to
      a sandbox env is refused on review
  - id: D-3
    grade: ASSUMED
    text: >-
      Live conformance is a third env-gated leg (`TORVE_OPENSANDBOX_TEST_DOMAIN`)
      asserting the stub's contract plus platform timeout collection and label-scoped
      enumeration; a live/stub disagreement is a stub defect
    paths: [tests/opensandbox_stub.py, tests/test_sandbox_images.py]
  - id: D-4
    grade: ASSUMED
    text: >-
      `torve sandbox build --push` publishes the battery image and prints the digest-pinned
      reference; the OpenSandbox runtime resolves digest-pinned references and records
      bare tags as unresolved (S-0017/D-1)
    paths: [src/torve/cli/sandbox.py, src/torve/adapters/runtime/opensandbox.py]
  - id: D-5
    grade: ASSUMED
    text: >-
      Seed and sync-out cost (bytes, seconds) are recorded per attempt for transferring
      runtimes, absent for mounting ones; seed optimization is demand-gated on these
      numbers under S-0035's paired-measurement discipline
    paths:
      - src/torve/adapters/runtime/opensandbox.py
      - src/torve/application/telemetry.py
  - id: D-6
    grade: ASSUMED
    text: >-
      Remote endpoint mode: `broker.bind` and `broker.advertise` replace the Docker-gateway
      derivation for OpenSandbox runs; the pass-through leg is refused in remote endpoint
      mode until a token-authenticated design exists; transport security is the operator's
      deployment choice, documented plainly
    paths: [src/torve/adapters/broker/local.py, src/torve/config/runconfig.py]
  - id: D-7
    grade: ASSUMED
    text: >-
      Subscription-billed tiers stay Docker-only (the volume refusal stands); remote
      capacity serves metered tiers
    paths: [src/torve/adapters/runtime/opensandbox.py]
    consequence: >-
      Off-peak windows and remote capacity target the same population; nobody builds
      a vault workaround casually
