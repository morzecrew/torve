# yaml-language-server: $schema=../../schemas/document.json
id: '0045'
title: The live channel
kind: design
status: superseded
implementation: complete
depends_on: ['0044']
informed_by: ['0021', 0039, '0041']
supersedes: []
superseded_by: '0055'
owner: misery7100
description: >-
  A run becomes observable while it runs: the broker meters liveness from the burn
  it already sees, carries the sandbox's records to the store without ever handing
  it a credential, and gives the manager a way to speak back.
schema_version: 3
sections:
  - key: summary
    md: |
      A v1 run is opaque from dispatch to exit. The engine learns what happened
      only when the sandbox is gone, which makes every question about a running
      attempt — is it alive, is it working, is it wedged, is it worth its
      tokens — unanswerable, and every intervention blind.

      This RFC makes a run observable while it runs, using the structure that is
      already between the sandbox and the outside world. The broker holds the
      credentials, sees every provider call, and authenticates the sandbox by a
      run-scoped token. Metering it already performs becomes the liveness signal;
      an intake route lets the sandbox contribute records without ever holding a
      store credential, with its identity stamped by the broker rather than
      claimed by the caller; and a notes route lets the manager say something to
      a run in flight. Nothing here reads or rewrites a prompt.
  - key: motivation
    md: |
      The blindness is not theoretical. In one week of operation:

      - An attempt ran 1h40m with no way to tell whether the agent was working or
        wedged; the answer required opening the sandbox by hand.
      - A model's stream stalled while technically connected, three times. The
        wall-clock timeout eventually fired — that is, the engine's only
        instrument was a clock that had to run out.
      - Token burn was known per run, after the run. Whether an attempt was
        spending usefully at minute 20 was not a question the engine could ask.
      - Every escalation arrived complete: the first moment the engine could act
        was after the work was already lost.

      RFC 0044 phase 2 made an agent's divergence entry engine-written, which
      removed a class of malformed records — but it kept the record inside the
      worktree until sync_out, because there was no mediated channel to anywhere
      else. That was the right floor and the wrong ceiling: the entry exists at
      minute five and the engine sees it at minute ninety.
  - key: current-state
    md: |
      Verified against the tree at `fbf2b47`:

      - `src/torve/adapters/broker/local.py` runs as a thread of the runner for
        the life of the run (D-21.10). It holds provider keys in its own
        environment and injects them at the wire; the sandbox never sees one.
      - It authenticates with a run-scoped token, and already knows which run it
        is serving — so the run's task, partition and attempt are facts the
        broker holds and a caller does not state.
      - It meters every provider response (`BrokerUsage`: requests, tokens per
        provider, wall time, refusals, cost where reported) — counts and metadata
        only, never bodies (D-21.7). Usage is aggregated per run and read at
        close.
      - It already serves three topologies: loopback, an internal Docker network
        addressed by its gateway (sealed mode, D-21.3), and a remote
        bind/advertise pair (D-41.6). A route added here inherits all three.
      - The event log and its authority table exist (RFC 0044): agents may write
        `divergence.recorded` and `message.sent`; workers may write
        `seat.consumed`.
      - What does not exist: any route from a sandbox to the store, any per-call
        record, and any way for the engine to address a run in flight.
  - key: goals-non-goals
    md: |
      **Goals**

      - Answer "is this attempt alive and working?" from recorded facts, without
        the agent's cooperation and without opening the sandbox.
      - Let a sandbox contribute records to the system of record while it runs,
        with its identity stamped rather than claimed.
      - Give the manager a way to say something to a run, and a basis for
        stopping one on evidence rather than on a clock.
      - Keep every credential exactly where it is today.

      **Non-goals**

      - Reading, rewriting or injecting prompts. The broker sees provider traffic
        because it must route it; that is not a licence to author it.
      - Replacing durable traces (RFC 0039). A trace is the full stream after the
        fact; this is a small number of typed facts during.
      - Streaming agent internals, tool calls or file diffs out of the sandbox.
      - Any change to what an agent may write. The authority table already
        answers that, and this RFC routes it rather than widening it — with one
        exception, named in §5.4.
  - key: liveness-is-the-burn-stream
    md: |
      The broker emits one `seat.consumed` event per metered provider response —
      seat, tokens, cost where the provider reports it — as it meters, rather
      than only aggregating for close. The actor is the worker: the broker is
      host-side, part of the run's own machinery, and no agent cooperation is
      involved.

      Liveness then needs no separate signal. An attempt whose last burn event is
      four minutes old is not working, whatever its connection state says, and
      that is exactly the wedged-stream case a clock took an hour to catch. The
      alternative — an agent reporting its own liveness — fails in precisely the
      case it exists for: a wedged agent reports itself healthy.

      Burn also becomes visible as a rate rather than a total, which is the form
      the question "is this worth continuing?" is actually asked in.
  - key: the-intake-route
    md: |
      The broker serves an authenticated route the sandbox posts records to. The
      request carries the record's content; it does **not** carry who is sending
      it, which run it belongs to, or which task it is about. Those come from the
      run-scoped token the broker already issued, so a caller cannot state them
      and therefore cannot forge them:

      - `actor.kind` is stamped `agent`, never taken from the request;
      - `partition` and `subject` are the run's own, so a record can only ever be
        about the task the sandbox was dispatched for;
      - the kind is checked against the authority table (D-44.2) before anything
        is appended, so the two kinds an agent may write are the two it can write.

      `torve log divergence` posts through this route when the run has one, and
      writes the worktree file when it does not — the file remains the landed
      projection either way, so a run with no broker behaves exactly as it does
      today. The entry is checked before it is sent, by the same shared checks
      (D-44.10): a malformed entry is refused in the sandbox and never reaches
      the wire.

      A store credential still never enters a sandbox. That is the difference
      between this and the obvious shortcut of handing the sandbox a DSN: with a
      DSN the authority table becomes advice, because anything holding the
      connection can write anything. Mediation is what keeps it a rule.
  - key: notes-and-stopping-on-evidence
    md: |
      The manager may write a note into a run — a `message.sent` event addressed
      to the run's role — and the harness may read the run's notes through the
      broker on the same authenticated route. It is a poll, not a push: nothing
      interrupts an agent mid-thought, and a note the agent never reads is still
      a recorded fact about what the engine tried to say.

      Notes are how a human's mid-run knowledge reaches an attempt without
      rewriting its prompt: "the flake in `test_x` is known, do not chase it" is
      a note, and it is auditable afterwards precisely because it is an event and
      not a silent edit.

      With burn and records arriving live, stopping an attempt stops being blind.
      The manager may end a run on evidence — a stalled burn stream, a divergence
      entry that shows the task is underspecified, a rate that will exhaust the
      budget before the work lands — and the cause is recorded rather than
      inferred from a timeout. The existing `killed` escalation covers the
      outcome; what changes is that the engine now has grounds.
  - key: one-amendment-to-the-authority-table
    md: |
      `message.sent` is agent-only in RFC 0044's table, which was written when the
      only sender imagined was an agent. A note from the manager is the same kind
      of record with a different sender, and the sender is stamped, so the table
      widens to admit `manager` and `operator`. Nothing else changes: an agent
      still cannot write an acceptance, a landing, or another agent's record.
  - key: alternatives-considered
    md: |
      - **A DSN in the sandbox.** Simplest to build and the one thing this design
        refuses: direct store access makes the authority table advisory, and an
        agent that can write any event can forge the history that judges it.
      - **A sidecar inside the sandbox** forwarding records out. It moves the
        trust boundary nowhere — the sidecar is inside — while adding a process,
        its lifecycle, and its failure modes.
      - **Parsing the agent's stream host-side.** Needs no new channel, and is
        the derive-don't-record antipattern RFC 0044 retired: it sees only what
        the agent chose to print, and re-interprets it through whatever the
        parser believes this week.
      - **An agent-emitted heartbeat.** Fails in the case that motivates it.
  - key: tests
    md: |
      - Burn: a metered response emits one event carrying the provider's own
        numbers; a run with no provider calls emits none; the aggregate at close
        still equals what the events sum to, so the two views cannot disagree.
      - Liveness: a stalled stream produces no burn events, and the gap is
        visible in the log — asserted as a property of recorded facts, not of a
        timer.
      - Identity: a request stating its own actor, partition or subject is
        ignored on every field, and the stamped record names the run's own —
        one case per field, because a forgery that works on one field is a
        forgery.
      - Authority: a sandbox posting a kind an agent may not write is refused,
        and nothing is appended.
      - Fallback: with no broker, `torve log divergence` behaves exactly as it
        does today, byte for byte in the landed log.
      - Notes: a note written by the manager is readable by the run it addresses
        and by no other run.
  - key: docs
    md: |
      `pages/` gains a page on what the engine can see during a run and what it
      deliberately cannot. The RFC 0044 amendment in §5.4 ships with acceptance.
  - key: out-of-scope
    md: |
      - Prompt authorship or mutation of any kind, including "helpful" injection
        of notes into the next request. A note is read by an agent that asks.
      - Streaming the trace live (RFC 0039 covers the durable stream after the
        fact); this channel carries typed facts, not output.
      - Cross-run visibility for agents. A sandbox sees its own run and nothing
        else, which the stamped subject enforces rather than documents.
      - Operator UI over the live stream. The projections make one possible and
        nothing here requires it.
  - key: risks
    md: |
      - **A write surface reachable from inside a sandbox.** Real. Bounded by
        three things that hold together: the two kinds an agent may write, the
        subject pinned to its own run, and a rate limit — so the worst a
        compromised agent achieves is noise on its own task's history.
      - **Event volume.** One event per provider call is a lot of rows on a long
        run. Accepted deliberately: they are small, they are the liveness signal,
        and a burn rate cannot be reconstructed from a total.
      - **Notes read as instructions.** A note is untrusted review data under the
        same framing the feedback record already carries (D-5.13); an agent that
        treats one as authority over its contract is the failure the framing
        exists to prevent.
      - **The broker becomes load-bearing for more than routing.** It already is:
        a run without it has no provider access. This RFC adds records to a
        component whose failure already stops the run.
  - key: unresolved-questions
    md: |
      - Whether the manager should be able to stop an attempt automatically on a
        stalled burn stream, or only surface it for a human. Settled by watching
        the first weeks of burn events, not by argument.
      - Rate limits and retention for burn events at fleet scale.
  - key: phasing
    md: |
      Phase 3 — notes, and stopping an attempt on evidence — waits on the manager
      RFC 0044 declares, because there is no actor to write a note or weigh a
      stalled stream until it exists. Its decisions (D-45.4, D-45.7) name
      `src/torve/application/manager.py` for that reason.
phasing:
  - phase: 1
    title: burn as liveness
    intent: >-
      The broker emits one `seat.consumed` event per metered provider response — the
      seat, the provider's own token counts, and its reported cost where there is
      one — as it meters, instead of only aggregating for the run's close. The actor
      is the worker, because the broker is the run's own host-side machinery and no
      agent is involved; the aggregate reported at close must equal the sum of the
      events, so the two views of one run's spending cannot disagree. This phase alone
      answers whether an attempt is alive and working, for every run, with no sandbox
      change and no agent cooperation.
    scope:
      - src/torve/adapters/broker/local.py
      - src/torve/application/ports.py
      - tests/test_broker.py
    acceptance:
      - uv run pytest tests/test_broker.py
      - uv run lint-imports
      - uv run torve rfc check
  - phase: 2
    title: the intake route
    intent: >-
      The broker serves an authenticated route the sandbox posts records to, stamping
      actor kind, partition and subject from the run-scoped token so a caller cannot
      state — and therefore cannot forge — any of them, and refusing a kind the authority
      table does not give an agent before anything is appended. `torve log divergence`
      posts through the route when the run has a broker and writes the worktree file
      when it does not, checking the entry before either, so the landed log is the
      same projection in both cases and a run without a broker is unchanged.
    scope:
      - src/torve/adapters/broker/local.py
      - src/torve/application/divergence.py
      - src/torve/cli/log.py
      - tests/test_broker_sealed.py
      - tests/test_divergence.py
    acceptance:
      - >-
        uv run pytest tests/test_divergence.py tests/test_broker_sealed.py
      - uv run torve gates check
      - uv run torve rfc check
    depends_on:
      - 1
