  - decision: D-14
    grade: LOCKED
    at: '2026-09-11T12:09:48Z'
    claim: >-
      rootfs mirrors the container filesystem and one COPY installs it. What building
      decided: the chmod stays explicit rather than relying on the archive's modes,
      because git records only the executable bit and a file arriving non-executable
      would fail at the seam rather than at the build.
    evidence: >-
      sandboxes/dsh/Dockerfile:15 — COPY rootfs/ / followed by one chmod naming the
      three scripts, where a path used to appear in the COPY argument, the chmod and
      the comment above both.
    action: decided
  - decision: D-15
    grade: LOCKED
    at: '2026-09-11T12:09:48Z'
    claim: >-
      DSH_MODEL is one JSON knob rather than four variables, because a catalog entry's
      values only make sense together — split into provider, dialect, window and cap,
      three can be right while the fourth goes stale. The generator adds the broker's
      provider block only when TORVE_BROKER_URL is set, so one knob serves the direct
      and the brokered seat.
    evidence: >-
      sandboxes/dsh/rootfs/opt/torve/equip:23 — the generator, guarded on the knob
      being present so a seat that names no model gets no overlay rather than an empty
      one.
    action: decided
    notes: >-
      Measured after: the brokered path resolves its provider, passes the credential
      check and reaches TRANSPORT: Connection error against a dead URL, which is the
      whole path working.
