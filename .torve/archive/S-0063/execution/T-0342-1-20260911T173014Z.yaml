    claim: >-
      A sixth variable, and it is absent rather than empty-meaning-something for a
      harness that reads the mount. claude gets the empty string and its equip never
      consults it, so the variable costs a harness that does not need it nothing.
    evidence: >-
      src/torve/adapters/agent/harness.py:681 — TORVE_EQUIP_ROOT, absolute against
      the workdir because the scripts run wherever the harness leaves them.
    action: decided
  - decision: D-3
    grade: LOCKED
    at: '2026-09-11T17:18:10Z'
    claim: >-
      The exclusion is the engine's and the copying stays the image's, which is the
      split D-3 draws. The engine writes .git/info/exclude because that is per-worktree
      and local — the repository's own .gitignore is a reviewed file and not torve's
      to edit, and an image writing into a worktree's gitdir would be holding a far
      larger capability than translating a manifest.
    evidence: >-
      src/torve/application/session.py:600 — _exclude_equip_root, before equip runs
      and idempotent across retries.
