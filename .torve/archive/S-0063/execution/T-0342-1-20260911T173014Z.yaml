    claim: >-
      One declaration, two readers: the manifest names the root, the engine excludes
      it and passes it, and equip writes where it was told. What building settled:
      equip refuses rather than guessing when the engine names none, because a harness
      that reads the workspace and silently writes nowhere is the failure this row
      exists to stop, arriving from the other side.
    evidence: >-
      src/torve/config/agents.py:94 — equip_root, empty for a harness that reads the
      mount itself.
    action: decided
    notes: >-
      Measured after: dsh drops five skills into .dsh/skills and .agents does not
      exist in the workspace at all.
  - decision: D-2
    grade: LOCKED
