entries:
  - decision: D-18
    grade: LOCKED
    at: '2026-09-11T15:33:40Z'
    claim: >-
      The claude seat takes its credential by name and mounts none. What building
      found and the owner corrected: this is not an argument against auth volumes.
      A volume is the right carrier for a harness with no env form, and the operational
      rule that matters is that it be read-write — the harness refreshes its token
      mid-session, and a mount it cannot write to produces a sandbox that sits until
      the agent clock kills it rather than a clean failure. That failure mode is named
      in the row because nothing else in the loop would name it.
    evidence: >-
      .torve/harnesses/claude-subscription.yaml:3 — the manifest names the variable
      and no volume; the auth_volume and auth_mount fields keep their model defaults,
      unused here.
    action: decided
    notes: >-
      Measured both ways against the real image: the same prompt answered identically
      with and without /auth, once the host's proxy environment reached the container.
