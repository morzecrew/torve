    at: '2026-10-11T15:33:03Z'
    attempt: 2
    claim: >-
      D-5 says a thread the engine refused is known from the forge, but a refusal
      posts nothing to the forge (S-0084/D-9), so the forge cannot mark one. The leg
      reads the forge's last comment only for an answered thread and falls back to
      the stream row a refusal wrote, which is host-local, so D-5's 'on any host'
      consequence holds only for answered threads.
    evidence: >-
      src/torve/application/reviewleg.py:1108-1111 — the forge branch covers a last
      comment authored by the engine, and the fallback is the recorded refusal's comment
      count.
    action: departed
    proposal: >-
      D-5 should say the forge proves an answered thread handled, while a refused
      thread is known from the row the refusal wrote, and a later comment past that
      row's count re-opens it.
