  - decision: D-3
    grade: ASSUMED
    at: '2026-09-13T20:57:35Z'
    claim: >-
      The wording holds by contact and the two questions get their answers. toolkit/scope-guard-policy/index.js
      is a thin cordis plugin on the fs event gate (fs/write-intent and fs/edit-intent,
      both prepended) whose whole body shells out via python3 to /opt/torve/equipment/implement/scope_guard.py
      — the same script the claude hook's settings.json names — and dsh equip installs
      it through dsh's own verb (dsh plugin --profile headless add) before the overlay's
      insert turns the package on. Q-1: an id-less insert reaches a package equipped
      in the same pass, and a lone id: configure cannot add a row, which is why the
      install runs first. Q-2: only the two write intents are wired and nothing in
      the dsh toolkit names a finisher, so no finish-shaped check is reachable on
      dsh — the write-time refusal is the whole of dsh's half of the hook kind.
    evidence: >-
      sandboxes/dsh/toolkit/scope-guard-policy/index.js:37-42 - the gate wires only
      the two write intents and the refusal owns the decision
    action: decided
