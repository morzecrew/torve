# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-08-25T00:00:00Z'
    title: >-
      one pull request per task (amends S-0010/D-5, adds S-0010/D-10)
    md: |-
      **Found in operation** — reviewing the first fully drained batch, the
      owner counted the pull requests: every re-queue deleted the candidate
      branch (closing its pull request) and every re-run opened a fresh one,
      so a nine-task batch left ~30 closed PRs — T-0056 alone left five. The
      board read as churn, and it diverged from the reviewer's own habit: one
      branch per unit of work, iterated by pushes, one thread of review.

      **Changed:** the branch is the task's, for the task's whole life
      (S-0010/D-10). A requeue captures revision feedback (S-0005/D-12 order
      unchanged: capture first) and keeps the branch; the next attempt
      force-pushes it with lease — the supersession S-0010/D-5 now sanctions,
      after capture — and `open_pr` finding an open pull request for the
      branch reuses it, refreshing the body to the current attempt. Review
      threads accumulate on one PR, superseded lines marked outdated by the
      forge and already preserved verbatim in the revision record. The
      branch's death moves to the landing retirement (S-0019/A-5's S-0019/D-13), and
      the retry command's cleanup (0008 S-0008/D-10) becomes capture-only — its
      original rationale, "the stale branch would refuse the re-run's push",
      is dissolved by the leased supersession itself.

      **Deliberately unchanged:** the base push stays fast-forward-only with
      no force path (S-0019/D-9); one commit per attempt (S-0010/D-8) — the pull
      request always shows exactly the candidate, which is the squash
      discipline; capture-before-supersede (S-0005/D-12); and the abandon command,
      which leaves the branch for the operator — rare, and a deletion there
      is a human's call.
  - id: A-2
    at: '2026-08-28T00:00:00Z'
    title: >-
      candidate publication follows the forge leg (adds S-0010/D-11)
    md: |-
      **Found twice in one day of engine-repo dogfood.** `scm.open_pr: false`
      deferred the pull request but the candidate branch still pushed — and on a
      repository whose base was never published, a candidate branch carries the
      entire local history to the remote. Two landings (T-0105, T-0106) each
      published 240+ commits of a public repository's unpushed history as a side
      effect of a run whose configuration said, as plainly as it could, that the
      forge was not in play.

      **Changed:** the push and the pull request are one leg. With `open_pr`
      off, the candidate is committed locally and the branch stays local; the
      lane lands it from the local branch exactly as it already does. With
      `open_pr` on, nothing changes: push, then the pull request.

      **Deliberately unchanged:** no separate `push_candidates` knob. A branch
      push with no pull request serves nobody the corpus knows about, and a knob
      whose only use is republishing the accident is not a feature.

      *Archived 2026-09-09: superseded by 0055 (S-0053 S-0053/D-8).*
