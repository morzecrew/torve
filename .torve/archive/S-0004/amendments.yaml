# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-72
    at: '2026-08-31'
    title: >-
      the regime preimage recorded (amends §6a, adds D-4.19)
    md: |-
      **Found reviewing the storage question directly.** §6 made
      `schema_version`, `config_hash` and denormalised decisions mandatory from
      the first record "because none can be reconstructed" — and then recorded
      only the hash of the regime, which is precisely the unreconstructable
      case: the preimage spans gates.yaml, the resolved tier mapping, provider
      and broker policy, the image digest, the skills lockfile and the vendored
      skills tree, and several of those move on with every campaign. Every
      before/after comparison this section warns about currently compares two
      opaque twelve-character names.

      **Changed:** §6a gains the fourth measurement defect and D-4.19 records
      the fix: the exact `parts` mapping the digest was computed over is dumped
      once, content-addressed, to `.torve/regimes/<config_hash>.json`, beside
      the telemetry that references it — host-local, gitignored, write-if-absent.
      No database and no new dependency: the mapping is already in hand as a
      JSON-serialisable dict at the one place the hash is computed, and
      content-addressing makes the write idempotent and the store append-only by
      construction. A "yaml string + checksum in the durable store" variant was
      considered and declined: the durable store is the run-lease substrate, the
      regime is a telemetry concern, and the preimage belongs beside the stream
      whose rows cite it.
  - id: A-57
    at: '2026-08-28'
    title: >-
      the reaper consults host truth for shadow sandboxes (amends §5, adds D-4.18)
    md: |-
      **Found in the first two-adapter campaign this section calls for.** Every
      shadow attempt on the lab repository died with exit 137 in under a minute,
      across three separately-diagnosed campaigns — first read as a dsh defect,
      then as a permission defect, then caught red-handed by `docker events`: the
      standing loop's tick, firing every minute, reaps any torve-labelled sandbox
      whose run is not in the durable store. Shadow runs never register there, by
      design — a replay is not work, it lands nothing and holds no lease — so the
      convention-driven reap (RFC 0003 §4.2) read every shadow sandbox as an
      orphan. The campaign's numbers measured which harness's attempts fit
      between two ticks.

      **Changed:** shadow liveness is host truth. The reaper already reads host
      run state files for its worktree sweep; both reap regimes now count a
      sandbox live when a host state file names its run with a heartbeat younger
      than `reap.stale_after`, alongside the store's records. A crashed shadow
      still reaps — its heartbeat goes stale — and an orphaned sandbox with no
      state file reaps immediately, exactly as before.

      **Deliberately unchanged:** shadow runs still register nothing in the
      store. Giving replays durable records to appease the reaper would make the
      measurement infrastructure a tenant of the machinery it measures, and every
      store query about real work would need a shadow filter forever.

      **Interim operations note:** until the execution lands, a shadow campaign
      on a root with a scheduled tick pauses the schedule for the campaign's
      duration — the 2026-08-28 clean campaign ran that way.
  - id: A-121
    at: '2026-09-05'
    title: >-
      Two criteria met, and the third is a reading nobody did
    md: |-
      **Judged in the pass A-113's new flag started.** Two of §8's three exit
      criteria were met on 2026-08-28 and the header says so: fifteen shadow runs
      (23 recorded replays), two adapters over the same eight tasks. The third is
      not met, and it is the one that was never going to happen by itself.

      **"Gate set adjusted from shadow-run evidence rather than from
      expectation."** The gate set has changed three times since — the coverage
      delta gate and the declared twins (both RFC 0036), and the axis labels
      (RFC 0034). Every one came from a design document. None came from reading
      the 21 shadow rows this repository has been accumulating.

      That is not a gap in the machinery. The replays ran, the rows are there
      with cost, iterations and gate outcomes, and `torve context` already
      projects them. What is missing is somebody reading them and either changing
      a gate or writing down that the evidence says not to. Either closes the
      criterion; only silence leaves it open.

      **Changed:** `implementation: partial` stands, with exactly one criterion
      outstanding and the evidence for it already collected.
  - id: A-124
    at: '2026-09-06'
    title: >-
      The gate set read against the replays: one change, and the rest stand
    md: |-
      **A-121's outstanding criterion, closed by reading the evidence.** §8 asks
      for a gate set adjusted from shadow-run evidence rather than from
      expectation. The 21 replays and the 406 real attempts behind them were read
      today, split by population. Per gate, failures over runs:

      | gate | replays | real |
      | --- | --- | --- |
      | `decisions-reported` | 1/23 (4%) | 60/383 (16%) |
      | `scope` | 3/23 (13%) | 29/382 (8%) |
      | `user-facing-text` | 0/18 | 25/313 (8%) |
      | `acceptance` | 0/23 | 15/382 (4%) |
      | `self-audit` | 0/23 | 8/383 (2%) |
      | `rfc-valid` | 2/23 (9%) | 3/350 (1%) |
      | `layering` | 2/23 (9%) | 0/359 |
      | `source-layout` | 0/23 | 4/366 (1%) |
      | `secrets` | 0/23 | 0/382 |
      | `no-test-tampering` | 0/23 | 0/382 |
      | `coverage-delta` | 0/0 | 37/63 (59%) |

      **The blocking set does not change, and each zero has a different reason.**
      `secrets` and `no-test-tampering` have never convicted anything in 405 runs
      across both populations, and that is what they are for: their failure class
      is irreversible, so their evidence is the sabotage twin rather than a
      conviction rate, and 29 of 29 twins behave. `layering` has never convicted
      a real attempt either, and its zero is different again — the import
      contracts run continuously in development, so the gate is a ratchet that
      holds rather than a net that catches. Removing a gate because it never
      fires is removing the reason it never fires.

      **`layering` and `rfc-valid` convict replays and not real runs**, at 9%
      each. That is not a finding about the gates: a replay runs old work against
      *today's* rules, and both rules tightened since the tasks being replayed
      landed. It is the measurement working, and it is worth writing down before
      somebody reads those two rows as gate defects.

      **The one adjustment the evidence supports is not to a gate.**
      `coverage-delta` reads 37 failures in 63 runs — 59%, the worst rate in the
      battery, on the newest gate. By day it reads **100%, 76%, 0%**: the gate
      landed on 2026-09-03 refusing everything and passes everything three days
      later. The aggregate describes a gate's own calibration window and would
      have argued for weakening or removing a gate that is now working. The
      reading was the thing that was wrong.

      **Changed:** `_gate_health` reports the last 20 runs beside the lifetime
      figure, and `torve context` prints both. A rate that is moving is a
      different fact from a rate that is high, and the projection said only the
      second. `coverage-delta` now reads `37` lifetime and `0/20` recent.

      The criterion is met in the direction it was written to allow: the evidence
      was read, it changed something, and what it changed is the instrument
      rather than the battery — because for the battery the evidence says leave
      it alone, which is a finding and not an absence of one.

      With §8's other two criteria met on 2026-08-28, that is all three, and this
      document's `implementation` becomes `complete`.

      *Archived 2026-09-09: superseded by 0055 (RFC 0053 D-53.8).*
