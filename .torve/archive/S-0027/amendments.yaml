# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-08-31T00:00:00Z'
    title: >-
      execution's readings fold into the rows (amends S-0027/D-5, S-0027/D-6, S-0027/D-7,
      S-0027/D-10; records the restricted-scope CLI doctrine)
    md: |-
      **From T-0114, T-0120, T-0121 and T-0122's execution logs, approved.**

      - S-0027/D-5's populations, as built: per-tier "attempts" counts every
        real-adapter run under the tier — attempt, review and intake telemetry;
        shadow and skill-eval excluded. Cost is the same population split
        broker-measured / self-reported; escalations join on the contract's own
        declared tier; "current digest" reads the last recorded
        `agent.image_digest`, never a live runtime resolution.
      - S-0027/D-6's lint, as built: a configuration drafting run is detected by
        scope confinement alone, and the lint validates the *baseline* — the
        tree's current config parses, named existing sandbox definitions build,
        doctor's forze-pin and image-resolution checks pass. A drafter that
        proposes actual file content, so the lint can validate the changed
        configuration, needs a documented DraftsDocument output-format
        extension first.
      - S-0027/D-7's mechanical reading: "displaced" means the resolved digest
        falls outside {incumbent, candidate} of the most recent config-eval
        record citing the tier; a tier no record cites is never refused on
        this ground.
      - S-0027/D-10: resolved against the pointer field (see the row).
      - From T-0121, the restricted-scope CLI doctrine, recorded for future
        contracts: inside a scope that excludes `src/torve/cli/main.py`,
        "give X a CLI surface" is satisfied by widening an existing command's
        argument surface; a genuinely new top-level command must carry
        `main.py` in its scope.allow.
  - id: A-2
    at: '2026-09-04T00:00:00Z'
    title: >-
      the rebuild hatch for the paired-verdict rule (amends S-0027/D-7)
    md: |-
      **Found dispatching the first task through the v2 manager.** S-0027/D-7 refuses
      to dispatch a seat whose image digest no recorded verdict has measured: a
      definition edit must not quietly change what a tier runs under. The rule is
      right, and it fired correctly — the agent images had just gained the
      engine's own CLI (S-0017 S-0017/A-2), so every digest moved at once and no
      verdict cited any of them.

      What the rule does not distinguish is a repository *rebuilding its own
      engine*. Here the images change because the engine changed, several times a
      day, and recording a paired replay verdict for each move costs a full
      shadow arm — which measures a regime that will be replaced before the
      measurement is read. The refusal stops the work that would produce the
      evidence the refusal is asking for.

      **Changed:** `unmeasured_images` (`refuse` | `allow`, default `refuse`).
      Under `allow` the dispatch proceeds and writes an `unmeasured_dispatch`
      engine event naming the tier, the digest and the digests the last verdict
      did measure. What S-0027/D-7 protects is comparing numbers from regimes nobody
      measured; a record saying "this run was unmeasured, and here is what the
      last verdict covered" protects that too, because the reader can exclude it.
      The same shape as the decomposition override (`--oversize`): explicit,
      recorded, never silent.

      **Deliberately unchanged:** the default. A repository that is not rebuilding
      its engine gets the refusal, and `allow` is a decision an operator makes in
      their own run configuration with the reason visible beside it.

      *Archived 2026-09-09: superseded by 0055 (S-0053 S-0053/D-8).*
