# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: the refusal, and what doctor says is armed
    intent: >-
      A configuration arming the landing leg with no criterion set is refused at load,
      naming the field and what to set. Beside it, `doctor` gains two statements about
      what is armed rather than verdicts on whether it should be: which promotion
      criteria a served manager would land without, and whether a standing job has
      been refused instantiation and how often. Nothing is armed here; the point is
      that arming it becomes a thing an operator can see the shape of first.
    scope:
      - src/torve/config/runconfig.py
      - src/torve/cli/doctor.py
      - tests/test_runconfig.py
      - tests/test_doctor.py
      - src/torve/config/AGENTS.md
      - pages/docs/operating.md
      - CHANGELOG.md
    acceptance:
      - uv run pytest
      - uv run mypy src
      - uv run lint-imports
    character: structural
  - phase: 2
    title: the job that reached for the judge is retired
    intent: >-
      `flake-quarantine` is removed, and the rule that refused it six times becomes
      a check. Its predicate worked — two commands are over the flake threshold —
      but what it minted was an edit to the list that stops a command blocking, and
      the command it wanted was the acceptance command of nearly every task here.
      The check walks the standing jobs and refuses any whose scope names a file that
      declares what convicts; `lockfile-drift` passes it, and nothing replaces the
      retired job because the signal already reaches a person through `doctor`.
    scope: [.torve/standing/**, tests/test_standing.py, CHANGELOG.md]
    acceptance:
      - uv run pytest
    depends_on:
      - 1
    character: structural
