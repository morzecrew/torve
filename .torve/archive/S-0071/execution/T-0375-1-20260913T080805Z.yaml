  - decision: D-2
    grade: LOCKED
    at: '2026-09-13T08:00:57Z'
    claim: >-
      The lockfile moved, so the battery image must be rebuilt and its digest recorded.
      The image definition needed no edit: the battery Dockerfile copies pyproject.toml
      and uv.lock from the repository-root context and syncs from them under --locked,
      so the added pytest-xdist and execnet entries change the keyed layer by themselves
      and a stale warm layer cannot survive the change. The rebuild itself is an act
      outside this diff, and it could not be executed from this session: no docker
      client is present, so 'just image battery' and 'torve sandbox digest battery'
      have nothing to talk to. The rebuild and the digest record are owed to the operator,
      not waived.
    evidence: >-
      sandboxes/battery/Dockerfile:23-30 — COPY of the two files followed by uv sync
      --locked --all-extras, so the lockfile bytes are the layer key and no Dockerfile
      edit is required; uv.lock gained pytest-xdist 3.8.0 and execnet 2.1.2
    action: decided
    notes: >-
      Docker is absent from the executing sandbox: `command -v docker` prints nothing
      and `docker info` reports 'docker: command not found'. The lockfile change is
      complete and verified (`uv lock --check` clean, `uv run pytest` 1707 passed
      / 44 skipped), and `uv run pytest -n 2 --collect-only` confirms the plugin loads
      from the synced environment. What remains is 'just image battery' on a host
      with a daemon and the moved digest recorded.
