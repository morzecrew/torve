# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      `manager resolve --resolution requeued` refreshes a phase task's contract through
      `refresh_document` and writes it, reading the task's document as the remote's
      document branch holds it after a fetch, and as the checkout holds it when the
      remote has no such branch
    paths:
      - src/torve/cli/manager.py
      - src/torve/application/planner.py
      - tests/test_manager.py
      - tests/test_plan.py
    consequence: >-
      a phase widened on the document branch reaches the next attempt without a hand
      edit to the contract
    rationale: >-
      mid-flight amendments land on the document branch, which is the text the pull
      request will merge; S-0088 already owns how a document becomes a contract, so
      the requeue reuses that path rather than writing a second derivation
    cites: [S-0088/D-1, S-0091/D-1]
  - id: D-2
    grade: ASSUMED
    text: >-
      The document branch the review leg's phasing reads (S-0092/D-2) is the remote's
      copy after a fetch, not the checkout's ref
    paths: [src/torve/application/reviewleg.py, tests/test_reviewleg.py]
    consequence: >-
      a round re-scoped at a requeue sees a phase pushed from another checkout
    rationale: >-
      the lane already treats the remote's branch as the one worked from (S-0091/D-1);
      the local ref lags it whenever a person pushes from elsewhere
    cites: [S-0091/D-1, S-0092/D-2]
  - id: D-3
    grade: ASSUMED
    text: >-
      `manager resolve --resolution requeued` clears the task's escalated host state
      (its run-state file, worktree and sandbox) before it writes the requeue, and
      keeps the checkpoint a continued attempt resumes from
    paths:
      - src/torve/cli/manager.py
      - src/torve/application/reaper.py
      - tests/test_manager.py
      - tests/test_reaper.py
    consequence: >-
      a requeue never fails as `gate_infrastructure_failure` on what its own escalation
      left behind
    rationale: >-
      `runner` refuses to dispatch over an escalated run state, and the only clearing
      today sweeps every escalated task at once
    cites: [S-0090/D-2]
  - id: D-4
    grade: ASSUMED
    text: >-
      While a pass is paused, the latest undelivered escalation of each task holding
      the pause is relayed whatever its reason, and the notification says the night
      is paused; every other escalation is judged by S-0051/D-8's interrupt classes
    paths:
      - src/torve/application/notify.py
      - src/torve/cli/manager.py
      - tests/test_notify.py
    consequence: >-
      a night that stops serving work pages the operator once, if a destination is
      configured
    rationale: >-
      night 15 sat paused for six and a half hours behind an `underspecified` halt
      that no interrupt class covered; what made it urgent was the pause, not the
      reason
    cites: [S-0051/D-8]
  - id: D-5
    grade: ASSUMED
    text: >-
      `manager resolve --resolution abandoned` leaves the run's host state where it
      is; `torve reap --escalated` still clears it
    paths: [src/torve/cli/manager.py, tests/test_manager.py]
    consequence: >-
      a person can still read an abandoned attempt's worktree and diff before sweeping
      it
    rationale: >-
      abandoning is a person declining the work, and the attempt may hold something
      worth salvaging; a requeue has no such reader, because its next attempt replaces
      the run
    cites: [D-3]
