    at: '2026-09-10T15:07:07Z'
    claim: >-
      D-2 refuses a kind the harness manifest does not name. D-10 says a harness that
      takes no skill kind keeps materialize and the prompt's paragraph. Read together
      they contradict, because a role profile declaring a package-data skill on a
      harness with no skill flag names a kind that harness does not equip — so D-2
      would refuse the very configuration D-10 describes, and every seat in this repository
      with it, since fake equips nothing and all three role profiles declare skills.
    evidence: >-
      src/torve/config/agents.py:438 — the exemption is one condition on the refusal,
      and without it loading this repository's own configuration raises before any
      seat resolves.
    action: halted
    proposal: >-
      D-2 gains its exception: a kind the manifest does not name is refused unless
      the engine can deliver it itself, which is package-data skills alone (S-0062/D-6,
      S-0062/D-10). The rule becomes no way to deliver it rather than no flag for
      it. When a real harness gives the skill kind a flag the exemption narrows on
      its own — it only ever fires for a harness with no skill channel.
  - decision: D-1
    grade: LOCKED
    at: '2026-09-10T15:29:19Z'
    claim: >-
      Equipment is one typed list on the profile and the two keys it replaced are
      refused by name. What building it decided, because the row does not say: an
      empty list written is a declaration of nothing, while an absent key contributes
      no layer at all — so 'equipment: []' and no file are different answers, and
      only the second lets the role's profile speak.
    evidence: >-
      src/torve/config/equipment.py:60 — Equipment carries kind, source, ref and select;
      agents.py FOLDED names skills and plugins with the item that replaces each.
    action: decided
    notes: >-
      The seat still exposes derived plugins and skills for the sandbox spec and the
      materializer; both retire with the renderer in phase 4.
