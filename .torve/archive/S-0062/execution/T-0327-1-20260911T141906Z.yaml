  - decision: D-4
    grade: LOCKED
    at: '2026-09-11T13:17:49Z'
    claim: >-
      The cache is warmed by torve equip and by dispatch, both host-side. What building
      decided: a fetch lands in a sibling directory and is renamed into place, so
      a half-fetched clone can never look like a warm one and a second attempt does
      not repair it silently. The github fetch is a pinned clone rather than gh skill
      install, because a clone is what every kind can be fetched by and the pin it
      records travels with the bytes.
    evidence: >-
      src/torve/application/equipment.py:168 — warm, which fetches only what is cold
      and returns where each item landed in declaration order.
    action: decided
  - decision: D-5
    grade: ASSUMED
    at: '2026-09-11T13:17:50Z'
    claim: >-
      The mount is a per-seat directory of hard links to the shared cache, not the
      cache root and not a copy. A copy would duplicate every skill for every attempt;
      a symlink would point at a host path the container has not mounted. Hard links
      cost a directory entry, survive a bind mount, and cannot be edited through a
      read-only mount anyway. Measured: touch inside the mount reports Read-only file
      system.
    evidence: >-
      src/torve/application/ports.py:77 — readonly_binds, host path to mount point;
      docker binds it :ro and opensandbox sends the bytes and takes the write bit
      away.
    action: decided
    notes: >-
      The two adapters reach the same guarantee by different routes, which is the
      split they exist for — that server has no bind mounts.
  - decision: D-8
    grade: ASSUMED
    at: '2026-09-11T13:17:50Z'
    claim: >-
      The hash reads keys for both layers. The seat's ride the tiers part already,
      because a declaration is all a seat carries; the role's needed a part of their
      own, since skills.sets holds names rather than keys and will retire before the
      equipment does.
    evidence: >-
      src/torve/application/telemetry.py:98 — parts['equipment'], role to sorted keys,
      read from the role profiles rather than from any cache.
    action: decided
  - decision: D-12
    grade: LOCKED
    at: '2026-09-11T13:17:51Z'
    claim: >-
      The two layers merge at dispatch rather than at seat resolution, because the
      role's profile varies per task and the seat does not. What building found: an
      item's directory name under the mount is not private bookkeeping — dsh refuses
      a skill whose directory is not a valid skill name, and claude puts the name
      in a flag an operator reads. So the name is the thing's own and the key disambiguates
      only a collision.
    evidence: >-
      src/torve/application/equipment.py:200 — mount_name, the locator's last segment
      reduced to characters a harness will take.
    action: decided
    notes: >-
      Measured after the change: dsh loads both skills with no invalid-skill complaint
      and mimo debug skill lists them.
