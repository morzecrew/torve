# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      A decision is a subject in the record: successive `decision.recorded` events
      on that subject are its versions, and `supersedes` is an edge to a different
      decision, never a regrade of the same one
    paths: [src/torve/application/decisions.py]
    consequence: >-
      Version counts, history and the supersession graph all read correctly from one
      fold; conflating the two would make every count wrong and the error would be
      invisible
  - id: D-2
    grade: LOCKED
    text: >-
      Retirement is recorded, never inferred from a row's absence
    paths: [src/torve/domain/events.py, src/torve/application/decisions.py]
    consequence: >-
      Costs one kind in a deliberately closed vocabulary; buys the ability to tell
      a deliberate retirement from a broken table, and works for sources that are
      not files
  - id: D-3
    grade: LOCKED
    text: >-
      Contract minting keeps reading the reviewed document; the record is not consulted
      at mint time
    paths: [src/torve/application/planner.py, src/torve/application/intake.py]
    consequence: >-
      A contract's grades still come from what a human committed, with no import step
      in between; the cost is two readers of the paths rule until tasks are records
      too
  - id: D-4
    grade: ASSUMED
    text: >-
      A source id is `<namespace>/<slug>`, stable under renaming; the corpus namespace
      is `rfc` and its slug is the document number
    paths: [src/torve/domain/source.py]
    consequence: >-
      A document moved on disk keeps its identity in the record; `ref` is what moves
  - id: D-5
    grade: ASSUMED
    text: >-
      The importer computes the events and returns them; the caller appends
    paths: [src/torve/application/decisions.py]
    consequence: >-
      A dry run is the same code path with the write skipped, so `--check` cannot
      drift from what an import would do
  - id: D-6
    grade: ASSUMED
    text: >-
      Only accepted, non-superseded documents are imported
    paths: [src/torve/application/decisions.py]
    consequence: >-
      The same admission every other reader applies (S-0007/D-7, S-0030/D-1); a draft's
      rows were never in force, so recording them would date them wrongly
  - id: D-7
    grade: ASSUMED
    text: >-
      The decision graph is read by subject type over one partition, not by folding
      the partition's whole log
    paths:
      - src/torve/application/eventlog.py
      - migrations/torve/postgres/0002_decisions.sql
    consequence: >-
      The corpus-sized slice stays cheap as execution grows, and the read cannot be
      truncated by attempt volume
  - id: D-8
    grade: OPEN
    text: >-
      What `decision.accepted` means — acceptance of a document, or of one row. Settled
      by the second source kind, not by argument
    paths: [src/torve/domain/events.py]
