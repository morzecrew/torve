# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      A surviving review blocker spends the run's `blocker_revisions` budget (default
      1) as in-run attempts in the same worktree before escalating `blocker_finding`;
      the poison ceiling and task budgets count every revision, unchanged
    paths: [src/torve/application/runner.py]
    consequence: >-
      Escalation timing changes; anything watching for `blocker_finding` on first
      conviction now sees it one attempt later by default
  - id: D-2
    grade: LOCKED
    text: >-
      The revision's critique travels only in the S-0005/the-revision-loop-added-by-a-32-2026-08-24
      feedback record — blockers rendered as threads (review id as author, claim +
      evidence as body), the convicted diff as the superseded diff, cap and truncation
      honesty unchanged
    paths: [src/torve/application/feedback.py, src/torve/application/review.py]
    consequence: >-
      One carrier for all revision context; a second channel (prompt injection, env)
      is a design violation, not an option
  - id: D-3
    grade: ASSUMED
    text: >-
      `blocker_revisions: 0` restores the pre-0043 transition sequence exactly — configuration
      decides the consequence (S-0001/D-10), and the conservative setting is always
      reachable
    paths: [src/torve/config/runconfig.py]
  - id: D-4
    grade: ASSUMED
    text: >-
      Unparseable verdicts and broker budget refusals keep immediate escalation —
      infrastructure and cost are not revisable defects
    paths: [src/torve/application/runner.py]
  - id: D-5
    grade: ASSUMED
    text: >-
      The record is written root-side (`.torve/tasks/<id>/feedback.md`) so a post-escalation
      re-dispatch inherits the accumulated critique with zero new mechanism
    paths: [src/torve/application/feedback.py]
  - id: D-6
    grade: OPEN
    text: >-
      Whether the revision attempt's history fact should carry a structured marker
      (for the calibration projection to count revisions vs first attempts) or the
      prose fact suffices — settled by whoever builds the first consumer
    paths: [src/torve/application/runner.py]
