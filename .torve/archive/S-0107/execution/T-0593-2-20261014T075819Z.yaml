    at: '2026-10-14T07:52:29Z'
    attempt: 2
    claim: >-
      S-0107/D-3 says the gate's score and survivors ride the record's gates.evaluated,
      but the record keeps only the last RECORDED_OUTPUT characters of a red result's
      output, so a mutation report long enough to be truncated loses the head line
      carrying its score. The record now keeps the mutation gate's first line beside
      the tail, and the reading parses the score and the survivors by shape rather
      than by position.
    evidence: >-
      src/torve/application/telemetry.py:1051 — the gate named mutation keeps its
      first line beside the tail; src/torve/domain/attempt.py:101 is where a survivor
      is recognised by its em-dash separator
    action: decided
    proposal: >-
      S-0107/D-3 should say the reading survives the record's output bound: the mutation
      gate's report head is kept beside the tail, and its score and survivors are
      read by shape, so a phase whose tests are weakest still reports its score rather
      than vanishing as if the gate never ran.
