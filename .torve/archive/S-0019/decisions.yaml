# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-19.5
    grade: LOCKED
    text: >-
      Intake pauses while the escalation queue holds `loop.pause_escalations` runs
      (default 1); every other leg keeps running — the queue may drain, not grow,
      by the loop's hand
    paths: [src/torve/application/loop.py, src/torve/config/runconfig.py]
    consequence: >-
      D-6.8 made mechanical: a queue nobody triages stops the machine, not the person
  - id: D-19.7
    grade: ASSUMED
    text: >-
      Every tick appends one engine event recording each leg's action or skip reason,
      `noop: true` when nothing moved
    paths: [src/torve/application/loop.py, src/torve/application/telemetry.py]
    consequence: >-
      Quiet and dead must be distinguishable from telemetry alone
  - id: D-19.9
    grade: LOCKED
    text: >-
      The loop publishes what it lands: after at least one landing, the tick's lane
      leg pushes the base branch to origin, fast-forward only — a refused push is
      a loud leg error, and no force path exists for the base (D-10.5 untouched).
      Added by amendment A-28 2026-08-24. *Complemented by amendment A-34 2026-08-24
      (D-19.12): the candidate branch republishes first, so the forge sees this push
      as the merge*
    paths: [src/torve/cli/tick.py, src/torve/adapters/vcs/git.py]
    consequence: >-
      Unpushed landings leave origin stale, and every later dispatch bases on the
      stale origin and conflicts systematically
  - id: D-19.10
    grade: ASSUMED
    text: >-
      The reaper keeps the state file of a READY implement or revert run whose task
      has not landed on the base; its worktree stays disposable, and review-role READY
      states remain sweepable. Added by amendment A-28 2026-08-24, amending RFC 0003
      D-3.23's sweep scope
    paths: [src/torve/application/reaper.py]
    consequence: >-
      READY is terminal to the engine but it is the lane's input; sweeping it before
      the landing loses the candidate across ticks
  - id: D-19.11
    grade: ASSUMED
    text: >-
      The lane adopts byte-identical untracked engine-record files the landing branch
      carries — the root copy is removed before the fast-forward; any difference in
      content still refuses. Added by amendment A-28 2026-08-24
    paths: [src/torve/application/lane.py, src/torve/adapters/vcs/git.py]
    consequence: >-
      The runner's worktree commit carries the task's own contract; an untracked identical
      copy in the root must not block the landing it belongs to
  - id: D-19.12
    grade: ASSUMED
    text: >-
      Before the base push, each rebased landing's candidate branch is republished
      to its landed tip — force-with-lease, engine-owned `torve/*` namespace, at landing
      time only — so the forge recognizes the base push as the merge of every landed
      pull request. Added by amendment A-34 2026-08-24
    paths: [src/torve/cli/tick.py, src/torve/adapters/vcs/git.py]
    consequence: >-
      The board read fast-forward landings as rejected work; a reader's first hour
      must not need this table to trust the history
  - id: D-19.13
    grade: ASSUMED
    text: >-
      A landed pull request the forge does not mark merged within a short grace is
      closed with the landing note — the T-0072 close-out, now the fallback — and
      the candidate branch is deleted in every landed case. Added by amendment A-34
      2026-08-24
    paths: [src/torve/adapters/vcs/git.py, src/torve/cli/tick.py]
    consequence: >-
      The race between the forge's merge detection and the engine's close-out must
      degrade to yesterday's behaviour, never to an open orphan
retired: [D-19.1, D-19.2, D-19.3, D-19.4, D-19.6, D-19.8, D-19.14]
