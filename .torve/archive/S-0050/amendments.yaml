# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-05T00:00:00Z'
    title: A run, over a board that also holds history
    md: |-
      **Found executing phase 2.** §5.4 called `status` the easy one — "the board
      already is it" — and the fold was indeed free. What was not free is the
      population. The board carries every task a partition has ever minted, and
      S-0049 S-0049/D-1 mints landed history too: on this repository's first pass
      the manager minted 184 contracts and recorded 184 landings from the trailer,
      so a board-backed `status` that reported every non-queued row answered with
      184 `ready` rows and buried the one run that was actually live.

      The run-state files never had this problem because a state file exists only
      where a run happened. The board's equivalent question is therefore not
      "which rows are not queued" but "which rows did a run touch": an attempt is
      recorded, or the engine is holding the task now. An escalation counts even
      with no attempt behind it, because something is waiting on a person either
      way. A `ready` row with no attempt is history the board imported, and it is
      `torve board`'s to show, not this reader's.

      That settles the first of §10's unresolved questions in the negative:
      `status` keeps its own report, because the two answer different questions
      over the same rows. The board is every contract this partition owns and
      what became of it; `status` is what ran here. Their overlap is real but
      partial, and collapsing them would cost the second question.

      The second question is now measured rather than hypothetical. Against the
      live log this repository reports one run from the record and three from the
      files: the record's is the only task the manager dispatched, and the files
      also hold a v1 escalation and a hand-run landing that no partition ever saw.
      That is S-0044/A-5's wall with a number on it, and it is why S-0050/D-1 holds.

      **Changed:** §5.4's account of `status` gains its population rule — a run is
      an attempt recorded or a task the engine holds, plus any escalation — and
      §10's first unresolved question is settled: `status` keeps its own report.

      Phases 1 and 2 have landed. Phase 3 remains, and its first block —
      `context`'s tasks and programme — is the one S-0049 already made a fold.
  - id: A-2
    at: '2026-09-05T00:00:00Z'
    title: >-
      Phase 3's first block, and what the other two still owe
    md: |-
      **Landed.** `context`'s task block reads the record: every contract the
      partition holds, its state, attempts, escalation and the two cross-links
      (`parent`, `targets`) that decompositions and reviews are read through. It
      is a fold rather than a swap, which is what S-0049/A-1 and S-0049/A-2 had to make true
      first — a record holding two thirds of the contracts and a third of the
      landings would have answered over a population nobody chose.

      The vocabularies differ in exactly one place. The board has one word for a
      task nothing has happened to; this projection has three. A queued row with
      no attempt is `consumed` for the roles a run mints and concludes with, and
      `unstarted` for the roles a worker takes. `shipped` needs no equivalent: it
      means landed, and a landed row reads `ready`, which every consumer of this
      key already accepts alongside it (`_phase_progress`, the document signals).

      Fallback stays wholesale, never key by key. A record carrying no contract
      falls back to the files entirely, because a report assembled from two
      populations compares counts that were never measured over the same tasks.

      **Still owed by phase 3**, and deliberately not attempted here: the costs
      and harness-population blocks, which read the telemetry stream and are the
      place phase 1's `rows_from_events` should be reused; and the
      specification-quality readings, whose landed-window semantics are their own
      reading rather than a source swap. Everything except the task block still
      reads files, which for the corpus and the programme is not a limitation —
      the corpus *is* files.
  - id: A-3
    at: '2026-09-05T00:00:00Z'
    title: >-
      The last two blocks, and the two that stay on files
    md: |-
      **Landed, and phase 3 with it.** The attempt-counting blocks — costs, gate
      health, the character calibration and the harness populations — take rows
      rather than a path, and `context_report` renders those rows once from
      whichever carrier was selected. That deleted four copies of the same parse
      loop, which is the shape §5.2 predicted: S-0044/A-4 made the row a rendering of
      the payload, so nothing had to be re-derived, only re-sourced. The
      divergence half moved the same way and reuses the engine's own `entry_of`
      — the worktree's `log.yaml` is a projection of those events (S-0044/A-3), so the
      reader that folds the events and the one that parses the file it wrote
      cannot disagree about what an entry is.

      **Two blocks stay on files, and not for now — by shape.** The findings
      ledger reports each finding's severity *and its claim*, and the record
      carries a claim only for a blocker (`blocker.raised`); rendering it from
      the record would silently drop the text an operator triages by. Operator
      feedback — human minutes, rework — has no event kind at all. Moving either
      is a change to §5.2's vocabulary rather than a change of source, and this
      document's scope says it does not touch what the engine records.

      **Added: `sources`.** The envelope names which carrier answered each block
      and how many attempt rows it had. This is S-0050/D-3's one deliberate
      exception, and it exists because of what the live comparison showed: the
      record holds 10 attempt rows where the files hold 636, 1 proposal where the
      files hold 225, and `$10.62` of spend against `$242.87`. Every one of those
      numbers is correct about the record and wrong about the repository, and
      nothing in the report distinguished the two. S-0050/D-2 keeps selection at the
      call site; this makes the consequence of the selection readable. The text
      and markdown renderers print it above the first count, because the reader
      who needs it most is a planning session that will otherwise quote the
      figure.

      That leaves S-0050/D-6 answered in the narrow case that actually arose: a
      report over a partial record says so, in a line, rather than merging
      carriers or refusing.

      *Archived 2026-09-09: superseded by 0055 (S-0053 S-0053/D-8).*
