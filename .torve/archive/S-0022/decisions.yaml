# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      The report never edits a decision table, proposes no text, and invokes no model;
      its output is evidence for a human writing an amendment
    paths: [src/torve/application/specquality.py, src/torve/cli/rfc.py]
    consequence: >-
      An engine that regrades its own decisions is an engine deciding what work exists
      (S-0001/D-10)
  - id: D-2
    grade: LOCKED
    text: >-
      Grades are compared as copied onto the contract at mint time, never as they
      stand in the table today
    paths: [src/torve/application/specquality.py]
    consequence: >-
      A reader that resolves grades at read time rewrites the past, which is the defect
      the log format exists to prevent
  - id: D-3
    grade: ASSUMED
    text: >-
      No single corpus score is computed or displayed; the output is populations with
      a named reading and a printed denominator
    paths: [src/torve/application/specquality.py, src/torve/cli/rfc.py]
    consequence: >-
      Charter §8a refuses thresholds for an internal tool, and a scalar becomes one
      by being watched
  - id: D-4
    grade: ASSUMED
    text: >-
      A decision inherited by tasks that touched its declared paths but cited by no
      log entry is reported as decoration-or-paths-defect, naming both causes. Amended
      by S-0022/A-4 2026-08-29: "touched" is scope.allow intersecting the row's declared
      paths, both as denormalised at mint time; the reading applies to LOCKED rows
      only — ASSUMED and OPEN rows print raw counts with no reading
    paths: [src/torve/application/specquality.py]
    consequence: >-
      The reading is only possible because Paths (S-0001/D-32) and the silence check
      exist; conflating the two causes would delete correct rows
  - id: D-5
    grade: ASSUMED
    text: >-
      Storage stays at S-0004/telemetry-staged stage 1: a plain reader over JSONL
      and YAML, no new dependency, written so that moving to stage 2 is a change of
      reader. Amended by S-0022/A-1 2026-08-31: one textual exception — `TaskFacts.landed`
      reads git's own landing trailer (S-0010/D-4) via a single batched `git log`
      call, because landedness is the one fact that must survive a reap sweep of the
      run-state file; every other reader in this module stays YAML/JSONL-only
    paths: [src/torve/application/specquality.py]
    consequence: >-
      §6's own move-on condition — window functions or joins — is not met at this
      volume, and an unused extra is a dependency with no evidence behind it
  - id: D-6
    grade: ASSUMED
    text: >-
      The surface is `torve rfc health`, a subcommand of the existing corpus verb,
      plus one section of the `torve context` projection. Amended by S-0022/A-4 2026-08-29:
      a decision whose paths span more than one phase's scope splits into per-surface
      rows at authoring — this row's paths contradicted T-0099's minted scope
    paths: [src/torve/cli/rfc.py, src/torve/application/projections.py]
    consequence: >-
      One subject, one front door; the context section is the consumer that justifies
      computing the report
  - id: D-7
    grade: LOCKED
    text: >-
      S-0004/measurement-defects-to-fix-before-trusting-a-number's quasi-experiment
      caveat is printed with the report, not paraphrased in documentation. Amended
      by S-0022/A-4 2026-08-29: printed without its corpus coordinate (a report reader
      has no corpus to resolve); when a third surface needs the string its canonical
      home is `torve.base`, importable from both layers
    paths: [src/torve/cli/rfc.py, src/torve/application/projections.py]
    consequence: >-
      The first attractive number becomes a promise to someone unless its limits arrive
      attached to it
  - id: D-8
    grade: ASSUMED
    text: >-
      Readings are suppressed below a printed floor of observations; ratios always
      print their denominator
    paths: [src/torve/application/specquality.py]
    consequence: >-
      A majority over three tasks is noise wearing a percentage
  - id: D-9
    grade: ASSUMED
    text: >-
      Tasks without an `rfc` join at the decision level and are reported as their
      own population, never merged into a document's numbers
    paths: [src/torve/application/specquality.py]
    consequence: >-
      Adopted intake work and hand-minted contracts have no document to indict, and
      mixing them would indict one anyway
  - id: D-11
    grade: ASSUMED
    text: >-
      Dispatch prints the envelope: expected attempts, cost and wall minutes for the
      task's size class, computed from this document's join over telemetry, denominator
      and caveat printed, silent below the floor
    paths: [src/torve/application/specquality.py, src/torve/cli/run.py]
    consequence: >-
      The operator's real question at dispatch is "how long and how much before I
      should worry"; the data answering it already exists here and an envelope with
      a printed denominator cannot become a promise
  - id: D-10
    grade: OPEN
    text: >-
      Whether an abandoned task's entries weigh the same as a landed task's; execution
      reports both and logs which the data supports
    paths: [src/torve/application/specquality.py]
    consequence: >-
      Departures on work that never landed are evidence of a different kind, and guessing
      the answer here would bake it in before anyone has seen the distribution
  - id: D-12
    grade: ASSUMED
    text: >-
      The corpus summary and the context section print the operator-attention line:
      landed changes in the window and the operator interventions behind them — feedback
      minutes, command and approval events, escalations triaged — computed from records
      already written, denominators printed, suppressed below the floor. Added by
      amendment S-0022/A-5 2026-08-31
    paths:
      - src/torve/application/specquality.py
      - src/torve/application/projections.py
    consequence: >-
      The engine's cost claim is human attention per landed change; a line computed
      from existing records with its denominator printed cannot become a promise,
      and without it the claim rests on anecdote
