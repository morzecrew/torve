# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-08-21'
    title: >-
      document conventions (adds S-0016/D-9 – S-0016/D-18)
    md: |-
      **Found in repository review.** `rfcs/` held three kinds of document with nothing expressing the difference: decision-bearing designs, executed procedures, and a hand-maintained index that had already drifted.

      **The sorting rule (S-0016/D-9):** a document with a table of graded decisions is an RFC and gets a number; published documentation goes to `pages/` — written independently for users, versioned with releases, consistent with the corpus but not derived from it; one-off procedures go to `ops/` and are deleted once executed. By this rule the migrations, CLI-contract and configuration-layout documents were promoted to RFCs 0011–0013 (their decision identifiers renumbered to `D-11.*`/`D-12.*`/`D-13.*` while nothing referenced them), and the skill-specialisation guide moved to `ops/`.

      **Structure (S-0016/D-13, S-0016/D-14, S-0016/D-17):** structured facts — id, status, dependencies, amendments, owner — live in YAML frontmatter; decision tables stay in markdown, hard-validated by `rfc_index.py`; `INDEX.md` is generated from frontmatter and CI-checked like a lockfile.

      **Amendments (S-0016/D-16):** each amendment lives in the `## Amendments` section of its primary target with globally-unique numbering; the standalone `AMENDMENTS.md` file was dispersed into targets (A-1/A-4/A-5/A-7 → the charter, S-0002/A-1 → S-0002, S-0009/A-1 → S-0009, S-0003/A-1 → S-0003) and deleted.

      **Logs (S-0001/D-36):** a task log pins `repo` and `base_sha`, so `path:line` evidence resolves six months later to the text the agent actually saw — self-contained means complete relative to a commit, not independent of the repository.

      **Executed 2026-08-21:** dev-era task logs were deleted after their divergences were promoted into decision tables, and the discovery-phase history was collapsed to a single commit.

      *Note 2026-08-21 — documentation is not derived.* S-0016/D-10 was reworded from "links to decisions and never restates them" to state what it always meant: a page must not contradict an accepted decision and must not restate rationale that belongs under a number. Documentation and the corpus answer different questions ("how do I use this" against "why was this decided"), are read by different people, and move on different axes — pages are versioned with releases and carry no history, while RFCs accumulate amendments and delete nothing (new row S-0016/D-12). The relationship is **consistency, not derivation**: a constraint, not a generation mechanism. The derived-like-`INDEX.md` analogy was misapplied to `pages/`; the index itself stays generated (S-0016/D-17). Where reasoning would genuinely help a reader, a page links to the RFC rather than summarising it.
  - id: A-2
    at: '2026-08-22'
    title: >-
      implementation status (amends the document conventions)
    md: |-
      **Found in use.** `status` describes the document's acceptance and nothing describes the work. In particular there was no way to say "accepted, decisions inherited, implementation deliberately dropped" — the options were to misuse `superseded`, which claims a replacement exists, or to leave `accepted` indefinitely, which says nothing.

      **Changed:** frontmatter gains `implementation: none | partial | complete | abandoned`. It is a judgement, on the same footing as `status` — `complete` and `abandoned` are human assertions no count of merged tasks can produce. Backfilled across the corpus at adoption, honestly rather than uniformly.

      **Deliberately not changed:** no progress field, and no `in_progress` value. Execution progress is derived from task state and belongs to the store under S-0001/A-2; a frontmatter copy would diverge the first time a task escalated. Progress is projected per phase by `torve context` and is never committed — and never enters `INDEX.md` (S-0016/D-22).

      **Also edits:** S-0007/torve-context (the projection), 0007 decisions D-7.15/D-7.16.
  - id: A-3
    at: '2026-08-22'
    title: >-
      what the frontmatter edges mean (adds S-0016/D-19, S-0016/D-20)
    md: |-
      **Found in planning design.** Within a single RFC the graph is handled; between RFCs, `depends_on`, `informed_by` and `supersedes` were read only by `rfc_index.py` for link validation. Nothing said what the edges *constrain*.

      **The correction that shapes it:** a dependency between RFCs is not a dependency between tasks. `depends_on` constrains *planning readiness* — a document cannot be planned until its dependencies are `accepted`, because its decision table inherits their rows and grades are copied at mint time (S-0016/D-15). Shipping order is carried by a phasing table, not by the graph. `informed_by` constrains nothing: it tells a reader what to read first, and making it checkable would turn a reading hint into a blocker.

      **A document may not inherit decisions from one that is not `accepted` (S-0016/D-20).** A grade copied from a draft is a grade that may change under an executor.

      **Known violation at adoption:** S-0009 (`accepted`) depends on S-0004 (`draft`) — surfaced by this rule, resolution pending review.

      **Also edits:** S-0007/admission–§3.3 and decisions S-0007/D-7–S-0007/D-11.
  - id: A-4
    at: '2026-08-22'
    title: >-
      the index carries the whole frontmatter (amends S-0016/D-22)
    md: |-
      **Found in use.** S-0016/A-2 added `implementation` and nothing surfaced it. S-0016/D-22 read as a general instruction to keep the index minimal, which was an overreach: the actual concern was store dependence, since a store-derived column would make a committed, CI-checked file depend on a database, and a flaking `--check` is one people learn to re-run rather than read. *(The source patch numbered this S-0001/A-5; that was taken, so it lands as S-0016/A-4 per S-0016/D-16.)*

      **Changed:** the rule is now that the index carries everything from the frontmatter and nothing from outside it. `implementation` and `kind` join the generated columns, alongside status, dependencies and amendment identifiers — the `Amends` column is a list of identifiers, never a summary, because the moment the index describes what an amendment changed it becomes a second, staler account. Rows are grouped by `kind`, with documents that are accepted but abandoned separated into their own section — that pairing is the most hazardous in the corpus (decisions still inherited, no implementation ever coming) and two adjacent columns in a flat table are easy to miss. `informed_by` stays out: it constrains nothing (S-0007/D-9).

      **Unchanged:** no store-derived data in the index. Progress remains a projection in `torve context` and is never committed. `--check` stays deterministic, which was the whole point of the original restriction.
  - id: A-5
    at: '2026-08-22'
    title: >-
      corpus location, numbering, and contents (amends the document conventions)
    md: |-
      **Found in use.** Three things were unstated: where the corpus lives when it is not `rfcs/`, how the next number is chosen, and what may sit in the directory. The last one had already caused one clean-up. *(The source patch numbered this S-0003/A-2; that was taken, so it lands as S-0016/A-5 per S-0016/D-16.)*

      **Changed:**

      - One configurable path, `rfcs.path`, defaulting to `rfcs/`. One path only — two roots mean two counters and a colliding number at the first merge. Specifications that genuinely need two locations are two corpora with two `.torve/` configurations.
      - The next number is derived as the maximum plus one. **No counter file:** a counter is state, two branches diverge it, and resolving that conflict gives two documents the same number. A parallel-creation race instead surfaces as a duplicate-`id` failure at merge, which is loud rather than silent. Resolving that collision means renaming the document merging second, before anything references it — S-0016/D-15 makes identifiers permanent *once a document is on the main branch*, not from the moment of creation, and this is the case that distinction exists for.
      - Only `NNNN-slug.md` and `INDEX.md` may live in the directory, with no subdirectories. The check's message routes the offending file to `pages/` or `ops/` rather than only refusing it — without routing, the file lands in the repository root and the mess has simply moved. The check belongs to `torve rfc check`, not `torve doctor`: `doctor` is about environment readiness, this is about corpus correctness. Two companion checks: the filename's numeric prefix must match `id` (slug loosely against `title`), and a filename is not renamed once the document is on the main branch.
      - **Documents are never deleted.** They leave service via `superseded` or `implementation: abandoned`. Identifiers are cited by amendments, divergence logs and commit trailers, and a reused number silently redirects all of them. Gaps are acceptable; reuse is not — a new document created in a numbering hole is refused.

      **Rejected:** checksums in the index. Git already guarantees content, and `--check` compares the rendering itself, which is strictly stronger and says what diverged rather than only that something did. It also protects against nothing that is left over, and puts a meaningless changed line in every diff.

      **Also edits:** 0013 (S-0013/A-1).
  - id: A-6
    at: '2026-08-22'
    title: >-
      how an identifier retires (adds S-0016/D-1, amends §3, §4)
    md: |-
      **Found by the citation-resolution check on its first day.** 0005 retired S-0005/D-5 the correct way for readers — row removed, prose tombstone — and the checker flagged the tombstone's own citation as unresolvable, because nothing structured recorded that the identifier had ever existed. The alternative, keeping retired rows in the table marked dead, was rejected: the table is the surface executors inherit from, and rows existing only to say "don't use me" are noise exactly where density matters most.

      **Changed:** frontmatter gains an optional `retired:` list — the identifiers this document once defined, since removed. Three consequences, all checked:

      - A retired identifier **resolves**: the citation check treats it as defined, so a tombstone reads clean — which lets unresolvable citations harden from warning to problem, the form in which the check actually catches typos.
      - A retired identifier is **never redefined**: a decision table anywhere in the corpus claiming an id from any `retired:` list is a problem (S-0016/D-26 made checkable for the retired case).
      - The retirement itself stays prose — the tombstone says *why* the row went; the frontmatter says only *that* it did (S-0016/D-13's split, applied to endings).

      Retirement should stay rare: one identifier in sixteen documents so far. The list scales at a line per id, not a row per corpse.
  - id: A-7
    at: '2026-08-27'
    title: >-
      `ops/` and `pages/` are conventions, not standing directories (amends S-0016/D-9,
      S-0016/D-10, S-0016/D-12)
    md: |-
      **Found when both directories emptied on the same day.** `ops/skill-specialisation.md` was executed on 2026-08-21 and, per S-0016/D-11, should have been deleted then; it was not, and it had since gone stale, citing a module path that had moved and a document that no longer exists. `pages/README.md` was a fifty-four-line restatement of this document's §2 and §3 governing a directory whose own last line said it was empty until the first user-facing page existed.

      **Deleting both left three `LOCKED` rows citing globs that match nothing,** which `torve rfc check` correctly reported as rot (S-0001/D-32): an implemented RFC cites real areas.

      **Changed:** the Paths cells of S-0016/D-9, S-0016/D-10 and S-0016/D-12 cite where the rule is *enforced* — `rfcs/**` and the validator — rather than the destinations it routes to. The decisions themselves are unchanged and still stand: a graded decision table makes an RFC, documentation goes to `pages/`, procedures go to `ops/` and are deleted once executed.

      **A directory is created when it has something in it.** A Paths cell names a governed area for the silence check; a decision about where files will go, when no such files exist, governs nothing, and pinning an empty directory open with a placeholder to satisfy a glob is the scaffolding this document's own §2 argues against. The routing message in the corpus check (S-0016/D-25) still names both destinations, which is where the convention is visible to whoever trips over it.
  - id: A-8
    at: '2026-09-09'
    title: the archive is where a retired document goes
    changes:
      - subject: D-25
        field: text
        before: >-
          Only `NNNN-slug.md` and `INDEX.md` in the corpus directory, no subdirectories;
          the check routes offenders to `pages/` or `ops/`. Added by amendment S-0016/A-5
          2026-08-22
        after: >-
          Only `NNNN-slug.md` and `INDEX.md` in the corpus directory, no subdirectories;
          the check routes offenders to `pages/` or `ops/`. A retired document's one
          legal destination is `archive/rfcs/` beside the corpus path, keeping its
          filename and identifiers, written only by `torve rfc archive` (S-0053 S-0053/D-8).
          Added by amendment S-0016/A-5 2026-08-22; amended by S-0016/A-8 2026-09-09
      - subject: D-25
        field: fingerprint
        after: b3e0b83d1881d805/bcecc04abf43a1cb
    md: |-
      **By S-0053 phase 3.** S-0016/D-25 admitted nothing in the corpus directory
      but documents and the index, and had no answer for a document that no
      longer stands except leaving it in place. S-0053 S-0053/D-8 gives a retired
      document one destination — `archive/rfcs/` beside the corpus path, the
      same filename, every identifier kept, `status: superseded` — reached only
      through `torve rfc archive`, whose transaction refuses the move unless
      the corpus without the document checks clean. The corpus directory rule
      is unchanged; the archive is outside it.
      ```yaml changes
      - subject: "S-0016/D-25"
        field: "text"
        before: "Only `NNNN-slug.md` and `INDEX.md` in the corpus directory, no subdirectories; the check routes offenders to `pages/` or `ops/`. Added by amendment S-0016/A-5 2026-08-22"
        after: "Only `NNNN-slug.md` and `INDEX.md` in the corpus directory, no subdirectories; the check routes offenders to `pages/` or `ops/`. A retired document's one legal destination is `archive/rfcs/` beside the corpus path, keeping its filename and identifiers, written only by `torve rfc archive` (S-0053 S-0053/D-8). Added by amendment S-0016/A-5 2026-08-22; amended by S-0016/A-8 2026-09-09"
      - subject: "S-0016/D-25"
        field: "fingerprint"
        before: null
        after: "b3e0b83d1881d805/bcecc04abf43a1cb"
