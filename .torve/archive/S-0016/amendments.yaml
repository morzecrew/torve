  - id: A-9
    at: '2026-09-09'
    title: moved is not deleted
    changes:
      - subject: D-26
        field: text
        before: >-
          Documents are never deleted; identifiers are never reused; gaps are acceptable.
          Added by amendment S-0016/A-5 2026-08-22
        after: >-
          Documents are never deleted; identifiers are never reused; gaps are acceptable.
          A document moved into the archive is not deleted: every identifier it defines
          still resolves through `show`, the check and the record (S-0053 S-0053/D-9).
          Added by amendment S-0016/A-5 2026-08-22; amended by S-0016/A-9 2026-09-09
      - subject: D-26
        field: fingerprint
        after: b3c7cde278428747/a0d73f2ad31523c3
    md: |-
      **By S-0053 phase 3.** "Never deleted" was written when the only way a
      document could leave was `git rm`. A document moved into the archive is
      not deleted: the check resolves what it defines (S-0053/A-1), `show` answers
      its identifiers marked archived, and the record holds every row as
      retired with the archive named as the reason (S-0053/D-9). The row's second
      sentence says so; the rule it protects — that a cited identifier always
      resolves — is the one that made the archive necessary rather than a
      `git rm`.
      ```yaml changes
      - subject: "S-0016/D-26"
        field: "text"
        before: "Documents are never deleted; identifiers are never reused; gaps are acceptable. Added by amendment S-0016/A-5 2026-08-22"
        after: "Documents are never deleted; identifiers are never reused; gaps are acceptable. A document moved into the archive is not deleted: every identifier it defines still resolves through `show`, the check and the record (S-0053 S-0053/D-9). Added by amendment S-0016/A-5 2026-08-22; amended by S-0016/A-9 2026-09-09"
      - subject: "S-0016/D-26"
        field: "fingerprint"
        before: null
        after: "b3c7cde278428747/a0d73f2ad31523c3"
      ```
  - id: A-10
    at: '2026-09-09'
    title: the next number counts the archive
    changes:
      - subject: D-24
        field: text
        before: >-
          The next number is derived as the maximum plus one, never stored in a counter
          file. Added by amendment S-0016/A-5 2026-08-22
        after: >-
          The next number is derived as the maximum plus one over the corpus path
          and the archive together, never stored in a counter file (S-0053 S-0053/D-10).
          Added by amendment S-0016/A-5 2026-08-22; amended by S-0016/A-10 2026-09-09
      - subject: D-24
        field: fingerprint
        after: 67ad88677aa44b9a/71ed077d6d777502
    md: |-
      **By S-0053 phase 3.** A number retired into the archive is still a
      number that was cited, so the maximum the next one derives from runs
      over the corpus path and the archive together (S-0053/D-10). `torve rfc new`
      reads the loader's derivation; a gap left by an archived document stays a
      gap.
      ```yaml changes
