# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-10-16T13:53:51Z'
    title: >-
      Each phase owns the tests paired with the modules it allows
    md: >-
      Planning refused five contracts on the T-0113 rule: a phase that allows a module
      must allow its existing tests. Phase 2 now owns `tests/test_lane_prevention.py`,
      phase 4 `tests/test_globs.py`, phase 6 `tests/test_review_corpus.py` and `tests/test_review_role.py`,
      and phase 7 `tests/test_manager_e2e.py`; phases 2, 4 and 6 run them in their
      acceptance. Phase 7's test needs Docker and the lab store, so phases 1 and 7
      name the host-side run the operator owes before the pull request merges.
  - id: A-2
    at: '2026-10-17T21:10:19Z'
    title: >-
      the image stamp is the release setuptools-scm renders
    changes:
      - subject: D-4
        field: text
        before: >-
          `just images` stamps every image with the version of the tree it builds,
          through `SETUPTOOLS_SCM_PRETEND_VERSION` from `git describe`; `torve doctor`
          runs each seat image's `torve --version` and goes red when it differs from
          the host's.
        after: >-
          `just images` stamps every image with the version setuptools-scm renders
          for the tree it builds, the number hatch-vcs gives the host's torve, through
          `SETUPTOOLS_SCM_PRETEND_VERSION`; `torve doctor` runs each seat image's
          `torve --version` and goes red when it differs from the host's.
      - subject: D-4
        field: fingerprint
        after: 228c3324f6271a9e/ff49045d274cbe9b
    md: >-
      T-0605 found that rendering `git describe` by hand disagrees with hatch-vcs,
      which numbers a build after a tag as the next release's dev version, so the
      doctor's exact comparison would flag every image built between two tags. The
      justfile renders the stamp with setuptools-scm, the library hatch-vcs runs,
      so image and host get the same number for the same tree; `torve --version` was
      not taken, because it reads the `_version.py` the last sync wrote. The row now
      says so.
  - id: A-3
    at: '2026-10-26T21:58:08Z'
    title: >-
      torve pins forze 0.16.2, and the release bakes the images
    changes:
      - subject: D-1
        field: text
        before: >-
          torve pins `forze==0.13.0`, in its dependencies, its extras and `migrations/substrate/FORZE_VERSION`,
          and rebuilds its seat images in the same change.
        after: >-
          torve pins `forze==0.16.2`, in its dependencies, its extras and `migrations/substrate/FORZE_VERSION`,
          and the release that ships the bump bakes its seat images (S-0112/D-1).
      - subject: D-1
        field: fingerprint
        after: cce8ca15252ea42c/558a26a8d48eb9ed
    md: >-
      #200 moved the pin to 0.16.2. forze's durable run store reads and writes the
      same columns in 0.13.0 and 0.16.2, its schema reference names no migration since
      0.6.0, and none of the breaking entries from 0.14.0 to 0.16.2 reaches what torve
      uses, so no substrate migration came with it. The seat images were not rebuilt
      in that change: since S-0112/D-1 every release bakes and publishes them, so
      0.7.0's images carry the bump. The row now says both.
