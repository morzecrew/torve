  - decision: unlisted
    grade: UNLISTED
    class: spec-gap
    at: '2026-10-17T17:12:34Z'
    attempt: 2
    claim: >-
      S-0110/D-4 names `git describe` as the source of the version stamped onto every
      image but not how that version is rendered. `git describe --tags --always` prints
      `v0.3.2-5-gabc1234` off a tag and a bare hash with no tags — neither is PEP
      440, which hatch-vcs refuses, and neither can ever equal the host's `torve --version`,
      so the doctor check this task adds would be permanently red. Rendering the source
      to PEP 440 is a decision the decision table did not settle.
    evidence: >-
      justfile:82 — the stamp is rendered `--match 'v*'` plus `X.Y.Z.devN+gHASH`,
      falling back to bare `torve --version`; the review thread T-0612 raised the
      non-PEP-440 string
    action: decided
    proposal: >-
      D-4 should say the stamp is rendered to PEP 440 before it is pretended — `git
      describe --tags --match 'v*'` with the off-tag form converted to `X.Y.Z.devN+gHASH`,
      or the host's own `torve --version` — so the pretended version is always valid
      and always equals the host's, and the doctor check cannot be red on a correctly
      built image.
