  - decision: D-4
    grade: ASSUMED
    kind: departed
    at: '2026-10-17T18:25:12Z'
    attempt: 4
    claim: >-
      S-0110/D-4 says the stamp comes 'from `git describe`'. Rendering that output
      by hand disagrees with the tool that renders it for the host: hatch-vcs's guess-next-dev
      turns `v0.3.2-5-gabc1234` into `0.3.3.dev5+gabc1234`, while the review's `sed`
      produced `0.3.2.dev5+gabc1234` — a string doctor's exact comparison flags as
      a different torve, and one that PEP 440 orders below the tag it follows. The
      stamp is now the host's own `torve --version`, which is the string doctor compares
      against by construction.
    evidence: >-
      justfile:83 — the stamp is `uv run torve --version`, the host's own release,
      no rendering of `git describe` beside it; hatch-vcs derives the host's string
    action: departed
    proposal: >-
      D-4 should say the stamp is the host's own `torve --version`, handed to bake
      as VERSION and pretended through SETUPTOOLS_SCM_PRETEND_VERSION, rather than
      a version rendered from `git describe`.
