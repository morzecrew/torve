# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: torve runs on forze 0.13.0
    intent: >-
      Pin `forze==0.13.0` in the dependencies, the `postgres` extra, the dev group
      and `migrations/substrate/FORZE_VERSION`, and relock. Before the change lands,
      the operator runs the store's tests on the host, which a sandbox cannot (S-0071/D-5):
      `just pg-up`, `just migrate`, then `uv run pytest tests/test_postgres_integration.py
      tests/test_manager_e2e.py` with `TORVE_PG_DSN` naming the lab store. The seat
      images are rebuilt in the same change. Settles D-1.
    scope:
      - pyproject.toml
      - uv.lock
      - migrations/substrate/FORZE_VERSION
      - tests/test_migrate.py
    acceptance:
      - >-
        uv run pytest tests/test_migrate.py tests/test_taskstore.py tests/test_dst.py
      - uv run mypy src
    character: routine
  - phase: 2
    title: >-
      No git command torve runs runs a repository's hook
    intent: >-
      Every git subprocess the adapters and the lane start carries `-c core.hooksPath=/dev/null`.
      Tests: in a repository whose installed pre-commit, post-commit, post-checkout,
      post-rewrite and pre-push hooks write a marker, `commit_all`, the lane's rebase,
      a worktree checkout and a push to a local bare remote leave no marker. Settles
      D-7.
    scope:
      - src/torve/adapters/vcs/**
      - src/torve/adapters/workspace/**
      - src/torve/application/lane.py
      - tests/test_provenance.py
      - tests/test_lane.py
      - tests/test_lane_prevention.py
      - tests/test_runner.py
    acceptance:
      - >-
        uv run pytest tests/test_provenance.py tests/test_lane.py tests/test_lane_prevention.py
        tests/test_runner.py
      - uv run mypy src
    character: routine
  - phase: 3
    title: >-
      A repository names the torve it needs, and the image says which it carries
    intent: >-
      Add `engine` to the runner configuration with its refusal, regenerate the schemas,
      stamp the image's version from `bake.hcl`, add the doctor's image version check,
      and install CPython 3.13 and 3.14 in the base image. Tests: the range and its
      refusal (`tests/test_runconfig.py`, `tests/test_versions.py`); the bake file
      passes the version and the base image installs both interpreters (`tests/test_sandbox_defs.py`);
      the doctor's check against a fake image runner (`tests/test_doctor.py`). Settles
      D-2, D-4 and D-5.
    scope:
      - src/torve/config/runconfig.py
      - src/torve/cli/doctor.py
      - .torve/schemas/**
      - bake.hcl
      - justfile
      - sandboxes/base/Dockerfile
      - tests/test_runconfig.py
      - tests/test_versions.py
      - tests/test_doctor.py
      - tests/test_sandbox_defs.py
    acceptance:
      - >-
        uv run pytest tests/test_runconfig.py tests/test_versions.py tests/test_doctor.py
        tests/test_sandbox_defs.py
      - uv run mypy src
    character: structural
  - phase: 4
    title: The hooks ship in the package
    intent: >-
      Move `.torve/agents/hooks/implement/` to `skills/hooks/implement/`; torve's
      implement profile and the starter implement profile equip `torve:hooks/implement`;
      the load-time hook check covers `torve:` items; the hooks and the stub call
      bare `torve`. The same change amends the paths of S-0072/D-1, S-0072/D-2 and
      S-0077/D-3 to the new directory (`torve spec amend`), as the owner agreed (Q-1).
      Tests: a `torve:hooks/implement` item materializes the hooks and `claude/settings.json`;
      the starter profile equips it; the shipped `globs.py` stays byte-identical with
      `src/torve/base/globs.py`; the stub calls bare `torve`. Settles D-3 and D-6.
    scope:
      - skills/hooks/**
      - .torve/agents/**
      - .torve/specs/S-0072/**
      - .torve/specs/S-0077/**
      - .torve/specs/S-0104/**
      - .torve/specs/S-0105/**
      - src/torve/cli/init.py
      - src/torve/config/agents.py
      - tests/test_equipment.py
      - tests/test_agents.py
      - tests/test_globs.py
      - tests/test_skills.py
      - tests/test_cli.py
    acceptance:
      - >-
        uv run pytest tests/test_equipment.py tests/test_agents.py tests/test_globs.py
        tests/test_skills.py tests/test_cli.py
      - uv run mypy src
      - uv run torve spec check
    character: structural
  - phase: 5
    title: '`gates.yaml` declares the layout'
    intent: >-
      Add `layout.root` and `layout.carried` to the gates manifest and its schema.
      The source-layout gate, the citation scan, the spec-quality frontier, the coverage
      fallback prefix and the `tests` defaults read `layout.root`; the sizer's callers
      pass `layout.carried`; a wildcard first segment names no module. The same change
      amends S-0057/D-9's text to the layout's source root, as the owner agreed (Q-2).
      Tests: with no `layout` every site reads what it reads today; with `root: app`
      each reads `app/src` or `app/tests`; with `carried: [db]` a scope over `app/src/**`
      and `db/migrations/**` counts one module; `**/x.py` counts none; the source-layout
      twin still fails. Settles D-8 and D-9.
    scope:
      - src/torve/config/manifest.py
      - src/torve/gates/source_layout.py
      - src/torve/config/spec.py
      - src/torve/application/specquality.py
      - src/torve/application/sizing.py
      - src/torve/application/planner.py
      - src/torve/application/intake.py
      - src/torve/cli/**
      - .torve/schemas/**
      - .torve/specs/S-0057/**
      - tests/**
    acceptance:
      - >-
        uv run pytest tests/test_manifest.py tests/test_gates.py tests/test_sabotage.py
        tests/test_spec.py tests/test_specquality.py tests/test_sizing.py tests/test_intake.py
      - uv run mypy src
      - uv run torve spec check
    depends_on:
      - 3
    character: structural
  - phase: 6
    title: >-
      Coverage, lock elision and test exclusion read the configuration
    intent: >-
      The coverage prefix comes from Cobertura's `<sources>`; the reviewer elides
      the rider files `scope.derived` names beside `uv.lock` and `src/torve/_web/`;
      the context pack excludes what `tests.patterns` names. Tests: a nested coverage
      report, a nested lock and a nested test tree (`tests/test_contextpack.py`, `tests/test_review_run.py`).
      Settles D-10.
    scope:
      - src/torve/application/contextpack.py
      - src/torve/application/review.py
      - tests/test_contextpack.py
      - tests/test_review_run.py
      - tests/test_review_corpus.py
      - tests/test_review_role.py
    acceptance:
      - >-
        uv run pytest tests/test_contextpack.py tests/test_review_run.py tests/test_review_corpus.py
        tests/test_review_role.py
      - uv run mypy src
    depends_on:
      - 5
    character: routine
  - phase: 7
    title: >-
      The operator learns to adopt and to upgrade, and waits on a night with one verb
    intent: >-
      Add `torve manager board --until-change`; write `skills/torve/references/upgrading.md`;
      rewrite `adopting.md` for a tool install, `engine`, a nested layout, the shipped
      hooks and hooks moved to CI; add the late-thread note and `gh pr checks --watch`
      to `review.md` and the archive note to `SKILL.md`; restate the upgrade in `stability.md`
      and the README. Tests: the board verb exits on a change and on the night's close
      (`tests/test_manager.py`); the skill names only verbs that exist (`tests/test_skills.py`,
      `tests/test_docs.py`). `tests/test_manager_e2e.py` is in scope as `manager.py`'s
      paired test; it needs Docker and the lab store, so the operator runs it on the
      host before the document's pull request merges, as phase 1 does. Settles D-11,
      D-12 and D-13.
    scope:
      - src/torve/cli/manager.py
      - skills/torve/**
      - pages/docs/**
      - README.md
      - tests/test_manager.py
      - tests/test_manager_e2e.py
      - tests/test_skills.py
      - tests/test_docs.py
    acceptance:
      - >-
        uv run pytest tests/test_manager.py tests/test_skills.py tests/test_docs.py
      - uv run mypy src
    depends_on:
      - 2
      - 3
      - 4
      - 5
    character: routine
