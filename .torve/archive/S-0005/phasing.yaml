# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: The finding and the role's mechanics
    intent: >-
      Findings become a domain type and the review role becomes real in the contract:
      Task gains targets, a review task refuses acceptance commands by validation,
      the acceptance gate is skipped for the role rather than passed with an empty
      list, and evidence location becomes a check that discards findings citing coordinates
      nothing can resolve.
    scope: [src/torve/domain/**, src/torve/gates/**, tests/**]
    acceptance:
      - uv run ruff check src tests
      - uv run mypy src
      - uv run basedpyright src
      - uv run pytest
      - uv run lint-imports
      - uv run torve rfc check
  - phase: 2
    title: The review run
    intent: >-
      Review runs through the pipeline: input assembled from the diff, the target's
      contract, inherited decisions and gate results — never the author's trace; the
      workspace mounts read-only and the reviewer holds no credential beyond its tier's;
      findings parse from the agent's output, unlocatable evidence is discarded before
      anyone sees it, a surviving blocker escalates the target as blocker_finding
      and everything else is recorded on the attempt; the runner mints and drives
      the review task when its target's gates go green, replacing the review-not-configured
      bridge — off by default in configuration.
    scope:
      - src/torve/application/**
      - src/torve/adapters/**
      - src/torve/config/**
      - tests/**
    acceptance:
      - uv run ruff check src tests
      - uv run mypy src
      - uv run basedpyright src
      - uv run pytest
      - uv run lint-imports
      - uv run torve rfc check
    depends_on:
      - 1
  - phase: 3
    title: Degraded mode and the seeded corpus
    intent: >-
      Reviews without a contract run in degraded mode and are told so explicitly,
      so no specification is invented; the seeded-defect corpus becomes a repository
      artefact under .torve/review-corpus/ with a command that replays every case
      through the reviewer tier and reports which expected findings were caught —
      the regression harness that gates every prompt or model change.
    scope: [src/torve/cli/**, .torve/review-corpus/**, tests/**]
    acceptance:
      - uv run ruff check src tests
      - uv run mypy src
      - uv run basedpyright src
      - uv run pytest
      - uv run lint-imports
      - uv run torve rfc check
    depends_on:
      - 2
