    kind: departed
    class: spec-gap
    at: '2026-09-12T19:28:06Z'
    claim: >-
      D-4 says an attempt record without a base sha is refused at the writer. Implemented
      as: refused when the record names no sha at all — merge_base and head both empty,
      which is the exact shape of the eighteen unjoinable rows in the stream. A repository
      whose base does not resolve (a fresh repo with no origin/main and no main) still
      writes its own head sha, and the contract is readable at that sha, so such a
      row is joinable and is written. Refusing on merge_base alone would refuse real
      attempts that a rate can count.
    evidence: >-
      tests/test_broker.py:908 - the brokered-attempt case drives a worktree built
      by 'git init' with one commit and no origin/main, so resolve_base returns None
      and a merge_base-only refusal escalates a real attempt that is joinable at its
      head sha.
    action: departed
    proposal: >-
      An attempt record that names no sha at all — neither the base sha nor the attempt's
      own head — is refused at the writer, naming both fields.
