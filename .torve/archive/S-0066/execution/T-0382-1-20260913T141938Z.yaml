    claim: >-
      The difference is recorded on the attempt, but nested inside the agent block's
      burn profile rather than beside it. The only generic route from a harness adapter
      onto the agent block is agent_burn, which reads the result's burn attribute;
      every other carrier takes fixed keyword names with non-loose value types, and
      both carriers live in the application layer, outside this task's scope. The
      consequence is a real ceiling in one corner: a stream that named an inventory
      but carried no turn yields no burn profile, so it records no inventory either
      — the same no-stream-no-block regime the counts follow.
    evidence: >-
      src/torve/adapters/agent/harness.py:1105-1112 — the comparison is attached with
      dataclasses.replace onto the burn profile, and only when parse_burn returned
      one
    action: departed
    proposal: >-
      ASSUMED — the inventory difference is its own key on the agent block, which
      needs a carrier in application/telemetry.py; nesting under burn stands until
      then
