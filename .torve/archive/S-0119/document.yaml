# yaml-language-server: $schema=../../schemas/document.json
id: S-0119
title: >-
  Issues become drafts, and a phase sees its callers
kind: design
change:
  type: feat
  scope: intake
status: superseded
implementation: complete
depends_on: [S-0060, S-0104]
informed_by: [S-0055, S-0099]
supersedes: []
superseded_by: S-0121
owner: Lev Litvinov
schema_version: 4
summary: |-
  A labelled issue becomes drafts without a command, and `torve spec check` names the callers a phase's change reaches outside its own scope, so work reaches acceptance without a person typing it and the author sees reach while the phasing is a draft.

  The manager's pass gains an intake leg, off until `intake.issue_label` names a label. An open issue carrying that label, applied by an account with triage or more and not edited since, is filed as a source and handed to the drafting run `torve intake` starts. The drafts wait for `torve adopt` as they always have, and the leg never writes to the forge. Before acceptance, `torve spec check` warns, per phase of an unlanded document, which first-party files outside the phase's scope import what the scope matches (owned by no phase, or by which other phase) and which tests of those files no acceptance command runs. The spec-writer skill tells an authoring session to run each phase's caller search in parallel and to settle those lines before asking for acceptance.
motivation: |-
  Work reaches torve through one person at a terminal. This repository filed 24 issues between 2026-09-15 and 2026-10-31 (#183 to #223), and each became work only when the owner wrote a document or a fix by hand: the record from 2026-09-29 to 2026-10-28 holds 292 implement and 113 review mints and no drafting run. `torve intake` lost its only other caller when the tracker was deleted (09c5e962, S-0008/A-5), because the inbound half shared the tracker's port and poll leg. S-0020/A-1 recorded what that cost: a request arriving from somewhere other than the operator's own shell is "a real capability, not a tidying", and it "returns with whatever surface replaces the tracker".

  The second cost is smaller and comes after acceptance. Of the 28 escalations in this repository's record from 2026-09-29 to 2026-10-28, 16 were review blockers. Four of them name a file outside the phase's own scope that the change reached:

  - two Python callers that another phase of the same document owned. T-0523's thread leg is built in `src/torve/cli/manager.py`, which S-0101's phase 1 owned, and it never received the records the phase's own test passed in. T-0536's review leg kept reading the stream through a re-export, from a file S-0102's phase 2 owned.
  - two managed `AGENTS.md` projections (T-0634, T-0666).

  Four more name a caller or consumer inside the scope that the change left unwired (T-0521, T-0522, T-0524, T-0543). The other eight are logic faults, a missing test and one red battery. Both import misses were minted before S-0104 gave contracts a contingent set, and no import miss has recurred since it landed on 2026-10-13. So the contingent set already lets an executor write the caller. What is missing is earlier: while the phasing is still a draft, nothing tells the author which callers a phase's change reaches and which phase owns them. That search is mechanical and independent per phase, and it is cheapest before acceptance, when an intent can still say "update the caller".
current_state: |-
  - `torve intake` (`src/torve/cli/intake.py`) builds the planner tier's agent, mints the drafting task (`mint_intake_task`), cuts a worktree at base, runs `run_intake` and removes the worktree, all inside the command. `run_intake` (`src/torve/application/intake.py`) loops draft, parse and lint. Green persists drafts awaiting `torve adopt`; a spent budget escalates `budget_exhausted`, which holds the pause like any escalation (`pause_escalations` defaults to 1).
  - `--source` records what asked (S-0060/D-5). `mint_intake_task` refuses an identifier the tree does not hold before a model is called (`resolve_source`), and adoption copies the source onto every contract it mints. A filed source is `.torve/sources/<kind>/<slug>.yaml` (S-0060/D-1); the filed kinds are `incident`, `audit`, `review` and `operator` (`SourceKind` in `src/torve/domain/vocabulary.py`). `adopt` commits the contract files it wrote and nothing else.
  - A pass (`once` in `src/torve/application/residency.py`) runs the relay, lane, threads and standing legs, then reclaims, mints and claims. A paused pass skips the legs that grow the queue. `src/torve/cli/manager.py` and `src/torve/cli/fleet.py` build the legs, and the fleet passes only `standing`. The idle wait between passes is 15 seconds (`IDLE_SECONDS`).
  - The standing leg (`src/torve/application/standing.py`) evaluates `command`, `path-digest` and `flake-threshold` predicates and mints the job's committed body through `adopt`, with no person between (S-0023/D-4). It recognises a condition a person already committed an answer to.
  - `GhScm` (`src/torve/adapters/vcs/git.py`) is the runner's only forge client: pull requests, statuses, review threads and comments, through `gh`, with the credential named by `scm.token_env` or the host's own login. Nothing reads an issue.
  - `contingent_paths` (`src/torve/application/neighbours.py`, S-0104/D-1) derives a phase's one-hop importers, first-party imports, paired tests, `__init__` files and the document's other scopes. The planner stores them as `scope.contingent`, and a write promotes one (S-0104/D-2). That is permission, not instruction: the contract does not say which contingent file has to change, and acceptance runs only the phase's named tests. The two import misses above were minted before S-0104 landed on 2026-10-13 and carried no contingent set. In both, the caller belonged to another phase of the same document, which S-0104's document union now puts in the contingent set. T-0523's caller is a function-local import, which the graph reads. No caller passes the manifest's `scope.derived` map to `contingent_paths`.
  - `torve spec check` adds three warnings from the application layer (`_model_findings` in `src/torve/cli/spec.py`): fingerprint drift, path rot, and the inherited LOCKED rows a phase of an unlanded document touches (`inherited_locks` in `src/torve/application/decisions.py`). None of them reads the import graph.
  - The spec-writer skill (`skills/spec-writer/SKILL.md`, package data under S-0055/D-36) tells the author to "grep for every caller of what it changes" (rule 3b). It says nothing about running that search in parallel or about a check to read afterwards.
goals: |-
  - A labelled issue on the partition's repository becomes lint-green drafts, or an escalation, with no command typed, and nothing dispatches until the owner adopts.
  - Only an issue that an account with triage labelled, and nobody edited since, is read past the listing.
  - A request drafts the same way from the shell and from the pass.
  - Before acceptance, the author sees per phase the importers outside its scope, with the phase that owns each, and the tests of the phase's files that no acceptance runs.
  - An authoring session searches callers per phase in parallel where it can delegate.
non_goals: |-
  - Writing to the forge: no comment, label change or close. The outbound projection and its commands were what the tracker cost (S-0008/A-5). A person reads drafts on the board and adopts them with `torve adopt`.
  - Adopting automatically. A draft never dispatches without a person's adoption (S-0020/D-1).
  - Commands in an issue thread (`/torve adopt`, `/torve revise`). They need the commander list and the thread loop that the tracker carried.
  - Drafting a document from an issue. The drafter writes task contracts, and a request that needs a document still needs a person to write one.
  - Refusing acceptance on a reach line. Whether a caller belongs in a phase is the author's judgement, and a refusal would train authors to pad scopes, which S-0104 removed the need for.
  - Reach through files the import graph cannot see, such as a `justfile` or a managed `AGENTS.md`. That is the manifest's `scope.derived` map and the spec-projection gate.
design:
  - key: the-intake-leg
    md: |-
      The leg is `issue_leg` in a new `src/torve/application/issues.py`, called from the pass after the standing leg and before the mint, and skipped when the pass is paused (D-8). The forge read is a port, so the leg is tested against a fake reader and `GhScm` implements it (D-3).

      ```python
      @dataclass(frozen=True)
      class LabelledIssue:
          number: int
          url: str
          title: str
          body: str
          labelled_by: str | None     # the account behind the last event that applied the label; None when unreadable
          labelled_at: str | None     # that event's instant, YYYY-MM-DDTHH:MM:SSZ; None when unreadable
          edited_at: str | None       # the later of the body's last edit and the last title rename; None when neither
          unreadable: str | None      # why the leg cannot judge it, such as a labelling outside the window; None when readable

      class IssueReader(Protocol):
          def labelled_issues(self, label: str) -> list[LabelledIssue]: ...
          def may_triage(self, login: str) -> bool: ...  # triage, write, maintain or admin on the repository; False for a non-collaborator

      def issue_leg(
          root: Path,
          config: RunnerConfig,
          reader: IssueReader,
          draft: Callable[[str, str], IntakeOutcome],  # (request, source id) -> outcome
      ) -> tuple[str, bool]: ...
      ```

      One pass:

      1. With `intake.issue_label` empty, return "issue intake off" and read nothing (D-1).
      2. List the open issues carrying the label. Skip each the reader marked `unreadable`, naming it and its reason in the detail line and an `issue_skipped` event, and order the rest by `labelled_at`, oldest first.
      3. Skip an issue whose source file `.torve/sources/operator/issue-<number>.yaml` the tree holds (D-5).
      4. Skip an issue whose title or body was edited after `labelled_at`. Then, in the same order, ask `may_triage` about each remaining issue's labeller, at most once per account in the pass, and skip an issue whose labeller cannot triage. Stop asking at the first issue that passes. Each skip is named in the detail line with what would let it through (D-2).
      5. For that issue, write its source file, then call `draft(request, "operator/issue-<number>")`. The request is the title, a blank line and the body (D-4). Stop after one drafting run (D-8).

      The source file is an ordinary filed source (S-0060/D-1):

      ```yaml
      # yaml-language-server: $schema=../../schemas/sources.json
      id: operator/issue-142
      kind: operator
      ref: https://github.com/<owner>/<repo>/issues/142
      title: <the issue's title>
      at: '<labelled_at>'
      summary: |
        <the issue's body>
      ```

      The leg fails closed toward not creating work, as the standing leg does. A forge read that fails puts its error in the detail line and drafts nothing this pass. A source file that cannot be written drafts nothing. A drafting run that spends its budget escalates as `torve intake`'s does (D-10). The leg writes nothing to the forge (D-9). The detail line and the `issue_drafted` and `issue_skipped` engine events are the operator's view; nothing decides on them.

      `GhScm.labelled_issues` reads the open issues carrying the label through `gh api graphql`, following `pageInfo` until `hasNextPage` is false. For each issue it reads the body's `lastEditedAt` and the last 100 `LABELED_EVENT` and `RENAMED_TITLE_EVENT` timeline items, which hold the most recent labelling and every later rename. An issue whose last application of the label is not among them is returned with `unreadable` saying so, never dropped, so the leg names it as a skip and records it. A page that cannot be read fails the whole read, so the pass drafts nothing. `GhScm.may_triage` reads one account's permission from `repos/{repo}/collaborators/{login}/permission`; a 404 there, an account that is not a collaborator, answers false rather than failing the read. The leg asks it only about the issues it would draft next. Both use `scm.repo` and `scm.token_env` as every other `GhScm` read does, so a repository without `scm.token_env` uses the host's own `gh` login. A sandbox never sees the credential.
  - key: one-drafting-path
    md: |-
      `draft_request` moves out of the command into `src/torve/application/intake.py` (D-7). The leg and `torve intake` then draft the same way.

      ```python
      def draft_request(
          root: Path,
          request: str,
          config: RunnerConfig,
          agent: Agent,
          *,
          spec: str | None = None,
          source: str | None = None,
          runtime: Runtime,
          taken: Iterable[str] = (),
      ) -> IntakeOutcome: ...
      ```

      It mints the drafting task, cuts the worktree at base, runs `run_intake` with the agent it was given and removes the worktree in a `finally`. The caller builds the planner tier's agent with `build_tier_agent`, which stays in `src/torve/cli/assembly.py`, so the application layer never imports the composition root. `torve intake` keeps parsing, building the agent, the configuration-error exit and rendering. `src/torve/cli/manager.py` and `src/torve/cli/fleet.py` build the agent once and close over it in the leg's `draft`.

      Adoption commits the source file a drafting run names when the tree holds it untracked (D-6). An adopted contract then never names a source its base commit lacks. A source file that is already tracked, or a document source, is left alone.
  - key: reach-before-acceptance
    md: |-
      `phase_reach(corpus, root)` in `src/torve/application/neighbours.py` reuses that module's import-graph reading (one hop, Python only, S-0104/D-11). `_model_findings` in `src/torve/cli/spec.py` adds its lines to the warnings, beside `inherited_locks`. Like `inherited_locks`, it reads only documents that are not archived, not superseded, and have implementation `none` (D-11).

      For each phase:

      - **Unowned**: non-test Python files that import a file the phase's scope matches and that no phase of the document matches.
      - **Owned elsewhere**: non-test Python files that import a file the phase's scope matches and that another phase's scope matches, grouped by that phase. T-0523's caller and T-0536's caller would each have been one line of this kind.
      - **Unrun**: test files that import a file the phase's scope matches and that no acceptance command of the document runs (D-12).

      Each non-empty set is one warning line, naming at most ten paths, sorted, and the count:

      ```
      S-0119: phase 3 (The pass drafts a labelled issue) reaches 1 file no phase owns: src/torve/cli/review.py
      S-0119: phase 3 (The pass drafts a labelled issue) reaches 1 file phase 1 owns: src/torve/cli/intake.py
      S-0119: phase 3 (The pass drafts a labelled issue) leaves 1 test of its files unrun by every acceptance: tests/test_lane.py
      ```

      The lines above are illustrative. The check stays green: a reach line is a warning, so the author answers it in the phasing or in the phase's intent (D-13). A line about another phase's file asks one question: does this phase's change need that caller changed? If it does, the intent says so, and the file joins this phase's scope too. Scopes of different phases may overlap.
  - key: the-caller-search-in-parallel
    md: |-
      Rule 3b of `skills/spec-writer/SKILL.md` keeps its list of what a phase owns and gains the method:

      - Search each phase's callers independently. Where the session can delegate, run one search per phase at once, each returning the importers, the call sites of every signature the phase changes, the re-exports and the generated files.
      - Fold the answers into the scopes and acceptance.
      - Run `torve spec check` and settle each reach line. Move the file into a scope, add its test to an acceptance command, or say in the phase's intent why it stays out.

      Step A.5 of `references/workflows.md` names the reach lines beside the inherited LOCKED rows as what to read before the owner accepts (D-13).
tests: |-
  - Phase 1: `draft_request` drafts a request end to end on the fake harness, and the command renders the same outcome. Adoption commits an untracked source file that a draft names and leaves a tracked one alone (`tests/test_intake.py`).
  - Phase 2: `GhScm.labelled_issues` against recorded `gh` output. Cases: the labeller and instant of the last labelled event, a never-edited issue, a body edited and a title renamed after labelling, a labelling outside the event window, a second page of issues, a page that fails, and `may_triage` for a triage and a read-only account (`tests/test_forge.py`).
  - Phase 3: the leg with a fake reader and a fake `draft` (`tests/test_issues.py`). Cases:
    - off with no label;
    - one drafting run per pass, oldest labelling first;
    - skipped for a filed source, for a labeller who cannot triage, and for a title or body edit after labelling;
    - `may_triage` asked once per account and only until an issue passes, and never for a filed, edited or unreadable issue; an issue the reader marked `unreadable` named with its reason, recorded as `issue_skipped`, and never reaching `draft`;
    - a reader error drafts nothing;
    - the source file's fields.
  - Phase 3, the pass: the leg runs after the standing leg and not while paused, in the manager and in the fleet (`tests/test_residency.py`, `tests/test_manager.py`, `tests/test_fleet_serve.py`). Also the configuration key and its schema (`tests/test_runconfig.py`, `tests/test_cli.py`).
  - Phase 4: a Hypothesis property for D-12 over generated acceptance commands and test paths; the reach lines for a two-phase corpus in a temporary tree; the command printing them as warnings and exiting 0 (`tests/test_neighbours.py`, `tests/test_cli_spec.py`).
  - Not tested: the live forge. The adapter is tested against recorded `gh` output, as the rest of `GhScm` is.
docs: >-
  `skills/spec-writer/SKILL.md` gains the parallel caller search and the reach lines,
  and `skills/spec-writer/references/workflows.md` step A.5 adds the reach lines.
  `skills/torve/references/night.md` and `pages/docs/operating.md` cover turning the
  leg on, the triage and edit rules, and adopting an issue's drafts.
out_of_scope: |-
  - Passing the manifest's `scope.derived` map to `contingent_paths` at mint. No caller does today. That is S-0104/D-5's business (Q-3), not this document's.
  - Counting drafting runs against a night's budget. Q-2 asks whether they should be.
risks: |-
  - **An issue body is untrusted text in front of a model** (S-0008/D-5). The triage rule and the edit rule narrow who can put text there, not what the text can do. The drafting run is sandboxed and brokered, its output is lint-gated data, and nothing dispatches before a person adopts it. A private adopter repository whose drafter sandbox has network egress raises the stake. The owner reads the drafts and the source before adopting.
  - **The leg lists issues on every pass.** At the 15-second idle wait that is about 240 GraphQL listings an hour, more when the labelled issues span pages, against the GraphQL budget of 5,000 points an hour. Permission reads are REST requests against a separate 5,000 an hour. They come only from issues not yet drafted and not edited, at most one per account per pass, so a quiet repository makes none. Each account whose labelled issue waits, skipped for lack of triage, costs one read per pass, about 240 an hour, until that issue is relabelled or closed. Both budgets are shared with the host's other `gh` use.
  - **The leg drafts an issue once.** A failed or escalated draft is not retried. The owner re-runs `torve intake --source operator/issue-<number>`, or deletes the source file.
  - **The source file is untracked on the drafting host until adoption commits it.** A draft nobody adopts leaves the file there, and a second host would draft the same issue again.
  - **Reach lines can be long** for a phase that changes a widely imported module. They are capped at ten names with the count, and reading them is the author's work.
  - **The evidence for the reach lines is thin.** There were two import misses in a month, both before S-0104, and none since. The lines may cost more reading than they save in review (Q-4).
  - **This document could be read as torve choosing its own work.** It does not: a person labels and a person adopts.
sections:
  - key: what-the-tracker-deletion-decided
    md: |-
      09c5e962 deleted about 2,600 lines that were inert in every repository torve ran: the projection, its outbox, the `/torve` commands and the poll leg (S-0008/A-5). The reason was maintenance, not design. Every refactor had to be correct about a subsystem nobody ran.

      This design reads one surface and writes none, so the outbox, the commands, the commander list and the thread loop stay deleted. The poll is a leg of the pass that already exists, off until configured. S-0008/D-1's rule, that the board is a view and never authority, holds: issue state decides nothing on the record, and the source file, the drafting run and the adoption are the record's own.
  - key: locked-rows-kept
    md: |-
      - S-0060/D-1: the leg files an ordinary `operator` source whose id equals its path.
      - S-0060/D-4: a drafted issue's contracts carry `source`, so the record's source id is the issue's source, which is what that order intends.
      - S-0060/D-5: the leg calls the path `torve intake --source` already takes. Adoption still copies the source onto every contract and now also commits its file.
      - S-0060/D-8: the skill change touches nothing about a document's `kind`.
      - S-0055/D-22: the leg's detail line names issue numbers and task ids only, and the reach lines are built in the application layer, as `inherited_locks`'s are.
alternatives:
  - option: >-
      A standing trigger kind `issue` beside `command`, `path-digest` and `flake-threshold`.
    rejected_because: >-
      A standing job mints its committed body through adoption with no person between
      (S-0023/D-4). An issue carries no committed answer, so the trigger would either
      skip the human signature or need a second, non-minting action that `max_open`
      and `strike_limit` would misread, since they count minted instances and their
      landings.
    cites: [S-0023/D-4, S-0055/D-57]
  - option: >-
      Restore the tracker projection and its inbound commands.
    rejected_because: >-
      It was deleted as 2,600 lines that every refactor had to carry while nothing
      ran them (S-0008/A-5). The capability S-0020/A-1 named as lost is the inbound
      request, and one read is enough to restore it.
    cites: [S-0008/A-5, S-0020/A-1]
  - option: A webhook receiver for issue events.
    rejected_because: >-
      It needs a host the forge can reach and a shared secret, for a latency the pass's
      15-second idle already meets. A listing per pass stays within the forge's rate
      limit.
  - option: Trust the label alone.
    rejected_because: >-
      An issue template can apply a label at creation for any author, and the author
      can edit the body after a maintainer labels it. The labeller's permission and
      the edit time are what a label means.
  - option: >-
      Make a reach line a problem that refuses the check.
    rejected_because: >-
      Many importers read only a name the phase does not change. A refusal would be
      answered by padding scopes, which S-0104's contingent set exists to avoid.
    cites: [S-0104/D-1]
  - option: >-
      Have the planner tell the executor which contingent files must change.
    rejected_because: >-
      The planner cannot know which importers a change breaks without the change.
      The prompt already lists the contingent paths (S-0104/D-7). The decision to
      own a caller belongs where the phase's acceptance is written, before acceptance.
    cites: [S-0104/D-7]
questions:
  - id: Q-1
    text: >-
      Should a drafting run the leg started hold the escalation pause? Today any escalation
      does (`pause_escalations: 1`), so one issue whose drafts never lint green stops
      every leg that grows the queue until the owner resolves it. Lean: hold it, as
      D-10 says, and revisit after the first month of issue-fed drafting.
  - id: Q-2
    text: >-
      Does a drafting run spend a night's budget? The broker records its cost, but
      the night counts attempts. Lean: count a drafting run as an attempt, decided
      by the owner before the leg is turned on.
  - id: Q-3
    text: >-
      No caller passes the manifest's `scope.derived` map to `contingent_paths`, so
      S-0104/D-5's riders reach a contract only through the scope gate. Is that S-0104's
      intent, or a gap for S-0104's owner to amend?
  - id: Q-4
    text: >-
      Phases 4 and 5 rest on two import misses, both before S-0104. Ship them now,
      or hold them until a month of the review leg's blockers shows reach outside
      the scope recurring? Lean: ship. Phase 4 is a warning built from code that already
      exists, and the parallel caller search in phase 5 is worth having on its own.
      If a month of authoring shows the lines changed no phasing, retire D-11 through
      an amendment.
