# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-12T20:16:39Z'
    title: >-
      phase 1 names the test file of the module it allows
    md: |
      `torve plan` refused to mint phase 1: the scope allowed
      `src/torve/application/decisions.py` and not `tests/test_decisions.py`, which is
      the T-0113 rule — a contract that may change a module but not that module's tests
      has quietly forbidden test-driven work on it, and the battery cannot catch it
      because the scope gate judges a diff against the contract.

      Worth recording rather than fixing quietly: this is the same rule that produced
      every measured lint refusal on the hand-minted path, and S-0067/D-6 exists to
      state it where a session reads it. It was violated here by the author of that row,
      in a document about checks that pass where they should not, one commit after
      accepting it. The drafted path caught it before anything was minted, which is the
      asymmetry S-0067 is about.
  - id: A-2
    at: '2026-09-12T20:38:24Z'
    title: D-5 names the second reader of its own rule
    changes:
      - subject: D-5
        field: paths
        before: [src/torve/application/decisions.py]
        after: [src/torve/application/decisions.py, src/torve/config/spec.py]
      - subject: D-5
        field: fingerprint
        after: 1e433fe5e58198c1/d8378fcb3f97fac7
    md: |
      The rule has two readers and D-5 named one. `application/decisions.py::path_rot`
      reports rot for a row whose globs all match nothing; `config/spec.py` refuses a
      LOCKED row on an implemented document whose glob matches nothing, and it is the
      second that produces the problem and the non-zero exit.

      T-0370 fixed the reader its contract allowed, correctly and completely, and the
      blocker survived because the contract could not reach the other one. The scope
      gate would have convicted an attempt that went looking, which is the system
      working — the defect is upstream of it, in a row whose paths described half the
      surface its text governs.

      Worth naming for what it is: this is the third contract tonight where the work
      came back right and the thing that was wrong was what I asked for. The lint and
      the size verdict read a scope; nothing reads a decision's paths against the text
      beside it.
  - id: A-3
    at: '2026-09-12T20:39:30Z'
    title: phase 5 names its test file too
    md: |
      The T-0113 rule, twice in one document, by the same author, ten minutes apart —
      recorded rather than fixed quietly because the repetition is the finding. Both
      times the lint refused before anything was minted, which is the drafted path's
      protection and the reason S-0067 exists for the other one.
  - id: A-4
    at: '2026-09-13T07:11:33Z'
    title: A verdict names the suite it judged
    changes:
      - subject: D-6
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-6
        field: paths
        before: []
        after: [src/torve/gates/acceptance.py, tests/test_gates.py]
      - subject: D-6
        field: fingerprint
        after: 96e05591aa56fc8a/73f58d80ce889d16
    md: |
      The document found three artefacts that were stable only on the machine holding
      the uncommitted half. This row is the fourth instance and the first one that is a
      *verdict* rather than a file: `acceptance` reports `pass` whether it ran 1,749
      tests or 1,716, and which it ran is decided by whether a Docker daemon happened
      to be reachable.

      The asymmetry is deliberate and stays — `S-0017/D-10` makes a daemon socket an
      explicit per-repository opt-in, and the sandbox's `/work` is a host bind-mount
      while a test's `tmp_path` is container-local, so a sibling container would mount
      a path that does not exist. Wiring the daemon buys 33 confusing failures in place
      of 33 honest skips.

      What is not deliberate is the silence. `D-3` already says a check that walks
      artefacts the repository may not be carrying judges what is there or skips naming
      the reason; this applies the same sentence one level up, to the gate that reports
      on such a check.
