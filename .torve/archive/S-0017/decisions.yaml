# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      The image digest is the sandbox's identity: resolved at dispatch, joined into
      `config_hash`, recorded on the attempt
    paths: [src/torve/application/telemetry.py, src/torve/adapters/runtime/**]
    consequence: >-
      A mutable tag makes every before/after comparison unfounded — the S-0004/D-6
      failure, one artefact over
  - id: D-2
    grade: ASSUMED
    text: >-
      Image definitions live under `.torve/sandbox/<name>/`; `torve sandbox build`
      builds and reports the digest; `torve doctor` reds on a configured image that
      does not exist
    paths: [src/torve/cli/**, .torve/sandbox/**]
    consequence: Ambient images are unreviewable regime changes
  - id: D-3
    grade: LOCKED
    text: >-
      The engine never builds images mid-run; building is an operator action
    paths: [src/torve/application/**]
    consequence: >-
      A build is a regime change, and regime changes are decisions
  - id: D-4
    grade: LOCKED
    text: >-
      Configuration routes by nature — identity in the image, task context in the
      workspace, secrets as env names, knobs in the command, state on the slot volume;
      one item, one channel
    paths: [src/torve/config/runconfig.py]
    consequence: >-
      A second channel for a secret is a leak; a repo-carried harness config is an
      injection surface
  - id: D-5
    grade: ASSUMED
    text: >-
      `tier.home` is the per-tier file channel, materialized at dispatch like skills;
      deferred until a harness needs it
    paths: [src/torve/config/runconfig.py, src/torve/application/skills.py]
    consequence: >-
      Specified now so the first need does not improvise
  - id: D-6
    grade: LOCKED
    text: >-
      stdio MCP servers are image content; remote MCP endpoints are egress destinations
      under provider routing (S-0004/D-8), never configured from the repository under
      work
    paths: [src/torve/config/runconfig.py]
    consequence: >-
      Repository contents flow to MCP endpoints exactly as to providers
  - id: D-7
    grade: LOCKED
    text: >-
      Memory is off for executor tiers by default; enabled memory is per-slot on the
      slot's volume, never shared between slots (S-0001/D-29), and never mounted in
      a shadow run
    paths: [src/torve/application/shadow.py, src/torve/config/runconfig.py]
    consequence: >-
      Shared memory is agent communication; remembered shadow runs are incomparable
      numbers
  - id: D-8
    grade: ASSUMED
    text: >-
      Images are thin: base runtime, harness, `git`, `uv`, and the engine's own CLI
      in an environment of its own; everything task-specific arrives via the workspace
      (the CLI added by amendment S-0017/A-2 2026-09-04)
    paths: [.torve/sandbox/**]
    consequence: >-
      What is baked deeper is invisible to review and to the hash of the work
  - id: D-10
    grade: LOCKED
    text: >-
      Socket mode is host-equivalent capability: an explicit per-repository opt-in,
      never a code default, never combined with repositories the operator does not
      trust as their own shell; OpenSandbox refuses docker access in any mode until
      the live-server integration. Added by amendment S-0017/A-1 2026-08-22
    paths: [src/torve/adapters/runtime/**]
    consequence: >-
      A container started over the host socket can mount any host path
  - id: D-11
    grade: ASSUMED
    text: >-
      Containers the sandbox starts carry no torve labels and the reaper does not
      chase them; the battery that starts them owns their lifecycle. Added by amendment
      S-0017/A-1 2026-08-22
    paths: [src/torve/application/reaper.py]
    consequence: >-
      Cleanup-by-convention must not pretend to cover what it cannot see
retired: [D-9]
