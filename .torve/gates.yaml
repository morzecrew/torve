# yaml-language-server: $schema=schemas/gates.json
# Gate manifest for this repository (S-0002, S-0002/D-5: manifests live in the
# consuming repository, not in the package). Torve gates its own development.
#
# Every entry carries `state` and `origin` (S-0002/D-19, S-0002/A-2): state is the
# activation lifecycle (shadow | blocking | quarantined — S-0002/states), origin
# answers "why do we have this" and cites the document that decided it — which
# is where the promotion history lives, so it is not restated here.
#
# `axis` labels what a red from this gate means (S-0034/convictions-classified):
# functional | boundary | compliance | form. An unlabeled gate reads as
# functional, so a label appears only where that default is wrong (S-0034/D-4).
#
# `sabotage` names the twin that proves the entry can convict (S-0036/the-sabotage-pair-lint,
# S-0036/D-3): a CASES family in the shipped sabotage suite, or a repository test
# path that reddens when the gate stops working. The load refuses a twinless
# entry in a manifest that names any twin — deleting one line below bricks
# `torve gates run`.
#
# `timeout` is on every entry (S-0071/D-3), because the runner sorts the battery
# cheapest-first on it and an entry that declares nothing sorts as its filled-in
# default — which is how the dearest gate in the battery came to run ahead of the
# cheapest. The value is the gate's own measured cost rounded up with headroom,
# never a round number picked at the keyboard: a round number is what the field
# was before it was measured. Each value below carries what it was measured from.
#
# What actually runs, with input, timeout and axis resolved and the contract's
# own gates included: `torve gates list [--task ...]`.
schema_version: 1

# The launcher a gate runs named test files through: the suite's rerun and
# base run (S-0118/D-1) and `red-on-base` (S-0106/D-7). The engine default is
# a bare `python3 -m pytest`, which cannot import this package in a battery's
# checkout, so every reading would be void and every red would convict.
tests:
  run: "uv run pytest -q -p no:cacheprovider"

# Repository-level scope, used on runs with no task contract. Unconstrained:
# human work on this repository is not scoped; task branches carry their own.
scope:
  allow: []
  deny: []
  # The files that ride with a source, both ways (S-0104/D-5). Naming the map
  # replaces the engine's lock-file defaults, so they are restated first. The
  # record page's authority table is compared against every event kind by
  # tests/test_docs.py: S-0118's phase 3 added `lane.judged` without owning the
  # page, and every later attempt on the document inherited the red. Block
  # lists only: the pre-write hook reads this map line-wise (`derived_map`).
  derived:
    pyproject.toml:
      - uv.lock
      - poetry.lock
      - pdm.lock
    Pipfile:
      - Pipfile.lock
    package.json:
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
    Cargo.toml:
      - Cargo.lock
    go.mod:
      - go.sum
    src/torve/domain/events.py:
      - pages/docs/architecture/record.md

# What a battery over an attempt judges (S-0122/D-4): the code, never the
# engine's bookkeeping. A row's `check` runs when its document completes, not on
# every attempt, and the spec checks run in CI and at completion.

gates:
  # The builtins run in the runner's own process over the diff, and measure
  # under 10ms each on a one-file change; 6 is three orders of magnitude of
  # headroom over that, and equal values keep them in manifest order, which is
  # the order a reader of this file predicts.
  - name: scope
    run: "@scope"
    state: blocking
    origin: structural
    axis: boundary
    timeout: 6
    sabotage: scope
  - name: secrets
    run: "@secrets"
    state: blocking
    origin: structural
    timeout: 6
    sabotage: secrets
  - name: no-test-tampering
    run: "@no-test-tampering"
    state: blocking
    origin: structural
    timeout: 6
    sabotage: no-test-tampering
  # Style over the whole tree, which the battery did not check. `ruff check`
  # lived only in the `acceptance` fallback below — the list a run with no task
  # contract falls back to — so a task-contract run linted whatever its contract
  # happened to name, and none of them named ruff. `--check` on the formatter is
  # the other half: an unformatted file landed in S-0064 phase 1 and came back
  # twice, because nothing but a person running `ruff format` ever noticed.
  #
  # Entered at shadow and promoted on soak evidence (S-0055/D-14): 177 shadow
  # runs from 2026-09-12 to 2026-10-07, 36 red. Eight of those were the dsh
  # harness's own skills under `.dsh/`, which ruff now excludes; the rest were
  # files the attempt wrote, and twice (S-0094, S-0096) they reached a pull
  # request because nothing blocked on them. The seat that writes this
  # repository's code no longer runs the formatter on its own.
  - name: lint
    run: "uv run ruff check . && uv run ruff format --check ."
    state: blocking
    origin: S-0015
    input: worktree
    # Both halves together measure 0.05s over three runs of the whole tree.
    # Since S-0114 a battery's checkout holds no `.venv`, so the first `uv run`
    # gate builds the environment: 2s with a warm cache, over 17s under load
    # (S-0116's completion battery, 2026-10-20). Every `uv run` gate carries the
    # same 120, so whichever sorts first can pay for it.
    timeout: 120
    sabotage: tests/test_lint.py
  # The layer contracts over the whole package. A self-development gate
  # (S-0015/D-10): the tool is a dev dependency and never ships.
  - name: layering
    run: "uv run lint-imports"
    state: blocking
    origin: S-0015
    input: worktree
    # 0.17s over three runs of the contracts across the package.
    # Since S-0114 a battery's checkout holds no `.venv`, so the first `uv run`
    # gate builds the environment: 2s with a warm cache, over 17s under load
    # (S-0116's completion battery, 2026-10-20). Every `uv run` gate carries the
    # same 120, so whichever sorts first can pay for it.
    timeout: 120
    sabotage: tests/test_layering.py
  # Types over the package, as its own gate rather than a line in the
  # `acceptance` fallback, which only a run with no contract ever reached
  # (S-0122/D-4). `main` is mypy-clean, so a red here is the change's own.
  # 9.1s cold and 0.3s warm over the package; the same 120 as every `uv run`
  # gate, for the environment build whichever sorts first pays.
  - name: mypy
    run: "uv run mypy src"
    state: blocking
    origin: S-0122
    input: worktree
    timeout: 120
    sabotage: tests/test_lint.py
  # The whole suite, once per battery, a red attributed to the change that
  # caused it (S-0118/D-1): a failing test's file is rerun at the head, then
  # on the merge base, and a test convicts only when it is red at the head and
  # not red on the base. No base reading, a file that does not collect, or a
  # red naming no test convicts (D-2). It replaces `coverage-delta`, whose
  # suite soaked a month at shadow; the coverage delta rides as a report whose
  # exit code never convicts (D-3, D-5). Blocking from the start: the soak was
  # the suite's own, and attribution only turns its reds into passes, so this
  # gate departs S-0055/D-14's shadow-first rule alone (S-0118/Q-1). No
  # `paths`: a change to a test, or to a page a test reads, is judged too.
  #
  # 600 is the ceiling measured for `coverage-delta`'s suite: 164s median over
  # 228 runs, 271s at p90, 600s at worst. The coverage report that rode here
  # cost more than any gate and convicted nothing (S-0122/D-4).
  - name: suite
    run: "@suite"
    state: blocking
    origin: S-0118
    timeout: 600
    sabotage: suite
    commands:
      - "uv run pytest -q"
  - name: acceptance
    run: "@task.acceptance"
    state: blocking
    origin: structural
    # The one entry whose cost is not this file's to measure: it runs whatever
    # commands the contract under work names, so its p90 is a property of the
    # contracts and not of the gate. The cap stands where it was, and the gate
    # sorts last, which is where the dearest gate belongs.
    timeout: 900
    sabotage: acceptance
    # Fallback for a run with no task contract, and the acceptance a review
    # round's contract takes (the thread leg refuses to start without one).
    # It repeats `lint` and `mypy` on a contract-less run, which costs seconds.
    # The spec checks left the attempt battery (S-0122/D-4); a document's
    # completion battery runs under no contract, so they run there from here.
    commands:
      - "uv run ruff check ."
      - "uv run ruff format --check ."
      - "uv run mypy src"
      - "uv run torve spec check"
      - "uv run torve spec project --check"
