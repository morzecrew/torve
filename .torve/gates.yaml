# yaml-language-server: $schema=schemas/gates.json
# Gate manifest for this repository (S-0002, S-0002/D-5: manifests live in the
# consuming repository, not in the package). Torve gates its own development.
#
# Every entry carries `state` and `origin` (S-0002/D-19, S-0002/A-2): state is the
# activation lifecycle (shadow | blocking | quarantined — S-0002/states), origin
# answers "why do we have this" and cites the document that decided it — which
# is where the promotion history lives, so it is not restated here.
#
# `axis` labels what a red from this gate means (S-0034/convictions-classified):
# functional | boundary | compliance | form. An unlabeled gate reads as
# functional, so a label appears only where that default is wrong (S-0034/D-4).
#
# `sabotage` names the twin that proves the entry can convict (S-0036/the-sabotage-pair-lint,
# S-0036/D-3): a CASES family in the shipped sabotage suite, or a repository test
# path that reddens when the gate stops working. The load refuses a twinless
# entry in a manifest that names any twin — deleting one line below bricks
# `torve gates run`.
#
# `timeout` is on every entry (S-0071/D-3), because the runner sorts the battery
# cheapest-first on it and an entry that declares nothing sorts as its filled-in
# default — which is how the dearest gate in the battery came to run ahead of the
# cheapest. The value is the gate's own measured cost rounded up with headroom,
# never a round number picked at the keyboard: a round number is what the field
# was before it was measured. Each value below carries what it was measured from.
#
# What actually runs, with input, timeout and axis resolved and the contract's
# own gates included: `torve gates list [--task ...]`.
schema_version: 1

# Repository-level scope, used on runs with no task contract. Unconstrained:
# human work on this repository is not scoped; task branches carry their own.
scope:
  allow: []
  deny: []

gates:
  # The builtins run in the runner's own process over the diff, and measure
  # under 10ms each on a one-file change; 6 is three orders of magnitude of
  # headroom over that, and equal values keep them in manifest order, which is
  # the order a reader of this file predicts.
  - name: scope
    run: "@scope"
    state: blocking
    origin: structural
    axis: boundary
    timeout: 6
    sabotage: scope
  - name: secrets
    run: "@secrets"
    state: blocking
    origin: structural
    timeout: 6
    sabotage: secrets
  - name: no-test-tampering
    run: "@no-test-tampering"
    state: blocking
    origin: structural
    timeout: 6
    sabotage: no-test-tampering
  - name: decisions-reported
    run: "@decisions-reported"
    state: blocking
    origin: structural
    axis: compliance
    timeout: 6
    sabotage: decisions-reported
  - name: self-audit
    run: "@self-audit"
    state: shadow
    origin: structural
    axis: compliance
    timeout: 6
    sabotage: self-audit
  # The corpus validator (S-0007/D-14), and the only place the corpus is
  # checked since CI stopped running the battery twice (S-0002/A-4) — named, so
  # a red corpus does not read as a red test suite.
  - name: spec-valid
    run: "uv run torve spec check"
    input: worktree
    state: blocking
    origin: S-0007
    axis: form
    # 4.4s over three runs of the whole corpus.
    # Since S-0114 a battery's checkout holds no `.venv`, so the first `uv run`
    # gate builds the environment: 2s with a warm cache, over 17s under load
    # (S-0116's completion battery, 2026-10-20). Every `uv run` gate carries the
    # same 120, so whichever sorts first can pay for it.
    timeout: 120
    sabotage: tests/test_rfc_check.py
  - name: source-layout
    run: "@source-layout"
    state: shadow
    origin: S-0014
    axis: form
    timeout: 6
    sabotage: source-layout
  # No corpus identifiers in user-facing strings (S-0011/D-11, S-0011/A-1).
  - name: user-facing-text
    run: "@user-facing-text"
    state: blocking
    origin: S-0011
    axis: compliance
    timeout: 6
    sabotage: user-facing-text
  # Style over the whole tree, which the battery did not check. `ruff check`
  # lived only in the `acceptance` fallback below — the list a run with no task
  # contract falls back to — so a task-contract run linted whatever its contract
  # happened to name, and none of them named ruff. `--check` on the formatter is
  # the other half: an unformatted file landed in S-0064 phase 1 and came back
  # twice, because nothing but a person running `ruff format` ever noticed.
  #
  # Entered at shadow and promoted on soak evidence (S-0055/D-14): 177 shadow
  # runs from 2026-09-12 to 2026-10-07, 36 red. Eight of those were the dsh
  # harness's own skills under `.dsh/`, which ruff now excludes; the rest were
  # files the attempt wrote, and twice (S-0094, S-0096) they reached a pull
  # request because nothing blocked on them. The seat that writes this
  # repository's code no longer runs the formatter on its own.
  - name: lint
    run: "uv run ruff check . && uv run ruff format --check ."
    state: blocking
    origin: S-0015
    input: worktree
    # Both halves together measure 0.05s over three runs of the whole tree.
    # Since S-0114 a battery's checkout holds no `.venv`, so the first `uv run`
    # gate builds the environment: 2s with a warm cache, over 17s under load
    # (S-0116's completion battery, 2026-10-20). Every `uv run` gate carries the
    # same 120, so whichever sorts first can pay for it.
    timeout: 120
    sabotage: tests/test_lint.py
  # The layer contracts over the whole package. A self-development gate
  # (S-0015/D-10): the tool is a dev dependency and never ships.
  - name: layering
    run: "uv run lint-imports"
    state: blocking
    origin: S-0015
    input: worktree
    # 0.17s over three runs of the contracts across the package.
    # Since S-0114 a battery's checkout holds no `.venv`, so the first `uv run`
    # gate builds the environment: 2s with a warm cache, over 17s under load
    # (S-0116's completion battery, 2026-10-20). Every `uv run` gate carries the
    # same 120, so whichever sorts first can pay for it.
    timeout: 120
    sabotage: tests/test_layering.py
  # Does the suite meet the attempt's changed lines (S-0036/D-1)? diff-cover
  # intersects coverage with the diff against {base} — the merge-base the
  # battery itself computed, substituted by the runner, so a gate never
  # resolves a ref in shell and live runs and replays measure one surface.
  # The judgment is the attempt's added and changed lines, never the inherited
  # tree and never a whole-repo threshold (S-0031's ratchet doctrine).
  #
  # The entry runs the suite before it can measure anything, so it has two
  # ways to go red under one name. It says which: a red suite ends here with
  # that sentence last, where the terminal and the retry's feedback pack both
  # read (T-0319), instead of filing a failing test under a name that says
  # coverage.
  - name: coverage-delta
    run: "COVERAGE_CORE=sysmon uv run pytest --cov=src --cov-report=xml -q || { echo '== the suite is red, so the coverage delta was never measured — the failure above is a failing test, not a coverage shortfall =='; exit 1; }; uv run diff-cover coverage.xml --compare-branch {base} --fail-under 80"
    state: shadow
    origin: S-0036
    input: worktree
    # What this gate judges (S-0071/D-6), which is what `--cov=src` names.
    # Measured over 302 runs: 77 of them changed nothing under `src/` and spent
    # 11,786 of the gate's 43,448 seconds there, seventeen going red over drift
    # the attempt had not caused.
    paths: [src/**]
    # Measured, not guessed: 164s median over 228 runs, 271s at p90, 600s at
    # worst. The runner sorts the battery cheapest-first on this field, so an
    # absent timeout read as zero cost and put the dearest gate in the pass
    # ahead of every gate that declares one — spec-valid included.
    #
    # `COVERAGE_CORE=sysmon` on the front is coverage.py over CPython's
    # `sys.monitoring` rather than its settrace tracer. Measured on this suite:
    # 25s plain, 47s under coverage, 30s under sysmon — so it returns about
    # two thirds of what measuring costs, on an interpreter this project
    # already pins. It is a word in the command rather than a knob on the
    # entry: the gate is a shell command, and a shell command carries its own
    # environment.
    timeout: 600
    sabotage: coverage-delta
  # The managed AGENTS.md sections beside the code, rendered from the corpus
  # and drift-checked like the index (S-0054/D-7).
  - name: spec-projection
    run: "uv run torve spec project --check"
    input: worktree
    state: shadow
    origin: S-0054
    axis: form
    # 1.5s over three runs of the projection across 32 governed directories.
    # Since S-0114 a battery's checkout holds no `.venv`, so the first `uv run`
    # gate builds the environment: 2s with a warm cache, over 17s under load
    # (S-0116's completion battery, 2026-10-20). Every `uv run` gate carries the
    # same 120, so whichever sorts first can pay for it.
    timeout: 120
    sabotage: tests/test_colocation.py
  # Does the attempt's own test code already pass on the tree it started from
  # (S-0081/D-1)? Not a builtin of the cheap kind: it runs the qualifying test
  # functions against the base tree, so it declares a real timeout. Enters at
  # shadow and is promoted on its own false-positive rate. The twin is the
  # gate's own test file: it reddens when the gate stops convicting.
  #
  # The entry lands after the builtin (T-0438): the battery that judges an
  # attempt runs the engine as landed, so a manifest naming a builtin the
  # landed engine lacks is an infrastructure failure, not a red gate.
  - name: red-on-base
    run: "@red-on-base"
    state: shadow
    origin: S-0081
    # Two runs of the changed test files only, plus the base extracted with
    # `git archive` into a temporary directory (S-0081/D-5). The whole suite is 25s; the qualifying slice is a fraction of that,
    # and 300 is the headroom a contract that rewrites every test file wants.
    timeout: 300
    sabotage: tests/test_gates.py
  # The verify pilot's two builtins (S-0116/D-10, D-11). They enter at shadow
  # with the document's completion, as its phasing says, so no phase needed
  # the new engine to pass in its own sandbox. Both skip until the pilot is on:
  # `held-out` runs only when the task's implement task recorded held-out
  # properties, and `verify-tests` judges only a verify task.
  #
  # A held-out run is one pytest pass over the recorded files: a 13-test file
  # measured 3.2-3.4s over three runs on the host. A property draws many
  # examples per test, so 120 is the headroom a large held-out set wants.
  - name: held-out
    run: "@held-out"
    state: shadow
    origin: S-0116
    timeout: 120
    sabotage: held-out
  # A collection pass over the verifier's file and its held-out properties,
  # then one run of both: 0.65s and 3.5-3.7s over three runs on the host. Each
  # pass gets the whole timeout, with the same headroom as `held-out`.
  - name: verify-tests
    run: "@verify-tests"
    state: shadow
    origin: S-0116
    timeout: 120
    sabotage: verify-tests
  # Which rows a test the change had to turn green proves (S-0115/D-1 to D-4,
  # D-9): the changed test functions that cite a carried row, run on the base
  # tree and on the candidate. It names each behavioural row with no proving
  # test and no check. Its runs are `red-on-base`'s shape, one test function at
  # a time, so it takes the same 300 (S-0115's risks). Shadow until its record
  # earns more, as a check's state is promoted (S-0054/D-4).
  - name: evidence
    run: "@evidence"
    state: shadow
    origin: S-0115
    timeout: 300
    sabotage: evidence
  # Does the attempt's own test code notice its source going wrong (S-0107/D-1,
  # D-2)? One edit to one node on a changed line, applied in a scratch copy of
  # the worktree, scored by whether the paired tests fail. Enters at shadow and
  # is promoted on soak evidence, like every measurement gate before it.
  #
  # Its cost is one baseline run of the paired tests plus each sampled mutant
  # rerun under twice that baseline. A mutant starts only if it can finish
  # inside this timeout, so a slow suite scores the mutants that ran rather
  # than none. 900 is the headroom a contract that rewrites a heavily tested
  # module wants; the twin is the gate's own CASES family in the sabotage suite.
  - name: mutation
    run: "@mutation"
    state: shadow
    origin: S-0107
    timeout: 900
    sabotage: mutation
  - name: acceptance
    run: "@task.acceptance"
    state: blocking
    origin: structural
    # The one entry whose cost is not this file's to measure: it runs whatever
    # commands the contract under work names, so its p90 is a property of the
    # contracts and not of the gate. The cap stands where it was, and the gate
    # sorts last, which is where the dearest gate belongs.
    timeout: 900
    sabotage: acceptance
    # Fallback for runs with no task contract (human pull requests).
    commands:
      - "uv run ruff check ."
      - "uv run ruff format --check ."
      - "uv run mypy src"
      - "uv run pytest"
