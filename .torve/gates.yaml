# Gate manifest for this repository (RFC 0002, D-2.5: manifests live in the
# consuming repository, not in the package). Torve gates its own development.
#
# Every entry carries `state` and `origin` (D-2.19, A-8): state is the
# activation lifecycle (shadow | blocking | quarantined — RFC 0002 §7.3),
# origin answers "why do we have this" for as long as the gate exists.
#
# `axis` labels what a red from this gate means (RFC 0034 §5.3):
# functional | boundary | compliance | form. An unlabeled gate reads as
# functional, so a label appears only where that default is wrong (D-34.4).
schema_version: 1

# Repository-level scope, used on runs with no task contract. Unconstrained:
# human work on this repository is not scoped; task branches carry their own.
scope:
  allow: []
  deny: []

gates:
  - name: scope
    run: "@scope"
    state: blocking
    origin: structural
    axis: boundary
    added: 2026-08-21
  - name: secrets
    run: "@secrets"
    state: blocking
    origin: structural
    added: 2026-08-21
  - name: no-test-tampering
    run: "@no-test-tampering"
    state: blocking
    origin: structural
    added: 2026-08-21
  - name: decisions-reported
    run: "@decisions-reported"
    state: blocking
    origin: structural
    axis: compliance
    added: 2026-08-21
  # The one gate that was non-blocking, which is what shadow is (A-8): it
  # runs, reports, and is measured before it may ever block.
  - name: self-audit
    run: "@self-audit"
    state: shadow
    origin: structural
    axis: compliance
    added: 2026-08-21
  # The corpus validator, the product gate of RFC 0007 §3a (D-7.14):
  # `torve rfc check` covers format, graph and index drift in one run, from
  # the package alone (D-7.12) — no store, no skill. Promoted out of its
  # shadow tenure when CI stopped running the battery a second time itself
  # (A-52): this is now the only place the corpus is checked, so it blocks,
  # and it is named, so a red corpus does not read as a red test suite.
  - name: rfc-valid
    run: "uv run torve rfc check"
    input: worktree
    state: blocking
    origin: rfc/0007
    axis: form
    added: 2026-08-22
    timeout: 20
  # The checkable half of RFC 0014 (D-14.11), entering at shadow per D-2.18
  # after the one-time repository sweep (D-14.12).
  - name: source-layout
    run: "@source-layout"
    state: shadow
    origin: rfc/0014
    axis: form
    added: 2026-08-21
  # The audience rule of RFC 0011 §5a (D-11.11, A-23): no corpus identifiers
  # in user-facing strings. Entered at shadow, whole-tree report read clean
  # after the one-time rewrite, sabotage red on demand (including the
  # must-pass docstring twin), then promoted — a deterministic AST check has
  # no false-positive rate to soak (the layering precedent, T-0014).
  - name: user-facing-text
    run: "@user-facing-text"
    state: blocking
    origin: rfc/0011
    axis: compliance
    added: 2026-08-22
  # RFC 0015 §6 (D-15.8): the layer contracts, checked by import-linter over
  # the whole package — a self-development gate (D-15.10), meaningful only in
  # this repository; the tool is a dev dependency and never ships. Entered at
  # shadow (§7.6), report read clean, sabotage red on demand, then promoted to
  # blocking per §7.7 — a deterministic graph check has no false-positive rate
  # to soak (departure from D-2.23's 30-change criterion, logged in T-0014).
  - name: layering
    run: "uv run lint-imports"
    state: blocking
    origin: rfc/0015
    added: 2026-08-22
    input: worktree
    timeout: 60
  - name: acceptance
    run: "@task.acceptance"
    state: blocking
    origin: structural
    added: 2026-08-21
    timeout: 900
    # Fallback for runs with no task contract (human pull requests).
    commands:
      - "uv run ruff check src tests"
      - "uv run mypy src"
      - "uv run pytest"
