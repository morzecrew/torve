# yaml-language-server: $schema=schemas/gates.json
# Gate manifest for this repository (S-0002, S-0002/D-5: manifests live in the
# consuming repository, not in the package). Torve gates its own development.
#
# Every entry carries `state` and `origin` (S-0002/D-19, S-0002/A-2): state is the
# activation lifecycle (shadow | blocking | quarantined — S-0002/states), origin
# answers "why do we have this" and cites the document that decided it — which
# is where the promotion history lives, so it is not restated here.
#
# `axis` labels what a red from this gate means (S-0034/convictions-classified):
# functional | boundary | compliance | form. An unlabeled gate reads as
# functional, so a label appears only where that default is wrong (S-0034/D-4).
#
# `sabotage` names the twin that proves the entry can convict (S-0036/the-sabotage-pair-lint,
# S-0036/D-3): a CASES family in the shipped sabotage suite, or a repository test
# path that reddens when the gate stops working. The load refuses a twinless
# entry in a manifest that names any twin — deleting one line below bricks
# `torve gates run`.
#
# `timeout` is on every entry (S-0071/D-3), because the runner sorts the battery
# cheapest-first on it and an entry that declares nothing sorts as its filled-in
# default — which is how the dearest gate in the battery came to run ahead of the
# cheapest. The value is the gate's own measured cost rounded up with headroom,
# never a round number picked at the keyboard: a round number is what the field
# was before it was measured. Each value below carries what it was measured from.
#
# What actually runs, with input, timeout and axis resolved and the contract's
# own gates included: `torve gates list [--task ...]`.
schema_version: 1

# Repository-level scope, used on runs with no task contract. Unconstrained:
# human work on this repository is not scoped; task branches carry their own.
scope:
  allow: []
  deny: []

gates:
  # The builtins run in the runner's own process over the diff, and measure
  # under 10ms each on a one-file change; 6 is three orders of magnitude of
  # headroom over that, and equal values keep them in manifest order, which is
  # the order a reader of this file predicts.
  - name: scope
    run: "@scope"
    state: blocking
    origin: structural
    axis: boundary
    timeout: 6
    sabotage: scope
  - name: secrets
    run: "@secrets"
    state: blocking
    origin: structural
    timeout: 6
    sabotage: secrets
  - name: no-test-tampering
    run: "@no-test-tampering"
    state: blocking
    origin: structural
    timeout: 6
    sabotage: no-test-tampering
  - name: decisions-reported
    run: "@decisions-reported"
    state: blocking
    origin: structural
    axis: compliance
    timeout: 6
    sabotage: decisions-reported
  - name: self-audit
    run: "@self-audit"
    state: shadow
    origin: structural
    axis: compliance
    timeout: 6
    sabotage: self-audit
  # The corpus validator (S-0007/D-14), and the only place the corpus is
  # checked since CI stopped running the battery twice (S-0002/A-4) — named, so
  # a red corpus does not read as a red test suite.
  - name: spec-valid
    run: "uv run torve spec check"
    input: worktree
    state: blocking
    origin: S-0007
    axis: form
    # 4.4s over three runs of the whole corpus, so 41 — the dearest gate that
    # is not one of the two suite runs, and it now sorts as one.
    timeout: 41
    sabotage: tests/test_rfc_check.py
  - name: source-layout
    run: "@source-layout"
    state: shadow
    origin: S-0014
    axis: form
    timeout: 6
    sabotage: source-layout
  # No corpus identifiers in user-facing strings (S-0011/D-11, S-0011/A-1).
  - name: user-facing-text
    run: "@user-facing-text"
    state: blocking
    origin: S-0011
    axis: compliance
    timeout: 6
    sabotage: user-facing-text
  # Style over the whole tree, which the battery did not check. `ruff check`
  # lived only in the `acceptance` fallback below — the list a run with no task
  # contract falls back to — so a task-contract run linted whatever its contract
  # happened to name, and none of them named ruff. `--check` on the formatter is
  # the other half: an unformatted file landed in S-0064 phase 1 and came back
  # twice, because nothing but a person running `ruff format` ever noticed.
  #
  # Enters at shadow and is promoted on soak evidence (S-0055/D-14).
  - name: lint
    run: "uv run ruff check . && uv run ruff format --check ."
    state: shadow
    origin: S-0015
    input: worktree
    # Both halves together measure 0.05s over three runs of the whole tree —
    # ruff is the cheapest thing in the battery, and 120 had it sorting eleventh
    # of thirteen. 7 is what a process start costs when nothing is cached.
    timeout: 7
    sabotage: tests/test_lint.py
  # The layer contracts over the whole package. A self-development gate
  # (S-0015/D-10): the tool is a dev dependency and never ships.
  - name: layering
    run: "uv run lint-imports"
    state: blocking
    origin: S-0015
    input: worktree
    # 0.17s over three runs of the contracts across the package.
    timeout: 9
    sabotage: tests/test_layering.py
  # Does the suite meet the attempt's changed lines (S-0036/D-1)? diff-cover
  # intersects coverage with the diff against {base} — the merge-base the
  # battery itself computed, substituted by the runner, so a gate never
  # resolves a ref in shell and live runs and replays measure one surface.
  # The judgment is the attempt's added and changed lines, never the inherited
  # tree and never a whole-repo threshold (S-0031's ratchet doctrine).
  #
  # The entry runs the suite before it can measure anything, so it has two
  # ways to go red under one name. It says which: a red suite ends here with
  # that sentence last, where the terminal and the retry's feedback pack both
  # read (T-0319), instead of filing a failing test under a name that says
  # coverage.
  - name: coverage-delta
    run: "uv run pytest --cov=src --cov-report=xml -q || { echo '== the suite is red, so the coverage delta was never measured — the failure above is a failing test, not a coverage shortfall =='; exit 1; }; uv run diff-cover coverage.xml --compare-branch {base} --fail-under 80"
    state: shadow
    origin: S-0036
    input: worktree
    # Measured, not guessed: 164s median over 228 runs, 271s at p90, 600s at
    # worst. The runner sorts the battery cheapest-first on this field, so an
    # absent timeout read as zero cost and put the dearest gate in the pass
    # ahead of every gate that declares one — spec-valid included.
    timeout: 600
    sabotage: coverage-delta
  # The managed AGENTS.md sections beside the code, rendered from the corpus
  # and drift-checked like the index (S-0054/D-7).
  - name: spec-projection
    run: "uv run torve spec project --check"
    input: worktree
    state: shadow
    origin: S-0054
    axis: form
    # 1.5s over three runs of the projection across 32 governed directories.
    timeout: 17
    sabotage: tests/test_colocation.py
  - name: acceptance
    run: "@task.acceptance"
    state: blocking
    origin: structural
    # The one entry whose cost is not this file's to measure: it runs whatever
    # commands the contract under work names, so its p90 is a property of the
    # contracts and not of the gate. The cap stands where it was, and the gate
    # sorts last, which is where the dearest gate belongs.
    timeout: 900
    sabotage: acceptance
    # Fallback for runs with no task contract (human pull requests).
    commands:
      - "uv run ruff check ."
      - "uv run ruff format --check ."
      - "uv run mypy src"
      - "uv run pytest"
