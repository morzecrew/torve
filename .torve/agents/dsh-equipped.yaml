# yaml-language-server: $schema=../schemas/agent.json
# What the agent is, for a seat on the dsh image (owner, 2026-11-03: deepseek
# runs in dsh, not in claude). `claude-equipped`'s two plugins are claude
# plugins and do not load here, so this profile carries no equipment of its
# own: the role's profile supplies the skills and the hook, and dsh's half of
# the hook is the scope guard alone (S-0072/D-3).
#
# The prompt used to ask this seat for what claude's Stop hook did — `torve log
# owed`, attestation entries, every decision row's check. All three went with
# the attestations (S-0122/D-14); the engine's `finish` below applies the
# formatter, and the battery runs the acceptance.
# The formatter's fixes, applied by the engine once the agent stops and before
# the tree leaves the sandbox (S-0122/D-4): 27 of 44 lint reds were format-only.
finish: "uv run ruff format --quiet . && uv run ruff check --fix --exit-zero --quiet ."
equipment: []
prompt_extras: |
  Prefer the smallest change that makes the acceptance commands pass.
