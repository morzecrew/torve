# of equipment (S-0062/D-1). It names no skill, so the profile named for the
# task's role supplies those under this layer (S-0062/D-12) — this file adds,
# it does not replace.
#
# The refs are the ones the image clones at. Until phase 2 mounts the cache the
# harness still names those clones by path in its own command; the declaration
# here is what the flag templates will be composed from.
