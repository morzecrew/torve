notes: |
  RFC 0011 executed to its currently-implementable extent: Typer plus Rich
  replace Click (the D-11.1 departure T-0009 recorded is closed), every
  result-producing command takes --format json emitting persisted record
  shapes, exit codes 0-5 are the escalation vocabulary's projection living
  in domain.py, --plain/NO_COLOR are honoured, stdout carries results and
  stderr diagnostics, and reap gained --dry-run. Presentation polish stays
  deferred per D-11.8, which is the RFC's own instruction.
