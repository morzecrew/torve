# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: One function answers whether a task landed
    intent: >-
      `landed` reads landing files from the base tree and the remote tips of document
      branches; every caller of the four old readers moves to it and they are deleted.
      Tests: a task landed on a document branch reads landed on a host with an empty
      stream; a squash-merged document's tasks read landed from the base; a rebase
      that renames shas changes nothing; dependencies, the reclaim, the thread leg's
      landings, the board and the night report agree. Settles D-1.
    scope:
      - src/torve/application/projections.py
      - src/torve/application/decisions.py
      - src/torve/cli/manager.py
      - src/torve/application/residency.py
      - src/torve/application/planner.py
      - src/torve/cli/night.py
      - src/torve/application/lane.py
      - tests/test_projections.py
      - tests/test_decisions.py
      - tests/test_manager.py
      - tests/test_manager_e2e.py
      - tests/test_residency.py
      - tests/test_plan.py
      - tests/test_cli.py
      - tests/test_lane.py
      - tests/test_lane_prevention.py
      - tests/test_why_record.py
      - src/torve/application/evals.py
      - src/torve/application/specquality.py
      - src/torve/application/ledger.py
      - src/torve/cli/fleet.py
      - src/torve/cli/status.py
      - tests/test_divergence.py
      - tests/test_context.py
      - tests/test_evals.py
      - tests/test_ledger.py
      - tests/test_specquality.py
      - tests/test_fleet.py
      - tests/test_fleet_cli.py
    acceptance:
      - >-
        uv run pytest tests/test_projections.py tests/test_decisions.py tests/test_manager.py
        tests/test_manager_e2e.py tests/test_residency.py tests/test_plan.py tests/test_cli.py
        tests/test_lane.py tests/test_lane_prevention.py tests/test_why_record.py
        tests/test_divergence.py tests/test_context.py tests/test_evals.py tests/test_ledger.py
        tests/test_specquality.py tests/test_fleet.py tests/test_fleet_cli.py
      - uv run mypy src
    character: structural
  - phase: 2
    title: >-
      Seats are metered from streamed responses, and attempts keep counting
    intent: >-
      `_meter` reads Anthropic and OpenAI streamed usage including cache tokens; `BurnEvent`
      and `seat.consumed` carry the four counts; the runner numbers an attempt from
      the record's attempts for the task. Tests: a recorded Anthropic SSE body and
      an OpenAI chunked body meter their real counts; a JSON body meters as before;
      a requeued task's next attempt is numbered after its last. Settles D-7 and D-8.
    scope:
      - src/torve/adapters/broker/local.py
      - src/torve/application/eventlog.py
      - src/torve/application/ports.py
      - src/torve/domain/events.py
      - src/torve/application/runner.py
      - src/torve/application/runstate.py
      - tests/test_broker.py
      - tests/test_eventlog.py
      - tests/test_events.py
      - tests/test_runner.py
      - tests/test_run_loop.py
      - tests/test_attempt_record.py
      - src/torve/application/worker.py
      - src/torve/application/executors.py
      - tests/test_residency.py
      - tests/test_worker.py
      - tests/test_state_parity.py
      - tests/test_taskstore.py
      - tests/test_run_integration.py
    acceptance:
      - >-
        uv run pytest tests/test_broker.py tests/test_eventlog.py tests/test_events.py
        tests/test_runner.py tests/test_run_loop.py tests/test_attempt_record.py tests/test_residency.py
        tests/test_worker.py tests/test_state_parity.py tests/test_taskstore.py tests/test_run_integration.py
      - uv run mypy src
    depends_on:
      - 1
    character: routine
  - phase: 3
    title: >-
      The lane reads a document from its branch and its battery from the forge
    intent: >-
      The carried tasks come from the remote branch's landing files in landing order;
      the completion battery writes `torve/completion` on the judged tip and the draft
      flag reads it; the forge port gains the status write and read. Tests: the pull
      request body lists the branch's tasks with an empty stream; a red status keeps
      the pull request a draft and a green one at a later tip publishes it; a second
      host reading the same remote decides the same. Settles D-2 and D-4.
    scope:
      - src/torve/application/lane.py
      - src/torve/cli/merge.py
      - src/torve/application/ports.py
      - src/torve/adapters/vcs/git.py
      - tests/test_lane.py
      - tests/test_lane_prevention.py
      - tests/test_forge.py
      - tests/test_cli.py
      - src/torve/application/reviewleg.py
      - tests/test_reviewleg.py
    acceptance:
      - >-
        uv run pytest tests/test_lane.py tests/test_lane_prevention.py tests/test_forge.py
        tests/test_cli.py tests/test_reviewleg.py
      - uv run mypy src
    depends_on:
      - 2
    character: structural
  - phase: 4
    title: >-
      A round carries its own description, and open documents come from the remote
    intent: >-
      The review leg writes `round:` into the round's contract; the wave, the requeue's
      rescope and the morning report read the board; the lane and the leg find open
      documents from the remote's branches and ask the forge at most once per pass.
      Tests: a round minted on one host is in the wave of another; a requeue rescopes
      from the contract; an idle pass makes no forge call. Settles D-3 and D-5.
    scope:
      - src/torve/application/reviewleg.py
      - src/torve/application/lane.py
      - src/torve/cli/manager.py
      - src/torve/application/manager.py
      - src/torve/domain/task.py
      - tests/test_reviewleg.py
      - tests/test_pr_review.py
      - tests/test_lane.py
      - tests/test_manager.py
      - tests/test_task_records.py
    acceptance:
      - >-
        uv run pytest tests/test_reviewleg.py tests/test_pr_review.py tests/test_lane.py
        tests/test_manager.py tests/test_task_records.py
      - uv run mypy src
    depends_on:
      - 3
    character: structural
  - phase: 5
    title: No decision reads telemetry, and legs settle
    intent: >-
      The remaining readers move off the stream; a test refuses `stream_rows` outside
      the ledger, the evals and the night report; identical leg failures back off,
      re-raises on an unchanged head are not recorded, and a candidate red twice at
      the same base and head escalates. Tests: the import boundary; a leg failing
      the same way three times records once per wait; the third red escalates. `doctor`
      and the lane refuse document or pull-request landing on a mock store. Settles
      D-6, D-9, D-10 and D-11.
    scope:
      - src/torve/application/projections.py
      - src/torve/application/lane.py
      - src/torve/cli/manager.py
      - src/torve/application/reviewleg.py
      - src/torve/application/residency.py
      - src/torve/application/planner.py
      - src/torve/cli/merge.py
      - tests/test_layout.py
      - tests/test_lane.py
      - tests/test_manager.py
      - tests/test_reviewleg.py
      - tests/test_residency.py
      - tests/test_plan.py
      - tests/test_cli.py
      - src/torve/cli/doctor.py
      - src/torve/cli/fleet.py
      - src/torve/application/telemetry.py
      - tests/test_doctor.py
      - tests/test_fleet.py
      - tests/test_fleet_cli.py
      - tests/test_intake.py
    acceptance:
      - >-
        uv run pytest tests/test_layout.py tests/test_lane.py tests/test_manager.py
        tests/test_reviewleg.py tests/test_residency.py tests/test_plan.py tests/test_cli.py
        tests/test_doctor.py tests/test_fleet.py tests/test_fleet_cli.py tests/test_intake.py
      - uv run mypy src
    depends_on:
      - 4
    character: structural
  - phase: 6
    title: The architecture pages name each fact's carrier
    intent: >-
      `pages/docs/architecture/state.md` and `record.md` carry the carriers table
      and drop the claim that telemetry decides nothing while the lane read it; `operating.md`
      says where an operator looks for each fact.
    scope:
      - pages/docs/architecture/state.md
      - pages/docs/architecture/record.md
      - pages/docs/operating.md
    acceptance:
      - uv run torve spec check
    depends_on:
      - 5
    character: routine
