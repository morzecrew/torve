    claim: >-
      D-5 requires a review round's branch, pull request, target, findings and phases
      to ride in its own contract under `round:`, and `task.minted` to carry it. A
      normal pydantic field on Task reaches Document, and Document.model_json_schema()
      embeds Task in $defs, so adding one field changes .torve/schemas/document.json,
      decisions.json, phasing.json and amendments.json — four tracked artefacts outside
      the contract's scope.allow. The generated schema and the scope gate therefore
      cannot both stay green. Resolved by carrying `round:` through a PrivateAttr
      lifted out by a wrap validator: the contract still carries the mapping and every
      reader still reads task.round, but the model's generated schema is byte-identical
      to the base and no tracked schema needs regenerating.
    evidence: >-
      src/torve/domain/task.py:221 — `_round: RoundRecord | None = PrivateAttr(default=None)`,
      lifted from the contract's `round:` mapping by the wrap validator at src/torve/domain/task.py:255-274
    action: decided
    proposal: >-
      D-5's consequence should say the round rides in the contract's `round:` mapping
      while staying off Task's JSON-schema surface — either by widening the task's
      scope to admit .torve/schemas/*.json, or by naming the private-attribute carrier
      as the sanctioned shape.
