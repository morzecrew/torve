# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      The pack's small deterministic files arrive in the attempt's first message rather
      than behind a read; `decisions.json` stays behind one
    paths:
      - src/torve/adapters/agent/harness.py
      - src/torve/application/contextpack.py
    consequence: >-
      seven round trips every attempt spends opening what the engine wrote become
      zero, and the attempt starts with what the engine intended rather than with
      what it opened first
    rationale: >-
      measured: the same seven files in the same order, every attempt, before any
      work — and they are small, while `decisions.json` is 17.5 KB and often unopened
    cites: [S-0054/D-10]
  - id: D-2
    grade: ASSUMED
    text: >-
      For a scope under a configured size, the in-scope files' contents and the tests
      `tests.json` names are delivered with the task; over it, an outline of the same
      files is delivered instead
    paths: [src/torve/application/contextpack.py, .torve/config.yaml]
    consequence: >-
      the sixteen calls a small attempt spends reading files the contract already
      named become one read of one document
    rationale: >-
      the engine resolves the scope against the tree before dispatch and the lint
      refuses a glob matching nothing, so the files are known; T-0395 spent sixteen
      calls re-deriving two of them, reading one 900-line module twice
    cites: [S-0054/D-11]
  - id: D-3
    grade: LOCKED
    text: >-
      The hand-over is judged by the orientation class and the landing rate together,
      and is reverted if orientation falls while attempts per landing rises
    paths: [src/torve/application/contextpack.py]
    consequence: >-
      a change that buys turns by making attempts worse is caught by the measurement
      that motivated it rather than defended by it
    rationale: >-
      a model that chose what to read may understand it better than one handed a wall
      of text; the argument cannot be settled by reasoning and both numbers exist
      once S-0075 lands
    cites: [S-0075/D-2]
  - id: D-4
    grade: ASSUMED
    text: >-
      The cap on what one tool result may return is enforced at the harness's own
      result boundary, where every tool crosses it, and the prompt's reading advice
      names the shell forms beside the reader's
    paths: [src/torve/adapters/agent/harness.py, .torve/harnesses/**]
    consequence: >-
      the context's growth term stops being set by whichever command dumped the most,
      whichever tool that command used
    rationale: >-
      measured across 21 retained traces: 237 of the corpus's file reads are `cat`
      and `sed`, against 185 distinct paths the reader touched at all. A rule shaped
      around ranged reads governs the smaller half and a cap at the result boundary
      governs both, so the cap is the load-bearing clause and the advice is the cheaper
      one
    cites: [S-0075/D-2]
  - id: D-5
    grade: ASSUMED
    text: >-
      The pack writes a file naming every symbol the repository defines and where
      — the whole tree, not the scope — and the pack's own index names that file;
      the symbols are a file the attempt may grep, never content the prompt carries
    paths: [src/torve/application/contextpack.py]
    consequence: >-
      a lookup costs one call against one file instead of two or three against the
      tree, and an attempt that never looks pays nothing for it
    rationale: >-
      `ast` over this tree names 4,179 symbols in 241 KB — roughly 60k tokens, larger
      than the whole prefix and multiplied by every request, so an index in the prompt
      spends about 2.1M cache-read tokens on a 35-request attempt to save calls that
      cost 828 bytes each. Whole-tree rather than scoped because the lookups are for
      definitions the scope does not contain: that is why they are greps and not reads.
      The pointer rides the pack's index rather than the rules skill because it is
      a fact about what this attempt was given, not a rule about how to work — and
      a rule shipped first would name a file that did not exist yet
    cites: [S-0075/D-2]
