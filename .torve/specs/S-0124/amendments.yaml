# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-11-06T10:43:12Z'
    title: Each phase names the rows it delivers
    md: |
      Phases 1, 2, 3 and 5 all edit `runner.py`, and phases 4 and 7 both edit `lane.py`. The
      critic counted a row as a task's own whenever the row's paths met its scope, so phase 1's
      first attempt (T-0808) was blocked for not delivering D-5, D-8 and D-11, which belong to
      phases 2, 3 and 5. Each phase now lists the rows it settles in `delivers`, and the critic
      holds its tasks to those alone. No row's text, grade or paths changes.
  - id: A-2
    at: '2026-11-06T14:20:14Z'
    title: >-
      Phase 1 owns the critic test that pins the old revision count
    md: |
      `tests/test_critic.py` runs `critic_config()`, a critic-mode review that names no
      revision budget, and asserts its first round reads `revision 1 of 1`. D-2 makes that
      budget 2, so the line reads `revision 1 of 2`. Phase 1's acceptance already runs the
      file, but its scope did not own it, so the only edit that passes was an edit the
      `no-test-tampering` gate convicts. T-0808's seventh attempt stopped on it. Phase 1's
      scope now includes `tests/test_critic.py`. No row's text, grade or paths changes.
  - id: A-3
    at: '2026-11-12T02:44:26Z'
    title: >-
      A revision runs on the task's own seat by default (S-0127/D-5)
    changes:
      - subject: D-1
        field: text
        before: >-
          A revision attempt, one whose task has a feedback record at the root, is
          class S and runs one candidate, on the tier `revision_variant` names
        after: >-
          A revision attempt, one whose task has a feedback record at the root, is
          class S and runs one candidate, on the task's own seat under `review.revision:
          off`, the default, and on the tier `revision_variant` names only when a
          configuration names `fresh` or `session` (S-0127/D-5)
      - subject: D-1
        field: fingerprint
        after: 6082ef6597dc8b06/14bd8ed0a79735ba
    md: |
      Amended on 2026-11-12 in the pull request that accepts S-0127 (S-0127/Q-6).
      S-0127/D-5 makes `off` the default: the attempt after a block is a fresh one on the task's own seat, not the Opus revision variant, which a configuration can still choose.
  - id: A-4
    at: '2026-11-12T02:44:32Z'
    title: One revision round by default (S-0127/D-5)
    changes:
      - subject: D-2
        field: text
        before: >-
          Under `review.mode: critic` a surviving blocker spends `review.blocker_revisions`
          revision rounds when the configuration names it, else 2; classic mode keeps
          1
        after: >-
          Under `review.mode: critic` a surviving blocker spends `review.blocker_revisions`
          revision rounds when the configuration names it, else 1 under `review.revision:
          off`, the default (S-0127/D-5), and 2 under `fresh` or `session`; classic
          mode keeps 1
      - subject: D-2
        field: fingerprint
        after: e279a2361f1bc149/0a34d1913148e82b
    md: |
      Amended on 2026-11-12 in the pull request that accepts S-0127 (S-0127/Q-6).
      Under S-0127/D-5's default a blocker gets one fresh attempt, and a blocker surviving it escalates; a configuration naming a number or a revision mode keeps today's rounds.
  - id: A-5
    at: '2026-11-12T02:44:39Z'
    title: >-
      A re-raise repeats the claim, not the line (S-0127/D-4)
    changes:
      - subject: D-3
        field: text
        before: >-
          Each revision round records its blocking findings' anchors in the run's
          history; a blocking finding anchored in the same file within `threads.WINDOW`
          lines of one the previous round recorded, or in the same file when either
          has no line, is re-raised, and the run escalates `blocker_finding` naming
          it instead of spending another round
        after: >-
          Each revision round records its blocking findings' anchors, kinds and rows
          in the run's history; a blocking finding is re-raised only when it repeats
          an earlier round's blocker, by naming the same row, or by having the same
          `kind`, a citation whose span overlaps the earlier blocker's span as mapped
          into the current tree, and a matching claim (S-0127/D-4), and the run escalates
          `blocker_finding` naming it instead of spending another round
      - subject: D-3
        field: fingerprint
        after: 26c0ca66e1890242/85d1b94f6e0dc6fb
    md: |
      Amended on 2026-11-12 in the pull request that accepts S-0127 (S-0127/Q-6).
      Distance alone named new findings near an old anchor as re-raises. S-0127/D-4 asks a re-raise to repeat the row, or the kind, span and claim, so a new blocker near an old one is a new blocker inside the revision budget.
  - id: A-6
    at: '2026-11-12T04:01:29Z'
    title: >-
      The first green wins and cuts the rest (S-0127/D-6)
    changes:
      - subject: D-4
        field: text
        before: >-
          Under `review.mode: critic` a unit's candidates start together; from the
          first green candidate's finish, a candidate whose agent turn runs past `straggler_clock`
          of that wall time is cancelled and recorded red, a gate pass already running
          is never cancelled, an escalating candidate cancels the others' turns, and
          candidates are ordered by index before collapse and pre-rank
        after: >-
          Under `review.mode: critic` a unit's candidates start together; when the
          first finishes green it wins and the others' agent turns are cancelled and
          recorded red, a gate pass already running is never cancelled, an escalating
          candidate cancels the others' turns, and candidates that finish together
          are ordered by index (S-0127/D-6)
      - subject: D-4
        field: fingerprint
        after: eff6ee2e1de73fa6/f9347bebfb8f8e32
    md: |
      Amended on 2026-11-12 while building S-0127.
      S-0127/D-6 replaced the straggler clock, the collapse of identical diffs and the pre-rank with the first green finisher; S-0127/Q-6 missed this row, and building S-0127's phase 2 found it.
  - id: A-7
    at: '2026-11-12T04:02:19Z'
    title: The bound is the class's (S-0127/D-9)
    changes:
      - subject: D-7
        field: text
        before: >-
          The unit's $3 bound is checked before its candidates launch, before each
          critic call and before a revision turn, so work launched under the bound,
          a batch of candidates, a critic call or a turn, may finish above it by that
          work's own spend; a cancelled candidate's spend from the turns it finished
          still counts
        after: >-
          The unit's bound, its class's notional-spend cap (S-0127/D-9), is checked
          before its candidates launch, before each critic call and before a revision
          turn, so work launched under the bound, a batch of candidates, a critic
          call or a turn, may finish above it by that work's own spend; a cancelled
          candidate's spend from the turns it finished still counts
      - subject: D-7
        field: fingerprint
        after: dd7724e4dea908d9/f9347bebfb8f8e32
    md: |
      Amended on 2026-11-12 while building S-0127.
      S-0127/D-9 replaced the flat $3 with the class's cap; when the bound is checked is unchanged. S-0127/Q-6 missed this row, and building S-0127's phase 2 found it.
