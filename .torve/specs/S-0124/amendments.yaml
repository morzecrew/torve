  - id: A-12
    at: '2026-11-23T10:19:43Z'
    title: A resumed turn's cost is the session's
    changes:
      - subject: D-14
        field: text
        before: >-
          A harness manifest's `session: true` says its image's `run` continues the
          session `TORVE_SESSION_ID` names, with `TORVE_PROMPT` as the next turn's
          task, and a seat whose manifest says so keeps its session for D-8's revision
          turn, as a dsh seat always does through its own driver (S-0122/D-11); any
          other seat falls back to `fresh` as before. The Claude Code manifests declare
          it and their image passes the id to `claude -p --resume`; the engine reads
          the id off the attempt's trace, runs `run` alone so nothing is equipped
          again, appends the turn's stream to the trace, and adds the turn's cost
          and token counts, and the receipt its context curve is checked against,
          to the earlier turns', so those are the attempt's whole as a dsh session's
          totals are
        after: >-
          A harness manifest's `session: true` says its image's `run` continues the
          session `TORVE_SESSION_ID` names, with `TORVE_PROMPT` as the next turn's
          task, and a seat whose manifest says so keeps its session for D-8's revision
          turn, as a dsh seat always does through its own driver (S-0122/D-11); any
          other seat falls back to `fresh` as before. The Claude Code manifests declare
          it and their image passes the id to `claude -p --resume`; the engine reads
          the id off the attempt's trace, runs `run` alone so nothing is equipped
          again, appends the turn's stream to the trace, and adds the turn's token
          counts, and the receipt its context curve is checked against, to the earlier
          turns', while the turn's cost, which claude reports for the whole session,
          replaces theirs, so those are the attempt's whole as a dsh session's totals
          are
      - subject: D-14
        field: fingerprint
        after: 3721d5441ffa1ec1/d64cc616a0c2dfed
    md: |
      Measured on the bed (13 documents, 3 trials, a Claude Sonnet 5.5 executor on the subscription seat). Each of the 29 session revisions resumed its claude session. On each, the resumed envelope's `total_cost_usd` and `modelUsage` covered the whole session, while its `usage` covered the turn alone. Summing the turns counted the earlier turns' cost twice: a candidate whose first turn cost $2.01 and whose session came to $3.40 recorded $5.41. The token counts were right.

      No cap moved on the bed. A roster-priced seat is costed from its tokens, and a subscription seat's cost reads as unreported. But a seat the roster says nothing about passes the adapter's figure through as its cost, so its revision would have spent the earlier turns against the unit's budget a second time.
  - id: A-13
    at: '2026-11-23T13:43:27Z'
    title: >-
      An attempt a session revision re-gated is counted once
    changes:
      - subject: D-15
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-15
        field: paths
        before: []
        after:
          - src/torve/application/streams.py
          - src/torve/application/ledger.py
          - src/torve/application/projections.py
          - src/torve/cli/ledger.py
          - scripts/measure/__main__.py
      - subject: D-15
        field: text
        before: <decision>
        after: >-
          A session revision's turn re-runs the gates inside its attempt (D-8), so
          the telemetry stream and the record hold a row per gate pass for that attempt,
          each carrying the attempt's whole agent block so far. Every reader that
          counts attempts or sums their spend folds an attempt's rows into its newest,
          keyed by its task, attempt stamp and candidate as `torve why` groups them:
          the ledger's attempts, seats and burn population, the context report's attempt
          blocks, the harness populations and the bed's trial cost. A row with a kind,
          or with no attempt stamp, is counted as it stands
      - subject: D-15
        field: fingerprint
        after: 76336cdf82ba390e/89da74ff71f50811
    md: |
      Measured on the bed (13 documents, 3 trials, a Claude Sonnet 5.5 executor). 29 of the 39 attempts took a session revision. Each re-ran the gates inside its attempt, so the stream held 68 executor rows for 39 attempts, and the second row of each carried the attempt's whole block. The ledger counted 68 attempts, and the ledger and the bed's trial cost summed both rows, counting 1.09M output tokens twice. `torve why` already folded to the later row.
  - id: A-14
    at: '2026-11-23T14:48:02Z'
    title: >-
      The attempt fold spares shadow replays and reaches the why regime
    changes:
      - subject: D-15
        field: text
        before: >-
          A session revision's turn re-runs the gates inside its attempt (D-8), so
          the telemetry stream and the record hold a row per gate pass for that attempt,
          each carrying the attempt's whole agent block so far. Every reader that
          counts attempts or sums their spend folds an attempt's rows into its newest,
          keyed by its task, attempt stamp and candidate as `torve why` groups them:
          the ledger's attempts, seats and burn population, the context report's attempt
          blocks, the harness populations and the bed's trial cost. A row with a kind,
          or with no attempt stamp, is counted as it stands
        after: >-
          A session revision's turn re-runs the gates inside its attempt (D-8), so
          the telemetry stream and the record hold a row per gate pass for that attempt,
          each carrying the attempt's whole agent block so far. Every reader that
          counts attempts or sums their spend folds an attempt's rows into its newest,
          keyed by its task, attempt stamp and candidate as `torve why` groups them:
          the ledger's attempts, seats and burn population, the context report's attempt
          blocks, `torve why`'s regime comparator, the harness populations and the
          bed's trial cost. A row with a kind, a shadow replay's, or one with no attempt
          stamp, is counted as it stands: a replay can share a live attempt's stamp,
          and the readers drop replays only after the fold
      - subject: D-15
        field: fingerprint
        before: 76336cdf82ba390e/89da74ff71f50811
        after: 5790c93e2aaa60e8/89da74ff71f50811
    md: >-
      Found in review of the first change. A shadow replay's row can carry the stamp
      of the live attempt it replays. Where it followed the live row, the fold kept
      the replay, and the ledger then dropped it as a replay, so the live attempt
      and its spend left the count. A replay now passes the fold untouched. `torve
      why` folded its task's own attempts, but its regime comparator read the unfolded
      stream, so a re-gated attempt's earlier pass was a second member of the population
      at a partial cost.
