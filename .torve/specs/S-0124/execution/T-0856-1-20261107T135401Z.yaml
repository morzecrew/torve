entries:
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    at: '2026-11-07T13:18:16Z'
    claim: >-
      Reality contradicts the claim: the tree defines no `_merge_tree`, and `_carry_checkpoint`
      has no git<2.40 branch. Its only merge-tree call runs `git merge-tree --write-tree
      --merge-base=<old>` directly, and the commit-tree it uses writes the carried
      tree under the checkpoint tip message, not a "torve: checkpoint merge anchor".
      The cited line 2276 is a `state: RunState` parameter, not a call. The cited
      test fails on this host because git 2.39 lacks `merge-tree --merge-base`, not
      because a fallback is present in the tree, so there is nothing unlicensed to
      remove.
    evidence: >-
      src/torve/application/runner.py:2210 — the function at this line is `_carry_checkpoint`,
      not `_merge_tree`; the module defines neither `_merge_tree` nor any "checkpoint
      merge anchor" string. `src/torve/application/runner.py:2244` is the only merge-tree
      call (`--write-tree --merge-base=<old>`, no fallback), and `src/torve/application/runner.py:2252`
      is the commit-tree that reuses the tip message from `runner.py:2245`; `src/torve/application/runner.py:2276`
      is the `state: RunState` parameter of `_run_task_async`, not a call site.
    action: departed
    proposal: >-
      Add no row licensing a git<2.40 merge-tree fallback or a checkpoint merge anchor:
      the checkpoint carry uses `merge-tree --write-tree --merge-base=` alone, and
      any older-git support is a separate decision about the host toolchain, not part
      of this path.
