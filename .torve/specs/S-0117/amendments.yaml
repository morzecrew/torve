amendments:
  - id: A-1
    at: '2026-11-02T17:31:26Z'
    title: >-
      Each phase owns the existing tests of the modules it allows
    md: >-
      `torve plan S-0117` refused the contracts: a contract that allows a module without
      each of its existing test files does not lint (the T-0113 rule). Phase 1 allows
      `src/torve/application/review.py`, which also pairs with `tests/test_review_corpus.py`
      and `tests/test_review_role.py`; phases 2 and 3 allow `src/torve/cli/manager.py`,
      which also pairs with `tests/test_manager_e2e.py`. Each phase's scope gains
      those files and its acceptance runs them. No row changes.
