risks: |
  A row that still mattered may have been left out. Every archived document stays readable
  with `torve spec show`, and a missed rule comes back through `torve spec add-decision` citing
  where it came from. The opposite risk is a row kept here whose code the rebuild deletes;
  `torve spec check` names a row whose paths match nothing, and the rebuild retires it.
