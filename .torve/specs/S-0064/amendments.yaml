# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-12T07:20:08Z'
    title: Phase 1 was two phases wearing one number
    md: |-
      `torve plan` called the original phase 1 `too_large` at 23 allow globs, and reading it back the verdict was right about more than the count: the phase wrote a new module, folded the broker's provider table into it, changed how a seat resolves, took a field off the harness manifest and moved the cost ledger onto a new number. Five things, one contract, and a reviewer with no seam to stop at.

      It is two now. The first writes down what the engine has never been able to read — the record, the roster, and the arithmetic a price makes possible — and changes nothing about how a seat resolves or what any image receives. The second spends it: the seat resolves against the roster, and four failures that were discovered by an attempt become configuration errors named before a sandbox exists. The old phases 2 and 3 shift to 3 and 4 with their contents untouched.

      What this does not do is get under the threshold. Phase 1 is 15 globs against a bar of 10, and the remainder is one new module, the configuration it absorbs, the two places that render it and a test file per module that S-0055's own lint requires. Splitting further would separate a file from the code that reads it, which is a worse contract than a large one. The verdict is recorded rather than engineered away: `torve size` is advisory, and this is the case it is advising about.
  - id: A-2
    at: '2026-09-12T08:20:39Z'
    title: >-
      Phase 1 writes a schema, and two assertions count the schemas
    md: |-
      T-0350 attempt 2 was convicted on `scope` and `no-test-tampering`, and the conviction was correct against a contract that was not. The phase adds `provider.json` to what `torve init` writes, and two tests assert the full roster of schema filenames — `tests/test_cli.py` and `tests/test_rfc_check.py`, one line each, a sorted list gaining one entry. Neither was in the phase's scope, so the only way to leave the suite green was to leave the scope.

      Worth stating plainly because the failure is an authoring failure, not an execution one: the executor wrote 376 lines of the module and 402 of its tests, left every acceptance command green, and correctly declined to invent a roster for a provider nothing is seated on. It was convicted for adding one string to a sorted list in a file the contract had not thought of.

      The general shape is worth carrying: a phase that adds a file the engine *writes* reaches every assertion that enumerates what the engine writes. Phases 2 through 4 add no schema, so the correction is phase 1's alone.
  - id: A-3
    at: '2026-09-12T08:47:50Z'
    title: Two questions the first live phase raised
    md: |-
      Both came out of running phase 1 and reading what it wrote, and both are recorded rather than answered because neither blocks the remaining phases.

      Q-2 is a case D-12 does not have. The row offers a price or no per-token cost, and the ModelStudio seat is neither: it is reached by API key and billed against a prepaid weekly token quota, so its attempts cost something real that dollars-per-token does not describe. The record now carries no price for it, which is the honest half — the dishonest half was there until this amendment, because phase 1 wrote `price: {input: 0.30, output: 1.20, cache_read: 0.06}` under a header claiming everything below was measured, and nothing had measured that. A figure invented on a plan that is not billed per token is exactly the failure this document was written about, arriving inside the fix for it.

      Q-3 asks whether a price should be fetched at all. Measured while asking, and the split is clean enough to record: OpenRouter publishes prices for all 445 of its models, ModelStudio's plan publishes nothing, and neither Anthropic nor OpenAI has a public pricing API. So fetching cannot be the mechanism; at most it is an optional source a record names.

      The clock moves here too, for the same reason and from the same run: `runtime.agent_timeout` was 1200 and T-0350's first attempt hit it at 1200.3s mid-write, while its second finished the same work in 987s. 2200 is what the phase actually needed. A seat may already name its own `agent_timeout`, so this is the fallback for one that does not — and a task whose character deserves a longer clock reaches one the way it reaches a heavier model, through a seat variant.
  - id: A-4
    at: '2026-09-12T09:48:17Z'
    title: >-
      Phase 2's scope, as wide as removing a field actually is
    md: |-
      The third scope correction on this document, and the first where the pattern is clear enough to name rather than just fix. A-2 widened phase 1 because adding a file the engine *writes* reaches every assertion that enumerates what it writes. This widens phase 2 because **removing a field from a configuration model reaches every place that reads it and every test that constructs one** — `api_key_env` had four readers in `src` and appeared in nine test modules, against a phase that named one reader and five modules.

      Both corrections share a cause worth stating plainly: a phase's scope was written from the decisions it implements rather than from the surfaces those decisions touch, and a decision's own `paths` are where it is *decided*, never the full set of places that consult it. Nothing automatic catches this — `lint-contract` checks a contract against the tree, not against work that has not happened yet — so the honest mitigation is to widen at authoring and let the scope gate convict a phase that reaches past what it declared, rather than the reverse.

      The scope also takes `.torve/providers/**`, which is not strictly this phase's work. Three records land with it — OpenRouter, DeepSeek's own two models, and the Anthropic route on ModelStudio — and they are what made the refusals real rather than theoretical: every one of those providers serves two dialects, which is precisely what forced a seat to say which it reaches instead of the engine picking. A phase that could only be tested against one single-dialect provider would have shipped a refusal nobody had seen fire.
