      manifest that carried DSH_MODEL carries no `env` at all: every value in that
      JSON string is a scalar the engine validates against a record, so the knob that
      was opaque to torve is gone rather than shortened.
    evidence: >-
      .torve/harnesses/dsh.yaml:25 — the env block is replaced by the reason it went,
      and model_overlay.py maps torve dialect keys onto pi-ai own.
    action: decided
