# yaml-language-server: $schema=../../schemas/document.json
id: S-0064
title: >-
  A provider is a record, and the seam carries scalars
kind: design
status: accepted
implementation: none
depends_on: [S-0063]
informed_by: [S-0055, S-0061, S-0062]
supersedes: []
superseded_by: null
owner: Lev Litvinov
schema_version: 4
summary: |-
  Everything a harness needs to reach a model becomes a typed record the engine owns, and the seam between engine and image carries flat scalars instead of a JSON blob.

  A provider is a file under `.torve/providers/`, holding one credential, one model roster, and a route per API dialect. A harness manifest declares which dialects it speaks, so a seat pairing one that cannot reach the other is refused at load rather than by an attempt that dialled and got a 404. The broker's provider table folds in, and brokered-versus-direct stops being a shape the images branch on: it becomes the value of one variable.
motivation: |-
  Retiring the seven baked dsh overlays (S-0063/D-15) moved a model's facts onto one environment knob and dropped every *endpoint* fact with the files. Five of the seven overlays had carried identical copies of those facts, which is the tell nobody read at the time: they were never properties of a model, they were properties of the route.

  What that cost was measured on 2026-09-11. The live dsh seat ran a reasoning model with `reasoningEfforts: false` hardcoded into its generator, against a context window declared at an eighth of its real size, with no request cap and no compat block. Its own trace reads `reasoningTokens: 0` across 33 requests while the endpoint returns 33 reasoning tokens for a two-word prompt. T-0346 restored those six values to the knob, and said in its own divergence entry that they ride there because there is nowhere else to put them.

  This document builds the somewhere else. The argument is not that a JSON blob is ugly — it is that torve cannot validate what it cannot name, so a value that goes stale inside `DSH_MODEL` is a value no gate can miss. Nothing in the engine could have told the operator that the knob had stopped carrying half of what the deleted files did.

  The second half arrived from the same probes. ModelStudio serves two API dialects at two base URLs on one credential, and the same model behaves differently on each: the OpenAI route returns thinking as `reasoning_content` and rejects the `developer` role, the Anthropic route returns native `thinking` blocks and has no such role to reject. So the unit that owns an endpoint's quirks is a route, not a provider — and Claude Code drives qwen3.8-flash end to end over the Anthropic route with no translation anywhere in the stack, which is a seat this repository could run today and cannot express.
current_state: |-
  Three files hold pieces of one answer, and none of them holds a model's facts.

  `.torve/config.yaml` carries `broker.providers.<name>` — `key_env`, `upstream`, `via_proxy` — which is the runner's routing table and nothing more. It knows how to reach a provider and nothing about what that provider serves.

  `.torve/harnesses/<name>.yaml` carries `env`, a map torve sets and never interprets (S-0063/D-10). dsh's entry is a JSON document in a string: provider, dialect, window, cap, reasoning level, two timeouts and a compat block. claude's is a scalar, `CLAUDE_PERMISSION_MODE`. Same key, two vocabularies, one of them opaque.

  The seat in `config.yaml` names `model` and `provider` as bare strings that nothing resolves against a roster — a seat may name a model its provider does not serve, and the first evidence is an error from the endpoint.

  At the seam, `TORVE_BROKER_URL` and `TORVE_BROKER_TOKEN` are present or absent, and three images branch on that: claude maps them onto `ANTHROPIC_BASE_URL`/`ANTHROPIC_AUTH_TOKEN` behind two `if`s, dsh's generator changes the *shape* of the overlay it writes, and mimo refuses a brokered seat outright with exit 78. Nine references across three definitions, all testing the same thing.
goals: |-
  - A provider's facts live once, in a file the engine validates and hashes.
  - A seat naming a model, a dialect or a reasoning level its provider does not serve is refused at load, naming both files — the refusal S-0063/D-4 already performs for equipment kinds.
  - Every parameter crosses the seam as a scalar in torve's vocabulary and units; each image assembles its own representation.
  - Brokered and direct differ by the value of a variable, never by its presence — no image branches on the broker.
  - A claude seat can run a non-Anthropic model through an Anthropic-dialect route, because that is measured to work and nothing but configuration prevents it.
non_goals: |-
  - Translating between dialects. The broker forwards; it does not rewrite a request from one API shape into another, and the measurement that makes this document possible is precisely that no translation is needed.
  - Modelling every quirk. A value torve cannot validate rides through untouched and visibly so; inventing a name for it would be a schema the engine has to keep up with across three harnesses (S-0063/D-3's argument).
  - The cost surfaces themselves — the evals ledger, the per-regime medians, the anomaly thresholds. What this document adds is the one fact those surfaces lack (D-12): a price beside the model, so the number they read is computed rather than believed. How they present it is unchanged.
  - Per-role reasoning. The level is the seat's because it must validate against the model, and the model is the seat's.
design:
  - key: the-provider-record
    md: |-
      A provider is one file, and the sample below is entirely values this repository has either already written down or measured:

      ```yaml
      name: modelstudio
      key_env: MODELSTUDIO_CODING_API_KEY
      via_proxy: false
      request_timeout_s: 600
      stream_idle_timeout_s: 120

      routes:
        openai:
          base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
          compat: {thinking_format: deepseek}
        anthropic:
          base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic

      models:
        qwen3.8-flash:
          context_window: 1000000
          max_tokens: 65536
          reasoning: [none, minimal, low, medium, high, xhigh, max]
          price: {input: 0.30, output: 1.20, cache_read: 0.06}
        opus:
          id: anthropic/claude-opus-4
          context_window: 200000
          max_tokens: 32000
      ```

      Three strata, and the point of the file is that each value sits in exactly one of them.

      The **provider** holds what one credential buys: the key's variable name, whether the runner's own upstream leg tunnels through a proxy, and the clocks. The clocks are here rather than per route because a wedged stream is a property of the network path to a vendor, and the incident that produced these two numbers — a trickling stream that idled two attempts to the full agent cap — did not care which URL it was trickling from.

      A **route** holds what a dialect changes. The reasoning levels above came out of a 400 that enumerated them, and the `thinking_format` flag exists on the OpenAI route and not the Anthropic one because the Anthropic route returns native `thinking` blocks. That asymmetry is the whole argument for routes existing: the same model, on the same credential, differs by URL.

      A **model** holds what is true of the model wherever it is reached. `reasoning` is a list rather than a boolean so the seat's choice has something to be refused against, and `price` is optional because a subscription seat has no per-token cost and must say so rather than report zero.

      `broker.providers.<name>` folds in whole, leaving `broker:` with `adapter`, `mode` and `cost_tolerance` — the three things that are about the broker rather than about a provider.
  - key: the-pairing-refusal
    md: |-
      A harness manifest gains one field:

      ```yaml
      # .torve/harnesses/claude-subscription.yaml
      api: [anthropic]

      # .torve/harnesses/dsh.yaml
      api: [openai, anthropic]
      ```

      and the seat resolves against it. Four things are now checkable before a sandbox exists, where all four were previously discovered by an attempt that had already started:

      - the harness speaks a dialect the provider serves,
      - the provider's roster lists the model the seat names,
      - the model declares the reasoning level the seat asks for,
      - the provider has a credential and the route a base URL.

      Each refusal names both files, because which of them is wrong is the reader's call — the provider offered something, the manifest says it cannot take it, and either could be the one to change. This is S-0063/D-4's refusal for equipment kinds, pointed at a second capability, and it is worth noting that the two are the same sentence with one noun swapped.

      `openai` and `anthropic` are torve's keys, not any harness's spelling. dsh's own vocabulary distinguishes `openai-completions` from `openai-responses`, so `openai` here means Chat Completions and a provider serving the Responses API would earn a third key rather than an overloaded first one. The set is not closed, which is why nothing about it has to be decided now.
  - key: the-seam
    md: |-
      The engine names the attempt in scalars, in torve's units, and each image assembles whatever its harness reads:

      ```
      TORVE_PROVIDER=modelstudio          TORVE_CONTEXT_WINDOW=1000000
      TORVE_API=openai                    TORVE_MAX_TOKENS=65536
      TORVE_BASE_URL=<resolved>           TORVE_REASONING=medium
      TORVE_API_KEY=<resolved>            TORVE_REQUEST_TIMEOUT_S=600
      TORVE_MODEL=qwen3.8-flash           TORVE_STREAM_IDLE_TIMEOUT_S=120
      ```

      Multiplying seconds by a thousand belongs in the file that knows it is talking to pi-ai. Mapping `TORVE_REASONING=medium` onto an effort enum on one route and a token budget on the other belongs there too — measured, those are the two incompatible wire forms the same model takes on the same provider, which is exactly why the engine names the level and not the parameter.

      What retires: `DSH_MODEL`, a JSON document in a string that torve set and never read. What arrives in its place is nine variables the engine validates, hashes and can refuse.

      The direction of translation is the load-bearing part. A renderer inside the engine has to track three harnesses across their versions; an image has to know one harness, the one it contains. S-0063/D-3 already settled that for equipment and the argument transfers without modification — this document is the same decision applied to the other half of what a sandbox needs.
  - key: brokered-is-a-value
    md: |-
      Today three images ask whether a broker is in force, in nine places, and answer by changing shape. claude wraps two assignments in `if` blocks; dsh's generator writes a structurally different overlay; mimo refuses outright with exit 78.

      Only two things ever actually differed: which URL, and which credential. A third — whether dsh must declare its own model catalog, because overriding `baseURL` detaches pi-ai's installed one — disappears the moment a provider record carries the roster, since torve then always declares it. That difference was never about brokering; it was an artefact of having nowhere to write a model's facts.

      So both differences become the *value* of a variable whose name never changes, and every branch has nothing left to test:

      ```
      # dsh's overlay, unconditionally
          baseURL: !!js process.env.TORVE_BASE_URL
          apiKeyEnv: TORVE_API_KEY

      # claude's run, unconditionally
          ANTHROPIC_BASE_URL=$TORVE_BASE_URL
          ANTHROPIC_AUTH_TOKEN=$TORVE_API_KEY
      ```

      mimo's refusal is then deleted rather than implemented: it refuses today only because nothing maps the broker's two names onto its configuration, and with one base URL and one key there is nothing to map.

      What must not become uniform, and is called out here so the simplification stops in the right place: the refusal that keeps a brokered seat honest is a configuration check, not a variable name. Under a broker the engine fills `TORVE_API_KEY` from the run-scoped token and never from a provider's `key_env`, and egress sealing stays a runtime decision keyed on the run. The image learns a URL; it never learns a policy, and it must have no way to influence one.
  - key: what-torve-does-not-name
    md: |-
      The rule that keeps this from becoming a schema the engine must chase: **anything torve can validate gets a torve name; anything it cannot is passed through untouched and visibly so.**

      A route's `extra` is the untouched half. It is handed to the image verbatim, and the fact that it is unvalidated is legible in review rather than buried — which matters, because the failure this whole document exists to fix was a value going stale where nothing could see it. The escape hatch already exists in spirit: dsh's `equip` appends arbitrary patch fragments for equipment kinds torve does not model.

      The `developer` role is the worked example of a value that should never have been offered a name. pi-ai switches to that role for reasoning models; both OpenAI-compatible third parties this repository reaches answer with HTTP 400. It is not a fact torve needs, because **torve never builds a request** — the client that would send it lives inside one image, so the decision lives there too, defaulted off for an `api: openai` route. A provider that one day accepts the role costs one flag at that point, and nothing until then.

      The cost of being wrong here is worth stating because it is small and asymmetric: a dsh seat pointed at real OpenAI would use `system` where it could have used `developer`. That is a request shaped conservatively, not a failure, and it is reversible in one line.
  - key: the-number-the-ledger-reads
    md: |-
      A harness reports what it thinks an attempt cost, and for a cross-dialect seat that is fiction. Measured: claude emits `[claude-code:unrecognized_model]` for qwen3.8-flash and then prices the attempt at `$0.174` off its own Anthropic rate card, having primed 27,823 cache-creation tokens on a one-line prompt.

      The engine could already *see* the disagreement — `dispatch.py` compares the adapter's self-report against the broker's metered figure and emits `cost_divergence` past `broker.cost_tolerance` — and had nothing to resolve it with. A price beside the model resolves it: cost is computed from the record and the attempt's token counts, and the harness's number is kept beside it as the adapter's claim.

      That also repairs the comparison rather than adding a second one. Today it weighs a rate card against reality; afterwards it weighs torve's arithmetic against the broker's metering, two numbers that are both about this call. A stale price is then not a quiet drift in the medians — it is a `cost_divergence` event on the next attempt.

      Where no price is written, cost stays unreported. That is not a gap to fill later: a subscription seat genuinely has no per-token cost, and `AgentMetadata` already defaults every field to `None` so that a harness reporting nothing stays visibly unreported rather than silently zeroed.
tests: |-
  Every row here is provable without a model in the loop, which is what makes this document cheap to verify.

  The refusals are unit tests over the loader: a seat whose harness speaks no dialect its provider serves, a model the roster does not list, a reasoning level the model does not declare, a provider file naming a route with no base URL. Each names both files.

  The seam is a rendering test per image, run against the real definition rather than a copy of its logic — the shape T-0346 established after a copy of the dsh generator would have passed while the image shipped `reasoningEfforts: false`.

  The end is a paired live run: one provider record, two seats, two dialects. claude on the Anthropic route and dsh on the OpenAI route, both reaching qwen3.8-flash through the same credential, both reporting reasoning tokens above zero.
docs: |-
  `pages/docs/operating.md` gains the provider record beside the harness manifest and the agent profile — the three files a seat is made of become four.

  The seam's variable list is documented where S-0063/D-2 put it, and the retired names (`TORVE_BROKER_URL`, `TORVE_BROKER_TOKEN`, `DSH_MODEL`) are named with what replaced them, because a reader who wrote the old form deserves the new one rather than a list of valid keys.
out_of_scope: |-
  `auth_volume` and `auth_mount` stay on the harness manifest. A harness with no environment form for its credential is a fact about the harness, not about the provider, and codex is such a harness (S-0063/A-13).

  `CLAUDE_PERMISSION_MODE` stays in `env`. It is genuinely a harness knob — it changes what an agent may do, not how a model is reached — and this document is about the values that never were.

  The opensandbox runtime's own `api_key_env` is a runtime credential, unrelated to a provider's.
risks: |-
  **The refusal fires on a repository that was working.** A seat whose harness manifest does not yet declare `api`, or whose provider has no record, stops loading. That is the intended behaviour and it is still a migration: the phasing lands the record and the refusal together, so a tree is never half-converted, and `torve doctor` names what a seat is missing before `torve run` does.

  **A route's compat facts are measured, and measurements go stale.** The record dates them; nothing re-measures them. A provider that fixes its `developer` role handling leaves a flag saying otherwise, and the cost is a request shaped more conservatively than it needed to be — a degradation, never a failure. The alternative, deriving them, is worse: it means probing an endpoint at dispatch.

  **A price in the record is a number that goes stale against a vendor's billing page.** D-12 moves the ledger off a harness's rate card and onto torve's own, which is only an improvement while someone maintains it. The mitigation is already in the loop rather than in a process: the broker meters every call, and `broker.cost_tolerance` compares that against what the record computes — so a stale price shows up as a `cost_divergence` event on the next attempt, not as a quiet drift in the medians.
alternatives:
  - option: >-
      A translating broker: one dialect in, whichever the provider speaks out
    rejected_because: >-
      Measured, no translation is needed. Claude Code drove qwen3.8-flash end to end
      with tool use over ModelStudio's Anthropic route, with `ANTHROPIC_BASE_URL`
      pointed at it and nothing between. A translator would be a second implementation
      of every dialect's semantics — streaming, tool calls, thinking blocks — living
      in the one component that must never be the reason an attempt failed.
    cites: [D-2]
  - option: >-
      Keep it inline: extra fields on `broker.providers.<name>` plus a `models:` map
    rejected_because: >-
      The smaller diff, and it fixes the regression just as well — this is the closest
      alternative, not a strawman. It loses on two mechanical counts and one the owner
      settled. `--config` takes an arbitrary path, so a component reached at dispatch
      with a root and no configuration in hand cannot read a provider without being
      handed one; and a provider record is measured and dated, so it accretes, while
      `config.yaml` is already long. The third is the standing preference this document
      was written under: stable and coherent over small. A smaller diff that leaves
      one more thing living somewhere it does not belong is not the cheaper option,
      it is the deferred one.
    cites: [D-1, S-0061/D-1]
  - option: >-
      Reasoning effort on the agent profile, so a role can ask for more thinking
    rejected_because: >-
      A profile is what the agent is and never how it runs, which is what makes it
      portable across harnesses and models. A level seated on a model that does not
      reason is either dropped silently — the failure this document exists to stop
      — or refuses the pairing, at which point the profile is no longer portable.
      The want behind it is already served: `character_routing` maps a phase's character
      to a seat variant at dispatch.
    cites: [D-6, S-0034/D-3]
  - option: Model the `developer` role as a per-route flag
    rejected_because: >-
      torve never builds a request, so it is not torve's fact. Both OpenAI-compatible
      third parties this repository reaches reject the role, so the flag would read
      `false` almost everywhere it appeared, and the client that would send it — pi-ai
      — lives inside one image.
    cites: [D-11]
  - option: >-
      Derive a route's compat facts by probing the endpoint
    rejected_because: >-
      It puts a network call in the configuration path and a probe in front of every
      dispatch, to replace values that change about once a year. A dated measurement
      that goes stale costs a request shaped more conservatively than it needed to
      be; a probe that fails costs the run.
    cites: [D-2]
questions:
  - id: Q-1
    text: |-
      Should a model entry carry its price, so cost telemetry stops trusting a harness's own rate card? Measured: claude does not recognise qwen3.8-flash, emits `unrecognized_model`, and then prices the attempt at $0.174 off its Anthropic table. The broker meters the same call correctly, and `broker.cost_tolerance` already compares the two — so the engine can detect the disagreement today and cannot resolve it. Adding price here would let it, and would also make the record something an operator has to keep current against a vendor's billing page. Deliberately left open: this document makes cross-dialect seats easy to express, which is what turns an existing wrong number into a frequent one.

      Settled by the owner: worth adding. A record an operator keeps current against a vendor's page is a smaller cost than a ledger nobody can trust, and an absent price is already a shape the telemetry has — a subscription seat has no per-token cost and says so.
    status: settled
    settled_by: D-12
  - id: Q-2
    text: >-
      What does a record say for a plan billed by quota rather than by token? D-12
      has two cases — a price, or no per-token cost at all — and the ModelStudio seat
      is a third it collapses into the second. It is reached by API key, it bills
      against a prepaid weekly token quota, and its attempts therefore have a real
      and finite cost that dollars-per-token does not describe. Absent price is the
      honest answer today, and it loses the fact that a quota is being consumed. What
      the record would need is a plan kind and a quota to count against, and what
      an operator would want is the remaining balance before a long unattended run
      rather than after it. Measured while asking: the token plan's OpenAI-compatible
      surface publishes nothing to read it from — `/models` returns `created`, `id`,
      `object`, `owned_by` and no pricing or quota key of any kind.
  - id: Q-3
    text: >-
      Should a price be fetched rather than written? A figure in a reviewed file goes
      stale against a vendor's billing page, and the mitigation D-12 leans on is detection
      rather than freshness — the broker meters, `cost_tolerance` compares, a stale
      price surfaces as `cost_divergence`. Fetching would remove the staleness instead
      of catching it. Measured: it depends entirely on the provider and the split
      is clean. OpenRouter publishes prices for all 445 of its models on `/api/v1/models`
      as `pricing: {prompt, completion}` in dollars per token; ModelStudio's plan
      publishes none, and neither Anthropic nor OpenAI has a public pricing API. So
      a fetch cannot be the mechanism — at best it is an optional source a provider
      record names, with the written figure as the fallback, and it trades a value
      that goes stale for a network call in the configuration path (the objection
      that already closed probing for compat facts, in the alternatives above).
