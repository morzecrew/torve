# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-29T03:58:07Z'
    title: Settled by S-0091
    changes:
      - subject: D-17
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-17
        field: text
        before: >-
          Where the composer reads the phases still to come from — the document's
          `phasing` list or the contracts already minted from it — is implementation's,
          under one constraint: it names them from a record and never from an estimate
        after: >-
          The composer names the phases still to come from the document's phasing,
          and the phases landed from the landing files on the branch tip joined with
          the lane's own `lane_landed` records (S-0091/D-3); it never names one from
          an estimate
      - subject: D-17
        field: fingerprint
        after: 243e04715617ff15/fb7d7e5be0f10b09
      - subject: D-18
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-18
        field: text
        before: >-
          Whether the document branch is cut at the first landing or at the first
          worktree of the document is implementation's, under one constraint: it is
          cut once per document, from the remote's `main` after a fetch, and every
          later landing targets the same ref
        after: >-
          The document branch is cut from the remote's `main` after a fetch, once
          per pull request: at the document's first landing, and again when its pull
          request merged or the remote no longer has the branch, with the old ref
          kept under `refs/torve/documents/` (S-0091/D-1); every landing in between
          targets the same ref
      - subject: D-18
        field: fingerprint
        after: c0a0531fcf42a9da/c6da993128d86481
    md: >-
      S-0091, accepted on 2026-09-29, answers these OPEN rows: the lane reads the
      document branch from the remote, cuts it again once per pull request, sets a
      branch the remote lost aside under a ref, and counts a phase from the landing
      files the branch carries. The rows now say so; the code lands with S-0091's
      phases.
  - id: A-2
    at: '2026-10-06T19:33:10Z'
    title: A review wave publishes once (S-0097)
    changes:
      - subject: D-7
        field: text
        before: >-
          At every landing the lane pushes the document branch under lease and opens
          or refreshes the document's one pull request, and then stops; merging is
          a person's single act on the forge
        after: >-
          At every landing the lane pushes the document branch under lease and opens
          or refreshes the document's one pull request, and then stops, except that
          while rounds of one review wave are outstanding a landing publishes nothing
          and the landing that leaves none outstanding publishes; merging is a person's
          single act on the forge
      - subject: D-7
        field: fingerprint
        after: edf0f8f4e940fe11/0e5e729b24c906e6
  - id: A-3
    at: '2026-11-02T21:36:34Z'
    title: >-
      A base that moved elsewhere leaves the document branch as judged
    changes:
      - subject: D-13
        field: text
        before: >-
          A document branch whose merge would no longer be clean is rebased onto the
          remote's `main` in a disposable worktree, the battery re-run over the rebased
          tree and the branch republished under lease, bounded once per base tip;
          a conflict escalates for a person and never resolves itself
        after: >-
          A document branch whose merge would no longer be clean — its merge with
          the remote's `main` conflicts, or `main`'s change since their merge base
          touches a path the document changed — is rebased onto that `main` in a disposable
          worktree, the battery re-run over the rebased tree and the branch republished
          under lease, bounded once per base tip; a conflict escalates for a person
          and never resolves itself. A base that moved elsewhere leaves the branch
          as the battery judged it
      - subject: D-13
        field: fingerprint
        after: 54726547a983cb3f/c6da993128d86481
    md: >-
      The lane rebased an open document branch and re-ran its whole battery on every
      move of `main`, though D-13 asks it only of a merge that would no longer be
      clean. On #236 one evening's three merges to `main` cost three whole-document
      batteries, each followed by the pull request's own checks on the republished
      head, all on the same verdict. "No longer clean" is now read as git reads it,
      a conflicting merge, widened to a base change that touches a path the document
      changed, where a clean merge can still break what the battery judged.
