# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-11-04T22:31:07Z'
    title: >-
      The battery keeps lint and acceptance, and mypy runs plain
    changes:
      - subject: D-4
        field: text
        before: >-
          The attempt battery is six gates that judge code (`secrets`, `scope` blocking
          on the fence only, `suite` with attribution, `mypy` on new errors only,
          `layering`, protected-test tampering), the engine runs ruff's fixes in the
          sandbox before the snapshot, and no other gate runs on an attempt
        after: >-
          The attempt battery judges code only: secrets, scope, no-test-tampering,
          lint, layering, mypy, the suite with attribution and the task's acceptance;
          a seat's finish command applies the formatter's fixes before the tree leaves
          the sandbox, and a contract row's check runs at document completion, not
          on every attempt
      - subject: D-4
        field: fingerprint
        after: bad8cda0dd671bb5/1276d8264d4b28b4
    md: |
      Building phase 1 settled three things D-4 and the phase's intent had wrong.
      `lint` stays a blocking gate: once the seat's `finish` command has applied
      the formatter's fixes, what is left is a real finding, and it costs
      seconds. `mypy` runs plain over the package, because `main` is mypy-clean,
      so a red is the change's own and needs no attribution against the base.
      The task's `acceptance` stays too: it runs whatever the contract names.

      Two clauses of phase 1's intent were already true or are kept on purpose.
      A surviving blocker's revision already runs on the seat's
      `revision_variant` (S-0117/D-1). The poison ceiling keeps counting per
      dispatch: requeues are an operator's act, and a lifetime count would
      escalate a task the operator just requeued.
  - id: A-2
    at: '2026-11-04T23:15:46Z'
    title: >-
      The dsh seat narrows the headless profile; sdk-minimal waits for the SDK driver
    changes:
      - subject: D-10
        field: text
        before: >-
          The dsh seat pins `@deepseek-ai/dsh@0.2.1-rc.5` and `deepseek-v4.1-flash-1017`,
          runs a `torve-exec` profile built on `sdk-minimal` with `DSH_PERMISSION_MODE=danger-full-access`
          inside the container, telemetry off, a per-attempt `DSH_HOME`, an empty
          `DSH_AGENTS_HOME` and a 900 s bash timeout, and every patch carries a `--dump-config`
          boot assertion
        after: >-
          The dsh seat pins @deepseek-ai/dsh@0.2.1-rc.5 and deepseek-v4.1-flash-1017
          and runs the headless profile narrowed to nine tools, with DSH_PERMISSION_MODE=danger-full-access
          inside the container, telemetry and the session-log upload off, per-attempt
          homes and a 900 s bash timeout; the image's smoke check reads every patch
          back out of --dump-config and fails the build on a dropped key or a disabled
          plugin
      - subject: D-10
        field: fingerprint
        after: 5346ad146b774b06/af8e7002dead8e91
    md: |
      Building phase 4 showed `sdk-minimal` is the SDK's JSON-RPC application,
      not a profile the headless entry point boots, so the seat keeps the
      headless profile and narrows its tool set instead: nine tools, with plan
      mode, session titles and the session-log upload turned off. The
      `sdk-minimal` profile becomes the seat's when the session driver of
      phase 6 drives dsh through the SDK. The research's persona finding was
      half right: the shipped 0.1.2-rc.1 still read `persona`, so only the door
      was broken in production, and the bump would have broken the persona.
  - id: A-3
    at: '2026-11-07T19:30:56Z'
    title: >-
      A revision's finding must locate to what the revision changed or failed to fix
      (S-0125)
    changes:
      - subject: D-1
        field: text
        before: >-
          The engine, not a model, turns a critic's findings into block or pass: a
          candidate is blocked when a finding that survives the location filter is
          at or above `review.blocks_at`, or when an owned row is `violated` with
          located evidence, and an `unknown` row never blocks
        after: >-
          The engine, not a model, turns a critic's findings into block or pass: a
          candidate is blocked when a finding that survives the location filter is
          at or above `review.blocks_at`, or when an owned row is `violated` with
          located evidence, and an `unknown` row never blocks; on a revision attempt
          such a finding counts only when it also locates within `threads.WINDOW`
          lines of a line the revision changed or of an earlier round's blocker, and
          every other is recorded non-blocking
      - subject: D-1
        field: fingerprint
        after: ab5ee4a9a6da81c9/03a530a15ac3f0d0
    md: |
      The owner amended this LOCKED row in session on 2026-11-07, for S-0125/D-1.
      Each revision of S-0124's phases was reviewed as a first attempt, and the
      critic named a new blocker on code the revision never touched: T-0810's
      three escalations named three different findings. The engine still decides,
      and on a first attempt it decides exactly as before. On a revision, a
      finding counts only where the revision acted or failed to act. Every other
      finding stays in the review record, and the document's pull request still
      receives it as a recorded thread.
  - id: A-4
    at: '2026-11-08T18:44:58Z'
    title: >-
      A finding on a claim a review round rejected does not block (S-0126)
    changes:
      - subject: D-1
        field: text
        before: >-
          The engine, not a model, turns a critic's findings into block or pass: a
          candidate is blocked when a finding that survives the location filter is
          at or above `review.blocks_at`, or when an owned row is `violated` with
          located evidence, and an `unknown` row never blocks; on a revision attempt
          such a finding counts only when it also locates within `threads.WINDOW`
          lines of a line the revision changed or of an earlier round's blocker, and
          every other is recorded non-blocking
        after: >-
          The engine, not a model, turns a critic's findings into block or pass: a
          candidate is blocked when a finding that survives the location filter is
          at or above `review.blocks_at`, or when an owned row is `violated` with
          located evidence, and an `unknown` row never blocks; on a revision attempt
          such a finding counts only when it also locates within `threads.WINDOW`
          lines of a line the revision changed or of an earlier round's blocker, and
          every other is recorded non-blocking; on a review round's attempt, a finding
          or `violated` row whose every cited `path:line` locates within `threads.WINDOW`
          lines of a claim that attempt rejected (S-0126/D-2) is recorded non-blocking,
          and a re-raise of the claim escalates (S-0121/D-29)
      - subject: D-1
        field: fingerprint
        before: ab5ee4a9a6da81c9/03a530a15ac3f0d0
        after: 6d4a467c5b2ab2fc/03a530a15ac3f0d0
    md: |
      The owner amended this LOCKED row in session on 2026-11-08, for S-0126/D-1. T-0913,
      a review round on #302, rejected one bot claim with a recorded reason. The critic never
      sees that reason (S-0121/D-28, S-0122/D-2), so it blocked all three attempts on the
      same claim, and the round escalated `poison_ceiling`. The engine still decides, from
      locations alone: a finding counts as one on the rejected claim only when every
      `path:line` it cites locates near that claim. The reply puts the rejection on the
      bot's thread, and a re-raise escalates to a person.
