  - id: A-7
    at: '2026-11-12T02:44:04Z'
    title: >-
      A red attempt restarts fresh, and a block gets one fresh attempt (S-0127/D-5,
      D-6, D-9)
    changes:
      - subject: D-8
        field: text
        before: >-
          A gate-red candidate with three or fewer convicted tests, or only mypy errors,
          gets one follow-up turn in its own session with the gate output and no critic
          call; a critic block goes to a fresh Opus session on the selected tree with
          the blocking findings and repros, at most two rounds; a re-raised finding
          escalates; a unit stops at five critic calls, $3 notional spend or 90 minutes
        after: >-
          A gate-red candidate gets no follow-up turn: the next attempt is an independent
          fresh session from the tree the red attempt started from (S-0127/D-6); a
          critic block sends the unit to one fresh attempt on the task's own seat
          under `review.revision: off`, the default, or to the revision a configuration
          names with `fresh` or `session` (S-0127/D-5); a re-raised finding escalates
          (S-0127/D-4); a unit stops at five critic calls or at its class's notional
          spend and clock (S-0127/D-9)
      - subject: D-8
        field: fingerprint
        after: 7e463b5c9e30cf03/c9ee6598052a783c
    md: |
      Amended on 2026-11-12 in the pull request that accepts S-0127 (S-0127/Q-6).
      The pilot's revision loop flipped none of six failing candidates at about $0.92 of Opus per unit, so S-0127 replaces the follow-up turn with a fresh attempt (S-0127/D-6), the Opus revision with one fresh attempt on the task's own seat (S-0127/D-5), and the flat $3 and 90 minutes with the class's figures (S-0127/D-9). The five-call critic cap stands.
