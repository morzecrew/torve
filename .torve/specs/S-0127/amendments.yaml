    md: |
      Review found that A-2 claimed more than its check gives: the writable retry is
      compared by the files the checkout held before and after it, so a command that
      edits a held file and restores it before it exits is measured as it ran. The row
      now says so. The retry runs only for a command the read-only mount denied, so a
      read-only run still cannot change the candidate at any point of it.
