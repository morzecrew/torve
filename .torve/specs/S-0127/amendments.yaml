      - subject: D-10
        field: fingerprint
        after: 54e2cab3a503d971/14bd8ed0a79735ba
    md: |
      Review of phase 2 found that the candidate's own code controls what a re-run prints, so
      refusing on the marker let a candidate print `Read-only file system` over a real failure
      and turn a blocking repro advisory. The marker now only sends the command to one run
      over a writable mount, whose exit stands; that run refuses the repro only when it changed
      or removed a file the checkout held, read by hashing the files from the disk, not from
      the checkout's index. A candidate can still make a repro unmeasurable on purpose, as a
      hang that times out does; that is integrity, and a `gaming` finding still blocks.
