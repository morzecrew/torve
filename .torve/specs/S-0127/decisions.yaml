# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      Under `review.mode: critic`, a kept finding at or above `review.blocks_at` and
      a `violated` row with located evidence block only when their repro fails on
      re-run, except that a kept `gaming` finding at or above `review.blocks_at` and
      a `violated` verdict on a LOCKED row still block on located evidence alone:
      the command is the finding's `repro.command`, else the first backticked command
      its evidence carries with output after it, and the engine re-runs it against
      the candidate through `runner.reproduce` (D-10); a non-zero exit blocks, while
      a zero exit, an exit of 126 or 127, a timeout or no command records the finding
      or row `advisory: true` in the review record with the command, its exit code
      and its output tail, never blocking; the S-0125/D-1 and S-0126/D-1 carries are
      read first and a carried finding is not re-run, `build_critic_prompt` says that
      only a repro exiting non-zero on the candidate can block, and a blocker's revision
      thread carries the command, its exit code and the re-run's output
    paths: [src/torve/application/critic.py]
    consequence: >-
      a defect finding the critic only read, or whose probe passes on the candidate,
      never stops a unit, and lands recorded as advisory in the review record and
      the document's pull request (D-13); gaming and a LOCKED row's breach stop it
      as today
    rationale: >-
      in the pilot the critic was accurate (0 of 20 sampled findings wrong) but its
      blocks were a coin flip against the hidden checks (precision 5/8, recall 5/11);
      an exit code the engine measured is a fact, a severity the critic wrote is a
      reading; integrity and the owner's rules rarely reproduce by a command, so those
      two keep blocking on what locates (Q-3)
    cites: [S-0122/D-1, S-0122/D-2, S-0122/D-6, S-0125/D-1, S-0126/D-1, S-0121/D-28]
    check: >-
      uv run pytest -q tests/test_critic.py tests/test_review_run.py -k "reproduced
      or blocks_on_reading"
  - id: D-2
    grade: ASSUMED
    text: >-
      A `weak_test` finding never blocks and is never re-run, whatever its severity
      and its repro: `decide` records it `advisory: true`
    paths: [src/torve/application/critic.py]
    consequence: >-
      a test that proves too little reaches the review record and the document's pull
      request as advisory, and its unit still lands
    rationale: >-
      11 of the pilot's 25 blocking findings were `weak_test`, and none of those blocks
      changed a hidden-check result; the 10 weak-test findings of the 20 sampled were
      true and were still not defects
    cites: [S-0122/D-1]
    check: >-
      uv run pytest -q tests/test_critic.py -k weak_test
  - id: D-3
    grade: ASSUMED
    text: >-
      `locate` accepts evidence that carries, anywhere in its text, a `path:line`
      or `path:start-end` citation that resolves under the root, as `evidence.citations`
      reads them with the grammar `critic._citations` uses today, or a backticked
      command followed by output; evidence holding neither is refused with today's
      messages, and `filter_findings` and the execution log's evidence check, which
      share `locate`, both accept a citation that follows prose
    paths: [src/torve/gates/evidence.py, src/torve/gates/log_entry.py]
    consequence: >-
      a probe or mutation sentence citing the line it changed survives the location
      filter; a divergence entry whose citation follows prose is accepted too, and
      the log's teaching rejection no longer asks for a leading citation
    rationale: >-
      `locate` discarded 5 of the pilot's majors whose evidence was a mutation or
      probe sentence citing `path:line` mid-text, while `critic._citations` already
      reads such citations for S-0126/D-1
    cites: [S-0005/D-4, S-0121/D-28, S-0126/D-1]
    check: >-
      uv run pytest -q tests/test_review_role.py tests/test_gates.py -k locates_anywhere
  - id: D-4
    grade: ASSUMED
    text: >-
      A finding's anchor is the first citation in its evidence that resolves, wherever
      it sits, for the S-0125/D-1 rules and for re-raise alike; a revision's blocker
      is re-raised only when it repeats an earlier round's blocker, by naming the
      same row, or by having the same `kind`, a citation whose span overlaps the earlier
      blocker's span as mapped into the current tree, and a claim D-11's measure matches;
      a blocker near an earlier anchor that repeats neither is a new blocker inside
      the revision budget, `blocker_fact` records each blocker's `kind` and `row`
      beside its claim and anchor, and `decide` computes `reraised` by this rule,
      which `review_step` reads for a critic verdict
    paths: [src/torve/application/critic.py, src/torve/application/review.py]
    consequence: >-
      a new defect a revision introduces beside an old one spends the revision budget
      instead of escalating as a re-raise; a finding led by an executed probe is judged
      by the line it cites, not carried for having no leading anchor
    rationale: >-
      T-0804 escalated as a re-raised blocker that was a new defect the revision introduced
      on the next line, inside `threads.WINDOW`; on the pilot's revision rounds 6
      findings at major or above led by an executed backticked probe were carried
      for having no leading anchor, while prose citing `path:line` could block
    cites: [S-0124/D-3, S-0125/D-1, S-0125/D-2, D-11]
    check: >-
      uv run pytest -q tests/test_critic.py tests/test_review_run.py -k repeats_a_blocker
  - id: D-5
    grade: ASSUMED
    text: >-
      `review.revision` gains `off`, the default: a surviving blocker sends the unit
      to one fresh attempt on the task's own seat, never its `revision_variant`, on
      the blocked candidate's tree with the feedback record D-1's threads fill, and
      a blocker surviving that attempt escalates `blocker_finding`; under `off`, `review.blocker_revisions`
      resolves to 1 unless the configuration names a number, and `fresh` and `session`
      keep their meaning when a configuration names them
    paths: [src/torve/config/runconfig.py, src/torve/application/session.py]
    consequence: >-
      no Opus revision runs unless a configuration asks for one, and a unit blocked
      twice reaches the owner after two executor sessions
    rationale: >-
      the pilot's critic and revision loop flipped 0 of 6 failing first candidates
      and broke 0 passing ones, at about $0.92 of Opus and 10 more minutes per unit
    cites: [S-0122/D-8, S-0124/D-1, S-0124/D-2, S-0124/D-8, S-0117/D-1]
    check: >-
      uv run pytest -q tests/test_runconfig.py tests/test_session.py -k revision_off
  - id: D-6
    grade: ASSUMED
    text: >-
      When an attempt's gates are red, the next attempt is an independent fresh session
      from the tree the red attempt started from, up to the poison ceiling: the red
      candidate gets no follow-up turn in its own session and no convicted tree is
      committed or carried, though `_route_repair` still adds the convicting gate's
      command to the next attempt's acceptance and the context pack still names earlier
      attempts' convictions; among one attempt's candidates the first to finish green
      wins, the others are cut when it does, and the critic reads only it
    paths: [src/torve/application/runner.py, src/torve/application/selection.py]
    consequence: >-
      attempts are independent samples, so a red attempt's tree never anchors the
      next; pre-rank and collapse no longer choose a winner, and a blocked first green
      goes to D-5, never to a sibling
    rationale: >-
      revising a candidate added nothing in the pilot (0 of 6 flipped), and a critic
      whose blocks scored precision 5/8 and recall 5/11 against the hidden checks
      is no judge between two green candidates
    cites: [S-0122/D-7, S-0122/D-8, S-0069/D-3, S-0069/D-4, S-0054/D-12]
    check: >-
      uv run pytest -q tests/test_runner.py tests/test_selection.py -k "independent_attempt
      or first_green"
  - id: D-7
    grade: ASSUMED
    text: >-
      The acceptance an attempt is shown is the contract's commands followed by the
      command of every gate the attempt's manifest runs `blocking` as a shell command,
      not a `@` builtin, with a declared timeout of 120 seconds or less, each command
      once; the contract on disk and the battery's `acceptance` gate are unchanged,
      so nothing runs twice
    paths: [src/torve/application/dispatch.py, src/torve/application/runner.py]
    consequence: >-
      in this repository an attempt is told to run the lint and format check, the
      layering contract and mypy before it finishes; a gate past 120 seconds, like
      the suite, is not shown
    rationale: >-
      T-0880's acceptance named its tests and `uv run mypy src`, and the round went
      red on the lint gate it was never told to run
    cites: [S-0122/D-4, S-0069/D-3]
    check: >-
      uv run pytest -q tests/test_dispatch.py tests/test_runner.py -k shown_acceptance
  - id: D-8
    grade: ASSUMED
    text: >-
      On a review round's attempt, a `halted` divergence entry that cites no LOCKED
      row and whose claim or evidence names one of the round's findings by `threads.names_spot`
      does not end the attempt while some finding of the round is named by no halt:
      `halted` reads it as that claim declined and the attempt goes on to its gates;
      a halt citing a LOCKED row escalates `locked_conflict` as S-0096/D-1 says, and
      a halt that names no finding of the round, or halts that name all of them, end
      the attempt as today
    paths: [src/torve/application/session.py]
    consequence: >-
      a round with one out-of-scope claim lands its other fixes, a round that declines
      everything still escalates, and a claim that collides with a LOCKED row still
      reaches the owner before the round lands
    rationale: >-
      T-0894's attempt halted on one out-of-scope claim, which discarded a round carrying
      six green fixes; a LOCKED row is the owner's to reopen, so its conflict is asked
      first (Q-5)
    cites: [S-0096/D-1, S-0084/D-13, S-0121/D-29]
    check: >-
      uv run pytest -q tests/test_session.py -k "halted_claim or locked_halt"
  - id: D-9
    grade: ASSUMED
    text: >-
      Under `review.mode: critic` a unit's notional-spend cap and its clock are its
      class's, from `selection.UNIT_BUDGETS`: S $1.50 and 45 minutes, M $3 and 90
      minutes, L $6 and 180 minutes; the class is `selection.unit_class` over the
      contract against the repository root's tree, with the `escalated` flag `_width`
      reads and without the revision flag, so every attempt of a run reads the same
      one, and a contract naming `budget.wallclock_minutes` keeps its own clock
    paths: [src/torve/application/selection.py, src/torve/application/runner.py]
    consequence: >-
      an L unit can afford a second attempt's gates and an S unit stops sooner than
      today, while an M unit's bounds are unchanged
    rationale: >-
      T-0810, an XL unit in the pilot, hit the flat $3 cap before its second attempt's
      gates ran
    cites: [S-0123/D-1, S-0123/D-2, S-0122/D-7]
    check: >-
      uv run pytest -q tests/test_selection.py tests/test_runner.py -k class_budget
  - id: D-10
    grade: ASSUMED
    text: >-
      `runner.reproduce(run, state, commands, probes)` runs each command in a fresh
      gates sandbox (`_gates_spec`: the battery's image and cache) over a fresh judge
      checkout of the candidate, with each probe's text written at its path first,
      but only at a path that is new to the checkout — no file there, tracked or not
      — and lies under the review's probe directory with no component a link, a probe
      at any other path, or one a finding names that the critic's copy did not keep
      (missing, a link, outside the copy or over the cap), refusing the whole repro
      so its finding is advisory; once the probes are written the checkout is mounted
      read-only (`workspace_read_only`), with the project environment, bytecode and
      the common tool caches pointed under the sandbox's own temporary directory (`UV_PROJECT_ENVIRONMENT`,
      `PYTHONPYCACHEPREFIX`, `PYTEST_ADDOPTS=-p no:cacheprovider`, `MYPY_CACHE_DIR`,
      `RUFF_CACHE_DIR`), so no command's read-only run can change the candidate, and
      a command whose output reports `Read-only file system` runs once more over the
      checkout mounted writable, that run's exit the one recorded unless it changed
      or removed a file the checkout held, which refuses the repro the same way, an
      end-state check that a change restored before the command exits passes, so a
      denied write never blocks, a printed marker alone never refuses, and only a
      command the read-only mount denied ever runs writable; each command is bounded
      by the timeout of the `acceptance` gate in the attempt's manifest (`run.manifest_file`),
      or by the runtime's `sandbox_timeout` when the manifest has no such gate, and
      all of one review's re-runs together by what is left of the unit's clock (D-9),
      a command the clock leaves no time for not run; it returns one `CommandRun`
      per command, its exit `None` on a timeout or when it was not run, and the checkout
      and the sandbox are removed when it returns, whatever happened
    paths: [src/torve/application/runner.py]
    consequence: >-
      a re-run is as isolated as the battery and leaves nothing behind, the critic
      never sees its result, and a failing repro measures the candidate the gates
      passed: only a command the read-only mount denied runs writable, judged by the
      files it leaves
    rationale: >-
      S-0122/D-2 keeps every reading the judge relies on to the host or a throwaway
      gates sandbox, and the critic's own runs happen in a copy where nothing it writes
      is evidence; a repro is a test command, so it gets the bound the battery already
      gives the task's test commands, and the unit's clock already bounds the unit,
      so no new constant is needed (Q-7)
    cites: [S-0122/D-2, S-0122/D-6, S-0114/D-5, D-9]
    check: >-
      uv run pytest -q tests/test_runner.py -k "reproduce or rerun_bound"
    fingerprint: a07bb2d89f2a5569/14bd8ed0a79735ba
  - id: D-11
    grade: OPEN
    text: >-
      Which deterministic measure over two blocker claims D-4 reads as a match, for
      example the overlap of their normalised words above a threshold: the phase chooses
      it, tests it on a new defect cited on the line after an earlier blocker, which
      must not match, and on the same defect described in other words, which must,
      and records the choice in its log
    paths: [src/torve/application/review.py]
    consequence: >-
      too loose a measure brings T-0804's false re-raise back, and too strict a one
      lets a repeated defect spend the revision budget again
    rationale: >-
      the pilot shows one false re-raise (T-0804) and no measured true one, so no
      threshold can be read off it, and the engine, not a model, decides what repeats
      (S-0122/D-1)
  - id: D-12
    grade: ASSUMED
    text: >-
      `threads.rejections(entries, attempt)` also keeps that attempt's `halted` entries
      that cite no LOCKED row, so the carry (S-0126/D-1, S-0126/D-2) and the reply
      read a declined claim as they read a contradicted one, and the leg answers a
      halted entry's thread `Out of scope — <claim>` with its evidence where it answers
      a contradicted one `Not applied — <claim>`
    paths: [src/torve/application/threads.py, src/torve/application/reviewleg.py]
    consequence: >-
      the bot's thread says the claim was declined and why, the critic's findings
      on it are carried as on a rejected claim, and a bot that raises it again escalates
      to a person
    rationale: >-
      T-0894's declined claim got no answer on its thread; the round's escalation
      was all a reader saw
    cites: [S-0126/D-3, S-0084/D-13, S-0121/D-29, D-8]
    check: >-
      uv run pytest -q tests/test_threads.py tests/test_reviewleg.py -k declined
  - id: D-13
    grade: ASSUMED
    text: >-
      The document's pull-request body lists, under each landing, each finding its
      last task-gated review recorded, by severity, kind, anchor (`path:line`) and,
      when the engine re-ran it, the re-run's command and exit code, read from the
      store's `review.recorded` items (D-14) under a heading that names them the critic's
      advisory findings; no claim or evidence text is listed, and a landed candidate's
      last review blocked nothing, so every finding listed is advisory
    paths: [src/torve/application/forge.py, src/torve/cli/merge.py]
    consequence: >-
      a person merging sees where the critic found something and what the engine measured
      of it, reads the claim in the review record, and the body stays composed from
      records and bounded by `BODY_LIMIT`
    rationale: >-
      D-1 makes most of the critic's findings advisory, and a review record on the
      host that ran the critic is read by nobody before a merge; S-0121/D-34 (LOCKED)
      keeps agent prose out of the body, so the critic's words stay out and S-0121/D-34
      stands unamended (Q-2)
    cites: [S-0121/D-34, S-0083/D-8, D-1, D-14]
    check: uv run pytest -q tests/test_forge.py -k advisory
  - id: D-14
    grade: ASSUMED
    text: >-
      Each item a critic review's `review.recorded` event carries holds the finding's
      `kind` (`contract` for a violated row) and, when the engine re-ran its repro,
      the command and exit code, as `ReviewItem` fields with defaults (`kind` empty,
      `rerun_command` empty, `rerun_exit` none), so a review recorded before them
      reads with none and every other field keeps its meaning
    paths: [src/torve/domain/events.py, src/torve/application/review.py]
    consequence: >-
      any host reads what a finding was and what the engine measured of it from the
      record, without the review record on the host that ran the critic
    rationale: >-
      D-13 lists kind and re-run from the store, and the store's items held only severity,
      anchor, claim and evidence; additive fields with defaults are how S-0101/D-11
      grew the same event
    cites: [S-0101/D-4, S-0101/D-11, S-0121/D-4, D-1]
    check: >-
      uv run pytest -q tests/test_review_run.py tests/test_events.py -k rerun_item
