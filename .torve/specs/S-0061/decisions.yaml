# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      An agent profile carries what the agent is — skills, plugins, prompt_extras
      — and nothing about how it runs.
    paths: [src/torve/config/agents.py]
    consequence: >-
      a persona file can no longer decide where a conviction routes, because routing
      is not a key it has
    rationale: >-
      a profile body is validated against TierConfig.model_fields today, so ~/.config/torve/agents/heavy.yaml
      may legally declare retry_variants — a file named for a persona deciding a property
      of the fleet
    cites: [S-0028/D-1, S-0029/D-1]
  - id: D-2
    grade: LOCKED
    text: >-
      A harness manifest carries how a model is reached — adapter, command, image
      and how auth arrives — and names no model.
    paths: [src/torve/config/agents.py]
    consequence: >-
      one manifest serves every model that image can run, and a model change is a
      one-line seat edit
    rationale: >-
      harness identity is the image (S-0017/D-4), which is already true and has no
      file to be true in; the model is what varies across seats sharing one harness
    cites: [S-0004/D-1, S-0017/D-4]
  - id: D-3
    grade: LOCKED
    text: >-
      The seat names one harness and at most one profile, and holds what varies per
      run — model, provider, routing, clocks and caches.
    paths: [src/torve/config/runconfig.py]
    consequence: >-
      `tiers:` reads as an assignment rather than as a full agent definition
    rationale: >-
      model, retry rungs, character routing and the two clocks all differ between
      seats that share an agent and a harness; they are the seat's by nature
    cites: [S-0027/D-11, S-0034/D-6, S-0035/D-6]
  - id: D-4
    grade: LOCKED
    text: >-
      The charter's base working rules stay unaddressable from configuration; a profile
      appends with prompt_extras and a `prompt` key is refused by name.
    paths: [src/torve/config/agents.py]
    consequence: >-
      no file outside the repository under work can disarm the rules two blocking
      gates convict on
    rationale: >-
      the base rules are what tell an executor to log divergences before committing
      and to keep corpus coordinates out of user-facing strings — exactly what decisions-reported
      and user-facing-text convict on
    cites: [S-0029/D-1]
  - id: D-7
    grade: ASSUMED
    text: >-
      The regime hash reads each seat's resolved harness, profile and own keys, and
      stops reading skills-lock.json.
    paths: [src/torve/application/telemetry.py]
    consequence: >-
      the hash changes when the equipment changes, and stops changing when a tool
      torve does not run reformats its own lockfile
    rationale: >-
      config_hash digests that file's bytes today and the engine reads it for nothing
      else, so a hash the operator cannot influence gates a regime the operator did
      choose
  - id: D-8
    grade: ASSUMED
    text: >-
      One merge level survives the split — a seat merges its harness and its profile,
      and neither references another of its kind.
    paths: [src/torve/config/agents.py]
    consequence: >-
      the file a refusal names is the file that carries the bad key
    rationale: >-
      S-0028/D-4 settled this for profiles and the reason is unchanged; a chain that
      resolves chains cannot name which link supplied a value
    cites: [S-0028/D-4]
  - id: D-9
    grade: ASSUMED
    text: >-
      A seat carrying a moved key is refused by name, with the file the key belongs
      in named in the message.
    paths: [src/torve/config/runconfig.py]
    consequence: >-
      the migration guide is the error, so no repository needs one written
    rationale: >-
      every consuming repository's tiers are the flat shape, and STRICT already refuses
      unknown keys — the only question is whether the refusal teaches
  - id: D-10
    grade: LOCKED
    text: >-
      The profile and the harness manifest are committed files of the operating repository
      under `.torve/`, not files on the operator's machine.
    paths: [src/torve/config/agents.py, src/torve/cli/init.py]
    consequence: >-
      a regime is reconstructable from a checkout, and two operators running one repository
      cannot silently run different equipment
    rationale: >-
      D-7 puts both bodies into the regime hash, and a hash over a file that exists
      on one laptop reproduces nowhere — the defect this document removes from skills-lock.json;
      S-0013/D-3 is untouched because these sit beside config.yaml in the operating
      repository, never in the one under work
    cites: [S-0013/D-3, S-0009/D-2]
  - id: D-11
    grade: ASSUMED
    text: >-
      A seat naming no profile resolves the profile named for the task's role, and
      SkillsConfig.sets retires.
    paths: [src/torve/config/runconfig.py, src/torve/config/agents.py]
    consequence: >-
      the default equipment for a role and a named set stop being two mechanisms answering
      one question in two files
    rationale: >-
      the role-keyed default and a tier's own skills list already override each other
      wholesale through effective_skill_sets, which is a merge rule existing only
      because the two live apart
    cites: [S-0009/D-1, S-0029/D-1]
invariants:
  - id: I-1
    statement: >-
      No configuration key reaches the prompt before the charter's base working rules
      — prompt_extras appends, and nothing replaces.
    paths: [src/torve/adapters/agent/harness.py, src/torve/config/agents.py]
    check: uv run pytest tests/test_agents.py -k base_rules
  - id: I-2
    statement: >-
      Every key of the old flat tier body lives in exactly one of the three files,
      and the other two refuse it by name.
    paths: [src/torve/config/agents.py, src/torve/config/runconfig.py]
    check: uv run pytest tests/test_agents.py -k one_home
retired: [D-5, D-6]
