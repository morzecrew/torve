# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-10T07:55:58Z'
    title: >-
      The superseded dependencies are read, not inherited from
    md: |-
      `depends_on` named S-0004, S-0028 and S-0029 — every one of them superseded by S-0055 in the corpus rebuild, so `torve plan` refused to mint: a grade inherited from a document that no longer stands breaks the copy-at-write-time guarantee (S-0007/D-7).

      They move to `informed_by`, which is what they always were. This document reads them for the shapes it is splitting apart; it inherits no row from any of them, and every rule it needs it states itself. Nothing else changes.
  - id: A-2
    at: '2026-09-10T12:01:30Z'
    title: Phase 1 takes the seats the migration reaches
    md: |-
      D-9 refuses a moved key on a seat, which is the migration this document exists to force. The migration's reach was not in the phase's scope.

      Every fixture that writes a `tiers:` mapping in YAML is a repository's worth of configuration, and twenty tests across eight files carried the flat shape. They are ported here rather than in a follow-up, because a phase that leaves the suite red has not landed. `tests/conftest.py` gains one helper — a harness manifest beside the configuration that names it — so the port is one line per fixture rather than a rewrite per file.

      `src/torve/cli/doctor.py` joins for the same reason at the other end: its provenance line said a tier resolved its adapter, model and command from a profile, which after the split is three quarters wrong. It now names the harness and the profile, which is what the `profile: "a -> b"` string it replaced was for.
  - id: A-3
    at: '2026-09-10T13:24:54Z'
    title: >-
      Phase 2 takes the spec that carries the declaration
    md: |-
      D-6 puts the rendering in the runtime adapter, and gave the phase the adapter and the sandbox definitions. It did not give it the road the declaration travels to get there.

      A `SandboxSpec` is what an adapter receives, so the plugins ride it — a spec carries the declaration and never the rendering, which is what lets both adapters read one shape and each answer for its own harness. That is `application/ports.py`, and the seat that fills it is `application/session.py`: the agent's own sandbox is the only one a profile equips, so the other four construction sites are untouched.

      `tests/test_sandbox_images.py` joins because the claude image's toolkit check asserted `settings.json` exists in the seed. It is rendered at dispatch now, so the check reads the clone the build still pins instead.
  - id: A-4
    at: '2026-09-10T13:34:19Z'
    title: >-
      A seat names its harness even when there is only one
    md: |-
      The risks section said a seat with `adapter` and `command` inline stays legal. D-9 says the opposite, and D-9 is what T-0322 built.

      The prose was hedging written before the migration's cost was known. The cost turned out to be one line per fixture, and the price of the hedge would have been I-2: one home per key is false the moment `adapter` may be written in two places, and the seat line in `torve doctor` could not say which harness a seat runs. The section now says what the document does, and says what the migration actually cost.
  - id: A-5
    at: '2026-09-10T15:41:46Z'
    title: >-
      prompt_extras is one block of prose, not a list of lines
    md: |-
      D-4 says a profile appends to the charter's base working rules and names the key it appends with. It never said what shape the key is, and the list of strings it got was the wrong one: every entry was rendered as one more bullet in the rules list, so a profile could add rules and could not add a paragraph, an example, or anything a rule needs context for.

      It is one string now, a YAML block scalar, appended after the base rules as it is written. The operator writes the bullets when bullets are what they want. Nothing about D-4's refusal changes — the base rules stay unaddressable, `prompt` is still refused by name, and the block still lands after them and never before.

      Requested by the owner; landed as T-0330.
  - id: A-6
    at: '2026-09-11T14:41:04Z'
    title: >-
      A plugin is equipment, and this row's shape is gone
    changes:
      - subject: D-5
        field: retired
        before: src/torve/config/agents.py
        after: >-
          Superseded by S-0062/D-1: a plugin is an equipment item like every other
          kind — a source and a ref on one typed list — and the two-field shape this
          row defined retired with the renderer that read it (S-0062/D-9, landed T-0329).
    md: |-
      The row defined a plugin as a source and a ref, which was right and too narrow: a skill wanted the same two fields and had neither, an MCP server had no declaration at all. S-0062/D-1 folded all of them into one typed list, and this shape's last reader — the renderer — went with T-0329.

      What the row got right survives in the thing that replaced it: pinning is the source's job, and torve's is to stop the Dockerfile, the cache path and the installed bookkeeping disagreeing about what was pinned. There is no bookkeeping to disagree with now.
  - id: A-7
    at: '2026-09-11T14:41:07Z'
    title: >-
      The renderer is gone and so is the road that fed it
    changes:
      - subject: D-6
        field: retired
        before: src/torve/adapters/runtime/** .torve/sandbox/**
        after: >-
          Superseded by S-0062/D-9 and landed in T-0329: `seed_files`, both adapter
          write-backs, `Plugin` and `SandboxSpec.plugins` are deleted. A plugin reaches
          its harness through the image's own `/opt/torve/equip` (S-0063/D-3), which
          is the harness's business rather than a copy of its internal state torve
          kept in step by hand.
    md: |-
      The row had the engine render a profile's plugins into each harness's own seeding format at dispatch, and refuse a declaration for a harness with no renderer. It worked — `claude plugin list` reported both plugins enabled from files torve wrote.

      What it cost was a hand-kept copy of another program's internal state, to be held in step across that program's versions. `--plugin-dir` reaches the same result through a supported, repeatable session flag, measured on 2.1.252 against an image with no `~/.claude` at all. That was found after the renderer shipped, which is why S-0062/D-9 retired it the same day.

      T-0329 removes the whole road, not just the building: `seed_files`, both adapter write-backs, `Plugin` and `SandboxSpec.plugins` existed only to carry a declaration to it. `harness_kind` is the one survivor and moved beside `image_tag`, since it answers which definition an image was built from — a question `torve doctor` asks and a renderer never did.
