    md: |-
      Amended on 2026-11-17 after the bed's second smoke run of `library-compile`.
      On spoolman-nfc the compiler wrote exactly twelve probes for the document's thirteen rows, one for nearly every row, and none for the rule the library arms keep missing: a `reader_id` with a space is a 422. That rule lives in the document's interface schema, not in a row's text, and the cap left no room for a second probe on its row. Twenty-four leaves room for the rules a schema states once every row has its probe. Each probe adds one re-run per decision, a few seconds on the bed.
