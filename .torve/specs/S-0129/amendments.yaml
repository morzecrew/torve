          the store records a digest of the document's files and the contract's rows
          as the seat is staged them, and a unit whose digest differs, an amendment
          or a refresh since, removes the store before its seat runs and compiles
          again; a store written before the digest was recorded differs
      - subject: D-7
        field: fingerprint
        after: e465645927644f6e/96a8cd04ffe1834e
    md: |
      Amended on 2026-11-22 from a review of the change that let a document ask for its own compile. A unit's store was kept by task and read before anything else, so after a refresh rewrote the contract's rows, or an amendment changed the document, the next attempt still planted and re-ran the probes compiled from the old text. A probe pinning a passage amended away then blocked on its row whatever the critic said (D-4). D-7 ties the store to what it was compiled from, so D-1's one compile per unit holds per document and rows.
