# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      Before an attempt's battery, the host commits what `git add -A` would stage
      in the worktree to a snapshot under `refs/torve/judge/<task>`, leaving the worktree's
      index and branch untouched, and clones the snapshot into a standalone checkout
      at `.wt/<task>.judge/` whose history ends at the snapshot.
    paths: [src/torve/adapters/workspace/git.py, src/torve/application/ports.py]
    consequence: >-
      a gate reads only what the commit would carry, and can run git over the candidate's
      history
    rationale: >-
      On 2026-10-19 two attempts passed spec-valid with an ignored file they wrote
      themselves; an ignored file is in no commit.
    cites: [S-0055/D-2, S-0113/D-2]
  - id: D-2
    grade: ASSUMED
    text: >-
      An attempt's gate pass builds its context over the judge checkout and mounts
      the checkout, not the worktree, into the gates sandbox; the toolchain cache
      volume mounts as before.
    paths: [src/torve/application/runner.py]
    consequence: >-
      nothing an attempt leaves outside its commit reaches a verdict
    rationale: >-
      The gates sandbox mounted the attempt's worktree, ignored files and `.venv`
      included.
    cites: [S-0055/D-2, S-0055/A-5, D-1]
  - id: D-3
    grade: ASSUMED
    text: >-
      The lane's re-gate of a rebased candidate and the whole-document battery run
      their shell gates in a gates sandbox, under the default executor seat's image,
      over a judge checkout of the rebased tip; `process_lane` is handed the sandbox
      factory by `torve merge` and the manager's lane leg.
    paths:
      - src/torve/application/lane.py
      - src/torve/cli/merge.py
      - src/torve/cli/manager.py
    consequence: >-
      no gate battery runs a candidate's code on the host
    rationale: >-
      `_regate` sets no executor, which the gate context reads as the host, so the
      candidate's tests ran in the manager's environment.
    cites: [S-0055/D-3, S-0106/D-2]
  - id: D-4
    grade: ASSUMED
    text: >-
      Before the snapshot, the host lists the ignored files under the worktree that
      the attempt created or changed, outside the engine's own files under `.torve/tmp/`
      and the toolchain caches, and records a list that is not empty as the shadow
      result `ignored-writes` in the attempt's battery; the reviewer does not read
      it.
    paths: [src/torve/application/runner.py]
    consequence: >-
      an attempt that writes outside its commit shows in its record without changing
      a verdict
    rationale: >-
      The judge no longer reads those files, but a write to one is how an attempt
      tried to steer the verdict, and the night's reader should see it.
    cites: [S-0055/D-1, S-0054/D-13]
  - id: D-5
    grade: ASSUMED
    text: >-
      A gate pass removes its judge checkout and ref when the battery ends, and `torve
      reap` removes any a killed pass left, with the rest of the task's footprint.
    paths: [src/torve/application/runner.py, src/torve/application/reaper.py]
    consequence: a judge checkout outlives no battery
    rationale: >-
      A checkout per battery doubles a task's disk while it runs, and a killed pass
      would leave it behind.
    cites: [D-1]
