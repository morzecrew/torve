# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      An attempt records its per-request context curve — first, median, max and sum
      — on every seat, reconstructed from the message usage where cache fields are
      absent, with the shape used named on the row and the sum checked against the
      receipt's own total
    paths: [src/torve/adapters/agent/harness.py, src/torve/application/telemetry.py]
    consequence: >-
      the identity behind every token figure can be verified per attempt instead of
      trusted, and an attempt that cannot be reconstructed says so
    rationale: >-
      the opus seat carries cache fields per message and the deepseek and qwen seats
      carry only `input_tokens`, with the receipt's `iterations` list empty — so three
      of four seats have no measurable curve, and the finding that produced this document
      inferred them from the fourth
    cites: [S-0065/D-6]
  - id: D-2
    grade: ASSUMED
    text: >-
      The burn profile classifies an attempt's tool calls — pack reads, orientation,
      in-scope reads, edits, test runs, lint runs, bookkeeping, other — and records
      calls before the first edit, reruns, calls per message, result bytes by class,
      compaction events and the latency medians
    paths: [src/torve/application/telemetry.py, tests/test_attempt_record.py]
    consequence: >-
      every mitigation has a class that judges it, so a change can be shown to have
      moved what it claimed rather than argued to have
    rationale: >-
      the shape — thirty-two orientation calls before two edits, four to fifteen reruns,
      four to fourteen bookkeeping calls — came from reading 753 tool calls by hand,
      which is not a measurement anyone will repeat after each change
  - id: D-3
    grade: LOCKED
    text: >-
      The ledger reports cache-read tokens, wall seconds, tool calls and dollars per
      changed line and per file in scope, from the diff the landing already commits,
      beside the per-task rates it reports now
    paths: [src/torve/application/ledger.py, src/torve/cli/ledger.py]
    consequence: >-
      a fixed overhead that only hurts small tasks becomes visible, and a mitigation
      aimed at it can be judged
    rationale: >-
      153k cache-read tokens per line on a twenty-line change against 16k on a four-hundred-line
      one, same fleet, same week. Per-task rates put both in one average and hide
      the only thing that distinguishes them
    cites: [S-0065/D-1]
  - id: D-4
    grade: ASSUMED
    text: >-
      The attempt records what every request re-read: the tool and skill counts the
      init line already reports, the contract's row count and size, and the first
      request's context
    paths: [src/torve/application/telemetry.py]
    consequence: >-
      a change to the prefix is seen in the number rather than assumed from the diff
      that made it
    rationale: >-
      the prefix is 33k-35k and is multiplied by every request, and 48 skills sit
      in the catalog of an attempt that invokes none of them — but the contract inside
      it is under 2.5k even with 26 rows, which is the part everyone assumes is the
      problem and is not
    cites: [S-0063/D-10]
    fingerprint: 9cd395605c71d040/c81a24ab2f418ac1
