  - decision: unlisted
    grade: UNLISTED
    class: spec-gap
    at: '2026-10-20T10:50:52Z'
    claim: >-
      S-0116/D-12's candidate arm is told to replay T 'with its held-out properties
      injected', but D-10 gives held-out properties exactly one route into a battery:
      the latest verify.holdout event on the task's implement task, and a shadow replay
      records no such event — it is a no-op there. A replay's battery therefore had
      no way to see an injected set at all, and the composition needed a seam the
      contract does not name.
    evidence: >-
      src/torve/application/dispatch.py:129 — RunDeps gains a holdout field beside
      taken; src/torve/application/runner.py:835-836 is the only reader
    action: decided
    proposal: >-
      Say which route a replay's injected set takes: either that RunDeps carries the
      held-out files into the battery's context for a composed arm (a replay records
      no verify.holdout event, so the event is not the route), or that the lane records
      an event for the replayed verifier and the runner reads it as D-10 says. The
      first is what is built.
    notes: >-
      Contingent paths promoted by this: src/torve/application/dispatch.py and src/torve/application/runner.py,
      both on the contract's contingent list. The seam is one field and one early
      branch, and _attach_holdout is otherwise unchanged.
  - decision: unlisted
