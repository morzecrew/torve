  - decision: D-12
    grade: ASSUMED
    at: '2026-10-20T10:51:10Z'
    claim: >-
      A composed arm replays two tasks in one clone, but every judge lookup is keyed
      by the task id of the clone — the workspace's judge_checkout names its own worktree
      — so the verifier's replay would have judged (and then deleted) a checkout named
      for the verifier, which has no clone. The judge is remapped onto the clone's
      own name for that replay instead.
    evidence: >-
      src/torve/application/shadow.py:69-91 — SharedJudge and replay_source; src/torve/adapters/workspace/git.py:334-340
      keys every clone by shadow_id(task_id)
    action: decided
    notes: >-
      Forced by the workspace's keying rather than chosen: the clone is T's, the replay
      in it is the verifier's, and the judge has to open the one the battery will
      read.
  - decision: D-5
    grade: ASSUMED
    at: '2026-10-20T11:08:48Z'
    attempt: 3
    claim: >-
      Review T-0680 found what neither the pair nor its tests exercised: the candidate
      arm's implement replay judged from T's parent while the verify replay's test
      file sat uncommitted in the same clone, so the file entered the implement diff
      as an added path — the very path the planner mints into that task's scope.deny
      (S-0116/D-5) — and the scope gate convicted every attempt of the arm. D-5 settles
      it: the verify candidate lands before its implementer, so the verify replay's
      tree is held as a commit in the clone and the implement replay is cut from that
      commit, its file base rather than an addition.
    evidence: >-
      src/torve/application/evals.py:808-817 — the verify replay's tree is committed
      in the candidate clone once the held-out files are taken, and that commit is
      the implement replay's parent, so its gates read the verifier's file as base
    action: decided
    proposal: >-
      Say in D-12 which tree a composed candidate arm's implement replay is cut from
      and judged against: the commit its verify replay is held as, not T's parent.
      The pair's denial of the verifier's file is only ever a diff against that commit.
    notes: >-
      Supersedes the attempt-1 unlisted proposal that the composed arm be judged from
      T's parent. tests/test_shadow.py:497-530 proves the mechanism on a real clone
      without a sandbox: uncommitted, the scope gate reports denied path tests/verify/test_s0001_p1.py;
      held, it passes. tests/test_evals.py:1334-1362 pins the composition — the commit
      is made in the candidate clone and the implement replay's parent is it.
