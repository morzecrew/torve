    at: '2026-10-18T18:52:24Z'
    attempt: 2
    claim: >-
      The side container's daemon served TLS on 2376, not the plain 2375 the sandbox
      is told: the dind image sets DOCKER_TLS_CERTDIR and its entrypoint only serves
      plain HTTP when the variable is empty, so the sandbox's docker CLI had no listener
      at DOCKER_HOST while readiness passed over the side container's own unix socket.
      The fix clears DOCKER_TLS_CERTDIR in the side container's environment, so the
      daemon listens where the sandbox looks.
    evidence: >-
      src/torve/adapters/runtime/docker.py:289 — the side container's run args carry
      '-e DOCKER_TLS_CERTDIR=', the variable whose emptying turns the image's TLS
      off; docker.py:81 is the DOCKER_HOST the sandbox is given.
    action: decided
    proposal: >-
      S-0111/D-1 should say that the side daemon must be started so it serves its
      API in the clear on 2375 — naming the DOCKER_TLS_CERTDIR clearing (or an equivalent)
      — rather than only naming the address the sandbox reaches it at, so a dind image
      whose default is TLS cannot silently leave the stated address dead.
