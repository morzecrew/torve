    claim: >-
      Rejected: the tree already reads the current role field. `may_triage` takes
      the role from `answered.get("role_name")` and keeps `permission` only as a fallback,
      and the tests record a body the endpoint really sends — `{"permission": "read",
      "role_name": "triage"}` answers true — so a triage holder is not skipped and
      the second read of S-0119/D-3 holds as written. Nothing is changed for this
      claim.
    evidence: >-
      src/torve/adapters/vcs/git.py:1334-1337 — the role is `role_name` first and
      `permission` only a fallback; tests/test_forge.py:1019-1026 records `{"permission":
      "read", "role_name": "triage"}` and `{"permission": "write", "role_name": "maintain"}`
      as true and `{"permission": "read", "role_name": "read"}` as false.
    action: decided
    proposal: >-
      No amendment: S-0119/D-3 already requires triage or more, and the adapter reads
      `role_name`, the field the collaborators permission endpoint sends for triage
      and maintain. The thread is answered by the tree as fixed in the T-0727 landing
      f6d2322.
