# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-10T17:04:33Z'
    title: Phase 1 takes the retirement D-11 decided
    md: |-
      The phase was written before Q-1 was settled and still said `torve sandbox` shells bake. D-11 retires the verb's build half and `RuntimePort.build_image` with it, and that reaches further than the definitions: the port has two adapter implementations and four stubs in the suite, `torve doctor` and `torve intake` name the verb in their prose, and the README documents it twice.

      They are taken here rather than in a follow-up, because a half-retired port is worse than either state — the protocol would still promise a build nothing performs. No decision row changes and no scope reaches past what the retirement touches.
  - id: A-2
    at: '2026-09-10T17:37:44Z'
    title: >-
      Phase 1 takes the two files the retirement reaches outside itself
    md: |-
      `tests/test_evals.py` built a throwaway candidate image through `RuntimePort.build_image` to measure two digests apart. With the port gone it builds one the way an operator does, which is a two-line change in a file the phase did not name.

      `.dockerignore` is new and belongs to the build: the base's context is the repository root (D-8), so what an image must never bake — the worktree, the venv, the task state — is excluded there rather than by the staging the retired verb used to do.
  - id: A-3
    at: '2026-09-10T17:42:57Z'
    title: >-
      Phase 1 takes the projection index its own move changes
    md: |-
      Moving the definitions to `sandboxes/` creates five governed directories, and the root `AGENTS.md` carries the index of every governed directory (S-0054/D-7). So `torve spec project` rewrites five new sections and one index line the phase could not name.

      This is the third scope amendment on one phase, which is worth saying plainly: the retirement's reach was underestimated at authoring, and each widening was found by a red gate rather than by reading. The scope is what the work actually touches now.
  - id: A-4
    at: '2026-09-10T17:52:18Z'
    title: >-
      The base's row governs the definitions, not one directory each
    changes:
      - subject: D-7
        field: paths
        before: [sandboxes/base/**, tests/test_sandbox_defs.py]
        after: [sandboxes/**, tests/test_sandbox_defs.py]
      - subject: D-7
        field: fingerprint
        after: b12c7650bd697574/0cb1affa4de73ac6
  - id: A-5
    at: '2026-09-10T17:52:21Z'
    title: D-9 governs the definitions as one surface
    changes:
      - subject: D-9
        field: paths
        before: [sandboxes/claude/**, sandboxes/dsh/**, sandboxes/mimo/**]
        after: [sandboxes/**]
      - subject: D-9
        field: fingerprint
        after: 04df4b057682af0f/765a667e6ee4604e
    md: |-
      The same coarsening as A-4, and it fixes a second defect while it is there: D-9's paths named `sandboxes/claude/**` alongside `sandboxes/dsh/**` and `sandboxes/mimo/**`, which are phase 2's surface and phase 3's. A row whose paths span two phases mints a contract that contradicts itself — the executor inherits a decision it cannot satisfy without leaving `scope.allow`.

      `sandboxes/**` sits inside every phase that touches a definition, which is what the row always meant: claude first, the other two after.
