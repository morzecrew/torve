        field: paths
        before: [sandboxes/base/**, tests/test_sandbox_defs.py]
        after: [sandboxes/**, tests/test_sandbox_defs.py]
      - subject: D-7
        field: fingerprint
        after: b12c7650bd697574/0cb1affa4de73ac6
  - id: A-5
    at: '2026-09-10T17:52:21Z'
    title: D-9 governs the definitions as one surface
    changes:
      - subject: D-9
        field: paths
        before: [sandboxes/claude/**, sandboxes/dsh/**, sandboxes/mimo/**]
        after: [sandboxes/**]
      - subject: D-9
        field: fingerprint
        after: 04df4b057682af0f/765a667e6ee4604e
    md: |-
      The same coarsening as A-4, and it fixes a second defect while it is there: D-9's paths named `sandboxes/claude/**` alongside `sandboxes/dsh/**` and `sandboxes/mimo/**`, which are phase 2's surface and phase 3's. A row whose paths span two phases mints a contract that contradicts itself — the executor inherits a decision it cannot satisfy without leaving `scope.allow`.

      `sandboxes/**` sits inside every phase that touches a definition, which is what the row always meant: claude first, the other two after.
  - id: A-6
    at: '2026-09-10T18:41:06Z'
    title: Phase 2 takes the seats the seam reaches
    md: |-
      D-1 refuses `command` on a manifest and takes it off the seat, which is the migration this phase exists to force. Fifty-five fixtures across nine test modules build a `TierConfig` with a command in it, because until now that was how a test said "a real seat".

      They are ported here rather than in a follow-up, because a phase that leaves the suite red has not landed. Most are a deletion and an `image=`; `tests/test_tiering.py` is the exception and is where the port is worth reading — its harness cases used the command to *be* the harness, so they now write a two-line `run` script and point the seam at it, which exercises the mechanism the old form could not.
  - id: A-7
    at: '2026-09-10T19:08:43Z'
    title: >-
      Phase 2 takes the shared fixture and the projections its rows move
    md: |-
      Two kinds of file the phase could not name. `tests/conftest.py` gains the one helper every ported module uses — a stand-in for the image's two scripts, written once rather than nine times.

      The three `AGENTS.md` are rendered, not written: amending S-0062/D-2 and S-0062/D-5 for the moved seam changes what governs `src/torve/config/`, `src/torve/application/` and `src/torve/adapters/runtime/`, and `torve spec project` rewrites their managed sections. A phase that amends a row must be able to re-render the sections that row appears in.
  - id: A-8
    at: '2026-09-10T19:45:10Z'
    title: >-
      Phase 3 takes the claude script the pipe bug it found reaches
    md: |-
      Probing dsh against its real image showed `exit=0` after a `MISSING_CREDENTIAL` failure. `run` pipes the harness through `tee` so the engine gets both a stream and a file, and a pipeline reports its last command — so every failed attempt read as a clean one, and the engine's verdict belonged to `tee`.

      claude's `run` landed in phase 2 with the same shape, so the fix reaches its file. All three carry the status by hand now, with the harness inside an `if` because `set -e` would otherwise kill the subshell before the status could be written.

      This is what phase 3 exists for, arriving from an unexpected direction: the contract held across three harnesses without a variable changing, and running the third one for real found a defect the first two hid.
  - id: A-9
    at: '2026-09-11T12:01:33Z'
    title: >-
      A fourth phase: the image's own layout and its configuration channel
    md: |-
      Four rows and a phase, from what running the three harnesses for real turned up and from the owner's reading of the definitions beside them.

      D-14 is `rootfs/`, the convention `morzecrew/platform-images` runs: a definition's files mirror the container filesystem and one `COPY rootfs/ /` installs them, instead of a path written three times — in the COPY argument, in the chmod, and in the comment above both.

      D-15 is the one with reach. The dsh image bakes seven model overlays, so the fleet's roster is a property of the harness and adding a model is a rebuilt image. Measured against 0.1.1-rc.2: an overlay generated at equip time from two environment variables resolves its provider, passes the credential check and dials the broker. The files buy nothing a knob does not, and D-10 already said a knob belongs in `env`.

      D-16 corrects a claim this document shipped. dsh loads `@deepseek-ai/dsh-skill-filesystem`, watching `.agents/skills` and `.dsh/skills`; mimo reads `<project>/.mimocode/skill/<name>/SKILL.md`. The mimo manifest saying `kinds: [plugin]` was wrong about the harness rather than cautious about it, and S-0062/D-10's prompt paragraph now stands for no harness this repository builds.

      D-17 is a defect phase 3 landed: dsh's `--patch` configures an entry the profile already carries and cannot add one, so `equip` appending arbitrary fragments works only for an item patching an id that already exists. That is why the model overlays tested clean and nothing else would have.
  - id: A-10
    at: '2026-09-11T12:09:00Z'
    title: >-
      Phase 4 takes the two projections its amendment re-renders
    md: >-
      D-16 amends S-0062/D-10, which governs `src/torve/adapters/agent/` and `src/torve/application/`,
      so `torve spec project` rewrites their managed sections. Rendered, not written
      — the same reason phase 2 needed three of them under A-7.
  - id: A-11
    at: '2026-09-11T12:54:48Z'
    title: >-
      The directory is named for where it lands, not for a filesystem it does not
      mirror
    changes:
      - subject: D-14
        field: text
        before: >-
          Everything a definition puts inside its image lives under `rootfs/`, mirroring
          the container filesystem, and one `COPY rootfs/ /` installs it.
        after: >-
          Everything a definition puts inside its image lives under `toolkit/`, and
          one `COPY toolkit/ /opt/torve/` installs it.
      - subject: D-14
        field: fingerprint
        after: 6699fa33dd4e9eb8/765a667e6ee4604e
    md: |-
      The row said `rootfs/`, mirroring the container filesystem, which is the convention `morzecrew/platform-images` runs and the right one when files land in several places. Here they do not: every file all three definitions install goes to `/opt/torve`, so the mirror bought three empty directory levels and a name that promised a generality nothing used.

      `toolkit/` is what `/opt/torve` has been called since S-0033/D-4, so the directory now says where its contents land. A definition that one day needs `/etc` or `/usr/local/bin` adds a `rootfs/` beside it and copies that separately; nothing here has to be decided in advance to allow it.
  - id: A-12
    at: '2026-09-11T15:26:33Z'
    title: A subscription seat mounts no credential
    md: |-
      D-18, from the first live attempt. The subscription route was defined by its auth volume: a per-worker-slot volume mounted read-write at `/auth`, holding `.credentials.json`, linked into the harness's HOME so a refreshed token survived for the next attempt on that slot.

      What that means in an attempt's hands is a standing credential. The file carries a refresh token as well as an access token, the mount is writable, and the volume outlives every sandbox that ever mounted it — so an attempt that reads it holds something that does not expire with the attempt. A variable carries one token, for one attempt, with no refresh beside it.

      Measured both ways against the real image: the same prompt answers identically through `CLAUDE_CODE_OAUTH_TOKEN` with no `/auth` in the container at all. The `auth_volume` and `auth_mount` fields stay on the manifest — the codex route still uses one and has not been measured for an env form — but the harness this repository dispatches to uses neither.
  - id: A-13
    at: '2026-09-11T15:30:19Z'
    title: >-
      The volume route stays, and read-write is what makes it safe to use
    changes:
      - subject: D-18
        field: text
        before: >-
          A subscription seat authenticates by variable name and mounts no credential:
          the claude image takes `CLAUDE_CODE_OAUTH_TOKEN` and no auth volume.
        after: >-
          The seats this repository dispatches to authenticate by variable name and
          mount no credential — the claude image takes `CLAUDE_CODE_OAUTH_TOKEN`,
          dsh takes `DEEPSEEK_API_KEY`. The auth-volume route stays for a harness
          that has no env form, and where one is used it is mounted read-write: a
          harness that cannot persist a refreshed token does not fail, it hangs.
      - subject: D-18
        field: fingerprint
        after: 6ad7f5252e3f2864/4d1178442d9c9e65
    md: |-
      A-12 read as an argument against auth volumes, and that is not the finding. A volume is a fine way to carry a credential a harness has no other way to take; codex is such a harness and keeps one.

      Two things are true instead. The seats this repository can actually experiment with — claude and dsh — both have an env form, so they use it: one token for one attempt, nothing persisted, which is the narrower blast radius and costs nothing here. And where a volume *is* used it has to be read-write, because the harness refreshes its token mid-session; a read-only mount does not produce a clean failure, it produces a sandbox that sits there until the agent clock kills it, which reads as a slow model rather than a broken mount.

      The second half is the one worth carrying forward, because it is a failure mode nothing else in the loop would name.
  - id: A-14
    at: '2026-09-11T17:12:43Z'
    title: >-
      A sixth variable: where equipment lands in the workspace
    changes:
      - subject: D-2
        field: text
        before: >-
          The engine speaks to every image through one set of environment variables
          — `TORVE_PROMPT`, `TORVE_MODEL`, `TORVE_EQUIPMENT`, `TORVE_OUTPUT`, and
          `TORVE_BROKER_URL`/`TORVE_BROKER_TOKEN` where a broker is in force.
        after: >-
          The engine speaks to every image through one set of environment variables
          — `TORVE_PROMPT`, `TORVE_MODEL`, `TORVE_EQUIPMENT`, `TORVE_EQUIP_ROOT`,
          `TORVE_OUTPUT`, and `TORVE_BROKER_URL`/`TORVE_BROKER_TOKEN` where a broker
          is in force.
      - subject: D-2
        field: fingerprint
        after: 9ce1369002088403/363650853e0975a3
    md: |-
      D-19 needs the engine and the image to agree on one path, and a path written in two places is a path that drifts. The manifest declares it once: the engine excludes it in the worktree and names it to the image, and `equip` writes where it was told.

      claude needs none — `--add-dir` points at the read-only mount itself, which is why it never hit this. A harness that reads equipment out of the workspace is the case the variable exists for, and a harness that declares no root and writes anyway lands visible, where the scope gate convicts loudly. Failing safe is the point: silent is what this cost.
