# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: >-
      the definitions move, and the layer they duplicate is inherited
    intent: >-
      `sandboxes/<name>/` at the repository root, building to `<name>-sandbox`, with
      one base image carrying `git`, `uv` and the engine's CLI. The block that is
      byte-identical in five definitions becomes inheritance, and `_torve-cli.dockerfile`
      retires with the test that pinned the copies against it. `bake.hcl` declares
      a target per definition with the base as a named context and a justfile recipe
      is the build. `torve sandbox build` and `stage` retire with `RuntimePort.build_image`,
      leaving `list` and `digest`, and every message that named the verb names the
      recipe. No engine behaviour changes — the images keep the commands their manifests
      already carry.
    scope:
      - sandboxes/**
      - .torve/sandbox/**
      - bake.hcl
      - justfile
      - src/torve/cli/sandbox.py
      - src/torve/cli/main.py
      - src/torve/cli/doctor.py
      - src/torve/application/ports.py
      - src/torve/application/intake.py
      - src/torve/adapters/runtime/**
      - README.md
      - tests/test_sandbox_defs.py
      - tests/test_sandbox_images.py
      - tests/test_runtime.py
      - tests/test_runtime_conformance.py
      - tests/test_cli.py
      - tests/test_doctor.py
      - tests/test_intake.py
      - tests/test_run_loop.py
      - tests/test_broker.py
      - tests/test_evals.py
      - .dockerignore
      - AGENTS.md
      - CHANGELOG.md
    acceptance:
      - uv run pytest
      - uv run mypy src
      - uv run lint-imports
    character: structural
  - phase: 2
    title: the env seam, and claude through it
    intent: >-
      `/opt/torve/equip` and `/opt/torve/run` in the claude image, and the six variables
      that reach them. `command` leaves the manifest and is refused by name, `equips`
      loses its templates and keeps `kinds`, `env` becomes the knob surface, and the
      broker's two placeholders become two variables with the routing refusal intact.
      The engine runs `equip` and then `run`, and parses what `run` wrote where it
      was told to write it.
    scope:
      - src/torve/adapters/agent/harness.py
      - src/torve/application/ports.py
      - src/torve/application/session.py
      - src/torve/config/agents.py
      - src/torve/config/runconfig.py
      - sandboxes/base/**
      - sandboxes/claude/**
      - .torve/harnesses/**
      - .torve/schemas/**
      - .torve/specs/S-0062/**
      - tests/test_tiering.py
      - tests/test_agents.py
      - tests/test_runconfig.py
      - tests/test_session.py
      - CHANGELOG.md
    acceptance:
      - uv run pytest
      - uv run mypy src
      - uv run lint-imports
    depends_on:
      - 1
    character: structural
  - phase: 3
    title: >-
      dsh and mimo, which is where the contract is tested
    intent: >-
      `equip` and `run` for the two harnesses whose equipment is not flags — dsh writing
      one `--patch` overlay from the manifest, mimo running its install commands before
      the run. A variable that has to change to admit them is a claude-shaped contract,
      and changing it here is the finding this phase exists for. Their manifests gain
      `kinds` naming what each can actually take.
    scope:
      - sandboxes/dsh/**
      - sandboxes/mimo/**
      - .torve/harnesses/**
      - tests/test_sandbox_defs.py
      - CHANGELOG.md
    acceptance:
      - uv run pytest
      - uv run mypy src
    depends_on:
      - 2
    character: structural
contract_example:
  schema_version: 2
  id: T-0331
  spec: S-0063
  phase: 1
  role: implement
  title: >-
    the definitions move, and the layer they duplicate is inherited
  intent: >-
    `sandboxes/<name>/` at the repository root with one base image carrying the CLI
    layer, a bake file expressing the dependency, and a justfile recipe as the build.
  depends_on: []
  targets: []
  scope:
    allow:
      - sandboxes/**
      - .torve/sandbox/**
      - bake.hcl
      - justfile
      - src/torve/cli/sandbox.py
      - src/torve/cli/main.py
      - src/torve/cli/doctor.py
      - src/torve/application/ports.py
      - src/torve/application/intake.py
      - src/torve/adapters/runtime/**
      - README.md
      - tests/test_sandbox_defs.py
      - tests/test_sandbox_images.py
      - tests/test_runtime.py
      - tests/test_runtime_conformance.py
      - tests/test_cli.py
      - tests/test_doctor.py
      - tests/test_intake.py
      - tests/test_run_loop.py
      - tests/test_broker.py
      - tests/test_evals.py
      - .dockerignore
      - AGENTS.md
      - CHANGELOG.md
    deny: []
  acceptance:
    - uv run pytest
    - uv run mypy src
    - uv run lint-imports
  decisions:
    - id: D-6
      grade: LOCKED
      text: >-
        Image definitions live at `sandboxes/<name>/` in the repository root and build
        to `<name>-sandbox`; `.torve/sandbox/` stays the hook for a consuming repository's
        own.
      paths: [sandboxes/**, src/torve/cli/sandbox.py]
      consequence: >-
        torve's own source stops living in the directory torve creates inside repositories
        it works on, and an image gets a name worth publishing
      check_state: shadow
    - id: D-7
      grade: LOCKED
      text: >-
        One base image carries `git`, `uv` and the engine's CLI; every definition
        inherits it, and `_torve-cli.dockerfile` with the test pinning five copies
        against it retires.
      paths: [sandboxes/base/**, tests/test_sandbox_defs.py]
      consequence: >-
        the layer five images duplicate is built once and inherited, and the test
        that stood in for inheritance goes with it
      check_state: shadow
  budget: {}
  tier: executor
  character: structural
