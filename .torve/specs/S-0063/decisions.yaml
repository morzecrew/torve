# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      A sandbox image carries `/opt/torve/run`, which invokes its harness; a manifest
      carries no command template and `command` is refused by name.
    paths: [src/torve/adapters/agent/harness.py, src/torve/config/agents.py]
    consequence: >-
      the shell that knows how to start a harness lives beside the harness, and a
      seat cannot be misconfigured into a model that silently would not work
    rationale: >-
      the line braids auth wiring, invocation and equipment, and only the knobs among
      them are the operator's; nothing checks the string before it runs, and a wrong
      flag reads as a failing model rather than a failing configuration
    cites: [S-0017/D-4, S-0004/D-1]
  - id: D-2
    grade: LOCKED
    text: >-
      The engine speaks to every image through one set of environment variables —
      `TORVE_PROMPT`, `TORVE_MODEL`, `TORVE_EQUIPMENT`, `TORVE_OUTPUT`, and `TORVE_BROKER_URL`/`TORVE_BROKER_TOKEN`
      where a broker is in force.
    paths: [src/torve/application/ports.py, src/torve/adapters/agent/harness.py]
    consequence: >-
      a new harness is a new image and never a new template language, and every adapter
      fills one shape
    rationale: >-
      `SandboxSpec` already carries an environment and both runtimes already set it,
      so the channel exists; what a template bought was substitution the environment
      does without `str.replace` over shell
    cites: [S-0021/D-9]
  - id: D-3
    grade: LOCKED
    text: >-
      A sandbox image carries `/opt/torve/equip`, which translates the equipment manifest
      into whatever its harness needs; S-0062/D-2's flag templates retire and `kinds`
      is what remains of the capability map.
    paths: [src/torve/config/agents.py, sandboxes/**]
    consequence: >-
      equipment reaches a harness the way that harness takes it, decided beside the
      harness rather than by a renderer keeping up with three of them across versions
    rationale: >-
      measured — claude takes flags, dsh takes one repeatable YAML overlay, mimo takes
      install commands; a string with `{path}` in it expresses the first and neither
      of the others, so the map was written from the one harness that had been measured
    cites: [S-0062/D-2, S-0062/D-9]
  - id: D-4
    grade: LOCKED
    text: >-
      `kinds` on a manifest is the enumeration this harness accepts; a profile declaring
      a kind outside it is refused at load, naming both files, with the package-data
      skill exception S-0062/A-3 already carries.
    paths: [src/torve/config/agents.py]
    consequence: >-
      the refusal survives the templates, in reviewed configuration, without pulling
      an image to learn what a harness can take
    rationale: >-
      an attempt quietly missing its equipment measures a regime nobody configured,
      which is why the refusal existed; nothing about that argument depended on the
      template
    cites: [S-0062/D-2, S-0062/A-3]
  - id: D-5
    grade: ASSUMED
    text: >-
      Broker placeholders retire into `TORVE_BROKER_URL` and `TORVE_BROKER_TOKEN`;
      the refusal moves from "the string names a placeholder" to "this seat needs
      a broker".
    paths: [src/torve/adapters/agent/harness.py]
    consequence: >-
      a run-scoped token stops being spliced into a shell string, and a seat whose
      provider the broker does not route is still refused before dispatch
    rationale: >-
      the placeholder check reads the template, so retiring the template would retire
      the check; the thing being protected is that a brokered seat never reaches a
      provider directly, which the environment states more plainly than a substitution
    cites: [S-0021/D-9, S-0055/D-4]
  - id: D-6
    grade: LOCKED
    text: >-
      Image definitions live at `sandboxes/<name>/` in the repository root and build
      to `<name>-sandbox`; `.torve/sandbox/` stays the hook for a consuming repository's
      own.
    paths: [sandboxes/**, src/torve/cli/sandbox.py]
    consequence: >-
      torve's own source stops living in the directory torve creates inside repositories
      it works on, and an image gets a name worth publishing
    rationale: >-
      S-0055/D-30 is about what torve owns in a consuming repository — configuration,
      manifests, task state; these images are torve's own source, built here and pulled
      elsewhere, and S-0017/D-2 that put them under `.torve/` is archived
    cites: [S-0055/D-30, S-0017/D-2]
  - id: D-7
    grade: LOCKED
    text: >-
      One base image carries `git`, `uv` and the engine's CLI; every definition inherits
      it, and `_torve-cli.dockerfile` with the test pinning five copies against it
      retires.
    paths: [sandboxes/**, tests/test_sandbox_defs.py]
    consequence: >-
      the layer five images duplicate is built once and inherited, and the test that
      stood in for inheritance goes with it
    rationale: >-
      the block is byte-identical in every definition and kept in step by a pin test,
      which is a test doing a base image's job
    cites: [S-0017/D-8]
    fingerprint: b12c7650bd697574/0cb1affa4de73ac6
  - id: D-8
    grade: ASSUMED
    text: >-
      `bake.hcl` declares a target per definition with the base as a named context,
      and a justfile recipe is the build; `torve sandbox build` shells `docker buildx
      bake`.
    paths: [bake.hcl, justfile, src/torve/cli/sandbox.py]
    consequence: >-
      the build expresses its own dependency graph, and the context staging the verb
      does by hand becomes the base image's inheritance
    rationale: >-
      buildx 0.36.1 is present and the arrangement is the one `morzecrew/platform-images`
      already runs; a dependency a build tool understands beats one a Python verb
      assembles
  - id: D-9
    grade: LOCKED
    text: >-
      Claude's `equip` and `run` land first; dsh's and mimo's land after, and they
      are the proof that the contract is not claude-shaped.
    paths: [sandboxes/**]
    consequence: >-
      the first landing is written against a harness this repository can reach, and
      the contract's generality is tested rather than asserted
    rationale: >-
      only claude has a seat to measure against, so writing all three at once lands
      two unexercised; the cost is that a claude-shaped contract is found one phase
      later, which is the trade the owner chose
    fingerprint: 04df4b057682af0f/765a667e6ee4604e
  - id: D-10
    grade: ASSUMED
    text: >-
      A manifest's `env` mapping reaches the image's environment and nothing else
      reads it; a knob that is not there is a rebuild.
    paths: [src/torve/config/agents.py, src/torve/application/session.py]
    consequence: >-
      an operator changes a permission mode in configuration, and a change to how
      the harness is invoked moves the image digest the telemetry already records
    rationale: >-
      the image is harness identity, so a flag that changes what an agent may do is
      a regime change that ought to be visible; today `--permission-mode` can change
      under a fixed digest and nothing says so
    cites: [S-0017/D-4]
  - id: D-11
    grade: LOCKED
    text: >-
      `torve sandbox build` and `stage` retire, and `RuntimePort.build_image` with
      them; the verb keeps `list` and `digest`, and `just images` is the build.
    paths:
      - src/torve/cli/sandbox.py
      - src/torve/application/ports.py
      - src/torve/adapters/runtime/**
    consequence: >-
      the engine loses its last way to build an image, which is the rule S-0017/D-3
      already stated and could not enforce while a verb of its own did it
    rationale: >-
      both verbs exist to assemble a build context by hand — staging the project into
      every definition so the CLI layer can install — and the base image removes exactly
      that work; a wrapper around bake would be indirection with nothing left inside
      it
    cites: [S-0017/D-3, D-7, D-8]
  - id: D-12
    grade: LOCKED
    text: >-
      The equipment manifest is `manifest.json` at the root of the read-only equipment
      mount, named by `TORVE_EQUIPMENT` alone — never a second variable, never a file
      in the workspace.
    paths: [src/torve/application/session.py, src/torve/adapters/runtime/**]
    consequence: >-
      the attempt cannot rewrite the description of what it was equipped with, and
      one variable names one root rather than two disagreeing about which is authoritative
    rationale: >-
      the workspace is writable by the attempt and mounts read-only in the reviewer's
      lane, so a manifest there would be both editable by the thing it describes and
      differently reachable per lane; the mount is already read-only for this reason
      (S-0062/D-5)
    cites: [S-0062/D-5, S-0005/D-2, D-2]
  - id: D-13
    grade: LOCKED
    text: >-
      Building a sandbox image is an operator's act and never an attempt's: the battery
      checks a definition's shape and never its build, and `TORVE_IMAGE_TESTS` runs
      the probes that build one.
    paths: [tests/test_sandbox_images.py, tests/test_sandbox_defs.py]
    consequence: >-
      the acceptance battery stays under its clock, and a definition that would not
      build is an operator's finding rather than a timed-out gate
    rationale: >-
      proposed from T-0331, where it was measured: the battery runs the suite twice
      — acceptance and coverage-delta — concurrently, and both raced the same bake
      through one buildkit, taking acceptance past its 900s bound. It follows from
      D-11 anyway: the engine has no way to build an image, so whether one builds
      is what `just images` answers, and the shape checks are what catch a drafting
      error
    cites: [D-11, D-7]
  - id: D-14
    grade: LOCKED
    text: >-
      Everything a definition puts inside its image lives under `toolkit/`, and one
      `COPY toolkit/ /opt/torve/` installs it.
    paths: [sandboxes/**]
    consequence: >-
      where a file lands is where it is written, so a definition is read by looking
      at it rather than by following a COPY line to a destination named somewhere
      else
    rationale: >-
      the convention `morzecrew/platform-images` already runs, and this repository
      has three definitions now writing `/opt/torve/` paths in a COPY argument, a
      chmod and a comment — three places for one fact
    fingerprint: 6699fa33dd4e9eb8/765a667e6ee4604e
  - id: D-15
    grade: LOCKED
    text: >-
      A harness's per-model configuration is the seat's `env`, rendered into whatever
      form that harness reads by its own `equip`; no image bakes a model file.
    paths: [sandboxes/**, .torve/harnesses/**]
    consequence: >-
      adding a model is an edit to reviewed configuration rather than a rebuilt image,
      and the seven overlay files this repository bakes into the dsh image go
    rationale: >-
      measured: a `--patch` overlay generated at equip time from two environment variables
      resolves its provider, passes the credential check and dials the broker — so
      the files buy nothing a knob does not, and a model in an image makes the roster
      a property of the harness instead of a property of the fleet
    cites: [D-10]
  - id: D-16
    grade: LOCKED
    text: >-
      `skill` is a kind every harness this repository builds accepts, delivered the
      way that harness reads skills; S-0062/D-10's prompt paragraph stands only for
      a harness that reads none.
    paths: [sandboxes/**, .torve/harnesses/**, src/torve/application/skills.py]
    consequence: >-
      a skill reaches a dsh or mimo seat as a skill its harness loads, rather than
      as a directory the prompt names and the model may or may not read
    rationale: >-
      measured, and it corrects a claim this document shipped: dsh loads `@deepseek-ai/dsh-skill-filesystem`,
      which watches `.agents/skills` and `.dsh/skills`, and mimo reads `<project>/.mimocode/skill/<name>/SKILL.md`
      — so the manifest saying mimo takes only plugins was wrong about the harness,
      not cautious about it
    cites: [S-0062/D-10, S-0062/D-6]
  - id: D-17
    grade: LOCKED
    text: >-
      dsh's `--patch` configures an entry the profile already carries and cannot add
      one, so equipment that would add a plugin installs it first and patches it after.
    paths: [sandboxes/dsh/**]
    consequence: >-
      an item naming a plugin dsh has not got is refused where it is declared, instead
      of failing at boot with `patch: entry "..." not found` inside an attempt
    rationale: >-
      measured against 0.1.1-rc.2, and it is a defect in what phase 3 landed: `equip`
      appends every non-plugin item into one overlay, which works only when the item
      patches an id the profile already has — which is why the model overlays tested
      clean and nothing else would have
    cites: [D-3]
  - id: D-18
    grade: LOCKED
    text: >-
      A subscription seat authenticates by variable name and mounts no credential:
      the claude image takes `CLAUDE_CODE_OAUTH_TOKEN` and no auth volume.
    paths: [sandboxes/claude/**, .torve/harnesses/**]
    consequence: >-
      an attempt holds one token for its own lifetime instead of reading a refresh
      token out of a volume that outlives every sandbox that ever mounted it
    rationale: >-
      the volume held `accessToken` and `refreshToken` in plaintext, mounted read-write
      because refresh writes, and persisted across attempts — so an attempt that read
      it held a standing credential rather than a bounded one. Measured: the same
      prompt answers identically through the variable with no `/auth` in the container
      at all, once the host's proxy environment reaches it
    cites: [S-0055/D-4, S-0001/D-13]
invariants:
  - id: I-1
    statement: >-
      No harness manifest carries a shell line, and no engine code substitutes into
      one.
    paths: [src/torve/config/agents.py, src/torve/adapters/agent/harness.py]
    check: uv run pytest tests/test_agents.py -k no_shell
  - id: I-2
    statement: >-
      Every image definition answers `/opt/torve/equip` and `/opt/torve/run`, and
      none carries its own copy of the CLI layer.
    paths: [sandboxes/**]
    check: uv run pytest tests/test_sandbox_defs.py -k seam
