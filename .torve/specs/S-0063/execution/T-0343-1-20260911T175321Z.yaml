    at: '2026-09-11T17:48:21Z'
    claim: >-
      The rule was right and the file was wrong. git reads info/exclude from the common
      gitdir and never from a linked worktree's own, which is what every attempt runs
      in — so _exclude_equip_root wrote a file nothing consulted, check-ignore matched
      nothing, and the first clean dsh run still had twelve equipment files headed
      for the commit. The test passed because it read back the file it had just written
      rather than asking git.
    evidence: >-
      src/torve/application/session.py:619 — rev-parse --git-common-dir, and the test
      now asserts on check-ignore inside a real linked worktree.
    action: decided
    notes: >-
      Repository-wide rather than per-worktree is the right scope anyway: the root
      is torve's by declaration and no checkout should track equipment.
