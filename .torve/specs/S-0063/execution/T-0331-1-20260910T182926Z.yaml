      nothing would build, which is the drafting error that exists once a build file
      does.
    evidence: >-
      src/torve/application/intake.py:519 — the leg reads the bake file and names
      the recipe, and the runtime is still asked to resolve configured images.
    action: decided
    notes: >-
      torve sandbox keeps list and digest; build and stage are gone with RuntimePort.build_image,
      its two adapter implementations and four stubs in the suite.
