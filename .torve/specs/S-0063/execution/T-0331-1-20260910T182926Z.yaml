  - decision: D-6
    grade: LOCKED
    at: '2026-09-10T17:54:24Z'
    claim: >-
      Moving out of .torve/ has a consequence nobody wrote down: a hidden directory
      is not projectable, so the definitions were ungoverned by the colocation rule
      the whole time they lived there. They are projectable now, and every definition
      directory carries a rendered AGENTS.md like every other source directory in
      this tree.
    evidence: >-
      src/torve/application/colocation.py:87 — _projectable refuses any path segment
      starting with a dot, which .torve/sandbox/ always was.
    action: decided
    notes: >-
      Amended in the same pass: D-7 and D-9 named directories one by one, which rendered
      near-identical sections into four folders holding a Dockerfile each (S-0063/A-4,
      A-5).
