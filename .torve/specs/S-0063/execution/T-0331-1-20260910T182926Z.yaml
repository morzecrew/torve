  - decision: D-11
    grade: LOCKED
    at: '2026-09-10T17:54:26Z'
    claim: >-
      The retirement reached the drafting gate, which built every touched definition
      to prove it still builds. It cannot, and replacing it with a build run some
      other way would put the network and a builder back on a path that may reach
