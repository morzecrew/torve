  - decision: unlisted
    grade: UNLISTED
    at: '2026-09-10T18:24:14Z'
    claim: >-
      The acceptance battery cannot build sandbox images. It ran the suite twice —
      once as acceptance, once inside coverage-delta — concurrently, and both raced
      the same bake through one buildkit; six images over this host's proxied egress
      took acceptance past its 900s bound and the gate timed out. The image-building
      probes are gated behind TORVE_IMAGE_TESTS now, which takes the suite from over
      15 minutes to 2:03. Nothing in the corpus decided what the battery must build,
      so this is a rule being written rather than departed from.
    evidence: >-
      tests/test_sandbox_images.py:96 — builds_images, the marker; the text-level
      checks in tests/test_sandbox_defs.py still run on every attempt.
    action: decided
    proposal: >-
      A row on S-0063: building a sandbox image is an operator's act and never an
      attempt's, so the battery checks a definition's shape and never its build. It
      follows from D-11 — the engine has no way to build one, so 'does this build'
      is what just images answers — and the shape checks are what catch a drafting
      error: inherits the base, carries no copy of the CLI layer, is named by a bake
      target, and bakes what the wheel declares.
    notes: >-
      What is gated is whether a pinned npm version still resolves, which surfaces
      the moment anyone builds.
