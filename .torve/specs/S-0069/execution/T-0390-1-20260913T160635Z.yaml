  - decision: D-5
    grade: OPEN
    at: '2026-09-13T16:03:39Z'
    claim: >-
      Settled: the qualifying set is layering, scope, user-facing-text and decisions-reported
      — the gates whose checks are pure functions of the tree — pinned at REPAIR_GATES
      in runner.py; acceptance, the largest repeat class, is deliberately outside
      it because only per-gate repeat counts separate a tree worth keeping from an
      approach worth abandoning.
    evidence: >-
      .torve/specs/S-0069/document.yaml:28 - the ledger counts the same gate convicting
      the next attempt of the same task 196 times across 28 tasks: acceptance 52,
      layering 41, user-facing-text 39, decisions-reported 26, scope 14 — the four
      pure-tree gates recorded here beside the acceptance class that stays out.
    action: decided
  - decision: D-3
    grade: ASSUMED
    at: '2026-09-13T16:03:53Z'
    claim: >-
      Assumption held and implemented: a repair acceptance is the convicting gate
      command appended to everything the contract declared, rebuilt per red from contract_acceptance
      sealed at dispatch so additions never accumulate or leak; builtin gates are
      named by the battery per-gate verb, shell gates by their declared command verbatim.
    evidence: >-
      tests/test_runner.py:1940 - the repair attempt carries the pytest command the
      contract declared plus torve gates run --only scope.
    action: decided
  - decision: D-4
    grade: ASSUMED
