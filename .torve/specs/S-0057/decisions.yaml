# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      A specification is a directory `S-NNNN/` — the identifier and nothing else —
      of `document.yaml`, `decisions.yaml`, `amendments.yaml` and `execution.yaml`,
      split by who writes each; an absent file is an empty list; the loader joins
      them into the one `Document` every reader keeps reading; `schema_version` 3,
      and 2 is refused
    paths:
      - src/torve/config/spec.py
      - src/torve/domain/spec.py
      - src/torve/config/spec_emit.py
    consequence: >-
      The author's file changes only by the author; `amended_by` is derived and gone;
      `Document.path` names a directory
    rationale: >-
      Amendments and execution grow forever and are machine-written; keeping them
      in the file a person authors makes every spec diff mostly machine output
    fingerprint: d15d8f4d26a17d07/30165c090ea60c7d
  - id: D-2
    grade: LOCKED
    text: >-
      A section is `key` and `md`; the heading is rendered from the key and the number
      from the position; `check` refuses a section with an empty body, a typed-kind
      fence, the decisions table header or an amendment identifier as its key
    paths: [src/torve/domain/spec.py, src/torve/config/spec.py]
    consequence: >-
      A typed list exists in one place; a heading cannot disagree with its key
    cites: [S-0056/D-3]
  - id: D-3
    grade: LOCKED
    text: >-
      The corpus is `.torve/specs/` and the archive `.torve/archive/`; the configuration
      key is `specs.path` and `rfcs.path` is refused naming it
    paths:
      - src/torve/config/runconfig.py
      - src/torve/config/layout.py
      - .torve/specs/**
      - .torve/archive/**
    consequence: >-
      Every input torve reads is under `.torve/`; the root carries no torve directory
    rationale: >-
      The task directory and the telemetry file are already carriers under `.torve/`
      (S-0056); the documents were the last input outside it
  - id: D-4
    grade: LOCKED
    text: >-
      `torve spec` absorbs every `torve rfc` verb and `cli/rfc.py` is deleted; the
      gate is `spec-valid`; the skill is `spec-writer`; `rfc_emit.py` becomes `spec_emit.py`;
      new prose says specification or document
    paths:
      - src/torve/cli/spec.py
      - src/torve/cli/spec.py
      - src/torve/config/spec_emit.py
      - skills/**
      - .torve/gates.yaml
    consequence: >-
      One namespace for the corpus; old prose and test file names keep the old word
    rationale: >-
      The code has called it spec since S-0053; the documents are neither requested
      nor commented on
  - id: D-5
    grade: LOCKED
    text: >-
      `torve init` writes `.torve/schemas/*.json` from every model torve reads from
      YAML — the four files, the contract, the log, the configuration, the manifest
      — and `.torve/.gitignore` with the patterns for what torve alone writes, idempotent,
      never a configuration or a manifest; every YAML torve writes names its schema
      on its first line; `doctor` and `spec check` redden when a schema lags its model
      or the ignore file lacks a minted pattern
    paths:
      - .torve/schemas/**
      - .torve/.gitignore
      - .gitignore
      - src/torve/cli/init.py
      - src/torve/cli/doctor.py
    consequence: >-
      An editor validates any torve YAML as it is typed; an adopting repository ignores
      the right files without copying a block; `init` is the initialisation there
      is
    cites: [S-0056/D-6]
  - id: D-6
    grade: LOCKED
    text: >-
      Every live and archived document converts once — refused sections and headings
      dropped, the file split and moved — in the commit that deletes `rfcs/`, `archive/rfcs/`,
      `rfcs/schema/` and the schema-2 loader; a parity test over every surviving item
      gates that commit and is deleted with the converter
    paths: [.torve/specs/**, .torve/archive/**]
    consequence: >-
      Fifty-seven directories; no document anywhere else
    cites: [S-0056/D-5]
  - id: D-7
    grade: LOCKED
    text: >-
      `execution.yaml` holds landings — task, phase, attempt, time, agent, the commit
      when the lander knows it, and the log's entries typed as `LogEntry` — appended
      by one function the runner calls before the candidate commit, whose trailers
      name the task so the field stays empty there, and `torve log land --commit SHA`
      exposes for a landing made by hand; a contract naming no document lands nowhere
      and says so
    paths:
      - src/torve/application/divergence.py
      - src/torve/application/runner.py
      - src/torve/cli/log.py
    consequence: >-
      Every clone carries what execution found, beside the rows it informs; the task
      directory carries nothing git keeps
    cites: [S-0056/D-9, S-0056/D-10]
    fingerprint: 6a281147d0744d9e/cd640ff2ccdc791f
  - id: D-8
    grade: ASSUMED
    text: >-
      `torve decisions import` reads every execution file, live and archived, and
      records the divergence and landing events the record lacks, idempotent by task,
      attempt, decision and time; the attempt-time `ingest` is unchanged
    paths: [src/torve/application/decisions.py, src/torve/cli/decisions.py]
    consequence: >-
      A clone without a store rebuilds the same record from the tree
    cites: [S-0056/D-11]
  - id: D-9
    grade: LOCKED
    text: >-
      `spec check` resolves every citation-shaped identifier in tracked files under
      `src/**`, `pages/**` and every `AGENTS.md`, `CLAUDE.md` and `README.md` over
      the corpus and the archive: unknown is a problem naming `file:line`, retired
      a warning, archived clean; tests and skills are not scanned
    paths: [src/torve/config/spec.py]
    consequence: >-
      A comment that cites a row is checked like a `cites` list; an identifier can
      never be invented in the code
  - id: D-10
    grade: ASSUMED
    text: >-
      `torve spec cites IDENT` lists the code lines, landings, amendments and documents
      that cite an identifier
    paths: [src/torve/cli/spec.py]
    consequence: >-
      The row's side of the link is a query, not a grep
  - id: D-11
    grade: ASSUMED
    text: >-
      `spec check` warns when `implementation: complete` names a phase no landing
      covers, and when every phase has a landing and `implementation` is not complete
    paths: [src/torve/config/spec.py]
    consequence: >-
      The status field and the execution file cannot drift apart silently
  - id: D-12
    grade: ASSUMED
    text: >-
      The colocated sections, the pack and the skills change in no shape but the word
      and the gate name; they render the same model
    paths:
      - src/torve/application/colocation.py
      - src/torve/application/contextpack.py
    consequence: Nothing a harness reads changes shape
    cites: [S-0056/D-8]
  - id: D-13
    grade: OPEN
    text: >-
      Whether `spec cites` also reads the `Torve-Decisions` trailers of the commit
      history
    paths: [src/torve/cli/spec.py]
    consequence: Decided by whoever executes phase 4, logged
invariants:
  - id: I-1
    statement: >-
      `.torve/specs/` and `.torve/archive/` hold only `S-NNNN/` directories, and a
      directory holds only the four file names
    paths: [.torve/specs/**, .torve/archive/**]
    check: uv run torve spec check
