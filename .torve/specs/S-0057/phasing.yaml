# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: the specification is a directory
    intent: >-
      `DesignSection` loses `heading`, `Document` loses `amended_by`, `schema_version`
      becomes 3 and 2 is refused. The loader joins `document.yaml`, `decisions.yaml`,
      `amendments.yaml` and `execution.yaml` (the last read as opaque until phase
      3) into the one model and the serializer dumps the four; `check` refuses a section
      with an empty body, a typed-kind fence, the table header or an amendment key,
      and a directory with any other name. The corpus moves to `.torve/specs/` and
      the archive to `.torve/archive/` under `specs.path`; `torve init` writes the
      four document schemas into `.torve/schemas/` and each file's first line names
      its own. `torve spec` absorbs every `torve rfc` verb, `cli/rfc.py` is deleted,
      `rfc_emit` becomes `spec_emit`, the gate is `spec-valid`, the skill `spec-writer`;
      every reader that opened `config.rfcs.path` opens `config.specs.path`. Every
      live and archived document converts in the commit that deletes `rfcs/` and `archive/rfcs/`;
      a parity test over every surviving item gates it and is deleted with the converter.
      The colocated sections are re-projected; the operating page, the skill and the
      changelog say the new names.
    scope:
      - src/torve/domain/spec.py
      - src/torve/config/spec.py
      - src/torve/config/rfc_emit.py
      - src/torve/config/spec_emit.py
      - src/torve/config/runconfig.py
      - src/torve/config/layout.py
      - src/torve/cli/rfc.py
      - src/torve/cli/spec.py
      - src/torve/cli/init.py
      - src/torve/cli/main.py
      - src/torve/cli/mcp.py
      - src/torve/application/planner.py
      - src/torve/application/standing.py
      - src/torve/application/intake.py
      - src/torve/application/projections.py
      - src/torve/application/decisions.py
      - src/torve/application/session.py
      - src/torve/application/review.py
      - src/torve/application/contextpack.py
      - src/torve/application/colocation.py
      - src/torve/application/specquality.py
      - rfcs/**
      - archive/**
      - .torve/specs/**
      - .torve/archive/**
      - .torve/schemas/**
      - .torve/config.yaml
      - .torve/gates.yaml
      - skills/**
      - .claude/skills/**
      - pages/docs/**
      - '**/AGENTS.md'
      - CHANGELOG.md
      - pyproject.toml
      - tests/test_spec.py
      - tests/test_spec_load.py
      - tests/test_rfc_emit.py
      - tests/test_rfc_check.py
      - tests/test_rfc_fmt.py
      - tests/test_rfc_verbs.py
      - tests/test_rfc_show.py
      - tests/test_rfc_archive.py
      - tests/test_decisions.py
      - tests/test_cli_decisions.py
      - tests/test_cli_spec.py
      - tests/test_specquality.py
      - tests/test_plan.py
      - tests/test_colocation.py
      - tests/test_contextpack.py
      - tests/test_context.py
      - tests/test_intake.py
      - tests/test_standing.py
      - tests/test_decisions_record.py
      - tests/test_skills.py
      - tests/test_mcp.py
      - tests/test_layout.py
      - tests/test_runconfig.py
      - tests/test_cli.py
      - tests/test_session.py
      - tests/test_review_run.py
      - tests/test_gates.py
      - src/torve/cli/context.py
      - src/torve/cli/decisions.py
      - src/torve/cli/intake.py
      - src/torve/cli/plan.py
      - src/torve/cli/serve.py
      - src/torve/gates/runner.py
      - README.md
    acceptance:
      - >-
        uv run pytest tests/test_spec.py tests/test_spec_load.py tests/test_rfc_emit.py
        tests/test_rfc_check.py tests/test_rfc_fmt.py tests/test_rfc_verbs.py tests/test_rfc_show.py
        tests/test_rfc_archive.py tests/test_decisions.py tests/test_cli_decisions.py
        tests/test_cli_spec.py tests/test_specquality.py tests/test_plan.py tests/test_colocation.py
        tests/test_contextpack.py tests/test_context.py tests/test_intake.py tests/test_standing.py
        tests/test_decisions_record.py tests/test_skills.py tests/test_mcp.py tests/test_layout.py
        tests/test_runconfig.py tests/test_cli.py tests/test_session.py tests/test_review_run.py
        tests/test_gates.py
      - uv run torve spec check
      - uv run torve spec project --check
      - uv run lint-imports --config pyproject.toml
    character: structural
  - phase: 2
    title: torve init writes what the code derives
    intent: >-
      `torve init` grows from the four document schemas to every model torve reads
      from YAML: the contract (`Task`), the log (the entry as `payload_of` shapes
      it until phase 3 types it), the run configuration (`RunnerConfig`) and the gate
      manifest (`Manifest`); and it writes `.torve/.gitignore` with the patterns for
      what torve alone writes, appending a missing one below the operator's lines,
      while the root `.gitignore` loses its torve block. `torve doctor` reddens when
      a schema lags its model or the ignore file lacks a minted pattern. A projected
      contract carries the header line; `init` adds the line once to `config.yaml`
      and `gates.yaml`, where other comments stay legal. The operating page names
      the verb.
    scope:
      - src/torve/cli/init.py
      - src/torve/cli/doctor.py
      - src/torve/application/planner.py
      - .torve/schemas/**
      - .torve/config.yaml
      - .torve/gates.yaml
      - pages/docs/operating.md
      - tests/test_doctor.py
      - tests/test_cli.py
      - tests/test_plan.py
      - .gitignore
      - .torve/.gitignore
      - tests/test_rfc_check.py
    acceptance:
      - >-
        uv run pytest tests/test_doctor.py tests/test_cli.py tests/test_plan.py
      - uv run torve doctor
      - uv run torve spec check
    depends_on:
      - 1
  - phase: 3
    title: execution is the document's
    intent: >-
      `Landing` and `LogEntry` join the model and `execution.yaml` is read as typed;
      a seeded log carries the header line naming `schemas/log.json`. One function
      in `divergence` appends a landing — from the worktree log, or from the record
      when a partition is given — to the execution file of the document the contract
      names, refusing a contract that names none; `runner.land` calls it before the
      merge commit and `torve log land T-NNNN --commit SHA [--partition P]` exposes
      it. `torve decisions import` records the divergence and landing events every
      execution file holds and the record lacks, idempotent. The sixteen surviving
      logs fold into 0053, 0054 and 0056 through the verb; the three with no document
      are left to git history.
    scope:
      - src/torve/domain/spec.py
      - src/torve/application/divergence.py
      - src/torve/application/runner.py
      - src/torve/application/decisions.py
      - src/torve/cli/log.py
      - src/torve/cli/decisions.py
      - .torve/specs/**
      - .torve/schemas/**
      - tests/test_divergence.py
      - tests/test_runner.py
      - tests/test_decisions_record.py
      - tests/test_cli_decisions.py
      - tests/test_spec_load.py
      - tests/test_decisions.py
      - tests/test_spec.py
      - src/torve/cli/init.py
    acceptance:
      - >-
        uv run pytest tests/test_divergence.py tests/test_runner.py tests/test_decisions_record.py
        tests/test_cli_decisions.py tests/test_spec_load.py
      - uv run torve spec check
    depends_on:
      - 1
  - phase: 4
    title: the links close
    intent: >-
      `spec check` scans the tracked files under `src/**`, `pages/**` and every `AGENTS.md`,
      `CLAUDE.md` and `README.md` for citation-shaped identifiers and resolves each
      over the corpus and the archive: unknown is a problem naming `file:line`, retired
      a warning, archived clean. `torve spec cites IDENT` lists the code lines, landings,
      amendments and documents that cite an identifier, and S-0057/D-13 is decided
      and logged. `spec check` warns when `implementation` and the landings disagree.
    scope:
      - src/torve/config/spec.py
      - src/torve/cli/spec.py
      - tests/test_rfc_check.py
      - tests/test_cli_spec.py
      - tests/test_spec.py
      - src/torve/gates/scope.py
      - tests/test_gates.py
      - .torve/specs/**
    acceptance:
      - >-
        uv run pytest tests/test_rfc_check.py tests/test_cli_spec.py
      - uv run torve spec check
    depends_on:
      - 3
contract_example:
  schema_version: 1
  id: T-0307
  rfc: .torve/specs/0057-the-specification-is-a-directory
  phase: 4
  role: implement
  title: the links close
  intent: >-
    Every citation-shaped identifier in source and docs resolves over the corpus and
    the archive; `spec cites` answers the row's side.
  depends_on: [T-0306]
  targets: []
  scope:
    allow:
      - src/torve/config/spec.py
      - src/torve/cli/spec.py
      - tests/test_rfc_check.py
      - tests/test_cli_spec.py
    deny: []
  acceptance:
    - >-
      uv run pytest tests/test_rfc_check.py tests/test_cli_spec.py
    - uv run torve spec check
  decisions:
    - id: D-9
      grade: LOCKED
      text: >-
        `spec check` resolves every citation-shaped identifier in tracked source and
        docs files over the corpus and the archive
      paths: [src/torve/config/spec.py]
      consequence: An identifier can never be invented in the code
      check_state: shadow
  budget: {}
  tier: executor
