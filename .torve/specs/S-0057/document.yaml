      - tests/test_cli_decisions.py
      - tests/test_spec_load.py
      - tests/test_decisions.py
      - tests/test_spec.py
    acceptance:
      - >-
        uv run pytest tests/test_divergence.py tests/test_runner.py tests/test_decisions_record.py
        tests/test_cli_decisions.py tests/test_spec_load.py
      - uv run torve spec check
    depends_on:
      - 1
  - phase: 4
    title: the links close
    intent: >-
      `spec check` scans the tracked files under `src/**`, `pages/**` and every `AGENTS.md`,
      `CLAUDE.md` and `README.md` for citation-shaped identifiers and resolves each
      over the corpus and the archive: unknown is a problem naming `file:line`, retired
      a warning, archived clean. `torve spec cites IDENT` lists the code lines, landings,
      amendments and documents that cite an identifier, and D-57.13 is decided and
      logged. `spec check` warns when `implementation` and the landings disagree.
    scope:
      - src/torve/config/spec.py
      - src/torve/cli/spec.py
      - tests/test_rfc_check.py
      - tests/test_cli_spec.py
      - tests/test_spec.py
    acceptance:
      - >-
        uv run pytest tests/test_rfc_check.py tests/test_cli_spec.py
      - uv run torve spec check
    depends_on:
      - 3
