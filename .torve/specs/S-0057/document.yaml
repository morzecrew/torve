# yaml-language-server: $schema=../../schemas/document.json
id: '0057'
title: The specification is a directory
kind: design
status: accepted
implementation: none
depends_on: ['0056']
informed_by: ['0053', '0054', '0055']
supersedes: []
superseded_by: null
owner: misery7100
description: >-
  A specification is a directory of four YAML files split by who writes them, under
  `.torve/specs/`, with a schema for every YAML torve reads, execution results kept
  beside the rows they cite, and citations from code checked both ways.
schema_version: 3
sections:
  - key: summary
    md: |
      A specification is a directory, `.torve/specs/S-NNNN/`, holding four
      YAML files split by who writes them: `document.yaml` (the author: the
      header, the prose, alternatives, questions, phasing, the contract
      example), `decisions.yaml` (the author, stamped by the tool: the rows,
      the invariants, the retired identifiers), `amendments.yaml` (written by
      `spec amend` and `spec fix`, never by hand) and `execution.yaml` (written
      at landing: what each task found, entry by entry, cited by row). A prose
      section is `key` and `md`; its heading is its key. The archive is
      `.torve/archive/S-NNNN/`, the same shape. `.torve/schemas/` holds the
      JSON Schema of every model torve reads from YAML — the four files, the
      task contract, the task log, the run configuration, the gate manifest —
      written by `torve init` and named by the first line of every such file; `torve init` also writes `.torve/.gitignore`, so what torve alone writes is ignored by default and the root ignore file carries no torve block.
      The corpus is called what the code already calls it: `torve spec`
      absorbs `torve rfc`, the gate is `spec-valid`, the configuration key is
      `specs.path`, the skill is `spec-writer`. The links close both ways:
      every row, invariant, question or amendment identifier a source or docs
      file mentions must resolve over the corpus and the archive, and `torve
      spec cites D-x.y` answers who cites a row — code lines, landings,
      amendments, documents. The conversion is one-shot: duplicated sections
      dropped, headings dropped, the file split and moved, parity over every
      item that survives; the sixteen surviving task logs fold into their
      documents' execution files when the model exists.
  - key: motivation
    md: |
      RFC 0056 made the document YAML and kept parity with the markdown it
      replaced. Parity is why the corpus reads raw: every typed list the
      conversion lifted is still there as the fence or table it was lifted
      from. Of the 86 sections in the four live documents, 23 are a typed list
      restated — the decisions table, an `alternatives` or `questions` fence,
      the phasing fence, the contract example, an amendment's heading (0053:
      6, 0054: 11, 0055: 2, 0056: 4) — and all 52 archived documents carry the
      same. A reader sees YAML inside markdown inside YAML, twice.

      Every one of the 86 sections carries a `heading` that restates its
      `key` (`the-document-is-the-model` under `5.1 The document is the
      model`); the number is the position. The field is a second spelling of
      a fact the list already holds.

      A document grows in two places nobody authors. Amendments: 0053 to 0056
      took A-140 to A-164 in one day, every one appended to the author's file.
      What execution found has no home at all: `0b46b82` deleted 296 task
      directories (D-56.10) and the sixteen that remain, T-0288 to T-0303,
      sit untracked on one machine. Their log entries — a claim, evidence,
      an action and notes per row, and the `proposal` an executor makes — are
      the only output of an attempt that cannot be derived from the document
      and the tree: 612 KB of log beside 680 KB of contract that `plan`
      regenerates. The record holds them for the one machine with a store.

      A row's identifier is permanent so that logs can cite it forever. Code
      cites it too: 1,620 mentions of a `D-`, `I-`, `Q-` or `A-` identifier
      across 135 source and docs files, in comments, docstrings and pages.
      Nothing resolves them — `check_cites` reads the `cites` lists of rows
      and alternatives and nothing else. A link that is checked in one
      direction is a link in one direction.

      `rfcs/` is the last input torve reads from outside `.torve/`;
      `rfcs/schema/document.json` is the only schema, for one of the five YAML
      shapes torve reads (configuration, gate manifest, contract, log,
      document). And the name is wrong: there is no request and no comment
      period; the documents are specifications a planner mints from, and the
      code has said so since RFC 0053 — `config/spec.py`, `domain/spec.py`,
      `SpecError`, `torve spec` — while the verbs that write them sit under
      `torve rfc`.
  - key: current-state
    md: |
      Verified against the tree at `0b46b82`.

      - **One model, one file.** `Document` (`src/torve/domain/spec.py`) is
        the shape of `rfcs/NNNN-slug.yaml`; `load_document(path)` reads one
        file, `dump_document(doc)` returns one text. `DesignSection` is `key`,
        `heading`, `md`. `Document.path` is a file; `archived` marks a load
        from `archive/rfcs/` (`ARCHIVE_RELATIVE`). The header line is relative
        to the file: `schema/document.json` live, `../../rfcs/schema/document.json`
        archived. `rfc_files` matches `^\d{4}-[a-z0-9-]+\.yaml$` and
        `check_directory` refuses anything else but `schema/`.
      - **Citations.** `check_cites` resolves `cites` lists over
        `Corpus.defined_identifiers()` (documents, rows, invariants,
        questions, amendments, retired ids). `DECISION_CITE` serves the line
        cites in prose; `_prose` strips fences before the link, line-cite and
        citation checks; `lookup_in` finds where an identifier is cited
        inside the corpus (`_cites`). Nothing reads the tree.
      - **The log.** A task log is a dict document `{schema_version, task,
        repo, base_sha, drift_count, entries}` (`divergence.open_log`);
        `append` adds an entry, `ingest` records it as `divergence.recorded`,
        `project` rewrites the file from the record and `journal_sync` runs
        both between an attempt and its gates. `runner.land` writes the
        `Torve-Decisions` trailer. There is no model for the log and no
        schema; `LandingRecorded` exists as an event.
      - **The importer.** `decisions.import_corpus` records rows and sources;
        it reads no log. `torve decisions import P` is how a corpus reaches a
        record.
      - **The directory.** `.torve/` holds `config.yaml` (`RunnerConfig`,
        with `rfcs: RfcsConfig(path)`), `gates.yaml` (`Manifest`),
        `standing/`, `skills-vendor/`, `telemetry.jsonl`, `review-corpus/`,
        `traces/`, `regimes/`, and the ignored `tasks/` and `context/`. There
        is no `init` verb; `torve doctor` checks a configured repository. The
        root `.gitignore` carries a torve block of nine patterns (`tasks/`,
        `context/`, `telemetry.jsonl`, `feedback.jsonl`, `regimes/`, `skills/`,
        `tmp/`, a trace-log glob) that every adopting repository copies by hand.
      - **The verbs.** `torve rfc` carries fifteen verbs in `src/torve/cli/rfc.py`
        (the index's worst-health file, untested hotspot); `torve spec`
        carries five (`project`, `show`, `paths`, `tests`, `why-not`). The
        gate `rfc-valid` is a manifest entry in `.torve/gates.yaml` and a name
        the pack knows; `rfc-writer` is the authoring skill, symlinked from
        `.claude/skills/`.
      - **Task contracts.** A contract's `rfc` field names the document by
        path (`Task.rfc`); the three document-less fixes of 0053's own
        machinery (T-0293 to T-0295) carry `rfc: null`.
  - key: goals-non-goals
    md: |
      Goals: a corpus a person reads without meeting the same list twice; the
      author's file changed by the author only; execution results kept with
      the rows they inform, in git, on every clone; a schema for every YAML
      torve reads, named from its first line; the identifier link checked
      from the code side and answerable from the row side; one name and one
      namespace for the corpus; every torve input under `.torve/`.

      Non-goals: changing what a row means (grade semantics, paths-as-scope,
      check-as-gate, the fingerprint rule, the silence check: RFC 0053 and
      0054, untouched); changing the in-memory `Document` a planner, the
      colocation, the pack or the importer read (it loses `heading` and
      `amended_by`, nothing else); changing the contract's shape or its `rfc`
      key; the record's event vocabulary; `torve init` writing a configuration or a manifest (§8); the
      library extraction (RFC 0056 §8); renaming test files.
  - key: the-specification-is-a-directory
    md: |
      One directory per document, `.torve/specs/S-NNNN/` — the identifier and
      nothing else, the title being `document.yaml`'s and `spec list`'s to show
      (A-166) — archived to `.torve/archive/S-NNNN/` unchanged in shape. The split is by
      writer, not by type: a file changes only through the hand that owns it.

      | File | Writer | Keys |
      | --- | --- | --- |
      | `document.yaml` | the author | `id` `title` `kind` `status` `implementation` `depends_on` `informed_by` `supersedes` `superseded_by` `owner` `description` `schema_version` `sections` `alternatives` `questions` `phasing` `contract_example` |
      | `decisions.yaml` | the author; `amend`, `fix` and `check --fix-rot` stamp it | `decisions` `invariants` `retired` |
      | `amendments.yaml` | `spec amend`, `spec fix`, `spec archive`, `spec retire` | `amendments` `editorial` |
      | `execution.yaml` | the landing (§5.3) | `landings` |

      `amended_by` is dropped: it is the identifiers in `amendments.yaml`, and
      the check that compared the two goes with it. A file that is absent is
      an empty list; `spec new` writes the first two and nothing else. Each
      file's first line names its schema, relative to the directory:
      `# yaml-language-server: $schema=../../schemas/document.json`, the same
      depth from the archive. `schema_version` becomes 3 and lives in
      `document.yaml` only; 2 is refused naming this document.

      The in-memory `Document` is unchanged but for the two dropped fields:
      the loader joins the four files into one model and every reader — the
      planner, `inherit_decisions`, the colocation, the pack, the importer,
      `spec show` — reads what it read. `Document.path` names the directory.
      `dump_document` returns the four texts by file name and the transaction
      writes the ones with content; a file never shrinks to nothing, so none
      is deleted. `check_directory` allows only `S-NNNN/` directories under
      `.torve/specs/` and `.torve/archive/`, and only the four names inside
      one. Document and amendment numbers derive over both, as they do.
  - key: sections-are-keys
    md: |
      `DesignSection` is `key` and `md`. `spec render` writes the heading from
      the key — dashes to spaces, the first letter raised — and numbers it by
      position; nothing else ever reads a heading. A design subsection is a
      section like any other, in order; there is no tree (§9 alternatives).

      `spec check` refuses a section that carries what a typed list holds:
      an empty `md`; a fence whose info string names a typed kind
      (`yaml alternatives`, `yaml questions`, `yaml decision-details`,
      `yaml invariants`, `yaml changes`, `yaml contract-example`); a line that
      is the decisions table header; a key that is an amendment identifier
      (`a-161-…`). An ordinary fence stays welcome — a `yaml` block that
      illustrates a shape, as RFC 0056 §5.1 does, is prose.
  - key: execution-is-the-documents
    md: |
      What a task found belongs to the rows it cites, so it lives beside them:

      ```yaml
      # yaml-language-server: $schema=../../schemas/execution.json
      landings:
        - task: T-0302
          phase: 3
          attempt: 1
          commit: 978ebb5c
          at: '2026-09-09'
          agent: session/claude-fable-5.1
          entries:
            - decision: D-56.9
              grade: LOCKED
              kind: resolved
              at: '2026-09-09T16:08:46Z'
              claim: …
              evidence: src/torve/application/planner.py:560 - …
              action: decided
              notes: …
      ```

      `Landing` and `LogEntry` are models in `domain/spec.py`; an entry is the
      log entry as `divergence.payload_of` shapes it, typed once, which gives
      the task log the schema it never had (§5.5). The writer is one function
      in `divergence`: read the task's log — the worktree file, or the record
      when a partition is given — and append the landing to the execution
      file of the document the contract's `rfc` field names. `runner.land`
      calls it before the merge commit, so the landing commit carries the
      landing; a session-authored landing runs `torve log land T-NNNN
      --commit SHA` before committing. A contract that names no document lands
      nowhere, and the verb says so.

      The record is unchanged at attempt time: `ingest` records entries as it
      does. `torve decisions import P` additionally reads every execution
      file, live and archived, and records the `divergence.recorded` and
      `landing.recorded` events it lacks — idempotent by task, attempt,
      decision and time — so a clone without a store rebuilds the same record
      from the tree, the pattern D-56.11 set for telemetry: the file is a
      carrier. The archive takes the file with the directory.

      `spec check` reads the two together: `implementation: complete` with a
      phase no landing names is a warning, and every phase landed with
      `implementation` not complete is one too.
  - key: the-links-close
    md: |
      Spec to code is `paths` and the colocated sections (RFC 0054). Code to
      spec is the identifier in a comment, a docstring or a page, and nothing
      checked it. `spec check` scans every file git tracks under `src/**` and
      `pages/**`, and every `AGENTS.md`, `CLAUDE.md` and `README.md`, for the
      citation shapes (`D-x.y`, `I-x.y`, `Q-x.y`, `A-n`, the same `CITATION`
      the `cites` lists use) and resolves each over the corpus and the
      archive: an identifier nothing defines is a problem naming `file:line`;
      a retired one is a warning; an archived one is clean, history being what
      a comment is allowed to cite. Tests and skills are not scanned: fixtures
      invent identifiers by design (32 unknown identifiers in the tree today,
      every one under `tests/` or `skills/`). Measured on `0b46b82`: 1,620
      mentions, 135 files, none unknown — the check starts green.

      `torve spec cites IDENT` is the row's side of the link: the code lines
      that mention it, the landings whose entries cite it (task, commit), the
      amendments that changed it, the documents whose rows cite it. Whether
      it also reads the `Torve-Decisions` trailers of the commit history is
      D-57.13, left to the phase.
  - key: the-place-the-name-and-the-schemas
    md: |
      **The place.** `.torve/specs/` and `.torve/archive/`; the configuration
      key is `specs.path` (default `.torve/specs`), and the old key is refused
      naming the new one. After RFC 0056 phase 4 every input torve reads is
      under `.torve/`, as `.github/` holds what GitHub reads: the human page is
      `spec render`, and a document nobody renders was not being read from the
      root either. D-13.3 is untouched: it governs the runner's configuration,
      which is still read from where the runner was launched.

      **The name.** `torve spec` absorbs every `torve rfc` verb — `check`,
      `list`, `new`, `amend`, `fix`, `archive`, `add-decision`, `retire`,
      `relocate-paths`, `render`, `graph`, `health`, `fmt` — beside its own;
      `src/torve/cli/rfc.py` is deleted into `cli/spec.py`. The gate is
      `spec-valid` in the manifest and the pack; the skill is `spec-writer`,
      symlink included; the bootstrap fixture converts with the corpus. The
      word in new prose is *specification* or *document*; the word in old
      prose stays, being history. `rfc_emit.py` becomes `spec_emit.py`; the
      import-linter contract follows. Test file names keep `rfc` (§4).

      **The initialisation.** `torve init` writes what can be derived from the
      code and nothing that is authored: `.torve/schemas/*.json` from every
      model torve reads from YAML — `document`, `decisions`, `amendments`,
      `execution` (the four files), `contract` (`Task`), `log` (the task log,
      from `LogEntry`), `config` (`RunnerConfig`), `gates` (`Manifest`) — and
      `.torve/.gitignore` with the patterns for what torve alone writes
      (`tasks/`, `context/`, `telemetry.jsonl`, `feedback.jsonl`, `regimes/`,
      `traces/`, `skills/`, `tmp/`); git honours a nested ignore file, and the
      root `.gitignore` loses its torve block. It is idempotent: a schema is
      rewritten, a pattern the file lacks is appended below the operator's own
      lines, and `config.yaml` and `gates.yaml` get the header line once, where
      other comments stay legal. `torve doctor` and `spec check` redden when a
      schema lags its model or the ignore file lacks a minted pattern. Every
      YAML torve writes carries the header line as its first line — the four
      files, a projected contract, a seeded log. A `torve init` that also writes
      a configuration is §8: the configuration is authored.
  - key: the-conversion
    md: |
      One commit, live and archived alike, and final: every document loads
      through the schema-2 loader; sections that §5.2 would refuse are
      dropped, the empty container sections (`design`, `amendments`) with
      them; `heading` is dropped; the model is written as four files into
      `.torve/specs/` or `.torve/archive/`; `rfcs/` and `archive/rfcs/` are
      deleted with the schema-2 loader, `cli/rfc.py`, `rfcs/schema/` and the
      old configuration key; the root `.gitignore` loses its torve block in phase 2. A parity test compares every item that survives
      — header fields, rows, invariants, alternatives, questions, phasing,
      amendments, editorial, the sections that stand, by key and body — and
      is deleted with the converter. The sixteen logs fold in phase 3, when
      `Landing` exists: each by the document its contract names (T-0288 to
      T-0292 and T-0296 to T-0303 name 0053, 0054 and 0056); the three with
      `rfc: null` stay in git history and nowhere else.
  - key: tests
    md: |
      - **Load and dump.** Four files join into one model and dump to the same
        four texts; an absent file is an empty list; a file with nothing is
        not written; `schema_version: 2` is refused naming 0057; a section
        with an empty body, a typed fence or the table header is refused with
        its key; a directory with a fifth name is refused.
      - **Conversion parity.** Every live and archived document converts with
        every surviving item identical; deleted with the converter.
      - **Verbs.** Every former `rfc` verb answers under `spec` and the `rfc`
        namespace is gone; `specs.path` is read and `rfcs.path` refused
        naming it; `spec-valid` runs where `rfc-valid` ran.
      - **Initialisation.** `torve init` writes eight schemas and the ignore
        file, twice without a diff; a removed pattern comes back below the
        operator's lines; `doctor` and `spec check` redden on lag; a projected contract, a seeded log and a new
        document carry the header line; the line is added once to the
        configuration and manifest.
      - **Execution.** `log land` appends a landing from the worktree log and
        from the record; the runner's landing commit carries it; a contract
        with no document is refused with the reason; `decisions import`
        records the events an execution file holds once; the two
        `implementation` warnings fire.
      - **Links.** An unknown identifier in `src/` reddens `spec check` with
        `file:line`; one in `tests/` does not; a retired one warns; `spec
        cites` lists code, landings, amendments and documents for a row.
  - key: docs
    md: |
      `pages/docs/operating.md` describes the directory, the four files, the
      schemas directory, `torve spec` and `torve init`. The `spec-writer`
      skill and its template are rewritten for the four files. `CHANGELOG.md`
      carries the breaking entries: the namespace, the gate, the key, the
      place.
  - key: out-of-scope
    md: |
      `torve init` writing a configuration or a manifest: both are authored,
      and what it writes is only what the code derives.
      A section tree. Renaming test files. The MCP `show` tool answering
      `cited_by` (it can, after `spec cites` exists). The library extraction.
  - key: risks
    md: |
      - **A dot directory hides the corpus** from a browser and a newcomer.
        Mitigation: `spec render` and `spec list` are the human surface; a
        README line names the place.
      - **Four files invite editing the wrong one.** Mitigation: the schema
        line per file, and `check` reading a hand-changed row against its
        stamp as it does.
      - **The tree scan reddens on a stray token.** Mitigation: the shapes
        are the citation shapes and the scan starts green; a false match is a
        problem naming its line, fixed by wording.
      - **Folding the sixteen logs by hand misattributes one.** Mitigation:
        the contract's `rfc` field decides, and the fold is a verb with a
        test, not a script.
  - key: unresolved-questions
    md: |
      Whether `spec cites` reads commit trailers is the phase's (Q-57.1,
      D-57.13). Whether the MCP `show` tool gains `cited_by` waits for
      someone to want it (Q-57.2).
alternatives:
  - option: >-
      one file per document with the duplicated sections stripped
    rejected_because: >-
      it reads well today and worse every landing; amendments and execution are machine-written
      and grow forever, and the author's diff would be mostly them
  - option: prose as a sidecar markdown file
    rejected_because: >-
      rejected by RFC 0056 for the same reason it stands here — a file nothing checks;
      prose is a string in the model and stays one
    cites: ['0056']
  - option: >-
      track `.torve/tasks/*/log.yaml` in git and drop only the contracts
    rejected_because: >-
      a log is keyed by task and its entries are keyed by row; 296 directories nobody
      opens by task, beside a contract `plan` regenerates, is what 0b46b82 deleted
  - option: a `landings` list inside `document.yaml`
    rejected_because: >-
      the author's file would change on every landing and the split by writer would
      be a split by nothing
  - option: a section tree, `sections[].sections`
    rejected_because: >-
      order and a key that spells its heading carry the structure; a tree needs a
      renderer that decides levels and a check that walks it, for two container sections
      that carried no body
  - option: scan tests and skills for citations too
    rejected_because: >-
      fixtures invent identifiers by design; 32 unknown identifiers stand in the tree
      today, every one under `tests/` or `skills/`
  - option: keep `rfcs/` at the root for discoverability
    rejected_because: >-
      the root is where a person looks for a page, and the page is `spec render`;
      the inputs torve reads belong where torve's other inputs are, as `.github/`
      holds what GitHub reads
  - option: keep the name RFC and the `torve rfc` namespace
    rejected_because: >-
      two namespaces read one corpus, and the code has said `spec` since RFC 0053;
      a request for comments names a process these documents do not follow
  - option: >-
      a `torve init` that writes the configuration and the manifest too
    rejected_because: >-
      both are authored, not derived; a minted configuration is a template nobody
      reads, and `init` stays honest by writing only what the code knows
questions:
  - id: Q-57.1
    text: >-
      Whether `spec cites` reads the commit history's `Torve-Decisions` trailers or
      only the tree and the corpus
  - id: Q-57.2
    text: >-
      Whether the MCP `show` tool answers `cited_by` once `spec cites` exists
phasing:
  - phase: 1
    title: the specification is a directory
    intent: >-
      `DesignSection` loses `heading`, `Document` loses `amended_by`, `schema_version`
      becomes 3 and 2 is refused. The loader joins `document.yaml`, `decisions.yaml`,
      `amendments.yaml` and `execution.yaml` (the last read as opaque until phase
      3) into the one model and the serializer dumps the four; `check` refuses a section
      with an empty body, a typed-kind fence, the table header or an amendment key,
      and a directory with any other name. The corpus moves to `.torve/specs/` and
      the archive to `.torve/archive/` under `specs.path`; `torve init` writes the
      four document schemas into `.torve/schemas/` and each file's first line names
      its own. `torve spec` absorbs every `torve rfc` verb, `cli/rfc.py` is deleted,
      `rfc_emit` becomes `spec_emit`, the gate is `spec-valid`, the skill `spec-writer`;
      every reader that opened `config.rfcs.path` opens `config.specs.path`. Every
      live and archived document converts in the commit that deletes `rfcs/` and `archive/rfcs/`;
      a parity test over every surviving item gates it and is deleted with the converter.
      The colocated sections are re-projected; the operating page, the skill and the
      changelog say the new names.
    scope:
      - src/torve/domain/spec.py
      - src/torve/config/spec.py
      - src/torve/config/rfc_emit.py
      - src/torve/config/spec_emit.py
      - src/torve/config/runconfig.py
      - src/torve/config/layout.py
      - src/torve/cli/rfc.py
      - src/torve/cli/spec.py
      - src/torve/cli/init.py
      - src/torve/cli/main.py
      - src/torve/cli/mcp.py
      - src/torve/application/planner.py
      - src/torve/application/standing.py
      - src/torve/application/intake.py
      - src/torve/application/projections.py
      - src/torve/application/decisions.py
      - src/torve/application/session.py
      - src/torve/application/review.py
      - src/torve/application/contextpack.py
      - src/torve/application/colocation.py
      - src/torve/application/specquality.py
      - rfcs/**
      - archive/**
      - .torve/specs/**
      - .torve/archive/**
      - .torve/schemas/**
      - .torve/config.yaml
      - .torve/gates.yaml
      - skills/**
      - .claude/skills/**
      - pages/docs/**
      - '**/AGENTS.md'
