    character: structural
  - phase: 2
    title: torve init writes what the code derives
    intent: >-
      `torve init` grows from the four document schemas to every model torve reads
      from YAML: the contract (`Task`), the log (the entry as `payload_of` shapes
      it until phase 3 types it), the run configuration (`RunnerConfig`) and the gate
      manifest (`Manifest`); and it writes `.torve/.gitignore` with the patterns for
      what torve alone writes, appending a missing one below the operator's lines,
      while the root `.gitignore` loses its torve block. `torve doctor` reddens when
      a schema lags its model or the ignore file lacks a minted pattern. A projected
      contract carries the header line; `init` adds the line once to `config.yaml`
      and `gates.yaml`, where other comments stay legal. The operating page names
      the verb.
    scope:
      - src/torve/cli/init.py
      - src/torve/cli/doctor.py
      - src/torve/application/planner.py
      - .torve/schemas/**
      - .torve/config.yaml
      - .torve/gates.yaml
      - pages/docs/operating.md
      - tests/test_doctor.py
      - tests/test_cli.py
      - tests/test_plan.py
      - .gitignore
      - .torve/.gitignore
    acceptance:
      - >-
        uv run pytest tests/test_doctor.py tests/test_cli.py tests/test_plan.py
      - uv run torve doctor
      - uv run torve spec check
    depends_on:
      - 1
  - phase: 3
    title: execution is the document's
    intent: >-
      `Landing` and `LogEntry` join the model and `execution.yaml` is read as typed;
      a seeded log carries the header line naming `schemas/log.json`. One function
      in `divergence` appends a landing — from the worktree log, or from the record
      when a partition is given — to the execution file of the document the contract
      names, refusing a contract that names none; `runner.land` calls it before the
      merge commit and `torve log land T-NNNN --commit SHA [--partition P]` exposes
      it. `torve decisions import` records the divergence and landing events every
      execution file holds and the record lacks, idempotent. The sixteen surviving
      logs fold into 0053, 0054 and 0056 through the verb; the three with no document
      are left to git history.
    scope:
      - src/torve/domain/spec.py
      - src/torve/application/divergence.py
      - src/torve/application/runner.py
      - src/torve/application/decisions.py
      - src/torve/cli/log.py
      - src/torve/cli/decisions.py
      - .torve/specs/**
