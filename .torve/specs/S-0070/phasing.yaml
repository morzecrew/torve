# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: >-
      a check refuses what is absent, not what is unkept
    intent: >-
      Path rot stops firing on a glob whose files the repository deliberately does
      not commit. The check reads the ignore file torve itself writes and distinguishes
      a row that governs nothing from a row that governs something uncommitted, naming
      which it found. This phase is first because it is the blocker: `spec check`
      fails in any clean tree today, so `spec-valid` and every acceptance command
      pass only where a task directory happens to exist — which is the host, and never
      the tree the lane rebases into.
    scope:
      - src/torve/application/decisions.py
      - tests/test_decisions.py
      - tests/test_rfc_check.py
      - CHANGELOG.md
    acceptance:
      - uv run pytest
      - uv run mypy src
      - uv run lint-imports
    character: structural
  - phase: 2
    title: a committed file renders the same everywhere
    intent: >-
      The projection's "Contended now" section leaves `AGENTS.md`, which becomes a
      pure function of the corpus — the rows governing a directory, their grades,
      consequences and checks, and the invariants. The information is not lost: the
      pack already carries it from the same source. The property is proved by rendering
      a governed directory twice, with a telemetry stream present and absent, and
      comparing the bytes.
    scope:
      - src/torve/application/colocation.py
      - tests/test_colocation.py
      - CHANGELOG.md
    acceptance:
      - uv run pytest
      - uv run mypy src
      - uv run lint-imports
    depends_on:
      - 1
    character: structural
  - phase: 3
    title: the sweep, and what it finds
    intent: >-
      Settle Q-1. Every path `.torve/.gitignore` names is grepped for in everything
      the repository commits, and each hit is judged by D-1 — moved to the pack, made
      to skip, or recorded as admissible with the reason. Three instances are a pattern
      and not a survey; this phase says whether the rule has a longer tail.
    scope: [tests/test_layout.py, CHANGELOG.md]
    acceptance:
      - uv run pytest
    depends_on:
      - 2
    character: structural
  - phase: 4
    title: the rule reaches whoever writes the next gate
    intent: >-
      One line each in the sandbox guide and the operating guide, because the people
      most likely to violate this are writing a projection or a gate and will not
      read a document first. Routine, and waiting on the sweep so it can say what
      the rule cost.
    scope: [sandboxes/AGENTS.md, pages/docs/operating.md]
    acceptance:
      - uv run torve spec check
    depends_on:
      - 3
    character: routine
  - phase: 5
    title: the rule's second reader
    intent: >-
      Phase 1 taught `path_rot` to tell a glob that governs nothing from a glob whose
      files the repository does not commit, and the corpus check kept refusing, because
      `config/spec.py` asks the same question in its own words and D-5 named only
      the first module. This completes phase 1 rather than extending it: the same
      skip, in the reader that produces the problem and the non-zero exit. It is numbered
      last and runs first — everything else in this document waits on `spec check`
      passing in the tree the lane rebases into.
    scope:
      - src/torve/config/spec.py
      - tests/test_spec.py
      - tests/test_rfc_check.py
      - CHANGELOG.md
    acceptance:
      - uv run pytest
      - uv run mypy src
      - uv run lint-imports
    depends_on:
      - 1
    character: structural
  - phase: 6
    title: a verdict names the suite it judged
    intent: >-
      The acceptance gate reports how many tests it skipped and why, so a green in
      a sandbox and a green on a laptop stop being the same sentence for two different
      amounts of evidence. Settles D-6.
    scope: [src/torve/gates/acceptance.py, tests/test_gates.py]
    acceptance:
      - uv run pytest
      - uv run mypy src
    character: structural
