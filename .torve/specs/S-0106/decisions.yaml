# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      A decision gate whose command selects no test fails as vacuous: pytest's exit
      5, or the "no tests ran" reading `acceptance` already makes, is `fail` with
      "the check selected nothing", under the row's state. `decisions-reported` owes
      an entry for a LOCKED row whose check did not pass, instead of skipping every
      row that has a check.
    paths:
      - src/torve/gates/runner.py
      - src/torve/gates/acceptance.py
      - src/torve/gates/decisions_reported.py
    consequence: >-
      a `-k` filter that matches nothing is seen the first time it runs, and a LOCKED
      row whose check fails gets a word in the log
    rationale: >-
      T-0448's three checks exited 5 and the attempt stayed green; `tests/test_gates.py`
      pins `decisions-reported` passing a row whose shadow check failed.
    check: uv run pytest tests/test_gates.py -q -k vacuous
  - id: D-2
    grade: ASSUMED
    text: >-
      The completion battery and the document-branch regate run the `decision:<id>`
      gates of every row the document's phases inherited, and an `invariant:<id>`
      gate for every standing invariant whose paths the document's diff reaches. A
      decision gate keeps its row's state; an invariant gate is shadow.
    paths:
      - src/torve/application/lane.py
      - src/torve/gates/runner.py
      - src/torve/gates/context.py
    consequence: >-
      a check runs on the whole document before its pull request turns ready, not
      only on the attempt that inherited it
    rationale: >-
      The battery judges the document branch under no task, so the contract-borne
      gates never reach it; the 23 invariant checks have never run.
    check: >-
      uv run pytest tests/test_lane.py -q -k completion_runs_checks
  - id: D-3
    grade: ASSUMED
    text: >-
      `torve gates check` runs the `check_twin` of every standing decision row that
      names one, after the sabotage CASES, and fails when a twin exits non-zero. `torve
      spec check` refuses a `blocking` row without a twin, as the planner already
      does at mint.
    paths: [src/torve/cli/gates.py, src/torve/config/spec.py]
    consequence: >-
      a row is never blocking on a check nobody has shown can fail
    rationale: >-
      S-0054/D-4 is LOCKED on exactly this and was left unbuilt by T-0296 until a
      row was promoted; promotion is the point of this document.
    check: >-
      uv run pytest tests/test_cli.py tests/test_rfc_check.py -q -k twin
  - id: D-4
    grade: ASSUMED
    text: >-
      A row's `check` may name a property test: a Hypothesis test stating the decision
      over generated inputs. `hypothesis` becomes a direct dev dependency. The spec-writer
      skill says when a row gets a property (a rule over inputs: parsers, matchers,
      state transitions, round trips), when an example test is the honest check, and
      that the phase settling the row writes it.
    paths: [pyproject.toml, skills/spec-writer/SKILL.md]
    consequence: >-
      a decision is checked over the inputs it governs, not over the one example its
      author thought of
    rationale: >-
      Properties are the part of the vericoding result a deepseek executor can carry;
      the dependency is already in the lock.
  - id: D-5
    grade: ASSUMED
    text: >-
      The review prompt lists each inherited row's `check` and `check_twin` beside
      its text and asks, for each row with a check: does the check test what the row
      says, and would a plausible wrong implementation make it fail? A check that
      fails either question is a finding at `major`. A row with no check draws no
      finding for lacking one.
    paths: [src/torve/application/review.py, src/torve/application/contextpack.py]
    consequence: >-
      a vacuous or unfaithful property is caught by the strong seat before the pull
      request, where `blocks_at: major` stops it
    rationale: >-
      SWE-Proof found 44% of agent-written specs fail an audit; the reviewer is the
      strongest model in the loop and already reads the diff.
    check: >-
      uv run pytest tests/test_review_run.py -q -k audit
  - id: D-6
    grade: ASSUMED
    text: >-
      Under a document whose `change.type` is `refactor`, `red-on-base` runs the changed
      test files and the inherited decision checks on the base tree and on the candidate.
      Green on both passes; green on one and red on the other fails as "behaviour
      changed under a refactor". Outside a refactor the gate is unchanged.
    paths: [src/torve/gates/red_on_base.py]
    consequence: >-
      a refactor is judged by whether behaviour held, and S-0081's named risk, a refactor
      convicted for changing nothing, is closed
    rationale: >-
      A property that must hold on both trees is the cheapest equivalence check there
      is.
    check: uv run pytest tests/test_gates.py -q -k refactor
  - id: D-7
    grade: ASSUMED
    text: >-
      The manifest's `tests:` block gains `run`, the command a list of test files
      is appended to (default `python3 -m pytest -q -p no:cacheprovider`), and `pair`,
      templates from a module to its tests over `{dir}` and `{stem}` (default the
      Python pairing at any depth under `tests/`). `red-on-base`, the intake's pairing,
      the neighbour derivation, the context pack's named tests and the review leg's
      fallback scope read them. A changed test file the gate cannot parse into functions
      qualifies whole.
    paths:
      - src/torve/config/manifest.py
      - src/torve/gates/red_on_base.py
      - src/torve/application/intake.py
      - src/torve/application/neighbours.py
      - src/torve/application/contextpack.py
      - src/torve/application/reviewleg.py
    consequence: >-
      a repository whose tests are `*_test.go` or `*.spec.ts` gets red-on-base and
      pairing by naming them, not by a change to torve
    rationale: >-
      morzer (Go) is on the adoption list, and `ast` and `tests/test_<stem>.py` are
      the only reasons it would get neither.
    check: >-
      uv run pytest tests/test_manifest.py tests/test_gates.py tests/test_intake.py
      -q -k adapter
