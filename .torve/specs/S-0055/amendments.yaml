  - id: A-2
    at: '2026-09-09T00:00:00Z'
    title: the standing baseline is a convention
    md: |
      The baseline is its rows and always was: sixty standing decisions, a summary and the departure it declared, with no design to describe. `kind` says so now — `convention` — so the anatomy phase 2 of S-0058 requires of a design is not asked of it; a convention owes its summary. No row changes.
  - id: A-3
    at: '2026-09-28T20:56:39Z'
    title: >-
      Decomposition is asked for, not routed to (S-0089)
    changes:
      - subject: D-47
        field: text
        before: >-
          A contract the size estimate calls `too_large` routes to a decomposition
          run rather than an attempt; children stay inside the parent's scope, decomposition
          depth is at most two, and the parent survives as the integration task
        after: >-
          A contract the operator sends to decomposition runs a decomposition rather
          than an attempt; children stay inside the parent's scope, decomposition
          depth is at most two, and the parent survives as the integration task. The
          size estimate advises and routes nothing to decomposition (S-0089/D-1)
      - subject: D-47
        field: fingerprint
        after: e170a74335b3f653/5a90b439632b2515
    md: >-
      S-0089 takes the size estimate out of dispatch: across both repositories the
      contracts it called `too_large` landed at the first attempt more often than
      the ones it called `ok`, so routing them away from a worker moved work off the
      record and predicted nothing. Decomposition itself is unchanged and is now the
      operator's to ask for with `torve decompose`. The estimate still judges drafts
      (S-0089/D-5).
  - id: A-4
    at: '2026-10-14T11:00:00Z'
    title: >-
      The typing floor is mypy's, as S-0014/D-14 records
    changes:
      - subject: I-4
        field: check
        before: uv run mypy src && uv run basedpyright src
        after: uv run mypy src
      - subject: D-59
        field: text
        before: >-
          Strict typing is a floor over `src/`: `mypy --strict` and `basedpyright`
          strict block CI and the acceptance fallback; tests, scripts and skills carry
          no type floor
        after: >-
          Strict typing is a floor over `src/`: `mypy --strict` blocks CI and the
          acceptance fallback, the one checker of record (S-0014/D-14); tests, scripts
          and skills carry no type floor
    md: >-
      S-0014/A-2 retired `basedpyright` on 2026-08-27 and made `mypy src` the one
      checker of record: two strict checkers over one tree bought disagreement, not
      depth, and the `[tool.pyright]` block in `pyproject.toml` stays for editors
      only. I-4 was written on 2026-09-09, when the specifications became directories,
      and carried the retired checker along. Its check never ran until S-0106 put
      invariant checks in the completion battery, where it has failed on every document
      since, on 187 findings `mypy` does not share. D-59 said both checkers block
      CI and the acceptance fallback, and neither runs `basedpyright`. The check and
      the row now say what D-14 names. The findings are the editor's to clear over
      time; no gate waits on them.
  - id: A-5
    at: '2026-10-19T15:25:28Z'
    title: >-
      The battery judges a standalone checkout of the commit
    changes:
      - subject: D-2
        field: text
        before: >-
          Gates execute outside the agent session against the working tree it leaves
          behind; an agent cannot report a gate outcome
        after: >-
          Gates execute outside the agent session, inside a sandbox, against a standalone
          checkout of what the attempt leaves committed; an agent cannot report a
          gate outcome
      - subject: D-2
        field: fingerprint
        after: 58ce771cf3d70fe8/ad95bd7b3f1cab28
    md: >-
      On 2026-10-19 T-0638 and T-0639 passed spec-valid by writing `.torve/tmp/tracked-files`,
      an ignored file the gate read from the worktree they left behind and no commit
      carried. The same reading of "the working tree it leaves behind" let the lane's
      re-gate and the document battery run a candidate's tests on the host, against
      D-3. S-0114 has every battery judge a standalone checkout of what the attempt
      leaves committed, inside a gates sandbox; the row now says so. Until its phases
      land, the attempt's battery still reads the worktree. The owner settled S-0114/Q-1
      on 2026-10-19.
  - id: A-6
    at: '2026-10-19T15:25:33Z'
    title: >-
      Acceptance runs over the commit's checkout; the lint still refuses git
    changes:
      - subject: D-20
        field: text
        before: >-
          Acceptance is a list of shell commands, exit 0 meaning satisfied, run in
          the battery sandbox over a worktree without a repository; a command that
          needs git cannot be an acceptance command
        after: >-
          Acceptance is a list of shell commands, exit 0 meaning satisfied, run in
          the battery sandbox over a standalone checkout of the attempt's commit;
          a command that needs git cannot be an acceptance command, because the attempt
          first runs it in its own sandbox, which has no repository
      - subject: D-20
        field: fingerprint
        after: 9ceea13f88bb61e2/876b16189f3cb60f
    md: >-
      Under S-0114/D-2 the battery's checkout has a repository, so "over a worktree
      without a repository" no longer describes where acceptance runs. The lint stays:
      an attempt runs its acceptance in its own sandbox before the battery does, and
      that sandbox still has none. The owner settled S-0114/Q-3 on 2026-10-19.
