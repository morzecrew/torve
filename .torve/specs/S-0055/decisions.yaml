# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-55.1
    grade: LOCKED
    text: >-
      Models never decide what work exists or whether it is finished; the runner executes
      state transitions from facts — exit codes, gate outcomes, approvals — and an
      agent reports observations that never cause a transition
    paths:
      - src/torve/application/runner.py
      - src/torve/application/manager.py
      - src/torve/domain/states.py
    consequence: >-
      A reviewer's severity is data whose consequence configuration sets; the planner
      invokes no model at all
    cites: [D-2, D-38.2]
  - id: D-55.2
    grade: LOCKED
    text: >-
      Gates execute outside the agent session against the working tree it leaves behind;
      an agent cannot report a gate outcome
    paths: [src/torve/gates/**, src/torve/application/runner.py]
    consequence: >-
      The battery is the acceptance; a green the agent claims is not one
    cites: [D-3]
  - id: D-55.3
    grade: LOCKED
    text: >-
      The sandbox is the unit of lifecycle; the engine never executes agent code on
      the host
    paths: [src/torve/adapters/runtime/**, src/torve/application/session.py]
    consequence: >-
      Killing a worker costs its lease and nothing else
    cites: [D-4]
  - id: D-55.4
    grade: LOCKED
    text: >-
      Agents hold no provider credentials; the broker injects them at its own boundary,
      routes providers at the wire and meters spend; every configuration file carries
      variable names, never values
    paths:
      - src/torve/adapters/broker/**
      - src/torve/config/runconfig.py
      - .torve/config.yaml
    consequence: >-
      A sandbox that is compromised leaks nothing it was not given; a committed file
      never holds a secret
    cites: [D-4b, '0021']
  - id: D-55.5
    grade: LOCKED
    text: >-
      Agents do not communicate; executor memory is off by default, per slot when
      on, and never mounted in a shadow run
    paths: [src/torve/application/shadow.py, src/torve/config/runconfig.py]
    consequence: >-
      Shared memory is a communication channel with a euphemism; a remembered replay
      is an incomparable number
    cites: [D-31, D-17.7]
  - id: D-55.6
    grade: ASSUMED
    text: >-
      Escalation reasons are a closed enum mapped to exit codes; `locked_conflict`
      and `underspecified` are halts on working judgement, one indicting the code
      and the other the contract
    paths: [src/torve/domain/states.py, src/torve/cli/options.py]
    consequence: >-
      A new reason is an amendment and a code path, never a free string
    cites: [D-11.4, A-21, A-22]
  - id: D-55.7
    grade: LOCKED
    text: >-
      A task contract is immutable once minted: a changed contract is a new task,
      a re-mint is a version and never a transition, and a task in flight is never
      re-minted
    paths: [src/torve/domain/task.py, src/torve/application/planner.py]
    consequence: >-
      An executor's contract cannot drift out from under it; `torve plan` refuses
      to re-mint over minted phases and leaves the decision to a person
    cites: [A-4, 0049]
  - id: D-55.8
    grade: ASSUMED
    text: >-
      Contracts are derived artefacts committed under `.torve/tasks/`; the task directory
      is the importer and the record is what dispatch reads
    paths: [.torve/tasks/**, src/torve/application/taskstore.py]
    consequence: >-
      Reproducible from a sha, refusable in a diff; the file is authored, the record
      is read
    cites: [A-4, 0049]
  - id: D-55.9
    grade: LOCKED
    text: >-
      A contract copies its rows' grade, text and paths at mint time; a grade is never
      resolved at read time
    paths: [src/torve/application/planner.py, src/torve/domain/task.py]
    consequence: >-
      A regrade never rewrites the judgement of a task that ran under the old grade
    cites: [D-7.22, D-22.2]
  - id: D-55.10
    grade: LOCKED
    text: >-
      Silence is a finding: a `LOCKED` row whose declared paths a diff touches without
      a log entry fails `decisions-reported`
    paths: [src/torve/gates/decisions_reported.py, .torve/tasks/**]
    consequence: >-
      Sixty-one convictions and their corrections are the record of this boundary
      being held
    cites: [D-32]
  - id: D-55.11
    grade: ASSUMED
    text: >-
      A divergence entry is written only through `torve log divergence`, validated
      by the gate's own checks at intake, with located evidence; `drift_count` is
      derived, never declared
    paths:
      - src/torve/application/divergence.py
      - src/torve/cli/log.py
      - .torve/tasks/**
    consequence: >-
      A hand-edited log is refused by the same code that gates it
    cites: [D-2.10, '0045']
  - id: D-55.12
    grade: ASSUMED
    text: >-
      An empty decision list on a contract is legal and explicit; "none apply" is
      distinct from "field forgotten"
    paths: [src/torve/gates/decisions_reported.py, src/torve/domain/task.py]
    consequence: >-
      The document-less lane is governed by standing inheritance, not by silence
    cites: [D-7.5]
  - id: D-55.13
    grade: ASSUMED
    text: >-
      Evidence must locate — a `path:line` inside the repository or a command with
      its output — and a finding or entry whose evidence does not locate is discarded
      unread
    paths: [src/torve/gates/evidence.py]
    consequence: >-
      Locating eliminates fabricated coordinates, not fabricated claims; the reviewer
      and the log share the rule
    cites: [D-2.10]
  - id: D-55.14
    grade: ASSUMED
    text: >-
      The gate manifest lives in the consuming repository at `.torve/gates.yaml`;
      builtins are named `@name`; every entry carries `state` and `origin`; a new
      gate enters at `shadow` and is promoted on soak evidence
    paths: [.torve/gates.yaml, src/torve/config/manifest.py]
    consequence: >-
      Promotion is a separate act with a number behind it, never a default
    cites: [D-2.5, D-2.18]
  - id: D-55.15
    grade: LOCKED
    text: >-
      Every gate names a sabotage twin that proves it can fail; a manifest that names
      any twin refuses a twinless entry; `torve gates check` runs the battery in CI
    paths: [src/torve/gates/sabotage.py, .torve/gates.yaml, .github/workflows/ci.yml]
    consequence: >-
      A gate nobody has seen fail is decoration; the battery carries zero grandfather
      exceptions
    cites: [D-36.3]
  - id: D-55.16
    grade: ASSUMED
    text: >-
      Every gate runs on every pass, cheapest first, never short-circuiting; the retry
      rung reads outcome and axis only, never a trace or a gate's output
    paths: [src/torve/gates/runner.py, src/torve/application/session.py]
    consequence: >-
      A replay of the rows reproduces the tier choice exactly; the severity ladder
      stays meaningful
    cites: [D-34.4, D-34.5]
  - id: D-55.17
    grade: LOCKED
    text: >-
      Scope is a contract: `allow` and `deny` globs make a touch outside them a red
      gate, and tasks whose allow sets intersect are never dispatched in parallel
    paths: [src/torve/gates/scope.py, src/torve/application/manager.py]
    consequence: >-
      Thirty-two convictions and their corrections; a collision is refused at dispatch,
      never discovered at merge
    cites: [D-1.7]
  - id: D-55.18
    grade: LOCKED
    text: >-
      Secrets never enter the tree; the `secrets` gate reads added lines and is the
      one gate no bypass trailer can lift
    paths: [src/torve/gates/secrets.py, .gitignore]
    consequence: >-
      The boundary has never been crossed in 745 attempts and the tree holds it as
      structure
    cites: [D-2.8]
  - id: D-55.19
    grade: ASSUMED
    text: >-
      An existing test is edited only under the contract's licence; adding a test
      is an addition, editing one needs scope
    paths: [src/torve/gates/no_test_tampering.py, tests/**]
    consequence: A green earned by weakening the suite is a red
  - id: D-55.20
    grade: ASSUMED
    text: >-
      Acceptance is a list of shell commands, exit 0 meaning satisfied, run in the
      battery sandbox over a worktree without a repository; a command that needs git
      cannot be an acceptance command
    paths: [src/torve/gates/acceptance.py, src/torve/application/intake.py]
    consequence: >-
      The lint refuses such a command at mint rather than after three attempts
    cites: [A-131]
  - id: D-55.21
    grade: ASSUMED
    text: >-
      A bypass is a `Torve-Bypass: <gate>: <reason>` commit trailer, counted per gate
      in telemetry
    paths: [src/torve/gates/runner.py, src/torve/application/telemetry.py]
    consequence: >-
      Every waiver is a recorded fact with a name on it
  - id: D-55.22
    grade: LOCKED
    text: >-
      User-facing strings carry no corpus coordinates: whoever runs the command has
      no corpus to resolve them
    paths: [src/torve/gates/user_facing_text.py, src/torve/cli/**]
    consequence: >-
      Twenty-eight convictions and their corrections; the audience rule is a gate,
      not a style
    cites: [D-11.11]
  - id: D-55.23
    grade: LOCKED
    text: >-
      Five layers — `base`, `domain`, `application`, `adapters`, `cli`, beside `gates`
      and `config` — with import directions enforced by import-linter over the whole
      package; the `layering` gate blocks
    paths: [src/torve/**, pyproject.toml]
    consequence: >-
      The hexagon is visible in the tree and mechanically held
    cites: [D-15.1, D-15.8]
  - id: D-55.24
    grade: LOCKED
    text: >-
      `gates` imports only `domain`, `base` and `config`; the gates-only install stands
      alone
    paths: [src/torve/gates/**, pyproject.toml]
    consequence: >-
      The first shippable increment keeps shipping alone
    cites: [D-15.2]
  - id: D-55.25
    grade: LOCKED
    text: >-
      Adapters never import each other and are organised `adapters/<port>/<technology>.py`
    paths: [src/torve/adapters/**]
    consequence: >-
      Swapping one adapter is never a rewrite of another
    cites: [D-15.3, D-15.4]
  - id: D-55.26
    grade: LOCKED
    text: >-
      The specification format terminates at the planner: gates, runtime adapters
      and agent adapters never import its owner
    paths: [pyproject.toml, src/torve/gates/**, src/torve/adapters/**]
    consequence: >-
      Format containment cannot break quietly; the contract is the only thing a gate
      reads about a task
    cites: [D-7.17]
  - id: D-55.27
    grade: ASSUMED
    text: >-
      No module is named `models`, `utils`, `helpers`, `common` or `base` below the
      package root; modules are named for what they hold, and the `source-layout`
      gate reads it
    paths: [src/torve/**]
    consequence: Names that admit anything accumulate everything
    cites: [D-15.5, D-14.11]
  - id: D-55.28
    grade: ASSUMED
    text: >-
      A module named after a CLI verb lives under `cli/` and holds parsing and rendering
      only; presentation never crosses inward
    paths: [src/torve/cli/**]
    consequence: >-
      Logic and presentation stay separable where they are hardest to separate
    cites: [D-15.6, D-18.2]
  - id: D-55.29
    grade: ASSUMED
    text: >-
      Application code reaches stores only through injected factories; substrate wiring
      lives in the facade and `config_hash` beside the telemetry it stamps
    paths: [src/torve/application/**]
    consequence: >-
      Anything derived below a port is invisible to simulation
    cites: [D-15.12]
  - id: D-55.30
    grade: ASSUMED
    text: >-
      Everything Torve owns in a consuming repository lives under `.torve/`; the gate
      manifest and the run configuration are separate files; run configuration is
      read from where the runner was launched and never from the repository under
      work
    paths:
      - .torve/config.yaml
      - .torve/gates.yaml
      - src/torve/config/runconfig.py
      - src/torve/config/layout.py
    consequence: >-
      A worked-on repository cannot configure the engine working on it
    cites: [D-13.3]
  - id: D-55.31
    grade: ASSUMED
    text: >-
      Providers a repository's contents may reach are enforced at dispatch, before
      a sandbox exists; an empty default denies every real provider
    paths: [src/torve/config/runconfig.py, src/torve/application/dispatch.py]
    consequence: Silence is not a policy; it is a closed door
    cites: [D-4.8]
  - id: D-55.32
    grade: ASSUMED
    text: >-
      A tier resolves through profiles in the operator's own configuration directory,
      never the repository under work; a missing profile or an unknown skill refuses
      rather than falls back
    paths: [src/torve/config/runconfig.py, src/torve/application/skills.py]
    consequence: Resolution is fail-closed throughout
    cites: [0028, 0029]
  - id: D-55.33
    grade: ASSUMED
    text: >-
      Configuration routes by nature — identity in the image, task context in the
      workspace, secrets as environment names, knobs in the command, state on the
      slot volume — one item, one channel
    paths: [src/torve/config/runconfig.py, src/torve/adapters/agent/harness.py]
    consequence: >-
      A second channel for a secret is a leak; a repository-carried harness config
      is an injection surface
    cites: [D-17.4]
  - id: D-55.34
    grade: ASSUMED
    text: >-
      A stdio MCP server is image content; a remote MCP endpoint is an egress destination
      under provider routing; no execution sandbox is given a read surface onto the
      record
    paths: [src/torve/config/runconfig.py, .torve/sandbox/**, src/torve/cli/mcp.py]
    consequence: >-
      Files in the worktree carry task context; reach into the record is the planner's
      alone
    cites: [D-17.6]
  - id: D-55.35
    grade: ASSUMED
    text: >-
      Sandbox images are digest-pinned inputs to a run; an image the eval ledger has
      not measured refuses dispatch unless the rebuild hatch is set, and the dispatch
      records the unmeasured digest
    paths: [.torve/sandbox/**, src/torve/application/dispatch.py, .torve/evals.jsonl]
    consequence: >-
      Numbers from different images are never silently compared
    cites: ['0017', '0027']
  - id: D-55.36
    grade: ASSUMED
    text: >-
      Skills ship as package data under `skills/` and are materialised role-scoped
      into the sandbox; a vendored skill lives under `.torve/skills-vendor/`; a name
      in both refuses, a name in neither is a configuration error
    paths: [skills/**, .torve/skills-vendor/**, src/torve/application/skills.py]
    consequence: >-
      What an agent knows is versioned and named, never ambient
    cites: [D-9.12]
  - id: D-55.37
    grade: LOCKED
    text: >-
      A fact is an event of a closed kind vocabulary with an authority table; an agent
      may write only `divergence.recorded` and `message.sent`; no update command exists
      on the record
    paths: [src/torve/domain/events.py, src/torve/application/eventlog.py]
    consequence: >-
      An audit trail that can be edited cannot be trusted; the authority table refuses
      before any store sees the write
    cites: [D-44.2]
  - id: D-55.38
    grade: ASSUMED
    text: >-
      The manager holds nothing between passes and rebuilds its view from the record;
      a worker holds a lease and nothing else
    paths:
      - src/torve/application/manager.py
      - src/torve/application/worker.py
      - src/torve/application/residency.py
    consequence: >-
      A restart is a re-read, never a recovery procedure
    cites: ['0044']
  - id: D-55.39
    grade: ASSUMED
    text: >-
      Retirement of a decision is recorded, never inferred from a row that stopped
      appearing; a second `decision.recorded` on a subject is a version, `supersedes`
      names a different decision
    paths: [src/torve/application/decisions.py]
    consequence: >-
      Absence cannot tell a retirement from a broken table
    cites: [D-47.1, D-47.2]
  - id: D-55.40
    grade: ASSUMED
    text: >-
      A landing is recorded from the `Torve-Task` trailer on the commit; git log is
      the surviving record and the importer mints landed history from it
    paths: [src/torve/adapters/vcs/git.py, src/torve/application/runner.py]
    consequence: >-
      A session-authored landing enters the record the same way an agent's does
    cites: [D-10.4]
  - id: D-55.41
    grade: ASSUMED
    text: >-
      Every attempt appends one telemetry row stamped with the `config_hash` of the
      regime it ran under; absent counts stay absent, never zero; the verdict is engine-derived
      and never model output
    paths:
      - src/torve/application/telemetry.py
      - .torve/telemetry.jsonl
      - .torve/regimes/**
    consequence: >-
      Numbers from different regimes are never silently compared; a mute row is a
      mute row
    cites: [D-4.6, D-38.2]
  - id: D-55.42
    grade: ASSUMED
    text: >-
      Every read of the log pages; no reader folds a truncated prefix as if it were
      the whole
    paths: [src/torve/application/eventlog.py]
    consequence: >-
      The board once decided dispatch over a third of its tasks missing
    cites: [A-99]
  - id: D-55.43
    grade: ASSUMED
    text: >-
      Migrations are owner-grouped, forward-only SQL under `migrations/`; the substrate
      is pinned by `FORZE_VERSION`, which `torve doctor` enforces and `config_hash`
      digests
    paths: [migrations/**, src/torve/application/migrate.py, src/torve/cli/doctor.py]
    consequence: >-
      A substrate surface change fails at the pin bump, not in production
    cites: ['0012']
  - id: D-55.44
    grade: ASSUMED
    text: >-
      `torve plan` is deterministic and invokes no model; it mints from exactly one
      accepted, committed document, copies that document's whole table, and refuses
      to re-mint over minted phases
    paths: [src/torve/application/planner.py, src/torve/cli/plan.py]
    consequence: >-
      What to do with existing tasks is a human decision
    cites: [D-7.22, D-49.1]
  - id: D-55.45
    grade: ASSUMED
    text: >-
      Nothing inherits from a document that is not `accepted`; a contract without
      a document inherits every accepted row whose declared paths intersect its `scope.allow`
    paths: [src/torve/application/planner.py, src/torve/application/intake.py]
    consequence: >-
      The document-less lane is governed; a draft's rows never stand
    cites: [D-A.10, D-30.5]
  - id: D-55.46
    grade: ASSUMED
    text: >-
      A draft passes the deterministic lint before adoption — non-empty intent and
      acceptance, in-tree globs, a module's test file allowed beside it, no git in
      acceptance, pairwise-disjoint scopes — and adoption mints identifiers under
      the engine lock
    paths: [src/torve/application/intake.py, src/torve/application/enginelock.py]
    consequence: >-
      A defect the lint names at drafting costs nothing; the same defect at attempt
      three cost 2410 seconds once
    cites: [D-20.3, A-131, A-132]
  - id: D-55.47
    grade: ASSUMED
    text: >-
      A contract the size estimate calls `too_large` routes to a decomposition run
      rather than an attempt; children stay inside the parent's scope, decomposition
      depth is at most two, and the parent survives as the integration task
    paths: [src/torve/application/sizing.py, src/torve/application/intake.py]
    consequence: >-
      Oversized work is split at drafting time, where the tree is in view
    cites: ['0026']
  - id: D-55.48
    grade: ASSUMED
    text: >-
      The poison ceiling is checked before dispatch and reaching it escalates, never
      retries; a red gate pass retries under the ladder's next rung
    paths:
      - src/torve/application/dispatch.py
      - src/torve/application/session.py
      - .torve/config.yaml
    consequence: >-
      An attempt is spent on a chance, never on a certainty
    cites: ['0034']
  - id: D-55.49
    grade: LOCKED
    text: >-
      Review is a second run role in its own sandbox; the reviewer never receives
      the author's trace; findings are one JSON document with located evidence, a
      blocker escalates the target and the rest go to the operator's ledger
    paths: [src/torve/application/review.py]
    consequence: >-
      Reviewer independence is from the author's reasoning; engine facts about the
      diff are not the author's
    cites: [D-5.3]
  - id: D-55.50
    grade: LOCKED
    text: >-
      The engine never resolves a merge conflict and never lands without the configured
      approval; landings serialize through one lane per base
    paths: [src/torve/application/lane.py, src/torve/application/residency.py]
    consequence: >-
      A conflict against an unmoved base is the same conflict, and re-queueing it
      is a loop
    cites: [D-6, D-52.5]
  - id: D-55.51
    grade: ASSUMED
    text: >-
      A landing commit carries `Torve-Task`, `Torve-Attempt`, `Torve-Agent`, `Torve-Config`
      and `Torve-Decisions` trailers; provenance is written by the runner, never by
      the agent
    paths: [src/torve/application/runner.py]
    consequence: >-
      What landed, under which regime, inheriting which rows, is readable from git
      alone
    cites: ['0010']
  - id: D-55.52
    grade: ASSUMED
    text: >-
      Documentation under `pages/` is written independently of the corpus — never
      generated from it, never contradicting an accepted row — and `INDEX.md` is generated
      and drift-checked, never hand-edited
    paths: [pages/**, rfcs/INDEX.md]
    consequence: >-
      Two axes, versioned differently; a lockfile-grade index cannot drift
    cites: [D-A.1a, D-A.6]
  - id: D-55.53
    grade: ASSUMED
    text: >-
      Commit messages follow gitmoji plus Conventional Commits with the type taken
      from the mapping file, checked by the skill's script; a body states why, in
      at most twenty non-blank lines
    paths: [.agents/skills/gitmoji-conventional/**]
    consequence: >-
      Release tooling reads the type; `git blame` reads the body
  - id: D-55.54
    grade: ASSUMED
    text: >-
      CI is the battery: `torve gates check` proves every gate can fail and `torve
      gates run --base origin/main` is the acceptance of every push; a human pull
      request runs the manifest's fallback commands
    paths: [.github/workflows/ci.yml, .torve/gates.yaml]
    consequence: There is no second definition of green
    cites: ['0002']
  - id: D-55.55
    grade: ASSUMED
    text: >-
      The web bundle is vendored under `src/torve/_web/` and the release job rebuilds
      it from `web/` and fails when the committed bundle differs
    paths: [src/torve/_web/**, web/**, .github/workflows/publish.yml]
    consequence: A stale bundle cannot ship silently
    cites: [D-32.5]
  - id: D-55.56
    grade: ASSUMED
    text: >-
      Cadence belongs to the manager's pass; there is no resident scanning loop, and
      the standing legs — maintenance, relay, lane — run inside the pass under their
      switches
    paths: [src/torve/application/residency.py, src/torve/cli/manager.py]
    consequence: >-
      One process to run and supervise; a pause stops what advances the repository
    cites: [A-105, A-106]
  - id: D-55.57
    grade: ASSUMED
    text: >-
      Standing maintenance is a committed contract under `.torve/standing/` with a
      trigger kind, cooldown, `max_open` and `strike_limit`, evaluated deterministically
    paths: [.torve/standing/**, src/torve/application/standing.py]
    consequence: >-
      A job that fires is a fact with a bound, never a daemon's habit
    cites: ['0023']
  - id: D-55.58
    grade: ASSUMED
    text: >-
      The review corpus under `.torve/review-corpus/` grows from post-merge escapes,
      and reviewer regressions are measured by replaying it
    paths: [.torve/review-corpus/**, src/torve/application/review.py]
    consequence: A reviewer's calibration is a measured quantity
    cites: ['0036']
  - id: D-55.59
    grade: ASSUMED
    text: >-
      Strict typing is a floor over `src/`: `mypy --strict` and `basedpyright` strict
      block CI and the acceptance fallback; tests, scripts and skills carry no type
      floor
    paths: [src/torve/**, pyproject.toml]
    consequence: >-
      A substrate surface change fails at the type check
  - id: D-55.60
    grade: ASSUMED
    text: >-
      Every attempt runs on a worktree seeded with the base sha pinned host-side,
      the role's skills materialised, and the divergence log seeded; the session trace
      is captured to `.torve/traces/` and its content enters no prompt and drives
      no control flow
