# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      The review-thread leg's record source reads no finding from a review whose target
      is a round the leg minted; such a review still blocks its round's landing on
      a blocker, and what it finds below that grade stays on the stream
    paths: [src/torve/application/reviewleg.py, tests/test_reviewleg.py]
    consequence: >-
      a document's rounds are bounded by the findings on its phases, and a round's
      check opens no further round
    rationale: >-
      bloomery's night of 2026-09-21 minted three rounds of rounds out of eleven,
      each an attempt and a review spent on a nit, and the reviewer always finds a
      nit
    cites: [S-0086/D-3, S-0086/D-5, S-0043/D-1]
  - id: D-2
    grade: ASSUMED
    text: >-
      The next dispatch of a task whose last attempt escalated `blocker_finding`,
      `locked_conflict` or `underspecified` from a halt, and which has not landed,
      continues from the tree that attempt checkpointed, whether it was requeued on
      the board or by a person
    paths:
      - src/torve/application/runner.py
      - tests/test_runner.py
      - tests/test_run_loop.py
    consequence: >-
      a review that asks for one file's change costs that change, and a halt answered
      by an amendment resumes where it stopped
    rationale: >-
      both trees are already committed on the task's branch (S-0086/D-2, S-0086/A-1)
      and a run already revises a blocker in the same worktree (S-0043/D-1); only
      a requeue threw the tree away, and bloomery paid a whole phase twice for it
    cites: [S-0026/D-8, S-0026/D-9, S-0086/D-2, S-0043/D-1]
    fingerprint: fd07c012ef76c08a/d5444928038b97ea
  - id: D-3
    grade: ASSUMED
    text: >-
      A continued attempt reads the task's contract as it stands at that dispatch,
      as every attempt does: after `plan --refresh` it is the refreshed contract.
      The tree carries over from the checkpoint; the terms do not
    paths: [src/torve/application/runner.py, tests/test_runner.py]
    consequence: >-
      an amendment that answered a halt reaches the attempt that resumes from it,
      and the resumed tree is judged by the terms that now stand
    rationale: >-
      the refresh is what made the halt answerable, and a contract is a copy at write
      time per attempt (S-0007/D-7), not per task
    cites: [S-0088/D-1, S-0007/D-7]
