          `blocker_finding`, and otherwise goes to the critic's re-review as S-0124/D-8
          describes it
      - subject: D-3
        field: fingerprint
        before: 77bc889d47db8d36/e20b63a95c8a18bd
        after: c9ec286092070f5a/e20b63a95c8a18bd
    md: |
      Amended on 2026-11-22 from the bed's verification run of S-0127/A-15.
      A critic's repro named a docs example by the id pytest gives it, `tests/test_docs.py::test_docs_examples[docs/index.md:1255-1269]`, which carries the example's line span. The revision fixed the example by wrapping one line, so the span became 1255-1272 and the old id named nothing: pytest exited 4 with `ERROR: not found:`, and the recheck read that as the blocker still failing, re-raised it and escalated a unit whose fix passes under the new id. A selector that finds no test has measured nothing of the candidate, like an exit of 126 or 127, so the turn now goes to the critic's re-review. Only pytest's own lines beside exit 4 or 5 count; a first review's re-run still blocks on any non-zero exit (S-0127/D-1).
