        after: >-
          After a session revision turn whose gates are green, the engine judges the
          turn by `critic.recheck` before any second critic call: each finding blocker
          of the verdict the turn was handed is re-run, its `repro.command` with the
          probes that review stored, through `runner.reproduce` against the revised
          candidate as S-0127/D-1 and S-0127/D-10 say; a re-run that executes clears
