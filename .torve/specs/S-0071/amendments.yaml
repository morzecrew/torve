# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-13T07:54:23Z'
    title: >-
      The coupling lives in the lockfile, not in the image definition
    changes:
      - subject: D-2
        field: paths
        before: [sandboxes/battery/Dockerfile]
        after: [pyproject.toml, uv.lock]
      - subject: D-2
        field: text
        before: >-
          The battery image is rebuilt in the same change that adds the dependency,
          and the moved digest is recorded rather than waived
        after: >-
          A dependency change here is an image change: the battery image is rebuilt
          in the same change that touches the lockfile, and the moved digest is recorded
          rather than waived. The image definition itself needs no edit — it copies
          the two files and syncs from them, so the rebuild is an act, not a diff
      - subject: D-2
        field: fingerprint
        after: 0ae81a09c6e9da14/3d013a06f2ca186d
    md: |
      Written while minting the first phase, which is where it showed. The row had
      declared `sandboxes/battery/Dockerfile`, and a contract scoped to that file
      inherits everything governing `sandboxes/**` — fourteen further rows across
      S-0055, S-0062, S-0063 and S-0064, none of which the phase touches.

      The reason it does not need to is that the image definition already does the
      right thing: it copies `pyproject.toml` and `uv.lock` and runs
      `uv sync --locked --all-extras`, keyed on Docker's own layer cache. Adding a
      package to the `dev` group changes the lockfile, the lockfile is part of the
      copied context, and the layer rebuilds. There is no edit to make.

      So the coupling the row is really about lives in the lockfile, and the rebuild
      is an operational act on the host rather than a diff an agent can write. The
      row now says that, and the phase's scope is the two files it actually changes.
  - id: A-2
    at: '2026-09-13T09:59:14Z'
    title: >-
      The rebuild is warmth, not rescue — and it must use the pinned tag
    changes:
      - subject: D-2
        field: grade
        before: LOCKED
        after: ASSUMED
      - subject: D-2
        field: text
        before: >-
          A dependency change here is an image change: the battery image is rebuilt
          in the same change that touches the lockfile, and the moved digest is recorded
          rather than waived. The image definition itself needs no edit — it copies
          the two files and syncs from them, so the rebuild is an act, not a diff
        after: >-
          A dependency change here is an image change: the pinned seat images are
          rebuilt in the same change that touches the lockfile, under the tags the
          harness manifests name rather than under `latest`, and the moved digest
          is recorded rather than waived. No image definition is edited — each copies
          the two files and syncs from them, so the rebuild is an act, not a diff
      - subject: D-2
        field: fingerprint
        before: 0ae81a09c6e9da14/3d013a06f2ca186d
        after: 7de0cc000ed75644/591a53183c8ca75f
    md: |
      Written after doing the rebuild, which disproved the row's own rationale.

      The rationale said an attempt would otherwise install the missing package "over
      an egress that is brokered and allowlisted", and graded the row LOCKED on that
      hazard. Two facts contradict it. The gates run in the agent's image, not the
      battery image — `runner.py:403`, "shell gates run over the same image the agent
      ran under (S-0003/D-8)" — and `claude-sandbox` bakes no project environment at
      all: `/opt/torve/project` does not exist in it. And T-0375 proved the runtime
      path works from inside the sandbox, recording that `uv run pytest -n 2
      --collect-only` loaded the plugin before any image carried it.

      So the rebuild buys a warm, deterministic layer rather than rescuing an attempt
      from a closed door. That is worth doing and it is not load-bearing, which is
      what `ASSUMED` says and `LOCKED` did not.

      The row gains the thing the rebuild actually taught. `just images` builds
      `TAG=latest`, so it left `claude-sandbox:2.1.252` and `dsh-sandbox:0.1.1-rc.2`
      — the tags the harness manifests pin — untouched, and the seats would have kept
      running the old images while the record claimed a rebuild. Same tag with a new
      digest is the case `S-0055/D-35` already describes: the digest is the input, the
      tag is a convenience, and the dispatch records the move. Measured across the two
      attempts either side of it: 38ccab25 to 9eab16e3, and the battery from 370.5s to
      78.4s.
  - id: A-3
    at: '2026-09-13T10:31:17Z'
    title: An acceptance command runs where it is judged
    changes:
      - subject: D-5
        field: grade
        before: OPEN
        after: LOCKED
      - subject: D-5
        field: paths
        before: []
        after: [.torve/specs, src/torve/application/intake.py]
      - subject: D-5
        field: fingerprint
        after: 337119b0329223bd/7bd57b4b55104661
    md: |
      Found by this document's own third phase, three times in a row.

      Phase 3 named `uv run torve doctor` among its acceptance commands. Doctor is a
      report on the host the engine runs *from* — is there a daemon, is
      `$TORVE_PG_DSN` set, do the provider credentials resolve — and a sandbox holds
      none of that on purpose. So every attempt failed on the same two lines,

          ✗ store.adapter is 'postgres' but $TORVE_PG_DSN is not set
          ✗ runtime unavailable: [Errno 2] No such file or directory: 'docker'

      neither of which the work could have changed. Three attempts, the poison
      ceiling, and no information: the battery was right each time and the contract
      was unsatisfiable by construction.

      Phase 4 carried the same defect in a slower-acting form — `torve spec project
      --check` is red in every sandbox until `S-0070`'s second phase moves the
      projection's live section out of a committed file, and naming it in acceptance
      would have made a shadow gate blocking. Both phases now accept `uv run pytest`,
      which is what actually proves them.

      The row is `LOCKED` because the cost is asymmetric and the check is cheap: an
      author cannot feel this mistake, the lint can, and the alternative to catching it
      at mint is catching it at the ceiling.
  - id: A-4
    at: '2026-09-15T22:51:38Z'
    title: >-
      The coverage-delta soak, read out loud: held at 80
    changes:
      - subject: D-4
        field: text
        before: >-
          `coverage-delta`'s soak is read out loud and the verdict recorded — promoted,
          retired, or held with the number that says why
        after: >-
          `coverage-delta`'s soak is read out loud and the verdict recorded — promoted,
          retired, or held with the number that says why; the soak was read and the
          gate is held at 80
      - subject: D-4
        field: fingerprint
        after: 0b76762ca5dd3556/4b8813709a14b5ec
    md: |-
      The row asked for the verdict and the number. Here they are, over 302 runs
      of the gate in shadow:

      - red 154 times, 51.2% of its runs
      - 130 of those reds, 84.4%, are a real coverage shortfall; 10 are the
        suite being red, where the gate says so and measures nothing
      - where it measured, the median was 76.0% against the bar of 80, with a
        range of 50 to 94
      - 43,448 seconds of wall clock, 12 hours, the largest single item in the
        battery and about three times `acceptance`

      **Held at 80.** Not promoted: at a 51% red rate promotion doubles the
      convictions, and a bar the fleet's median sits four points under is a
      standard this repository has not yet met rather than a check it is
      failing. Not retired either: 84% of the reds are true, so the signal is
      real and the gate is the only thing measuring it.

      What changed instead is the cost. The gate now declares that it judges
      `src/**` (S-0071/D-6), so the 77 runs that changed nothing there are
      skipped rather than run, and its command asks coverage.py for CPython's
      `sys.monitoring` tracer: measured on this suite, 25s plain, 47s under
      coverage, 30s under sysmon. The bar stays where it is until the median
      moves, and D-1's parallel suite is why holding it is now affordable.
