# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      `torve brief <contract>` runs what dispatch runs before an agent starts — the
      lint, the size estimate, the uninherited rows, the pack, the battery — prints
      it, and refuses nothing
    paths: [src/torve/cli/brief.py]
    consequence: >-
      the hand-minted path gets the protection the drafted path already has, printed
      before the work rather than convicted after it
    rationale: >-
      of the last eight session-authored contracts three carried a lint refusal and
      all eight landed green; the verb that would have caught them exists, is written
      for this case in its own help text, and only `torve intake` calls it
    cites: [S-0030/D-4]
  - id: D-2
    grade: ASSUMED
    text: >-
      The brief prints the rows whose declared paths intersect the scope and which
      the contract has not inherited
    paths: [src/torve/cli/brief.py]
    consequence: >-
      a session stops learning from a conviction that it was governed by a row it
      never carried
    rationale: >-
      the lint already computes this as an advisory and no caller has ever printed
      it, while `decisions-reported` is the most convicting gate in the battery
  - id: D-3
    grade: ASSUMED
    text: >-
      The working rules live once, at `skills/working-rules/`, reaching a sandbox
      as a declared equipment item and a session through its skill root; `build_prompt`
      names the skill instead of inlining it
    paths:
      - skills/working-rules/**
      - src/torve/adapters/agent/harness.py
      - .torve/agents/**
    consequence: >-
      the best short statement of how to work in this repository stops being readable
      only by opening the engine's source, and both modes read one text that a diff
      can refuse
    rationale: >-
      S-0066 shuts `.claude/skills` out of a sandbox attempt, so the rules must arrive
      as equipment — declared, refusable at load, hashed into the regime; every other
      torve-owned skill already has exactly this one-source shape
    cites: [S-0066/D-1, S-0062/D-7]
  - id: D-4
    grade: LOCKED
    text: >-
      One bullet stays in the prompt: that the role's skills are in system position,
      whole, and that their files are under `.torve/skills/`
    paths: [src/torve/adapters/agent/harness.py]
    consequence: >-
      the skill remains reachable; without it the rules are a file nothing points
      at
    rationale: >-
      moving a pointer into the thing it points at is the one way this change can
      fail silently, and it fails for every attempt at once
    fingerprint: e8b4ce3e824cdb66/fa4496186fea6bbc
  - id: D-5
    grade: LOCKED
    text: >-
      The MCP surface serves the per-task pack as one more read-only tool and registers
      no tool that writes
    paths: [src/torve/cli/mcp.py]
    consequence: >-
      every session gets the facts a sandbox is handed on disk, whichever harness
      it drove up in, and no verb's refusals are reimplemented behind a second interface
    rationale: >-
      the pack is already a pure function of record, tree and contract, which is the
      shape a read tool wants; the refusals are the valuable part of a write verb
      and they live in the verb
    cites: [S-0054/D-9]
  - id: D-6
    grade: ASSUMED
    text: >-
      The working-rules skill states that a scope naming a module names that module's
      test file
    paths: [skills/working-rules/**]
    consequence: >-
      the one rule that produced every measured lint refusal on the hand-minted path
      is written where a session reads it, not only where a lint reports it
    rationale: >-
      all four refusals across the last eight session contracts were this rule, and
      a contract that forbids its own test file is self-consistent and green all the
      way down
  - id: D-7
    grade: ASSUMED
    text: >-
      The working-rules skill states that a task's scope does not name the changelog;
      the entry is written afterwards, from the landing records, once the work it
      describes has been reviewed
    paths: [skills/working-rules/**]
    consequence: >-
      the same exact literal stops appearing in most of the board's allow-sets, where
      it makes every pair of tasks naming it clash and serialise; and an entry stops
      describing an implementation that review may still change
    rationale: >-
      measured: 55 of 86 live contracts and 40 phasing entries name `CHANGELOG.md`,
      while no decision row governs it, no gate reads it and nothing in `src/` mentions
      it — the only thing that ever asked an agent for an entry is the `keep-a-changelog`
      skill, which arrives as undeclared equipment that S-0066 shuts
    cites: [S-0066/D-1]
  - id: D-8
    grade: ASSUMED
    text: >-
      The working-rules skill states that a test may not assume it is the only one
      on the machine: what it creates on a shared daemon it finds by its own name
      or root, never by a literal other tests also use
    paths: [skills/working-rules/**]
    consequence: >-
      the suite can run in parallel, which is measured at 4.3x, and a test that breaks
      the rule fails as a bug rather than as a flake
    rationale: >-
      four tests asked Docker for sandboxes labelled `T-9001` — one shared literal
      across eleven files — and got every concurrent test's; one of them destroyed
      a neighbour's live container. `naming.root_key` had existed for exactly this
      since S-0003/D-25 and said so in its own docstring
    cites: [S-0071/D-1]
  - id: D-9
    grade: ASSUMED
    text: >-
      Dispatch refuses a contract the lint refuses, at the rung the size check already
      stands on: named reasons, and a recorded override for the operator who means
      it
    paths: [src/torve/cli/run.py]
    consequence: >-
      a contract that can never go green is refused before an attempt is paid for,
      rather than after three of them
    rationale: >-
      the size verdict and the contract lint are siblings and exactly one is wired
      — `cli/run.py:132` refuses `too_large` and records `oversize_dispatch`, while
      nothing on the dispatch path calls `lint_contract` at all. T-0377 named `torve
      doctor` in its acceptance and was dispatched three times; the lint had the answer
      before the first one
    cites: [S-0071/D-5, S-0030/D-4]
  - id: D-10
    grade: ASSUMED
    text: >-
      A verb that takes a contract takes its task id, resolving through `layout.task_file`;
      a path stays accepted for a draft that has no id yet
    paths: [src/torve/cli/brief.py, src/torve/cli/gates.py, src/torve/cli/intake.py]
    consequence: >-
      the three reading verbs address work the way `torve run` does, and where a contract
      file lives stops being the caller's problem
    rationale: >-
      `run` takes `{task_id}` and `brief`, `size` and `lint-contract` take a path,
      so the id a person has in hand is the one thing they cannot pass. `layout.task_file`
      already exists to resolve it. The draft case is why a path is kept rather than
      replaced: `intake` writes contracts that are not minted and have no id
    cites: [D-1]
