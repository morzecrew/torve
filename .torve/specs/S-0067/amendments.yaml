    md: |
      Both rows come from using `torve brief` for the first time, ten minutes after it
      landed.

      D-9 is the gap the verb made visible rather than one it fills. Brief prints and
      refuses nothing, which is right for a reading verb — forcing it on every dispatch
      would put thirty-two lines of advisory in front of a contract the planner minted
      correctly, and an advisory that is always there is one nobody reads. What is
      missing is narrower: dispatch refuses an oversized contract and records the
      override, and never runs the lint at all. Two sibling checks, one wired.

      D-10 is the skew the same use exposed. `run` takes a task id; `brief`, `size` and
      `lint-contract` take a path, so the identifier a person actually holds is the one
      thing none of them accepts — and `torve size T-0367` answering "Path 'T-0367'
      does not exist" is a verb telling its user that its own storage layout is their
      problem. A path stays accepted, because `intake` drafts contracts that have no id.

      Phase 4's documentation now waits on this phase too: a guide describing how to
      address these verbs should describe the way they will address.
