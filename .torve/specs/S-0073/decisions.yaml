# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      `build_prompt` names the working-rules skill and does not restate it; the test
      over it asserts that property rather than the words, so a bullet added back
      fails instead of passing quietly beside the skill
    paths: [src/torve/adapters/agent/harness.py, tests/test_tiering.py]
    consequence: >-
      one copy of the text that governs behaviour, and a test that cannot be satisfied
      by two
    rationale: >-
      T-0385 landed the skill and departed from D-3 because `tests/test_tiering.py`
      pins each bullet to the prompt string and was outside its scope. The duplication
      is still there, and S-0067 was marked complete over it
    cites: [S-0067/D-3, S-0067/D-4]
  - id: D-2
    grade: ASSUMED
    text: >-
      The working rules reach the agent in system position, through each harness's
      own channel, carrying the same text
    paths: [src/torve/adapters/agent/harness.py, .torve/harnesses]
    consequence: >-
      the rules are read before the contract rather than below it, and they join the
      cached prefix
    rationale: >-
      all three images have the channel and the text is identical across them; the
      two readings of the benefit — obedience and cache — are both testable against
      the ledger afterwards and neither is assumed
    cites: [S-0029/D-1]
  - id: D-3
    grade: ASSUMED
    text: >-
      `num_turns`, `permission_denials` and `subagent_stats` are recorded on the attempt
      when the receipt carries them, absent when it does not, and never invented
    paths: [src/torve/adapters/agent/harness.py, src/torve/application/telemetry.py]
    consequence: >-
      an attempt at 113 turns and an attempt at 12 stop reading as the same attempt
    rationale: >-
      all three are already in the receipts on disk — 55 trace files carry them —
      so this is a parse, not a harness change; absent-stays-absent is the rule every
      other count on that row follows (S-0055/D-41)
    cites: [S-0065/D-6, S-0055/D-41]
  - id: D-4
    grade: LOCKED
    text: >-
      No cap is placed on subagent fan-out: measured over every receipt that reports
      it, none has ever been spawned, so the bound is refused as a knob that would
      move the regime digest while changing nothing
    paths: [.torve/harnesses]
    consequence: >-
      E13 closes on evidence instead of shipping, and the question reopens only if
      the recorded number stops being zero
    rationale: >-
      55 receipts carrying `subagent_stats`, every one `spawned: 0` and `max_depth:
      0`. The register's own condition was that zero closes the question
    cites: [S-0063/D-10]
  - id: D-5
    grade: ASSUMED
    text: >-
      The working rules ask for independent reads and greps in one message, because
      the harness executes several tool calls from one and nothing has ever sent two
    paths: [skills/working-rules/**]
    consequence: >-
      the round trips a small attempt spends orienting fall without any read being
      given up
    rationale: >-
      1,605 assistant messages across every retained trace, each carrying exactly
      one tool call — no exception on any seat, opus through Anthropic and qwen through
      ModelStudio alike. Zero variance is not a model's habit, so the harness was
      checked directly: the same CLI at the same version, invoked the same way, executes
      two calls issued in one message, and nothing in the image, the broker or the
      init line forbids it. What differs is one sentence in the prompt. `cache_read`
      is requests times context, so this is the only mitigation measured that divides
      the multiplier rather than the multiplicand, and the burn profile's calls-per-message
      reports the answer directly
    cites: [S-0067/D-3]
  - id: D-6
    grade: ASSUMED
    text: >-
      A contract's acceptance commands carry their own quiet form, and the working
      rules ask for them to be run as written, once, after the edits
    paths: [skills/working-rules/**, .torve/specs]
    consequence: >-
      the model stops inventing output filters for a command the engine could have
      spelled, and the suite runs twice rather than a dozen times
    rationale: >-
      four to fifteen `pytest` invocations per attempt, most of them the same command
      with a different `tail`, `grep` or `tr` — none of which changed a verdict. The
      battery re-runs the acceptance outside the session regardless, so the in-session
      runs are for the model's own confidence and one is enough
    cites: [S-0030/D-4]
  - id: D-7
    grade: ASSUMED
    text: >-
      `torve log divergence` records several rows in one invocation, and the working
      rules say the finishing check answers `log owed` before a stop
    paths: [src/torve/cli/log.py, skills/working-rules/**]
    consequence: >-
      the bookkeeping tail becomes one round trip instead of one per governed row
    rationale: >-
      four to fourteen bookkeeping calls per attempt — `log owed`, a `--help`, one
      `log divergence` per row, `log owed` again — and the Stop hook S-0066/D-5 declared
      already blocks a finish that still owes an entry
    cites: [S-0066/D-5]
  - id: D-8
    grade: ASSUMED
    text: >-
      Each image reads the system text the engine staged, through its own channel
      — claude's `--append-system-prompt`, dsh's persona row — and a seat whose image
      does not read it is the engine's silence, not the model's
    paths: [sandboxes/claude/toolkit/run, sandboxes/dsh/toolkit/run]
    consequence: >-
      the rules arrive before the contract rather than as a file the attempt happens
      to open on its third call, which is what D-2 claims matters and what D-5 cannot
      be judged without
    rationale: >-
      T-0409 landed the engine half of D-2 — `working_rules()` as one producer, staged
      to `.torve/tmp/system.md` and named as `TORVE_SYSTEM_PROMPT` — and no image
      reads that variable: `grep` finds it nowhere under `sandboxes/`, and neither
      built image carries it. The phase's own allow pattern named `.torve/harnesses`,
      a directory, and the scope guard matches worktree-relative paths with fnmatch,
      so the contract could not be satisfied as minted and the attempt recorded D-2
      contradicted rather than crossing its scope. Measured meanwhile: an attempt
      that read the batching sentence from the skill file on its third call made 57
      further calls, one per message
    cites: [D-2, D-5]
