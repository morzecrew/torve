# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      A contract carries `scope.contingent`, literal paths the planner derives at
      mint and at refresh: the importers, in source and tests, one hop, of the files
      the phase's globs match; the first-party modules those files import; their tests
      paired at any depth under `tests/`; their packages' `__init__`; and the paths
      the document's other phases' scopes match.
    paths:
      - src/torve/domain/task.py
      - src/torve/application/neighbours.py
      - src/torve/application/planner.py
    consequence: >-
      the files a change most often reaches beyond its phase are known to the attempt
      before it starts
    rationale: >-
      On the record these rules cover 34 of 44 missing paths and every path of 16
      of 21 tasks; co-change history adds nothing beyond them.
  - id: D-2
    grade: ASSUMED
    text: >-
      A contingent path is promoted on its first write when no in-flight task's `allow`
      or promoted paths hold it: the board records `scope.promoted`, and the path
      joins the task's fence for every overlap check after.
    paths:
      - src/torve/application/runner.py
      - src/torve/application/manager.py
      - src/torve/domain/events.py
      - .torve/agents/hooks/implement/scope_guard.py
    consequence: >-
      an attempt that needs a neighbour writes it and carries on, and no other task
      writes it at the same time
    rationale: >-
      `scopes_clash` already fences in-flight tasks; a promotion is one more path
      in the fence.
    fingerprint: b61fb7aa224fb211/0cbd323f35b8da4f
  - id: D-3
    grade: ASSUMED
    text: >-
      A contingent path an in-flight task holds is refused with the holder's id, and
      the attempt returns to the queue as a `blocked_by_overlap` dispatch does, not
      to a person.
    paths: [src/torve/application/runner.py]
    consequence: a collision costs a wait, not an escalation
    rationale: >-
      Overlap is already resolved by waiting; a contingent collision is an overlap
      found late.
  - id: D-4
    grade: ASSUMED
    text: >-
      A contingent path that only a later, undispatched phase of the same document
      holds may be promoted, and that phase's dispatch then waits on the promoting
      task.
    paths: [src/torve/application/manager.py]
    consequence: >-
      a phase can finish work that another phase of its document owns on paper, in
      order
    rationale: >-
      13 of the 21 tasks on record needed a path another phase of their own document
      owned. The owner confirmed it (Q-1, 2026-10-12).
  - id: D-5
    grade: ASSUMED
    text: >-
      The gate manifest's `scope.derived` map names files that ride with a source,
      in both directions (a lock file with its manifest, a golden with its producer,
      a generated schema with its model); a derived path is contingent wherever its
      source is in scope. The map replaces the hard-coded lock-file table, and its
      default is that table.
    paths:
      - src/torve/config/manifest.py
      - src/torve/gates/scope.py
      - src/torve/application/neighbours.py
    consequence: >-
      a repository names its own generated files once, and the import graph's blind
      spot is covered where it is named
    rationale: >-
      The ten paths no import rule catches are generated-artifact links.
  - id: D-6
    grade: ASSUMED
    text: >-
      A managed `AGENTS.md` beside a path in scope is writable as a lock file is:
      `torve spec project` writes it, and the scope gate allows it.
    paths: [src/torve/gates/scope.py, .torve/agents/hooks/implement/scope_guard.py]
    consequence: >-
      a phase that changes governed code can regenerate its projection without a halt
    rationale: >-
      T-0289 hit the poison ceiling on projections alone.
    fingerprint: 68c43c6215521fb6/920088c60deee661
  - id: D-7
    grade: ASSUMED
    text: >-
      The attempt's prompt lists its contingent paths beside its scope, the scope
      gate reports every promoted path, and the reviewer is shown the promotions.
    paths:
      - src/torve/adapters/agent/harness.py
      - src/torve/gates/scope.py
      - src/torve/application/review.py
    consequence: >-
      a widening is read by the agent, the gate and the reviewer, never made silently
    rationale: A guard that bends must say where it bent.
  - id: D-8
    grade: ASSUMED
    text: >-
      A review round's contingent paths are its anchor's neighbours by the same rules.
    paths: [src/torve/application/reviewleg.py]
    consequence: >-
      a round that needs its anchor's caller or test promotes it instead of halting
    rationale: >-
      Eight of bloomery's eleven scope-halt tasks were rounds scoped to one anchor
      file.
  - id: D-9
    grade: ASSUMED
    text: >-
      Test pairing finds a module's tests at any depth under `tests/`; the planner
      warns on a phase missing them and keeps refusing only the flat layout's miss.
    paths: [src/torve/application/intake.py]
    consequence: >-
      a nested test layout is paired without refusing plans that were valid yesterday
    rationale: >-
      As a refusal, nested pairing would block 35 of bloomery's 86 plans.
  - id: D-10
    grade: ASSUMED
    text: >-
      The spec quality report counts promotions per phase and per document.
    paths: [src/torve/application/specquality.py]
    consequence: >-
      an author sees which phases were drawn too narrow, from the record
    rationale: >-
      The signal that a scope was wrong used to be a halt and a person's amendment.
  - id: D-11
    grade: ASSUMED
    text: >-
      The import-graph rules read Python; in a repository with no Python the contingent
      set is the pairing, the document union and the derived map.
    paths: [src/torve/application/neighbours.py]
    consequence: >-
      an adopter in another language still gets the rules that are not language-bound
    rationale: >-
      A per-language import graph is a later document; the test adapter of the third
      move is where languages are named.
  - id: D-12
    grade: ASSUMED
    text: >-
      This document changes torve's own copy of the pre-write hook; an adopter's copy
      is refreshed from torve's when it upgrades, and shipping the hook as package
      equipment is a document of its own.
    paths: [skills/hooks/implement/scope_guard.py]
    consequence: >-
      the change stays inside torve's tree, and an adopter's hook follows its upgrade
    rationale: The owner's answer to Q-2 (2026-10-12).
    fingerprint: 6dc4f00769f963a9/161f7c080078d8ce
