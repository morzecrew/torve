# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-54.1
    grade: LOCKED
    text: >-
      `InheritedDecision` gains `consequence` and `check`, copied at mint from the
      model, carried by `decision.recorded`, rendered after each row in the prompt;
      the fingerprinted set stays text, grade and paths
    paths: [src/torve/domain/task.py, src/torve/application/planner.py]
    consequence: >-
      A gate reads the contract and never the corpus (D-7.18 stands); the reason a
      row exists reaches the executor for the first time
  - id: D-54.2
    grade: LOCKED
    text: >-
      A contract's row with a `check` runs as a gate appended to the battery by the
      runner, named `decision:<id>`, axis compliance, `origin: rfc/NNNN#<id>`, never
      written into `gates.yaml`
    paths: [src/torve/gates/runner.py]
    consequence: >-
      Decision gates exist exactly as long as the contract; the manifest stays the
      operator's (D-2.5); the retry ladder reads them as any compliance conviction
      (D-34.4)
    rationale: >-
      Three decisions are gates by hand today with origin as a comment; the row is
      the place the check belongs, and the contract is the only thing a gate may read.
    cites: [D-2.5, D-7.18, D-34.4, D-53.15]
  - id: D-54.3
    grade: LOCKED
    text: >-
      A row whose check ran in the same pass, green or red, is not owed a divergence
      entry; a row with no check keeps the silence check
    paths: [src/torve/gates/decisions_reported.py]
    consequence: >-
      The battery proves what a command can prove; the log is for judgement; 670 of
      705 entries stop costing tokens as rows gain checks
    rationale: >-
      The silence check is the strongest anti-drift guarantee and the most expensive
      habit; a command proving compliance retires the prose without weakening the
      check.
    cites: [D-7.5, D-2.10]
  - id: D-54.4
    grade: LOCKED
    text: >-
      A decision gate enters at `shadow`; promotion to blocking is `check_state` on
      the row, written by `torve rfc amend` citing soak evidence, and a blocking row
      must name a `check_twin` that `torve gates check` runs
    paths: [src/torve/gates/runner.py, src/torve/gates/sabotage.py]
    consequence: >-
      D-2.18 and D-36.3 apply to rows exactly as to manifest entries; no row convicts
      before someone has seen it fail
  - id: D-54.5
    grade: ASSUMED
    text: >-
      A `LOCKED` row with no check is reported *soft* by `rfc health`, counted beside
      the hard ones, never regraded by the engine
    paths: [src/torve/application/specquality.py]
    consequence: >-
      The author sees which locks are prose; RFC 0022's non-goal on automatic edits
      stands
  - id: D-54.6
    grade: LOCKED
    text: >-
      `torve spec project` renders a managed section into the `AGENTS.md` of every
      directory a standing row's paths or an accepted phase's scope names — rows with
      grade, text, consequence, check and state; invariants; contended paths — and
      a root index of governed directories; text outside the markers is never touched
    paths: [src/torve/application/colocation.py, src/torve/cli/spec.py]
    consequence: >-
      Every harness and every person reads the rules where the code is, with no prompt
      change; a directory that stops being governed loses its section
    rationale: >-
      The harness docstring already relies on AGENTS.md for everything the prompt
      omits; it is twelve lines of Repowise. Nearest-file precedence is what every
      harness does.
    cites: [D-A.6, D-11.11, D-17.4]
  - id: D-54.7
    grade: LOCKED
    text: >-
      The rendered sections are committed and drift-checked by a manifest gate running
      `torve spec project --check`; a hand edit inside the markers is drift naming
      the file
    paths: [.torve/gates.yaml, src/torve/cli/spec.py]
    consequence: >-
      The INDEX.md rule (D-A.6) applied to the tree; the projection cannot lie about
      the corpus
  - id: D-54.8
    grade: ASSUMED
    text: >-
      `AGENTS.md` sections carry rows, invariants, checks, tests and warnings only;
      no generated overview, no prose beyond the row's own text and consequence
    paths: [src/torve/application/colocation.py]
    consequence: >-
      The one controlled study says overviews cost and do not help; rules and facts
      do
  - id: D-54.9
    grade: LOCKED
    text: >-
      `torve spec show`, `paths`, `tests` and `why-not` form a read-only verb over
      the worktree's corpus and the archive beside it; a form that would need the
      record, another task or an escalation is refused by design
    paths: [src/torve/cli/spec.py]
    consequence: >-
      RFC 0007 §5 stands: the sandbox gains disclosure over files it could open, never
      reach
  - id: D-54.10
    grade: LOCKED
    text: >-
      The context pack under `.torve/context/` is computed host-side from the record
      and the tree, with no model, before the prompt is written; deterministic for
      a base sha and record state; gitignored; never in an image; byte-identical for
      a shadow run; own task only
    paths: [src/torve/application/contextpack.py, src/torve/application/session.py]
    consequence: >-
      RFC 0035's rule for derived state applied to knowledge; D-17.4, D-17.7 and D-31
      hold; a replay stays comparable
    rationale: >-
      Every thinness in the sandbox has a good decision behind it, and every one is
      about state or other agents' output. A projection of own-task facts is neither.
    cites: [D-17.4, D-17.6, D-17.7, D-31, D-35.1]
  - id: D-54.11
    grade: ASSUMED
    text: >-
      The pack's files are `index.md`, `decisions.json`, `gates.json`, `tests.json`
      (from `coverage.xml`), `attempts.json`, `contended.json`, `schema/`; each lands
      one at a time behind a config-eval on the compliance-red population and is deleted
      if attempts to green and dollars per landing do not fall by more than its tokens
      cost
    paths: [src/torve/application/contextpack.py]
    consequence: >-
      Nothing that adds tokens to every attempt ships without a number; the study's
      +20 % is the prior to beat
  - id: D-54.12
    grade: ASSUMED
    text: >-
      A red pass writes its gate report into the next attempt's `attempts.json` —
      output tails with byte-loss markers, governing decision ids for `decisions-reported`
      and `scope`, failed test ids from JUnit — and the retry ladder still selects
      the tier from outcome and axis alone (D-34.5)
    paths: [src/torve/application/runner.py, src/torve/application/session.py]
    consequence: >-
      What tier runs next is unchanged; what it is told is the change; RFC 0043's
      loop becomes the general case
  - id: D-54.13
    grade: LOCKED
    text: >-
      The reviewer reads the pack minus any model-authored entry, plus `touched.json`
      (rows the diff intersects, coverage of changed lines, prior findings on the
      task); nothing the author wrote enters (D-5.3 unchanged)
    paths: [src/torve/application/review.py]
    consequence: >-
      Engine facts about the diff are not the author's voice; the reviewer stops being
      the role with the least context
    rationale: >-
      Reviewer independence is from the author's reasoning, not from the engine's
      facts; owed() already computes what the diff touches and throws it away.
    cites: [D-5.3, D-5.1]
  - id: D-54.14
    grade: ASSUMED
    text: >-
      The default review skill set is `[reading-isnt-proof, ratchet-what-you-build]`
    paths: [src/torve/config/runconfig.py]
    consequence: Two skills that declare the role reach it
  - id: D-54.15
    grade: ASSUMED
    text: >-
      Findings and drafts are validated against the pydantic models' JSON Schema shipped
      in `schema/`; a validation failure is a lint refusal naming the field, never
      an `unparseable` row
    paths: [src/torve/application/review.py, src/torve/application/intake.py]
    consequence: >-
      The output contract is a contract the agent can read; two of three unparseable
      rows on record were shape failures
  - id: D-54.16
    grade: ASSUMED
    text: >-
      The drafter's 400-path listing is replaced by the pack's `index.md` and `torve
      spec paths` over the candidate scope
    paths: [src/torve/application/intake.py]
    consequence: >-
      A split is proposed against the rows it would cross, not a list of filenames
  - id: D-54.17
    grade: OPEN
    text: >-
      A decision gate's timeout: the row's or the manifest default's (Q-54.1); settled
      when the first checkable row runs the full suite
  - id: D-54.18
    grade: OPEN
    text: The window for `contended.json` (Q-54.2)
