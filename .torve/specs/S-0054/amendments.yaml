    title: phase 1 brings the runner's test file
    changes:
      - subject: phase 1
        field: scope
        before: >-
          … tests/test_gates.py tests/test_sabotage.py tests/test_cli.py
        after: >-
          … tests/test_gates.py tests/test_runner.py tests/test_sabotage.py tests/test_cli.py
