      - subject: D-9
        field: text
        before: >-
          Which variable name each of the three night knobs takes, and what the image's
          own `run` maps it to, is implementation's — under one constraint: torve
          sets them and interprets none of them
        after: >-
          The night seat `claude-subscription-night` names the three knobs `CLAUDE_FALLBACK_MODEL`,
          `CLAUDE_CAPACITY_RETRY_SECONDS` and `CLAUDE_DENY_TOOLS`. The claude image's
          `run` maps them to `--fallback-model`, a retry of a capacity error that
          spent no tokens bounded by those seconds (`capacity.py`), and `--disallowed-tools`.
          No module under `src/` reads any of them.
      - subject: D-9
        field: fingerprint
        after: 4ed4b571a9244765/44ee03959419beba
      - subject: D-12
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-12
        field: text
        before: >-
          Where the wall-clock end is measured from and what a pass in flight does
          when it arrives is implementation's, under two constraints — an attempt
          in flight is not interrupted by the end, and the close is written even when
          the end falls inside a pass
        after: >-
          The wall-clock end is the night's `opened_at` plus `night.minutes`. The
          serve loop reads its stop terms only at the top of a pass, so an attempt
          in flight at the end finishes, and `night.closed` records `wall_clock` with
          `overran_seconds` past the end.
      - subject: D-12
        field: fingerprint
        after: 7b0d65f85067bbd0/a5c8e537da609e08
