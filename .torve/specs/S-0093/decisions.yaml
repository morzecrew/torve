# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      A landing that leaves a document complete runs the fallback battery over the
      document branch tip before the pull request is published; the pull request leaves
      draft only on a green battery
    paths: [src/torve/application/lane.py, tests/test_lane.py]
    consequence: >-
      no document pull request is ready on a tree the whole suite has not passed
    rationale: >-
      a fast-forward proves the tree is the one the gates measured, and the gates
      measured only the phase's scoped acceptance; the document is the unit a person
      merges, so it is where the whole suite belongs
    cites: [S-0083/D-13]
  - id: D-2
    grade: ASSUMED
    text: >-
      A red battery at completion writes `lane_document_gates_red` with its summary
      and publishes the pull request as a draft
    paths: [src/torve/application/lane.py, tests/test_lane.py]
    consequence: >-
      a person reading the pull request sees why it is still a draft
    rationale: >-
      the lane already reports a red rebase regate this way (`lane_gates_red`)
  - id: D-3
    grade: ASSUMED
    text: >-
      Where a review leg reads recorded findings, a red battery at completion is recorded
      as a review finding on the last landed task — severity major, the failing gates
      and tests as the claim, the battery's command as the evidence — so the review
      leg mints a round for it; elsewhere a red battery at completion escalates the
      completing task `blocker_finding` at once
    paths:
      - src/torve/application/lane.py
      - src/torve/application/reviewleg.py
      - tests/test_reviewleg.py
    consequence: >-
      the engine fixes what its phases broke outside their scope, and the round's
      landing reruns the battery
    rationale: >-
      `record_threads` already turns a recorded finding with command evidence into
      a round (S-0086/D-4) and S-0092 scopes it; a new path would duplicate both
    cites: [S-0086/D-4, S-0092/D-1]
    fingerprint: d122528719bf89ac/400d3c7ea4fef236
  - id: D-4
    grade: ASSUMED
    text: >-
      Where a review leg runs, a completion earns one round: the battery reruns when
      that round lands a change or answers its finding without one, and a second red
      battery escalates on the last landed task for a person
    paths:
      - src/torve/application/lane.py
      - src/torve/application/reviewleg.py
      - tests/test_lane.py
    consequence: >-
      a flaky test clears itself on the rerun, a break the round can fix is fixed,
      and one it cannot reaches a person instead of looping
    rationale: >-
      a round is not guaranteed to land: one that finds nothing to fix answers without
      a change, which would otherwise leave the pull request a draft with no battery
      to clear it, and an unbounded rerun would loop on a break the engine cannot
      fix
    cites: [D-3, S-0090/D-1]
    fingerprint: 086942ad54629266/49e4175f74f7df4c
  - id: D-5
    grade: ASSUMED
    text: >-
      The completion battery is the manifest's fallback battery under the manifest's
      own cap, the one the rebase regate already runs; no separate setting
    paths: [src/torve/application/lane.py]
    consequence: >-
      one cap sizes both regates, and a suite that outgrows it is fixed in one place;
      the tiers the fallback leaves out (bloomery's engine and e2e tiers) still reach
      CI first
    rationale: >-
      bloomery's acceptance cap is 600s against default tiers measured at 167.8s plus
      a first sync; a repository whose suite outlasts its cap already has a broken
      rebase regate, and a second knob would let the two disagree
    cites: [D-1]
