entries:
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    at: '2026-11-02T09:16:44Z'
    claim: >-
      The claim that D-7's check only pins a stubbed _regate is stale: tests/test_lane.py:4458
      is test_a_rebased_candidate_with_only_inherited_failures_lands, which does not
      monkeypatch _regate. It writes a genuinely failing tests/test_inherited.py,
      commits it as red on the base, puts a real @suite gate with a pytest command
      in the manifest, rebases a candidate onto that red base, and asserts process_lane
      lands it with inherited_failures naming the node id and the suite result passing
      with that id in its output. The real suite attribution therefore runs at head
      and merge base; an implementation that handed the suite no merge base would
      convict under D-2 and fail the landed assertion. The cited stub at line 4478
      is not this test.
    evidence: >-
      tests/test_lane.py:4458-4510 — the inherited test runs the real suite gate,
      asserts landed plus inherited_failures == [tests/test_inherited.py::test_still_red];
      no monkeypatch of lane._regate is present, and 'uv run pytest tests/test_lane.py
      -k inherited -q' passes.
    action: decided
    proposal: >-
      No specification change owed; the rejecting reviewer should re-read the test
      at tests/test_lane.py:4458 against the current tree.
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    at: '2026-11-02T12:21:22Z'
    attempt: 2
    claim: >-
      The claim does not hold against this tree. The one test that `uv run pytest
      tests/test_lane.py -k inherited` selects is a real end-to-end lane test, not
      a stub: `test_a_rebased_candidate_with_only_inherited_failures_lands` declares
      an actual `suite` gate entry whose `commands` run pytest over `tests/test_inherited.py`,
      calls `process_lane`, and asserts the rebased candidate lands with the inherited
      node id on the LaneResult. No `_regate` stub is patched in it, and the quoted
      `return lane._Regate(0, "suite=pass", ...)` appears nowhere in the tree or its
      history. The check does catch a battery that attributes nothing to the base:
      making the suite's base reading unavailable fails the test with 'gates red'
      instead of 'landed', which is D-2 convicting.
    evidence: >-
      tests/test_lane.py:4458-4459 — the test `-k inherited` selects runs the real
      battery; its `suite` gate's `commands` at tests/test_lane.py:4476-4479 run pytest
      over the red file, and `process_lane` at tests/test_lane.py:4494 is the real
      lane. `rg -n 'suite=pass' tests/ src/` returns nothing. Temporarily making `_extract_base`
      return its no-base note turns the check red: 'At index 0 diff: gates red !=
      landed'.
    action: decided
    proposal: >-
      No row is owed: S-0118/D-7's check already runs the real suite gate and its
      inherited attribution, and the stub the claim cites is not in this tree.
