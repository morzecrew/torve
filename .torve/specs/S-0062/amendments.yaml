# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-10T14:53:04Z'
    title: >-
      The phases take the test files of the modules they touch
    md: |-
      `torve plan` refused to mint: three phases allowed a module whose existing test file was outside their scope, which is the T-0113 rule — a phase that can change a module and cannot change what tests it either leaves the suite red or edits a test it was not scoped to edit.

      Phase 1 gains `tests/test_runconfig.py` because the fold of `skills` and `plugins` into equipment reaches the loader that fills them. Phase 2 gains `tests/test_session.py` because the seat that fills a `SandboxSpec` is the one that mounts the cache. Phase 3 gains both `tests/test_session.py` and `tests/test_runner.py`, which is where an infrastructure failure is told apart from a conviction.

      No decision row changes and no scope widens beyond a module's own tests.
  - id: A-2
    at: '2026-09-10T15:03:30Z'
    title: Phase 1 takes the doctor's seat fixtures
    md: |-
      D-1 folds `skills` and `plugins` into `equipment` and refuses the old keys by name, which is the migration this phase exists to force. The migration's reach was three profile bodies written as fixtures in `tests/test_doctor.py` — the seat line and the equipment line are what `torve doctor` says a seat is made of, so they carry a profile body like any repository does.

      They are ported here rather than in a follow-up, because a phase that leaves the suite red has not landed. No source file outside the phase changes: `doctor.py` reads `tier.skills`, which is derived from the same list.
  - id: A-3
    at: '2026-09-10T15:07:12Z'
    title: >-
      D-2's refusal is no way to deliver it, not no flag for it
    changes:
      - subject: D-2
        field: text
        before: >-
          A harness manifest declares which equipment kinds it accepts and the flag
          template that carries each into its command; a kind a profile declares and
          the manifest does not is refused at load.
        after: >-
          A harness manifest declares which equipment kinds it accepts and the flag
          template that carries each into its command; a kind a profile declares and
          the manifest does not is refused at load, unless the engine can deliver
          it itself — package-data skills alone, which `materialize` writes into the
          worktree.
      - subject: D-2
        field: fingerprint
        after: 17dcbd9fb4c5c9d4/0f914ec0385a62d4
    md: |-
      D-2 and D-10 contradicted, and building phase 1 made it visible in the first minute: D-10 says a harness that takes no `skill` kind keeps `materialize` and the prompt's paragraph, and D-2 as written refused exactly that configuration — a role profile declaring a package-data skill names a kind the `fake` harness does not equip, so every seat in this repository would have been refused before it resolved.

      The rule is what D-2 always meant: an attempt must not run missing its equipment. A package-data skill has a second channel every harness has, so refusing it protects nothing and costs D-10. Every other kind, and a skill that has to be fetched, has only the flag and is refused as before.

      The exception narrows on its own. Once a real harness gives the `skill` kind a flag it fires only for a harness with no skill channel at all, which is the case D-10 exists for. Proposed from T-0326 (S-0062/D-2, halted).
  - id: A-4
    at: '2026-09-10T15:08:00Z'
    title: >-
      Every phase writes the changelog entry for what it changed
    md: |-
      Four phases changed what a repository writes and none of them could say so: `CHANGELOG.md` was in no scope, so an entry would have reddened the scope gate and its absence would have left four landings undocumented.

      Every phase gains it. An entry is not documentation of the work — it is the user-facing half of the change, and a phase that ships a new declaration and cannot write down that it did has not shipped it.
  - id: A-5
    at: '2026-09-10T15:10:48Z'
    title: >-
      A fifth kind: the subagents a harness can be handed
    md: |-
      Claude Code 2.1.252 takes `--agents <json>`, a JSON object defining custom agents, beside `--plugin-dir`, `--mcp-config` and `--settings`. It is a channel like the other four, so it is a kind like the other four: `local:.torve/subagents/<name>.json` with the manifest naming `agent: --agents {path}`.

      The design section is renamed from `one-declaration-four-kinds`, and now says why the kinds are an enumeration: the capability map is keyed on them, so a kind no manifest could name would be a declaration nothing can carry. Adding one is this amendment, which is the intended cost.
  - id: A-6
    at: '2026-09-10T15:10:51Z'
    title: >-
      No equipment by default — an unequipped seat runs the bare harness
    md: |-
      `torve init` minted `implement.yaml`, `review.yaml` and `revert.yaml` pre-filled with the two skills this engine ships, so a repository that had asked for nothing got two skills in its trigger-matching set and two entries in its regime hash. That is equipment by default, and S-0009's own argument against it is the collision cost of a skill nobody wanted.

      It mints none now. A role with no profile contributes no layer, a seat naming no profile contributes none either, and a seat with neither runs the bare harness with nothing attached. The two shipped skills stay shipped and stay package data (D-6); what changes is that a repository has to name one.

      The cost is named rather than hidden: `decisions-reported` convicts on the divergence-log format `flag-dont-flip` teaches, and a fresh repository no longer loads that skill. The base working rules in the prompt still mandate the logging (S-0061/D-4), which is where the requirement always lived — the skill taught it, it never carried it.
  - id: A-7
    at: '2026-09-10T19:04:24Z'
    title: >-
      The capability map keeps its refusal and loses its templates
    changes:
      - subject: D-2
        field: text
        before: >-
          A harness manifest declares which equipment kinds it accepts and the flag
          template that carries each into its command; a kind a profile declares and
          the manifest does not is refused at load, unless the engine can deliver
          it itself — package-data skills alone, which `materialize` writes into the
          worktree.
        after: >-
          A harness manifest declares which equipment kinds it accepts, and a kind
          a profile declares and the manifest does not is refused at load, unless
          the engine can deliver it itself — package-data skills alone, which `materialize`
          writes into the worktree. Which flag carries each kind is the image's own
          `/opt/torve/equip` (S-0063/D-3), not a template here.
      - subject: D-2
        field: fingerprint
        before: 17dcbd9fb4c5c9d4/0f914ec0385a62d4
        after: 4fa4762a34b39585/0f914ec0385a62d4
  - id: A-8
    at: '2026-09-10T19:04:27Z'
    title: The image composes the flags, not the engine
    changes:
      - subject: D-5
        field: text
        before: >-
          The cache mounts read-only into the sandbox, one directory per item, and
          the harness's flag templates are composed against those paths.
        after: >-
          The equipment cache mounts read-only into the sandbox, one directory per
          item, and the image's own `/opt/torve/equip` composes whatever its harness
          needs from the manifest at the mount root (S-0063/D-3, S-0063/D-12).
      - subject: D-5
        field: fingerprint
        after: 325a795ff1532b8b/c13bcb2414ce38df
    md: |-
      The row said the manifest's flag templates are composed against the mount paths. There are no templates now (A-7), and composing is the image's: `equip` reads `manifest.json` at the root of the read-only mount and turns it into flags, an overlay, or install commands, depending on what its harness takes.

      What does not change is the mount: read-only, one directory per item, so nothing inside an attempt can edit what it was equipped with — which is also why the manifest sits inside it (S-0063/D-12) rather than in a workspace the attempt can write.
  - id: A-9
    at: '2026-09-11T12:08:24Z'
    title: >-
      No harness this repository builds is without a skill channel
    changes:
      - subject: D-10
        field: text
        before: >-
          For a harness that takes the `skill` kind the prompt stops naming `.torve/skills/`;
          for one that does not, `materialize` and the prompt's paragraph stand unchanged.
        after: >-
          For a harness that takes the `skill` kind the prompt stops naming `.torve/skills/`;
          for one that does not, `materialize` and the prompt's paragraph stand unchanged.
          All three harnesses this repository builds take it — claude by flag, dsh
          at `.agents/skills`, mimo at `.mimocode/skill/` (S-0063/D-16) — so the paragraph
          stands for none of them.
      - subject: D-10
        field: fingerprint
        after: 9952aa9998bd875d/4efcb7034d979af9
    md: |-
      The row was written when claude was the only harness measured, and it kept a fallback for a harness with no skill channel: `materialize` into the worktree, and a prompt paragraph naming the directory. Both other harnesses turn out to have one.

      dsh loads `@deepseek-ai/dsh-skill-filesystem`, which watches `.agents/skills` and `.dsh/skills` under the workspace. mimo reads `<project>/.mimocode/skill/<name>/SKILL.md`, and `mimo debug skill` lists what it found — measured with a probe skill copied in by `equip`.

      So the fallback has no subject among the images this repository builds. It stays in the row because a harness without one is a thing that can exist and the engine should still have an answer; what changes is that it is now the exception rather than half the story.
  - id: A-10
    at: '2026-09-11T13:05:12Z'
    title: Phase 2's intent says what its rows say now
