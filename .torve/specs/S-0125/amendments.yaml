# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-11-07T22:38:34Z'
    title: >-
      A unit that reaches its ceiling on a revision keeps its work
    changes:
      - subject: D-10
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-10
        field: paths
        before: []
        after: [src/torve/application/runner.py]
      - subject: D-10
        field: text
        before: <decision>
        after: >-
          A run that escalates `poison_ceiling` after a revision attempt, one following
          a `review blocker (revision k of n)` fact in the run's history, commits
          its last attempt's tree on the task's branch as a checkpoint marked `escalated
          at the ceiling on a revision`, and the dispatch after a requeue resumes
          from it as from a review blocker; a run whose attempts saw no critic block
          still restarts from base
      - subject: D-10
        field: fingerprint
        after: 4e93a18f98333147/14bd8ed0a79735ba
    md: |
      T-0883, phase 1, ran three attempts on 2026-11-07. The critic's blockers went from four
      to one to none, and the third attempt went red only on one `RUF005` lint finding. That
      was the poison ceiling. `_continuable` (runner.py) excludes `poison_ceiling`, so a
      requeue would have restarted the task from base and thrown the three attempts away.
      The owner agreed in session to add D-10 and phase 6, which delivers it. Phase 6 waits
      on phase 1, whose landing also edits `runner.py`. No other row changes.
  - id: A-2
    at: '2026-11-08T11:33:22Z'
    title: One file's findings stay one round above the cap
    changes:
      - subject: D-3
        field: text
        before: >-
          Every review round carries at most `threads.findings_per_round` findings,
          whether its head was triaged or not, and the default is 5; `batch_claims`
          still never splits a file across rounds
        after: >-
          Every review round carries at most `threads.findings_per_round` findings,
          whether its head was triaged or not, and the default is 5; a file with more
          findings than the cap is one round of its own, because `batch_claims` never
          splits a file across rounds
      - subject: D-3
        field: fingerprint
        after: f2b4ea0d32532368/fe62264787a2595d
    md: |
      The row's two clauses disagreed for a file carrying more findings than the cap: the cap
      said a round holds at most five, and `batch_claims` keeps a file whole. The code and
      `tests/test_reviewleg.py` already resolve it for the file, since two rounds of one wave on
      the same file would race on it. T-0913's critic convicted that case as a violation of the
      row twice, and the round escalated at its ceiling (2026-11-08); the attempt's divergence
      entry proposed this wording. The text now says what the code does. No behaviour changes.
