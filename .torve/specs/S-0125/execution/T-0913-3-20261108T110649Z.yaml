entries:
- decision: unlisted
  grade: UNLISTED
  kind: contradicted
  at: '2026-11-08T09:32:54Z'
  claim: 'The claim at runconfig.py:1350 that a file with more findings than findings_per_round
    makes an oversize round is true of the code but is not a defect: S-0125/D-3 states the
    cap and, in the same row, that batch_claims still never splits a file across rounds. The
    two only conflict for a file carrying more findings than the cap, and the row resolves
    that case in favour of the file: two rounds of one wave on the same file would race on
    it, which is what grouping by file exists to prevent. batch_claims keeps the file whole
    by design; only the findings_per_round docstring was corrected to say so.'
  evidence: src/torve/application/reviewleg.py:831-861 — batch_claims flushes a round before
    a file group that would overflow it and never splits a group, and its docstring names
    the oversize round as intended; S-0125/D-3 says batch_claims still never splits a file
    across rounds
  action: departed
  proposal: 'S-0125/D-3 should say: every review round carries at most threads.findings_per_round
    findings, except that a single file with more findings than the cap forms one round of
    its own, because batch_claims never splits a file across rounds.'
