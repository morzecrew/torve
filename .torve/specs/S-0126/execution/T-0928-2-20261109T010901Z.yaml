    claim: >-
      src/torve/application/runner.py:1054 — the claim does not hold as a defect:
      exempting a round-less implement task that records a contradicted rejection
      is the behaviour the existing tests require. tests/test_run_loop.py:1347-1383
      runs a task built by base_task, which carries no round, whose only work is an
      unlisted/contradicted entry, and asserts it lands READY on attempt 1; tests/test_review_run.py:2100-2130
      asserts the same exemption for Task(id='T-9001', role='implement') with no round.
      Requiring a round, as the claim proposes, turns both red (the previous attempt's
      suite gate showed exactly these two failures), and tests/test_run_loop.py is
      outside this task's editable tests. The current-attempt pin from S-0126/D-3
      already stops an earlier attempt's rejection from excusing a later empty diff.
      Narrowing the exemption to rounds needs a row amending S-0084/D-13 and those
      tests first.
    evidence: >-
      tests/test_run_loop.py:1347-1383 — a round-less base_task whose only change
      is a contradicted entry must land READY; tests/test_review_run.py:2100-2130
      pins the same exemption for a round-less implement Task
    action: departed
    proposal: >-
      If a rejection should exempt only review rounds, amend S-0084/D-13 to say so
      and update tests/test_run_loop.py:1347 and tests/test_review_run.py:2100 in
      the same change.
