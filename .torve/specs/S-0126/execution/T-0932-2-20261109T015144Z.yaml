entries:
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    at: '2026-11-09T01:26:49Z'
    claim: >-
      src/torve/application/critic.py:471 — the missing spans are not a defect but
      S-0126/D-2's own rule. The carry takes a finding's span only when threads.names_spot
      matches it in the claim, or the round's one finding when the claim names none,
      plus every locating citation in the evidence. A multi-finding round whose rejection
      names no spot therefore contributes no finding span, and tests/test_critic.py:305-323
      pins that exact case. The reply answering every thread is the conservative half
      of the pair (S-0097/D-5): it cannot say a thread was fixed when nothing says
      which finding the rejection is about. Extending the carry to every finding would
      clear an independent defect sitting at one of them, the S-0126/D-1 failure in
      reverse, so S-0126/D-2 and D-3 would have to be amended to say so first.
    evidence: >-
      src/torve/application/AGENTS.md:490 — S-0126/D-2 gives the span of every finding
      names_spot matches in the claim, or the round's one finding when the claim names
      none, and tests/test_critic.py:305-323 pins a two-finding round whose unnamed
      rejection contributes no finding span.
    action: departed
    proposal: >-
      If an unnamed rejection in a multi-finding round should count for every finding,
      S-0126/D-2 must say so and S-0126/D-3's consequence be reworded; until then
      the carry keeps names_spot's attribution.
