# yaml-language-server: $schema=../../schemas/phasing.json
after: [S-0125]
unit: phase
phasing:
  - phase: 1
    title: One rule for a rejection
    intent: >-
      `threads.rejections(entries, attempt)` returns the entries with `decision: unlisted`
      and `kind: contradicted` whose `attempt` is *attempt*, an entry with no `attempt`
      counting for every attempt, identical entries once. `reviewleg._names` moves to
      `threads.names_spot(claim, spot, spots)`: a full `path:line` matches; the file's name
      and the line match only when no other spot in *spots* shares both. `reply_body` and
      `answer_round` use both: the reply reads the landing's execution record before the
      root log, and keeps the rejections of the attempt the record's file names
      (`<task>-<attempt>-<instant>.yaml`), or of the root log's latest attempt.
      `reviewleg.INSTRUCTIONS` asks each attempt to record again every claim it still
      rejects. Tests named `rejections` and `names_spot` in `tests/test_threads.py`, and a
      test named `rejections` in `tests/test_reviewleg.py` (the landing record wins over a
      root log holding other entries).
    scope:
      - src/torve/application/threads.py
      - src/torve/application/reviewleg.py
      - tests/test_threads.py
      - tests/test_reviewleg.py
    acceptance:
      - uv run pytest -q tests/test_threads.py tests/test_reviewleg.py
      - uv run mypy src
    delivers: [D-3]
  - phase: 2
    title: The engine carries what the round rejected
    intent: >-
      `critic.rejected_spots(task, worktree, attempt)` returns `(path, start, end)` spans:
      none unless `task.round` is set; otherwise, for each rejection
      `threads.rejections` returns from the worktree's task log for *attempt*, the span of
      every round finding `threads.names_spot` matches in its claim, that of the round's one
      finding when the round carries one and the claim names none, and every `path:line`
      or `path:start-end` its evidence cites that `locate` accepts. `run_critic` takes the
      attempt under review, computes the spans after staging and passes them to
      `decide(..., rejected=...)`; nothing is staged for them. Before the other rules,
      `decide` carries a kept finding or a `violated` row when its evidence cites at least
      one `path:line`, every cited one locates, and every one lies within `threads.WINDOW`
      lines of a span in the same file. A carried finding goes into `carried`, its record
      marked `rejected: true`; a carried row is recorded `blocks: false, rejected: true` and
      kept out of `violated`. The review guide gains a paragraph on rejected claims. Tests
      named `rejected_claim` in `tests/test_critic.py` (a Hypothesis property over
      citation lines and spans, and examples built through `rejected_spots`: a range
      citation, a named finding with no `end_line`, a one-finding round's unnamed
      rejection, T-0913's attempt-3 findings, a citation outside every span, a citation
      that does not locate, an earlier attempt's rejection), and tests named
      `rejected_spots` in `tests/test_critic.py` and `tests/test_review_run.py` (the log
      read, the round-less task, the unchanged staged input).
    scope:
      - src/torve/application/critic.py
      - tests/test_critic.py
      - tests/test_review_run.py
      - /skills/torve/references/review.md
    acceptance:
      - uv run pytest -q tests/test_critic.py tests/test_review_run.py tests/test_threads.py
      - uv run mypy src
    depends_on: [1]
    delivers: [D-1, D-2]
