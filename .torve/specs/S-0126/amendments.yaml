    md: |
      T-0923's attempt 3 departed from D-3 on 2026-11-09. Under the row as written, a claim that
      cites `runconfig.py:1350`, where two findings of the round share that file name and line,
      names neither finding. The reply then posts the rejection on every thread of the round,
      the fixed findings' threads included, and the carry exempts neither finding's span.
      Attempt 2 had scoped the reply alone to the shared pair, and its review flagged the split
      between the reply's rule and the carry's. The attempt proposed this amendment instead:
      `names_spot` itself names every finding that shares the name and line, so the reply and
      the carry keep one rule. A full `path:line` still names only its own finding. The owner
      agreed in session. The row's consequence changes with its text.
