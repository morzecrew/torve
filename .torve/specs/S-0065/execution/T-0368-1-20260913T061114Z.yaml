    claim: >-
      the landing files in the tree are the carrier: a landing file is present at
      a base only because the commit carrying it landed there, so it answers 'did
      this task land' with no store, no telemetry and no git; the record's landing.recorded
      events are already minted from those same files, and the lane's lane_landed
      is reconciled against them at the landing rather than tallied beside them
    evidence: >-
      src/torve/application/ledger.py:454 — the ledger already divides by the landing
      files through shipped_ids; src/torve/application/decisions.py:951 mints the
      record's landing.recorded from the same files, leaving only src/torve/application/lane.py:542
      unreconciled, which now carries the carrier's verdict
    action: decided
    notes: >-
      the three counts measure different things — the record counts landing commits,
      the lane counts its own merges, the files count landed tasks; only the last
      is the denominator a rate needs
