# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-12T16:58:13Z'
    title: >-
      the record carries what was agreed, because the contract is not kept
    changes:
      - subject: D-3
        field: text
        before: >-
          An attempt's contract is read at the attempt's own base sha, from git, whether
          or not it is still in the working tree
        after: >-
          An attempt's record carries what it was fenced by and judged against — the
          inherited rows, the scope and the acceptance — and where the contract is
          still in git history it is additionally read at the attempt's own sha
      - subject: D-3
        field: fingerprint
        after: e8a5ed03fc8e2336/7c320184354f32fb
    md: |
      D-3 was written on a measurement that is true and a premise that is not.

      The measurement stands: 243 of the 264 attempts whose `contract.yaml` has left
      the working tree still resolve at the sha the attempt row carries, and
      S-0056/D-10's consequence — "git keeps the history" — held for every one of them.

      The premise does not. `.torve/.gitignore` carries `tasks/`, and `git ls-files
      .torve/tasks` returns nothing: contracts have not been committed since the task
      history was pruned, which is the other half of the same locked row. So the git
      read repairs the past and can never reach the future. Every contract minted from
      here — including the two this document's own acceptance produced — exists as an
      untracked file on one machine and nowhere else.

      What makes the join durable is that the record is self-describing, which is what
      the document's title already argues for. Measured, most of that is already true:
      250 of 276 attempt records carry their inherited rows inline as id, grade and
      paths. What no attempt record has ever carried is the scope it was fenced by and
      the acceptance it was judged against — precisely the two facts the git read was
      being asked to recover.

      So the row now names the record as the carrier and the git read as what it always
      was: a way to recover more than the record holds, for the attempts old enough to
      have it. Nothing about phase 1 moves — the writer it changes is the one already in
      that phase's scope.

      The row's consequence and rationale are left as written. Both remain true of the
      half of the row they describe, and the words that correct them are these.
  - id: A-2
    at: '2026-09-12T16:59:25Z'
    title: D-3's paths follow its text to the writer
    changes:
      - subject: D-3
        field: paths
        before: [src/torve/application/ledger.py]
        after: [src/torve/application/ledger.py, src/torve/application/telemetry.py]
      - subject: D-3
        field: fingerprint
        before: e8a5ed03fc8e2336/7c320184354f32fb
        after: 7f75a33a403798e3/df44d8263967949a
    md: |
      A-1 moved the row's obligation from a reader to a writer and left its paths on the
      reader alone. A row governs what its paths name — that is what the silence check
      reads — so a row obliging the attempt writer to carry the scope and the acceptance
      has to name the module that writes it, or `decisions-reported` would never ask.
  - id: A-3
    at: '2026-09-12T19:15:16Z'
    title: >-
      documentation is its own phase, so it can be routed
    md: |
      Phase 2 carried `pages/docs/operating.md` beside the verb it documents, and the
      size heuristic called the phase `too_large` for one reason: it touched two
      top-level modules, `pages` and `src`. The same thing happened to S-0068's phase 1
      earlier the same evening.

      My first reading was that the heuristic was wrong and `pages` should join `tests`
      and `.torve` on the carried list. That reading does not survive the exemption's own
      rationale: those two are exempt because they accompany *every* change mechanically
      — a change to `src/` needs its test, and every task carries its own contract.
      Documentation accompanies some changes, and when it does it is a different job.

      The stronger reason to split is that the engine already has a mechanism that only
      pays off when a task is one competence. `character_routing` maps a phase's
      character to a seat variant, is validated at load, and has never been set in this
      repository or in its configuration's entire git history — while 65 of 74 contracts
      declare a character. A task that is both engine code and prose cannot be routed at
      all: it has to run on the seat the harder half needs, so the prose is written at
      the price of the code.

      So the documentation becomes a `routine` phase of its own, waiting on phase 3
      because the denominator it has to describe is not settled until the carrier is.
      What stays with the code is the record rather than the reference: the reasoning
      behind a change belongs in its commit body and its changelog entry, written by
      whoever found it out.

      The reading that produced this also settled a larger question. A phase already
      mints more than one task — the planner groups entries by phase number, refuses
      same-phase scopes that intersect, and resolves a `depends_on` to every task id in
      the named phase. S-0053 uses it today and six archived documents used it before.
      Nothing needs building for tasks to outnumber phases; the five documents written
      this session simply never used it.
