    class: spec-gap
    at: '2026-10-09T19:27:53Z'
    claim: >-
      D-8 does not settle what 'equipped' means when a role's set materialized nothing
      at all. The resolved set never reaches the adapter (AgentContext carries no
      skills and is out of scope), so the harness reads the worktree's .torve/skills;
      when that directory is absent — a role equipped with nothing — it keeps naming
      working-rules rather than suppressing it, which is what the existing prompt
      tests outside this scope require.
    evidence: >-
      src/torve/adapters/agent/harness.py:287-288 — a missing skills directory returns
      True (name it), so only a materialized set that lacks working-rules suppresses
      the name
    action: decided
    proposal: >-
      Say that 'equipped' is read from the worktree's materialized skill set and that
      an absent set names working-rules; or have session create .torve/skills even
      when empty, so an unequipped role is distinguishable from an unmaterialized
      one.
