# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      A test function proves a row when its own source, docstring, comments and body,
      carries the row's full identifier as a whole token. A module or class docstring
      proves nothing on its functions' behalf, and only test functions that differ
      from the base tree as parsed syntax qualify.
    paths: [src/torve/gates/row_evidence.py]
    consequence: >-
      the tests already citing rows become evidence without a new convention, and
      one citation at the top of a file cannot vouch for every test in it
    rationale: >-
      94 of 101 test files already cite rows. Matching the identifiers the battery
      carries needs no citation grammar, so the gate imports nothing from the specification's
      owner.
    cites: [S-0081/D-2, S-0055/D-26]
  - id: D-2
    grade: ASSUMED
    text: >-
      A builtin gate `evidence` runs each row's citing functions against the base
      tree, built as `red-on-base` builds it, and against the candidate. A row is
      proved when one of its citing functions is red on base and green on the candidate.
      A row that carries a `check` is judged by its own decision gate, and `evidence`
      does not run it.
    paths:
      - src/torve/gates/row_evidence.py
      - src/torve/gates/__init__.py
      - src/torve/config/manifest.py
    consequence: >-
      a row counts as proved only by a test the change had to turn green
    rationale: >-
      A test green on base would have passed before a line was written (S-0081). A
      check already runs as its own gate (S-0054/D-2), and running it twice proves
      nothing new.
    cites: [S-0081/D-5, S-0054/D-2]
  - id: D-3
    grade: ASSUMED
    text: >-
      A row is behavioural unless every one of its paths is documentation, a `*.md`
      file or a path under `pages/`. `evidence` fails when a behavioural row is unproved
      and carries no `check`, naming each such row, and skips when the battery carries
      no behavioural row. It enters at shadow.
    paths: [src/torve/gates/row_evidence.py]
    consequence: >-
      an unproved requirement is named in every battery that carries it, without blocking
      a landing until the gate's record earns it
    rationale: >-
      Documentation rows are proved by reading, not by a test. Rows over sandbox definitions
      and workflows have tests that prove them, so the source root alone is too narrow
      a line.
  - id: D-4
    grade: ASSUMED
    text: >-
      `evidence` names a sabotage case and its twin: a behavioural row whose only
      citing test passes on base fails, and the same row with a citing test red on
      base passes.
    paths: [src/torve/gates/sabotage.py]
    consequence: >-
      `torve gates check` proves the gate can fail before any manifest names it
    cites: [S-0055/D-15]
  - id: D-5
    grade: ASSUMED
    text: >-
      After the whole-document battery, the lane joins per row the `evidence` verdict
      and tests, the `decision:<id>` outcome, the mutation survivors whose path matches
      the row's paths, and the review findings recorded on the document's tasks whose
      evidence path matches them.
    paths: [src/torve/application/evidence_matrix.py, src/torve/application/lane.py]
    consequence: >-
      one table answers, row by row, what proves it and what argues against it
    rationale: >-
      A builtin sees only its own context, not other gates' results, so the join runs
      after the battery, where every result is in hand.
  - id: D-6
    grade: OPEN
    text: >-
      How the joined table reaches the pull request's composer: a host file keyed
      by the branch tip, the battery's result threaded to the publisher, or a record.
      The body never carries a table measured on another tip.
    paths: [src/torve/application/lane.py, src/torve/cli/merge.py]
    consequence: >-
      the implementer picks the carrier the lane's existing ports make cheapest
  - id: D-7
    grade: ASSUMED
    text: >-
      The document pull request's decisions table gains columns for the tests that
      prove each row, its check, its survivors and its findings when a joined table
      exists for the tip it publishes; without one the table stays as it is.
    paths: [src/torve/application/forge.py]
    consequence: >-
      the owner accepts requirement by requirement, and a repository whose manifest
      has no `evidence` entry sees no change
    rationale: >-
      The rows are written once (bloomery #155); a second table would repeat them.
    cites: [S-0083/D-8]
  - id: D-8
    grade: ASSUMED
    text: >-
      The working rules and the spec-writer skill tell an implementer to cite, in
      each test's docstring, the row it proves, and `pages/docs/operating.md` documents
      the gate and the table's columns.
    paths:
      - skills/working-rules/SKILL.md
      - skills/spec-writer/SKILL.md
      - pages/docs/operating.md
    consequence: >-
      the citations the gate reads are written on purpose rather than by habit
  - id: D-9
    grade: ASSUMED
    text: >-
      `evidence` runs in every battery that carries a behavioural row, an attempt's
      as well as the whole document's, and skips in a verify attempt's battery, where
      `verify-tests` judges. In an implement attempt the test functions of the verifier's
      file the contract denies it count as changed, and run on the attempt's base
      tree and on the candidate.
    paths: [src/torve/gates/row_evidence.py]
    consequence: >-
      a row the verifier's tests prove reads as proved on the attempt that turns them
      green, and a verify attempt, whose tests are red by design, names no row
    rationale: >-
      An attempt's battery diffs against the document branch tip, where the verifier's
      file already sits when the implement attempt runs, so D-1 alone would skip the
      tests the pilot exists to write.
    cites: [D-1, S-0083/D-9, S-0116/D-5, S-0116/D-11]
  - id: D-10
    grade: ASSUMED
    text: >-
      The review prompt shows, under each inherited row, the `evidence` gate's reading
      of it from a passing or a failing result: the citing tests that proved it, or
      that none did. It asks of each proving test whether the test exercises what
      the row says; one that does not is a finding at `major`. An unproved row is
      never a finding by itself, and a battery with no `evidence` result leaves the
      prompt as it is.
    paths: [src/torve/application/review.py]
    consequence: >-
      a citation that proves nothing is read by the engine's reviewer on the attempt,
      before the owner meets it in the table
    rationale: >-
      The reviewer already audits each check (S-0106/D-5) and grades the mutation
      survivors beside the rows that cover them (S-0107/D-4). A proving test is the
      same kind of claim, and a reviewer told which test proves which row reads the
      test against the row instead of the suite's status.
    cites: [S-0106/D-5, S-0107/D-4]
