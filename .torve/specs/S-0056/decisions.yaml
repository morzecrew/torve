# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      A document is one YAML file, `rfcs/NNNN-slug.yaml`, in the `Document` model's
      own shape and key order; loading is the model's validator plus the corpus checks;
      `schema_version` 2, and 1 is refused
    paths: [src/torve/config/spec.py, src/torve/domain/spec.py]
    consequence: >-
      The markdown parser, `load_fences`, the heading and table regexes are deleted;
      every reader of the corpus is unchanged
  - id: D-2
    grade: LOCKED
    text: >-
      `DecisionDetail` folds into `Decision`; the fenced kinds are gone; a row carries
      `rationale`, `cites`, `check`, `check_state`, `check_twin`, `superseded_by`
      and its `fingerprint` on itself
    paths: [src/torve/domain/spec.py, src/torve/application/planner.py]
    consequence: >-
      `inherit_decisions` reads the row; the frontmatter fingerprint map is gone
  - id: D-3
    grade: LOCKED
    text: >-
      Prose is `sections[].md`, a string the engine never parses, with `key` and `heading`
      beside it; `level` and `order` are dropped
    paths: [src/torve/domain/spec.py]
    consequence: >-
      Markdown inside a body is welcome and invisible to every check
  - id: D-4
    grade: LOCKED
    text: >-
      Every writer — `amend`, `fix`, `retire`, `archive`, `new` — mutates the model
      and writes it through one serializer; comments are not preserved and `check`
      refuses one outside the schema header line; `fmt` survives as `--check` only
    paths: [src/torve/config/spec_emit.py, src/torve/cli/spec.py]
    consequence: >-
      There is no second renderer to drop a field; the `character:` defect closes
      by construction
  - id: D-5
    grade: LOCKED
    text: >-
      Every live and archived document converts once through the markdown loader and
      the dump, the markdown files are deleted in the same commit with the parser,
      the emitter's table half and `INDEX.md`, and a parity test over every item gates
      that commit and is deleted with the loader
    paths: [.torve/specs/**, .torve/archive/**]
    consequence: >-
      Fifty-five YAML documents; no markdown source anywhere
  - id: D-6
    grade: LOCKED
    text: >-
      `torve rfc schema` writes `rfcs/schema/document.json` from the model, drift-checked
      by `rfc check`; every document's first line names it; `rfc new` emits 0055's
      shape with the header line
    paths: [.torve/schemas/**, src/torve/cli/spec.py]
    consequence: >-
      An editor validates a row as it is typed; a new document starts small
  - id: D-7
    grade: ASSUMED
    text: >-
      `torve rfc list` replaces `INDEX.md`; `torve rfc render NNNN` is the only markdown
      writer and never the source of anything
    paths: [src/torve/cli/spec.py]
    consequence: The index is a query, not a file
  - id: D-8
    grade: ASSUMED
    text: >-
      `SKILL.md`, `AGENTS.md`, the colocated sections and the pack are unchanged:
      projections rendered from the model, read by harnesses and people
    paths: [skills/**, src/torve/application/colocation.py]
    consequence: Nothing a harness reads changes shape
  - id: D-9
    grade: LOCKED
    text: >-
      With a store configured, `plan` mints into the record and writes no file; dispatch
      projects `.torve/tasks/<id>/contract.yaml` into the worktree, gitignored; the
      log written there is imported after the attempt; without a store the files are
      the record as today
    paths:
      - src/torve/application/planner.py
      - src/torve/application/session.py
      - src/torve/config/layout.py
    consequence: >-
      The board is the only place a task is; the file exists for the attempt that
      reads it
  - id: D-10
    grade: LOCKED
    text: >-
      Every task directory whose contract names an archived document is deleted, not
      archived, in one commit; `.torve/tasks/` leaves the tracked exceptions; the
      retention leg over task directories goes with them
    paths: [.torve/tasks/**, .gitignore]
    consequence: >-
      Git keeps the history and the record keeps the landings; nothing standing cites
      a task log
  - id: D-11
    grade: ASSUMED
    text: >-
      `torve migrate telemetry` reads the file once into the record; every reader
      that opens `.torve/telemetry.jsonl` goes through one function that reads the
      record when a store is configured and the file when not
    paths:
      - src/torve/application/telemetry.py
      - src/torve/application/contextpack.py
      - src/torve/application/intake.py
      - src/torve/application/specquality.py
    consequence: >-
      The file is a carrier and an append target, never what a reader with a record
      opens
  - id: D-12
    grade: ASSUMED
    text: >-
      `.torve/review-corpus/` moves to `tests/fixtures/review-corpus/`
    paths: [tests/fixtures/**]
    consequence: Test fixtures live with the tests
  - id: D-13
    grade: OPEN
    text: >-
      Whether phase 4 gives `traces/` and `regimes/` a retention window or leaves
      them to S-0039
    paths: [src/torve/application/reaper.py]
    consequence: Decided by whoever executes phase 4, logged
