out_of_scope: |-
  - bloomery's copy of the pre-write hook: it changes when bloomery re-copies torve's hooks, as S-0104/Q-2 settled.
  - The board fold's ESCALATED to READY step missing from `TRANSITIONS`, found by the same research: a separate fix.
risks: ''
alternatives:
  - option: >-
      Keep `fnmatch` in the hook and add a test that compares it against pathspec.
    rejected_because: >-
      The test would fail at once: `fnmatch` is path-blind, and no test makes it read
      `src/*.py` the way gitignore does.
  - option: >-
      Make `globs_intersect` conservative: overlap unless the fixed directory prefixes
      diverge.
    rejected_because: >-
      It is sound but over-reports every literal file against a wildcard glob in the
      same directory, which serialises tasks the fence has no reason to hold. The
      meet is about forty lines, and it is exact.
questions:
  - id: Q-1
    text: >-
      Phase 3 moves the four other readers (intake, telemetry's read class, a gate's
      `paths` filter, `check_backlinks`) onto `matches`. Each change is one line,
      but each changes what that reader matches: `Path.match` is right-anchored, and
      the prefix tests match `src/torve/run` against `runner.py`. Fold them in, or
      keep this document to the hook, the gate and the fence? Lean: fold them in;
      `_judges_anything`'s own docstring says "one idea has one grammar".
    status: settled
    settled_by: D-4
