# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      A landed round is answered once, read from the forge: the leg replies only to
      a thread whose last comment is not the engine's, and its keyed pull-request
      comment lands once per key; it reads no `lane_thread_resolved` or `review_finding_answered`
      row.
    paths: [src/torve/application/reviewleg.py]
    consequence: >-
      a second host does not answer a round the first already answered
    rationale: >-
      The forge already holds both answers, and S-0101/D-5 already reads a thread's
      last comment.
    cites: [S-0084/D-11, S-0086/D-5, S-0101/D-5]
  - id: D-2
    grade: ASSUMED
    text: >-
      A recorded finding is answered when a round whose contract lists it in `round.findings`
      has landed or a person resolved it off the board.
    paths: [src/torve/application/reviewleg.py]
    consequence: >-
      a recorded finding opens one round whichever host reads it
    rationale: >-
      The round's contract carries its findings (S-0099/D-5), its landing is a landing
      file and its resolution is the board's (S-0101/D-2).
    cites: [S-0099/D-5, S-0101/D-2]
  - id: D-3
    grade: ASSUMED
    text: >-
      The leg replies on a thread it refuses with the refusal's reason, so a later
      pass reads it as handled from the thread's last comment; it reads no `lane_thread_refused`
      or `lane_engine_thread` row.
    paths: [src/torve/application/reviewleg.py]
    consequence: >-
      a refused thread is not raised again on any host until someone comments after
      the refusal
    rationale: >-
      The refusal was recorded only on the host that made it; the reply makes the
      forge its carrier, the same one S-0101/D-5 reads for an answered thread.
    cites: [S-0097/D-3, S-0101/D-5]
  - id: D-4
    grade: ASSUMED
    text: >-
      The red completion battery's finding is read from the `torve/completion` failure
      status on the document branch's tip, its description naming the red gates; the
      leg's forge reads the status and the battery writes no row the leg reads.
    paths:
      - src/torve/application/reviewleg.py
      - src/torve/application/lane.py
      - src/torve/application/ports.py
      - src/torve/cli/manager.py
    consequence: >-
      the battery's round is raised from the verdict a person also sees in the checks
    rationale: >-
      S-0099/D-4 made that status the verdict's carrier; the stream row beside it
      was a second copy.
    cites: [S-0093/D-3, S-0099/D-4]
  - id: D-5
    grade: ASSUMED
    text: >-
      A task's landing sha in the leg is read through `landed()`.
    paths: [src/torve/application/reviewleg.py]
    consequence: >-
      the reply to a round names the same landing on any host
    rationale: S-0099/D-1 made the landing file the landing.
    cites: [S-0099/D-1]
  - id: D-6
    grade: ASSUMED
    text: >-
      The review leg imports no stream reader, and the boundary test allows only the
      ledger, the evals, the night report and `projections` to import `streams`.
    paths: [src/torve/application/reviewleg.py, tests/test_layout.py]
    consequence: no decision module reads the telemetry stream
    rationale: >-
      It closes S-0102's departure from S-0102/D-7, the last exception.
    cites: [S-0099/D-6, S-0102/D-7]
