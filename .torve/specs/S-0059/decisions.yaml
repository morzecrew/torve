# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      A contract names its document as `spec: S-NNNN` — the identifier, never a path;
      a contract carrying `rfc` refuses to load with a hint naming the key; the same
      word and value stand on the drafts file, `torve intake --spec`, a standing job's
      `decisions_from`, the plan report, the projections' envelopes, the web tables
      and the pack; the contract's schema version is 2 and the local contracts are
      rewritten once
    paths:
      - src/torve/domain/task.py
      - src/torve/application/planner.py
      - src/torve/application/intake.py
      - src/torve/application/standing.py
      - src/torve/application/review.py
      - src/torve/application/projections.py
      - src/torve/application/specquality.py
      - src/torve/cli/**
      - web/src/**
      - .torve/tasks/**
    consequence: >-
      One lookup resolves a document from a contract; nothing regexes a number out
      of a path
    rationale: >-
      the contract is the file every executor opens first, and it carried the word
      S-0057 retired with a path S-0058 made needless
    cites: [S-0058/D-1, S-0057/D-3, S-0044/D-8]
  - id: D-2
    grade: LOCKED
    text: >-
      Every reader resolves a contract's document by `document_dir(spec_dir, identifier)`;
      the scope gate's exemption and the runner's decision gates come from the identifier,
      and the gate context carries the corpus path
    paths:
      - src/torve/gates/context.py
      - src/torve/gates/scope.py
      - src/torve/gates/runner.py
      - src/torve/application/decisions.py
      - src/torve/adapters/agent/harness.py
    consequence: >-
      The regexes over the path go; a document that moved is still found
    cites: [S-0058/D-6]
  - id: D-3
    grade: LOCKED
    text: >-
      The record's source id of a task is `spec or "operator"`, the document id; `CORPUS_NAMESPACE`
      goes; a mint whose contract carries `rfc` folds through one read shim in `minted_contract`,
      and the record is not rewritten
    paths:
      - src/torve/application/residency.py
      - src/torve/application/manager.py
      - src/torve/domain/source.py
    consequence: >-
      A task's source joins the record's source without translation; three hundred
      recorded mints keep folding
    rationale: >-
      an append-only log rewritten is not a record; the fold already survives a payload
      the model moved under (S-0049/D-5)
    cites: [S-0044/D-8, S-0047/D-4, S-0049/D-4, S-0049/D-5]
  - id: D-4
    grade: LOCKED
    text: >-
      A gate's `origin` is `structural`, `leak/<task>` or a citation the grammar accepts;
      the runner's decision gates carry the row's own id as origin; the manifest's
      `rfc/NNNN` become `S-NNNN`
    paths:
      - src/torve/config/manifest.py
      - src/torve/gates/runner.py
      - src/torve/gates/sabotage.py
      - .torve/gates.yaml
    consequence: >-
      `spec cites S-0054/D-2` finds the gate the row minted
    cites: [S-0002/D-19, S-0054/D-4]
  - id: D-5
    grade: LOCKED
    text: >-
      Every closed vocabulary is defined once in `torve/domain/vocabulary.py` and
      imported — the corpus words, the entry words, the contract's role, tier and
      character, the gate words, the finding severity, the source kind — with the
      tuples the CLI lists; `domain/rfc.py` is deleted; a word two fields share, or
      the record reads, is never spelled inline; `Phase.character` and `Task.character`
      share `Character`
    paths:
      - src/torve/domain/**
      - src/torve/config/**
      - src/torve/application/standing.py
    consequence: >-
      A word gains a member in one place; the parity test between the log's and the
      record's copies is deleted with the copies
    cites: [S-0007/D-13]
  - id: D-6
    grade: LOCKED
    text: >-
      One shared `ConfigDict` in `torve/base/model.py` — `extra="forbid"`, `use_attribute_docstrings=True`
      — configures every model that forbids extras; a field's words are its attribute
      docstring, never a comment beside it and never `Field(description=...)`; a test
      asserts every property of every schema `init` writes carries a description
    paths:
      - src/torve/base/model.py
      - src/torve/domain/**
      - src/torve/config/**
      - src/torve/application/standing.py
      - src/torve/cli/init.py
      - .torve/schemas/**
    consequence: >-
      The schema an editor shows carries the field's meaning; a field added without
      its words fails the suite
    rationale: >-
      the words already exist, as comments the schema never sees; a docstring is the
      same words in the one place both readers look
    cites: [S-0057/D-4]
  - id: D-7
    grade: ASSUMED
    text: >-
      `init` mints `standing.json` from `StandingContract` and adds the schema line
      to every file under `.torve/standing/`; `doctor` reddens when either lags
    paths: [src/torve/cli/init.py, src/torve/cli/doctor.py, .torve/standing/**]
    consequence: >-
      Every custom YAML document torve reads from a repository names its schema
    cites: [S-0057/D-4, S-0023/D-1]
  - id: D-8
    grade: ASSUMED
    text: >-
      The log's `base_sha` is `base`, the landing's word; the log's schema version
      is 2 and a log saying `base_sha` reads through a shim; the landing's `commit`
      stays; `spec new`'s hint and `spec show`'s label name the summary, not a description
    paths:
      - src/torve/domain/spec.py
      - src/torve/application/**
      - src/torve/gates/decisions_reported.py
      - src/torve/adapters/agent/harness.py
      - src/torve/cli/**
    consequence: >-
      One word for the commit an attempt built on, in the log and the landing
    cites: [S-0058/D-12]
  - id: D-9
    grade: LOCKED
    text: >-
      The runner commits the work, then writes the landing naming `base` and `commit`
      and commits it alone as `torve(T-NNNN): landing of attempt N` — two commits
      per attempt, departing S-0010/D-8; an attempt that changed nothing still lands,
      with an empty `commit`
    paths: [src/torve/application/runner.py, src/torve/application/decisions.py]
    consequence: >-
      The runner's landing names its commit the way a by-hand landing does; the landing
      commit is the branch's tip
    rationale: >-
      a file cannot name the commit it rides in, and an amended commit is a different
      sha
    cites: [S-0058/D-12, S-0010/D-8, S-0010/D-6]
  - id: D-10
    grade: LOCKED
    text: >-
      The runner writes no `Torve-Task`, `Torve-Attempt`, `Torve-Agent`, `Torve-Config`
      or `Torve-Decisions` trailer, retiring S-0010/D-4; the landing carries `decisions:
      [{id, grade}]`, the rows the contract carried; `Torve-Bypass`, `Torve-Fixes`
      and `Torve-Checkpoint` stay
    paths:
      - src/torve/application/runner.py
      - src/torve/domain/spec.py
      - src/torve/config/spec_emit.py
    consequence: >-
      One record of a landing; the commit author stays the agent's identity (S-0010/D-2)
    rationale: >-
      of the five, one was read by greps the landing file answers, one by `spec cites`
      alone, three by nobody
    cites: [S-0010/D-4, S-0010/D-2, S-0002/D-7, S-0036/D-5]
  - id: D-11
    grade: LOCKED
    text: >-
      A task naming no document lands under `.torve/execution/` in the same file shape;
      the loader reads it beside the corpus and the archive, and the scope gate exempts
      it
    paths:
      - src/torve/config/layout.py
      - src/torve/config/spec.py
      - src/torve/application/decisions.py
      - src/torve/gates/scope.py
    consequence: >-
      An operator's ask and a standing job land with a record; the revert leg finds
      them
    cites: [S-0058/D-6, S-0023/D-4]
  - id: D-12
    grade: LOCKED
    text: >-
      Every reader of a landing reads the tree through `landings` and `landed_commits`
      — `shipped_landings`, `shipped_ids`, `shipped_commit`, the revert leg, `status`,
      `shadow`, `evals`, the review's defect lookup, the PR review's `landed_tasks`
      and `spec cites`; no git subprocess reads a trailer or a subject, closing S-0022/A-1's
      exception and retiring S-0007/D-26's subject spellings; the five local tasks
      without a landing get one written once from their trailers, by a script not
      committed
    paths:
      - src/torve/application/projections.py
      - src/torve/application/specquality.py
      - src/torve/application/review.py
      - src/torve/application/session.py
      - src/torve/application/ports.py
      - src/torve/application/residency.py
      - src/torve/application/shadow.py
      - src/torve/adapters/vcs/git.py
      - src/torve/adapters/workspace/git.py
      - src/torve/cli/**
    consequence: >-
      A tree without git answers what landed; S-0022/D-5 holds again without its exception
    cites: [S-0022/D-5, S-0007/D-26, S-0057/D-13, S-0058/D-6]
invariants:
  - id: I-1
    statement: >-
      No file under `src/torve` writes or reads a `Torve-Task`, `Torve-Attempt`, `Torve-Agent`,
      `Torve-Config` or `Torve-Decisions` trailer
    paths: [src/**]
    check: >-
      ! grep -rnE --include=*.py "Torve-(Task|Attempt|Agent|Config|Decisions)" src/torve
  - id: I-2
    statement: The word `rfc` does not stand in `src/torve`
    paths: [src/**]
    check: '! grep -rnw --include=*.py rfc src/torve'
  - id: I-3
    statement: >-
      Every property of every schema `torve init` writes carries a description
    paths:
      - src/torve/domain/**
      - src/torve/config/**
      - src/torve/application/standing.py
    check: >-
      uv run pytest tests/test_spec.py -k schema_descriptions
